    <style>
        body {
            font-family: Arial, sans-serif;

        }

        .container {
            display: flex;
            gap: 12px;
            margin: 16px;
        }

        }

        }

        }

        }

        .product-list tr:hover {

        }

        .selected-table {
            width: 100%;

            margin-top: 8px;

        }

        .selected-table th,

        .preview-area {
            border: 1px solid #bbb;
            margin-top: 16px;
            padding: 8px;
            background: #fafafa;
        }

        /* In preview tem */
        @media print {
            body * {
                visibility: hidden;
            }

            .print-preview,
            .print-preview * {
                visibility: visible;
            }

            .print-preview {
                position: absolute;
                left: 0;
                top: 0;
                width: 210mm;
                height: 297mm;
                background: white;
                padding: 0;
                margin: 0;
                transform: scale(1.46222);
                transform-origin: top left;
            }

            body,
            html {
                margin: 0 !important;
                padding: 0 !important;
            }

            @media print {
                …

                /* Giữ lại padding/margin của .print-preview (để canh lề mm không bị xóa) */
                .print-preview * {
                    box-sizing: border-box;
                }

                /* Chỉ reset margin/padding bên trong từng tem nếu muốn gọn */
                .print-preview .tem,
                .print-preview .tem * {
                    margin: 0;
                    padding: 0;
                }

                /* Bắt buộc giữ lùi xuống 2.5mm cho cột QR khi in */
                .print-preview .qr-col {
                    margin-top: 2.8mm !important;
                }
            }



        }

        .btn {
            background: #2a87f4;
            color: white;
            border: none;
            padding: 5px 12px;
            margin: 0 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1360b2;
        }

        #maspSuggestList {
            font-size: 13px;
        }

        #maspSuggestList table {
            width: 100%;
            border-collapse: collapse;
        }

        #maspSuggestList th,
        #maspSuggestList td {
            border-bottom: 1px solid #eee;
            padding: 2px 5px;
            cursor: pointer;
        }

        #maspSuggestList tr:hover {
            background: #e6f3ff;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            position: relative;
        }

        .form-row label {
            flex: 0 0 90px;
            text-align: left;
            margin-right: 5px;
            font-size: 13px;
        }

        .form-input {
            flex: 1 1 auto;
            position: relative;
        }

        .form-input input {
            width: 100%;
            padding: 2px 5px;
            font-size: 13px;
            box-sizing: border-box;
        }

        .required {
            color: red;
            font-weight: bold;
        }

        #maspSuggestList {
            position: fixed !important;
            z-index: 9999 !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        #deleteProductBtn {
            background-color: #cc3333 !important;
        }

        #deleteProductBtn:hover {
            background-color: #a60000 !important;
        }


        label.locked {
            opacity: 0.9;
        }

        label.locked::after {
            content: ' (tự bật theo giá)';
            font-size: 12px;
            color: #888;
            margin-left: 4px;
        }
    </style>
</head>

<body>

        </div>
        <!-- Bên phải: bảng sản phẩm đã chọn và tùy chọn in -->

            <div class="print-options">

                <!-- MODULE ĐĂNG NHẬP SUPABASE -->
                <div id="loginModule" style="display:inline-block; margin-left:16px;">

                    <input type="password" id="login-password" value="123123"

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabaseUrl = 'https://rddjrmbyftlcvrgzlyby.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZGpybWJ5ZnRsY3ZyZ3pseWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3NjU4MDQsImV4cCI6MjA2MjM0MTgwNH0.-0xtqxn6b9OBz4unTTvJ4klxizWhHa1iSuYGm7cOYTM'; // <-- Thay đúng anon key

        // Lấy token từ localStorage (nếu có)
        const token = localStorage.getItem('supabase_access_token');

        // Nếu có token thì khởi tạo client với Authorization header
        export const supabase = token
            ? createClient(supabaseUrl, supabaseKey, {
                global: { headers: { Authorization: `Bearer ${token}` } }
            })
            : createClient(supabaseUrl, supabaseKey);

        // 🔎 LẤY GIÁ LẺ THEO DANH SÁCH MÃ (batch)
        async function fetchGiaLeByMasps(masps = []) {
            const uniq = Array.from(new Set(
                (masps || []).map(m => (m || '').toUpperCase()).filter(Boolean)
            ));
            if (!uniq.length) return {};
            const { data, error } = await supabase
                .from('dmhanghoa')
                .select('masp, giale, gianhap, dvt, tensp')
                .in('masp', uniq);
            if (error) {
                console.warn('fetchGiaLeByMasps error:', error);
                return {};
            }
            const map = {};
            (data || []).forEach(sp => {
                const k = (sp.masp || '').toUpperCase();
                map[k] = sp || {};
            });
            return map;
        }

        // -- CẤU HÌNH BẢNG 9 CỘT HANDSONTABLE --
        let hot;
        const colHeaders = [
            "STT", "Mã hàng", "Tên hàng", "Kích cỡ", "Số lượng", "ĐVT", "Giá nhập", "In", "Giá lẻ"
        ];
        const columns = [
            { data: 0, type: 'numeric' }, // STT  { data: 0, type: 'numeric', readOnly: true },
            { data: 1, type: 'text' },    // Mã hàng
            { data: 2, type: 'text' },    // Tên hàng
            { data: 3, type: 'text' },                    // Kích cỡ (Size)
            { data: 4, type: 'numeric' },                 // Số lượng
            { data: 5, type: 'text' },                    // ĐVT
            {
                data: 6,
                type: 'numeric',
                numericFormat: { pattern: "0,0", culture: 'vi-VN' }
            },                                            // Giá nhập
            { data: 7, type: 'checkbox' },                // In
            {
                data: 8,
                type: 'numeric',
                numericFormat: { pattern: "0,0", culture: 'vi-VN' }
            }                                             // Giá lẻ
        ];



        document.addEventListener("DOMContentLoaded", function () {
            const container = document.getElementById('hot');
            hot = new Handsontable(container, {
                data: [],
                colHeaders: colHeaders,
                columns: columns,
                rowHeaders: true,
                minSpareRows: 1,
                licenseKey: 'non-commercial-and-evaluation',
                contextMenu: true,
                copyPaste: true,
                manualColumnResize: true,
                manualRowResize: true,
                stretchH: 'all',
                afterChange: syncHandsontableToSelected,
                beforeChange: function (changes, source) {  //Thêm event beforeChange để chặn chỉnh sửa thủ công các cột "chỉ đọc"
                    if (source === 'edit') {
                        // Không cho chỉnh sửa trực tiếp các cột mã hàng, tên hàng, dvt, giá lẻ, giá nhập
                        const readOnlyColumns = [1, 2, 6, 8];
                        for (let i = changes.length - 1; i >= 0; i--) {
                            if (readOnlyColumns.includes(changes[i][1])) {
                                changes.splice(i, 1); // Hủy thay đổi trên cột chỉ đọc nếu là thao tác nhập tay
                            }
                        }
                    }
                    // Nếu là paste thì không chặn gì cả!
                }
            });

            window.hotInstance = hot;        // ← expose instance thật sự ra global
            // (nếu muốn giữ tên cũ)
            window.hot = hot;                // ← để window.hot không còn là <div id="hot">

        });

        window.fetchGiaLeByMasps = fetchGiaLeByMasps;

        // ==== CẤU HÌNH THÔNG SỐ IN TEM ====
        const PAGE_MARGIN_TOP_MM = 2.5;      // Lề trên của toàn bộ khối tem (mm)
        const PAGE_MARGIN_LEFT_MM = 11;   // Lề trái của toàn bộ khối tem (mm)
        const TEM_H_GAP_MM = 0;          // Khoảng cách ngang giữa 2 tem (mm)
        const TEM_V_GAP_MM = 0;          // Khoảng cách dọc giữa 2 tem (mm)
        const TEM_WIDTH_MM = 37;           // Rộng mỗi tem (mm)
        const TEM_HEIGHT_MM = 19;          // Cao mỗi tem (mm)
        // ==== KẾT THÚC CẤU HÌNH ====

        // State
        let products = [];
        let filtered = [];
        let selected = [];

        // Elements
        const searchInput = document.getElementById('search');
        const productListDiv = document.getElementById('productList');

        const previewArea = document.getElementById('previewArea');
        const fromRowInput = document.getElementById('fromRow');
        const fromColInput = document.getElementById('fromCol');

        const loaiTemSelect = document.getElementById('loaiTem');
        function applyFromLimits() {
            if (loaiTemSelect.value === 'insize_tomy114') {
                fromRowInput.max = 12;
                fromColInput.max = 16;
            } else {
                fromRowInput.max = 8;
                fromColInput.max = 5;
            }
        }
        loaiTemSelect.addEventListener('change', applyFromLimits);
        applyFromLimits();


        // 1. Search products (không load all)
        async function searchProducts(keyword, callback) {
            let { data, error } = await supabase
                .from('dmhanghoa')
                .select('masp, tensp, dvt, giale, gianhap')
                .or(`masp.ilike.%${keyword}%,tensp.ilike.%${keyword}%`)
                .order('masp')
                .limit(100);
            filtered = data || [];
            products = data || [];
            renderProductList();
            if (typeof callback === 'function') callback();
        }


        searchInput.addEventListener('input', () => {
            const val = searchInput.value.trim().toLowerCase();
            if (val.length === 0) {
                filtered = [];
                products = [];
                renderProductList();
            } else {
                searchProducts(val);
            }
        });

        // Render product list
        function renderProductList() {
            let html = '<table>';
            html += '<tr><th>Mã SP</th><th>Tên hàng</th></tr>';
            for (let p of filtered) {
                html += `<tr data-masp="${p.masp}">
      <td>${p.masp}</td>
      <td>${p.tensp}</td>
    </tr>`;
            }
            html += '</table>';
            productListDiv.innerHTML = html;
            // Gắn double click event cho từng dòng
            productListDiv.querySelectorAll('tr[data-masp]').forEach(row => {
                row.ondblclick = () => selectProduct(row.dataset.masp);
            });
        }

        function selectProduct(masp) {
            if (!hot) return;
            const p = products.find(x => x.masp === masp);
            if (!p) return;
            let data = hot.getSourceData();
            // Loại dòng trắng cuối bảng (dòng chỉ toàn rỗng/null)
            data = data.filter(row => Array.isArray(row)
                ? row.some(cell => cell !== null && cell !== "")
                : Object.values(row).some(cell => cell !== null && cell !== "")
            );

            // Kiểm tra mã đã có chưa
            //if (data.some(row => row[1] === p.masp)) return; //Bỏ kiểm tra trùng mã sản phẩm khi thêm từ danh sách
            // Thêm sản phẩm mới
            data.push([
                data.length + 1,        // STT
                p.masp,                 // Mã hàng
                p.tensp,                // Tên hàng
                "0",                    // Kích cỡ (mặc định "0")
                1,                      // Số lượng (default 1)
                p.dvt || "sp",          // ĐVT (nếu trống thì "sp")
                p.gianhap || 1,         // Giá nhập (nếu trống thì 1)
                true,                   // In
                p.giale || 0            // Giá lẻ (nếu trống thì 0)
            ]);

            // Cập nhật lại STT liên tục
            data.forEach((row, idx) => row[0] = idx + 1);
            hot.loadData(data);
        }




        function syncHandsontableToSelected() {
            if (!hot) return;
            const data = hot.getData().filter(row => row[1] && row[2]);
            selected = data.map(row => ({
                stt: row[0],         // STT
                masp: row[1],        // Mã hàng
                tensp: row[2],       // Tên hàng
                size: row[3],        // Kích cỡ
                sl: row[4],          // Số lượng
                dvt: row[5],         // Đơn vị tính
                gianhap: row[6],     // Giá nhập
                tick: !!row[7],      // In
                giale: row[8]        // Giá lẻ
            }));

        }


        // Render lưới chọn
        function renderSelectedTable() {
            selectedTableBody.innerHTML = '';
            selected.forEach((row, idx) => {
                selectedTableBody.innerHTML += `
      <tr data-idx="${idx}">
        <td>${idx + 1}</td>
        <td>${row.masp}</td>
        <td>${row.tensp}</td>
        <td><input type="number" min="1" max="50" value="${row.sltem}" style="width:38px"
             onchange="changeSlTem(${idx}, this.value)"></td>
        <td>${row.dvt || ''}</td>
        <td><input type="number" min="1" max="999" value="${row.sl}" style="width:38px"
             onchange="changeSl(${idx}, this.value)"></td>
        <td>${formatGia(row.giale)}</td>
        <td><input type="checkbox" ${row.tick ? 'checked' : ''} onchange="toggleTick(${idx}, this.checked)"></td>
        <td>${formatGia(row.gianhap)}</td>
      </tr>
     `;
            });
            // Gắn double click xóa dòng
            selectedTableBody.querySelectorAll('tr[data-idx]').forEach(tr => {
                tr.ondblclick = () => {
                    const idx = parseInt(tr.dataset.idx);
                    selected.splice(idx, 1);
                    renderSelectedTable();
                };
            });
        }

        window.changeSlTem = function (idx, val) {
            selected[idx].sltem = parseInt(val) || 1;
        };
        window.changeSl = function (idx, val) {
            selected[idx].sl = parseInt(val) || 1;
        };
        window.toggleTick = function (idx, val) {
            selected[idx].tick = val;
        };

        // Phân trang preview
        let currentPage = 1;
        let totalPages = 1;
        let temsAll = [];


        window.renderPreview = function (page = 1) {
            syncHandsontableToSelected();
            // Kiểm tra chọn loại tem
            const loaiTem = document.getElementById('loaiTem') ? document.getElementById('loaiTem').value : "";
            if (!loaiTem) {
                alert("Vui lòng chọn loại tem cần in!");
                return;
            }

            // Info chung mẫu cho từng loại tem
            let infoChung = "";
            if (loaiTem === "giaydep") {
                infoChung = `
            không giặttẩy;Bảoquản khô<br>
            Dán nhãn tại Việt Nam Giày<br>
            dép;chất liệu da,tổng hợp<br>           
        `;
            } else if (loaiTem === "quanao") {

        // ==== RENDER: In SIZE theo giấy TOMY 114 (tem tròn 11mm, 16 cột × 12 hàng) ====
        function renderPreviewInSizeTomy114(page = 1) {
            syncHandsontableToSelected();

            // Gom dữ liệu: chỉ lấy các dòng tick In và có size hợp lệ (khác rỗng/'0')
            const items = (selected || [])
                .filter(r => r && r.tick)
                .flatMap(r => {
                    const s = ((r.size ?? '').toString().trim());
                    const qty = Number(r.sl) || 0;
                    if (!s || s === '0' || qty <= 0) return [];
                    return Array(qty).fill({ size: s });
                });

            // Phân trang: 192 tem/trang
            const PER_PAGE = 192, COLS = 16, ROWS = 12;
            totalPages = Math.max(1, Math.ceil(items.length / PER_PAGE));
            currentPage = Math.min(Math.max(1, page), totalPages);

            // Vị trí bắt đầu (blank slot) chỉ áp dụng cho trang đầu
            const fromRow = parseInt(fromRowInput.value) || 1; // 1..12
            const fromCol = parseInt(fromColInput.value) || 1; // 1..16
            const blank = (currentPage === 1) ? (fromRow - 1) * COLS + (fromCol - 1) : 0;

            // Lấy dữ liệu cho trang hiện tại (chú ý blank chỉ trừ ở trang đầu)
            const start = (currentPage - 1) * PER_PAGE - (currentPage === 1 ? 0 : blank);
            const end = currentPage * PER_PAGE - (currentPage === 1 ? 0 : blank);
            const pageTems = items.slice(Math.max(0, start), Math.max(0, end));
            const maxTems = PER_PAGE - (currentPage === 1 ? blank : 0);

            // Dựng HTML: padding theo thông số bạn cung cấp
            // Blank cho trang đầu  //row-gap: 1.9mm;  voi cs1  row-gap: 1.5mm; voi cs2
            let html = `<div class="print-preview" style="padding-top:5.5mm; padding-left:9.3mm;">
    <div class="tem-grid" style="
      display:grid;
      grid-template-columns: repeat(${COLS}, 11mm);
      grid-template-rows: repeat(${ROWS}, 11mm);
      column-gap: 1.4mm;
      row-gap: 2.5mm;
    ">`;

            // Ô trống đầu trang (offset)
            for (let i = 0; i < (currentPage === 1 ? blank : 0); i++) {
                html += `<div class="tem tem-blank"></div>`;
            }

            // Các tem size
            //const fitFont = s => (s.length >= 3 ? '12pt' : '12pt'); // auto-fit đơn giản
            const fitFont = s => '16pt';  // luôn 12pt
            for (let i = 0; i < maxTems; i++) {
                const t = pageTems[i];
                if (!t) { html += `<div class="tem tem-blank"></div>`; continue; }
                const sizeText = (t.size || '').toString();
                html += `
      <div class="tem" style="
        width:11mm;height:11mm;border-radius:50%;
        display:flex;justify-content:center;align-items:center;
        overflow:hidden;text-align:center;
      ">
        <span style="font-weight:700;font-size:${fitFont(sizeText)};line-height:1; text-transform:uppercase;">
          ${sizeText}
        </span>
      </div>`;
            }

            html += `</div></div>`;
            previewArea.innerHTML = html;
            document.getElementById("pageInfo").textContent = `Trang ${currentPage} / ${totalPages}`;
        }

        // ===== NHẬN DỮ LIỆU TỪ TRANG NHẬP MỚI =====
        async function importFromHashToInTem() {
            const hash = location.hash || "";
            if (!hash.startsWith("#imp=")) return;

            let imp = hash.slice(5).trim();
            if (!imp) return;
            imp = imp.replace(/-/g, "+").replace(/_/g, "/");
            const pad = imp.length % 4;
            if (pad) imp += "=".repeat(4 - pad);

            let payload = null;
            try {
                payload = JSON.parse(decodeURIComponent(escape(atob(imp))));
            } catch (e) {
                console.error("Decode imp error", e);
                return;
            }
            if (!payload || !Array.isArray(payload.items)) return;

            console.log("[IN-TEM] Nhận dữ liệu từ trang nhập:", payload);

            // 🆕 Lấy map { MASP → {giale,gianhap,dvt,tensp} } từ CSDL
            const masps = payload.items.map(it => (it.masp || '').toUpperCase());
            const spMap = await fetchGiaLeByMasps(masps);

            // Chuyển items thành data đúng 9 cột và LẤY GIÁ LẺ từ spMap
            const data = payload.items.map((it, idx) => {
                const masp = (it.masp || '').toUpperCase();
                const sp = spMap[masp] || {};
                return [
                    idx + 1,                        // STT
                    masp,                           // Mã hàng
                    it.tensp || sp.tensp || "",     // Tên hàng (ưu tiên payload)
                    it.size || "0",                 // Kích cỡ
                    it.sl || 0,                     // Số lượng
                    it.dvt || sp.dvt || "sp",       // ĐVT
                    (it.gianhap ?? sp.gianhap) || 0,// Giá nhập (nếu muốn hiển thị)
                    true,                           // In
                    (it.giale ?? sp.giale) || 0     // 🔥 GIÁ LẺ – lấy từ DB nếu payload không có
                ];
            });

            // Đợi hot sẵn sàng rồi nạp
            const tryLoad = () => {
                const inst = window.hotInstance || window.hot;  // ưu tiên instance thật
                if (inst && typeof inst.loadData === 'function') {
                    inst.loadData(data);
                    console.log("[IN-TEM] Đã nạp vào Handsontable:", inst.getData?.());
                    // Xoá hash / query để tránh nạp lại
                    history.replaceState(null, "", location.pathname + location.hash);
                    return true;
                }
                return false;
            };

            if (!tryLoad()) {
                const tm = setInterval(() => { if (tryLoad()) clearInterval(tm); }, 300);
            }
        }
        document.addEventListener("DOMContentLoaded", () => { importFromHashToInTem(); });

    </script>

    <script>
        (function () {
            // Giải mã ?data= (base64 -> JSON) và nạp thẳng vào Handsontable (hot)
            async function importFromQueryData() {
                const q = new URLSearchParams(location.search).get("data");
                if (!q) return;

                try {
                    const json = decodeURIComponent(escape(atob(q)));
                    const items = JSON.parse(json);
                    if (!Array.isArray(items) || items.length === 0) return;

                    console.log("[IN-TEM] Nhận ?data:", items);

                    // Gọi hàm fetch giá/lệ nếu trang đã có (giống import từ hash)
                    const masps = items.map(it => (it.masp || "").toUpperCase());
                    const spMap = (typeof window.fetchGiaLeByMasps === "function")
                        ? await window.fetchGiaLeByMasps(masps)
                        : {};

                    // Chuyển item -> mảng hàng theo format của Handsontable:
                    // [STT, Mã hàng, Tên hàng, Kích cỡ, Số lượng, ĐVT, Giá nhập, In, Giá lẻ]
                    const data = items.map((it, idx) => {
                        const masp = (it.masp || "").toUpperCase();
                        const sp = spMap[masp] || {};
                        return [
                            idx + 1,
                            masp,
                            it.tensp || sp.tensp || "",
                            it.size || "0",
                            it.sl || 0,
                            it.dvt || sp.dvt || "sp",
                            it.gianhap ?? sp.gianhap ?? 0,
                            true,
                            it.giale ?? sp.giale ?? 0
                        ];
                    });

                    // Nạp vào HOT (bảng thực đang hiển thị)
                    const tryLoad = () => {
                        const inst = window.hotInstance || window.hot;  // ưu tiên instance thật
                        if (inst && typeof inst.loadData === 'function') {
                            inst.loadData(data);
                            console.log("[IN-TEM] Đã nạp vào Handsontable:", inst.getData?.());
                            // Xoá hash / query để tránh nạp lại
                            history.replaceState(null, "", location.pathname + location.hash);
                            return true;
                        }
                        return false;
                    };


                    if (!tryLoad()) {
                        // Nếu HOT chưa sẵn, đợi nó init xong
                        const tm = setInterval(() => { if (tryLoad()) clearInterval(tm); }, 300);
                    }
                } catch (e) {
                    console.error("❌ Lỗi decode ?data:", e);
                }
            }

            document.addEventListener("DOMContentLoaded", importFromQueryData);
        })();
    </script>

                // 2️⃣ Gom theo mã hàng
                const map = {};
                const sizes = [0, 38, 39, 40, 41, 42, 43, 44, 45];
                for (const row of rawData) {
                    const masp = (row[maspIdx] || "").toString().trim().toUpperCase();
                    const size = (row[sizeIdx] || "").toString().trim();
                    const sl = parseInt(row[qtyIdx]) || 0;
                    const dvt = row[dvtIdx] || "sp";
                    const gianhap = parseFloat(row[gianhapIdx]) || 0;
                    if (!masp || sl <= 0) continue;

                    if (!map[masp]) {
                        map[masp] = { masp, dvt, gianhap };
                        sizes.forEach(s => map[masp][`s${s}`] = 0);
                    }
                    const s = sizes.includes(+size) ? +size : null;
                    if (s !== null) map[masp][`s${s}`] += sl;
                }

                // 3️⃣ Tính tổng nhập và đóng gói payload
                const items = Object.values(map).map(it => {
                    const tong_nhap = sizes.reduce((sum, s) => sum + (it[`s${s}`] || 0), 0);
                    return { ...it, tong_nhap };
                });

                if (!items.length) {
                    alert("⚠️ Không có dữ liệu hợp lệ để tạo nhập tạm!");
                    return;
                }

                // 4️⃣ Encode payload và mở trang nhập tạm
                const payload = {
                    source: "in-tem",
                    cs: "cs1",
                    items
                };
                const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
                const url = `nhaptamcs111.html?data=${encoded}`;
                window.open(url, "_blank");
            } catch (err) {
                console.error("❌ Lỗi khi tạo nhập tạm:", err);
                alert("❌ Có lỗi xảy ra khi tạo hóa đơn nhập tạm!");
            }
        }

        // Gắn vào nút "Tạo HĐ nhập tạm"
        document.getElementById("btnTaoNhapTam")?.addEventListener("click", createNhapTamFromInTem);

        // 2) Mỗi khi quay lại tab, làm “refresh nhẹ”
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                supabase.auth.refreshSession().catch(() => { });
            }
        });

        // 3) Gia cố: canh thời điểm gần hết hạn thì refresh sớm
        const REFRESH_EARLY_SEC = 300; // 5 phút trước khi hết hạn
        setInterval(async () => {
            const { data: { session } } = await supabase.auth.getSession();
            const expMs = session?.expires_at ? session.expires_at * 1000 : 0;
            if (expMs && expMs - Date.now() < REFRESH_EARLY_SEC * 1000) {
                await supabase.auth.refreshSession().catch(() => { });
            }
        }, 60 * 1000);

    </script>

    <script src="scripts/stockQuickPopup.js"></script>
