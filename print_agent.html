<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Print Agent</title>
    <style>
        body {
            font-family: Arial;
            padding: 12px
        }

        .ok {
            color: green
        }

        .err {
            color: red
        }
    </style>
</head>

<body>
    <h3>Print Agent - CS1</h3>
    <div id="st">Đang khởi động...</div>

    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        // TODO: thay bằng project của bạn
        const SUPABASE_URL = 'https://rddjrmbyftlcvrgzlyby.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZGpybWJ5ZnRsY3ZyZ3pseWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3NjU4MDQsImV4cCI6MjA2MjM0MTgwNH0.-0xtqxn6b9OBz4unTTvJ4klxizWhHa1iSuYGm7cOYTM';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TARGET = "cs1";



        const st = (msg, cls = "") => {
            const el = document.getElementById("st");
            el.className = cls;
            el.textContent = msg;
        };

        st("Đang subscribe print_jobs...", "ok");

        async function claimJob(jobId) {
            // lock job: new -> printing (tránh in trùng)
            const { data, error } = await supabase
                .from("print_jobs")
                .update({ status: "printing" })
                .eq("id", jobId)
                .eq("status", "new")
                .select("id")
                .maybeSingle();

            if (error) return false;
            return !!data;
        }

        async function doneJob(jobId) {
            await supabase
                .from("print_jobs")
                .update({ status: "printed", printed_at: new Date().toISOString() })
                .eq("id", jobId);
        }

        async function errorJob(jobId, err) {
            await supabase
                .from("print_jobs")
                .update({ status: "error", error: String(err || "unknown") })
                .eq("id", jobId);
        }

        function openAndPrint(payload) {
            // payload chính là { hoadon, chitiet } giống file in-hoadon.html đang dùng
            localStorage.setItem("data_hoadon_in", JSON.stringify(payload));

            // mở trang in của bạn
            // sửa URL này theo đúng đường dẫn bạn đang dùng
            const url = "/in-hoadon.html?autoprint=1";

            // mở tab mới để in (có thể bị popup-block nếu không cho phép)
            window.open(url, "_blank");
        }

        // Subscribe realtime
        supabase
            .channel("print_jobs_channel_cs1")
            .on("postgres_changes", {
                event: "INSERT",
                schema: "public",
                table: "print_jobs"
            }, async (payloadEvent) => {
                try {
                    const job = payloadEvent.new;
                    if (!job) return;
                    if (job.status !== "new") return;
                    if (job.target !== TARGET) return;

                    st("Có lệnh in mới: " + job.id, "ok");

                    const ok = await claimJob(job.id);
                    if (!ok) return; // bị máy khác claim

                    openAndPrint(job.payload);

                    // đánh dấu printed sau 3s (bạn có thể làm “afterprint” nâng cao sau)
                    setTimeout(() => doneJob(job.id), 3000);

                } catch (e) {
                    st("Lỗi in: " + e, "err");
                    try { await errorJob(payloadEvent.new?.id, e); } catch { }
                }
            })
            .subscribe((status) => {
                st("Realtime status: " + status, status === "SUBSCRIBED" ? "ok" : "");
            });
    </script>
</body>

</html>
