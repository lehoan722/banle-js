  <script>

    let rowDangChon = null;

    // Lấy đủ mọi dòng hóa đơn từ Supabase (bằng .range để lấy từng trang, rồi gộp lại)
    async function getAllHoaDon(query, pageSize = 1000) {
      let from = 0;
      let allData = [];
      while (true) {
        let { data, error } = await query.range(from, from + pageSize - 1);
        if (error) {
          alert("❌ Lỗi tải hóa đơn: " + error.message);
          break;
        }
        if (data && data.length > 0) {
          allData = allData.concat(data);
          if (data.length < pageSize) break; // Trang cuối cùng
          from += pageSize;
        } else {
          break;
        }
      }
      return allData;
    }


    // ... (đoạn createClient, getAllHoaDon, v.v. của bạn giữ nguyên)

    // Lấy tất cả sohd từ ct_hoadon_banle theo 1 mã (dùng phân trang .range giống getAllHoaDon)
    async function getSohdByOneMasp(masp, pageSize = 2000) {
      let from = 0;
      const sohdSet = new Set();
      while (true) {
        const { data, error } = await window.supabase
          .from('ct_hoadon_banle')
          .select('sohd, masp')
          .ilike('masp', `%${masp}%`)
          .range(from, from + pageSize - 1);

        if (error) { alert('❌ Lỗi tìm sohd theo mã: ' + error.message); break; }
        if (!data || data.length === 0) break;

        data.forEach(r => { if (r?.sohd) sohdSet.add(r.sohd); });
        if (data.length < pageSize) break;
        from += pageSize;
      }
      return sohdSet;
    }

    // Lấy tập sohd theo nhiều mã: matchAll=true → giao nhau; matchAll=false → hợp
    async function getSohdByMaspList(maspList, matchAll = true) {
      if (!maspList.length) return new Set();
      const sets = [];
      for (const m of maspList) {
        const s = await getSohdByOneMasp(m);
        sets.push(s);
      }
      if (sets.length === 1) return sets[0];

      if (matchAll) {
        // Giao nhau
        let inter = sets[0];
        for (let i = 1; i < sets.length; i++) {
          const next = sets[i];
          inter = new Set([...inter].filter(x => next.has(x)));
          if (inter.size === 0) break;
        }
        return inter;
      } else {
        // Hợp
        const uni = new Set();
        sets.forEach(s => s.forEach(x => uni.add(x)));
        return uni;
      }
    }


    async function taiDanhSachHoaDon() {
      // 1. Lấy các giá trị lọc từ giao diện
      const tuNgay = document.getElementById("tuNgay").value;
      let denNgay = document.getElementById("denNgay").value;
      // v2 lọc theo DATE => KHÔNG nối giờ phút giây

      const nv = document.getElementById("locNV").value.trim().toUpperCase();
      const sohd = document.getElementById("locSoHD").value.trim();
      const khach = document.getElementById("locKhach").value.trim();
      const tienTu = Number(document.getElementById("tienTu").value);
      const tienDen = Number(document.getElementById("tienDen").value);

      const selectLoai = document.getElementById("loaiChungTu");
      const loaiChungTuArr = Array.from(selectLoai.selectedOptions).map(o => o.value);

      const loaiTongHop = document.getElementById("loaiTongHop")?.value || "chitiet";

      const tbody = document.getElementById("dsHoaDon");
      tbody.innerHTML = "";

      // ====== V2: GỌI RPC (DETAIL LÀM CHUẨN) ======
      const maspRaw = document.getElementById('locMasp').value.trim();
      const matchAll = document.getElementById('chkMatchAll').checked;

      const maspList = maspRaw
        ? maspRaw.split(',').map(s => s.trim().toUpperCase()).filter(Boolean)
        : null;

      // loaiChungTuArr đang là mảng multi-select => pass thẳng vào RPC
      const loaiList = (loaiChungTuArr && loaiChungTuArr.length) ? loaiChungTuArr : null;

      // chuẩn hóa tiền
      const tienTu2 = (!isNaN(tienTu) && tienTu > 0) ? tienTu : null;
      const tienDen2 = (!isNaN(tienDen) && tienDen > 0) ? tienDen : null;

      // params chung
      const paramsBase = {
        p_tu_ngay: tuNgay || null,
        p_den_ngay: denNgay || null,
        p_loaihd_list: loaiList,
        p_manv: nv || null,
        p_khachhang: khach || null,
        p_sohd: sohd || null,
        p_tien_tu: tienTu2,
        p_tien_den: tienDen2,
        p_masp_list: maspList,
        p_must_contain_all: !!matchAll
      };

      // 1) COUNT (để set tổng nhanh)
      {
        const { data, error } = await window.supabase.rpc('xemhoadon111_v2_count', paramsBase);
        if (error) {
          tbody.innerHTML = `<tr><td colspan="12">❌ Lỗi count: ${error.message}</td></tr>`;
          return;
        }
        const row = data?.[0] || {};
        // tổng trên UI: dùng số "chuẩn theo detail"
        document.getElementById('tongSoLuong2').textContent = Number(row.total_sl_detail || 0).toLocaleString();
        document.getElementById('tongTien2').textContent = Number(row.total_thanhtoan_v2 || 0).toLocaleString();
      }

      // 2) PAGED (lấy toàn bộ theo batch)
      let filtered = [];
      const LIMIT = 2000;
      let offset = 0;

      while (true) {
        const { data, error } = await window.supabase.rpc('xemhoadon111_v2_paged', {
          ...paramsBase,
          p_limit: LIMIT,
          p_offset: offset
        });

        if (error) {
          tbody.innerHTML = `<tr><td colspan="12">❌ Lỗi paged: ${error.message}</td></tr>`;
          return;
        }

        const rows = data || [];
        if (rows.length === 0) break;

        // map về format cũ để phần render phía dưới không phải đập lại nhiều
        rows.forEach(r => {
          filtered.push({
            sohd: r.sohd,
            // dùng NGÀY BÁN làm “ngày hiển thị chính”
            ngay: r.ngay,
            // vẫn giữ created_at để ai cần đối chiếu thời điểm ghi DB
            created_at: r.created_at,
            updated_at: r.updated_at,
            manv: r.manv,
            tennv: r.tennv,
            khachhang: r.khachhang,
            ghichu: r.ghichu,

            // --- số chuẩn theo detail ---
            tongsl: r.sl_detail,
            tongthanhtien: r.tong_detail,     // tổng sau km dòng
            chietkhau: r.chietkhau,           // chiết khấu hóa đơn (header)
            thanhtoan: r.thanhtoan_v2,        // tổng detail - chiết khấu

            // --- đối chiếu (tuỳ bạn có dùng không) ---
            tongsl_header: r.sl_header,
            lech_sl: r.lech_sl
          });
        });

        if (rows.length < LIMIT) break;
        offset += LIMIT;
      }
      // ====== END V2 ======


      // SẮP XẾP THEO SỐ HÓA ĐƠN TỪ NHỎ ĐẾN LỚN (chỉ áp dụng cho chế độ chi tiết)
      if (loaiTongHop === "chitiet") {
        filtered.sort((a, b) => {


          const s1 = (a.sohd || "").toString();
          const s2 = (b.sohd || "").toString();
          return s1.localeCompare(s2); // tăng dần
        });
      }

      // ----------- XỬ LÝ TỔNG HỢP THEO NGÀY/THÁNG/NĂM ----------
      let hienThiData = filtered;
      if (loaiTongHop !== "chitiet") {
        const groupMap = new Map();
        filtered.forEach(hd => {
          const d = new Date(hd.ngay || hd.created_at);

          let key = "";
          if (loaiTongHop === "ngay") key = d.toISOString().slice(0, 10);
          if (loaiTongHop === "thang") key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
          if (loaiTongHop === "nam") key = d.getFullYear() + "";
          if (!groupMap.has(key)) {
            groupMap.set(key, {
              sohd: 1,
              created_at: hd.created_at,
              tongsl: Number(hd.tongsl || 0),
              tongthanhtien: Number(hd.tongthanhtien || 0),
              chietkhau: Number(hd.chietkhau || 0),
              thanhtoan: Number(hd.thanhtoan || 0)
            });
          } else {
            let obj = groupMap.get(key);
            obj.sohd += 1;
            obj.tongsl += Number(hd.tongsl || 0);
            obj.tongthanhtien += Number(hd.tongthanhtien || 0);
            obj.chietkhau += Number(hd.chietkhau || 0);
            obj.thanhtoan += Number(hd.thanhtoan || 0);
          }
        });
        hienThiData = Array.from(groupMap.entries()).map(([key, val]) => {
          // Định dạng lại ngày/tháng/năm để hiển thị
          if (loaiTongHop === "ngay") val.created_at = key.split('-').reverse().join('/');
          if (loaiTongHop === "thang") val.created_at = key.slice(5, 7) + "/" + key.slice(0, 4);
          if (loaiTongHop === "nam") val.created_at = key;
          return val;
        });
      }

      // ------------- HÀM ĐỊNH DẠNG NGÀY  -------------

      function dinhDangNgay(ngayStr) {
        if (!ngayStr) return "";
        const d = new Date(ngayStr);
        return new Intl.DateTimeFormat("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        }).format(d);
      }

      // ------------- HÀM ĐỊNH DẠNG NGÀY GIỜ -------------
      function dinhDangNgayGio(ngayStr) {
        if (!ngayStr) return "";

        // Nếu chuỗi có dạng dd/mm/yyyy hoặc mm/yyyy hoặc yyyy thì giữ nguyên (đang tổng hợp)
        if (
          /^\d{2}\/\d{2}\/\d{4}$/.test(ngayStr) ||
          /^\d{2}\/\d{4}$/.test(ngayStr) ||
          /^\d{4}$/.test(ngayStr)
        ) return ngayStr;

        const d = new Date(ngayStr);
        const datePart = new Intl.DateTimeFormat("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        }).format(d);

        const timePart = new Intl.DateTimeFormat("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(d);

        // timePart thường ra "09:18" => đổi thành "09h18"
        return `${datePart} ${timePart.replace(":", "h")}`;
      }
      function dinhDangNgayOnly(ngayStr) {
        if (!ngayStr) return "";
        // nếu đã là dd/mm/yyyy thì giữ nguyên
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(ngayStr)) return ngayStr;

        // nhận 'yyyy-mm-dd' hoặc timestamp => lấy phần ngày theo Asia/Ho_Chi_Minh
        const d = new Date(ngayStr);
        return new Intl.DateTimeFormat("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        }).format(d);
      }

      // ------------- HIỂN THỊ RA BẢNG (Handsontable) -------------
      // Map dữ liệu sang hotData (giữ số để sort/filter đúng)
      hotData = (hienThiData || []).map((hd, idx) => ({
        stt: idx + 1,
        _chk: false,
        sohd: (hd.sohd ?? ""),
        ngaytao: (hd.created_at ? dinhDangNgayGio(hd.created_at) : dinhDangNgayOnly(hd.ngay)),
        ngaysua: dinhDangNgayGio(hd.updated_at || hd.updatedAt),
        nv: (hd.manv ?? ""),
        khach: (hd.khachhang ?? ""),
        tongsl: Number(hd.tongsl || 0),
        tongthanhtien: Number(hd.tongthanhtien || 0),
        chietkhau: Number(hd.chietkhau || 0),
        thanhtoan: Number(hd.thanhtoan || 0),
        ghichu: (hd.ghichu ?? "")
      }));
      (window.ensureHot ? window.ensureHot(loaiTongHop) : null);
      // ------------- DÒNG TỔNG CUỐI BẢNG -------------
      let tongSL = 0, tongThanhTien = 0, tongChietKhau = 0, tongTien = 0;
      hienThiData.forEach(hd => {
        tongSL += Number(hd.tongsl || 0);
        tongThanhTien += Number(hd.tongthanhtien || 0);
        tongChietKhau += Number(hd.chietkhau || 0);
        tongTien += Number(hd.thanhtoan || 0);
      });
      // (v2) KHÔNG ghi đè tổng chuẩn (đã lấy từ RPC count)
      // Nếu cần, chỉ dùng để hiển thị tổng của TRANG hiện tại:
      const info = document.getElementById('dangHienThiInfo');
      if (info) info.textContent = `Đang hiển thị ${hienThiData.length.toLocaleString()} hóa đơn của trang này | SL trang: ${tongSL.toLocaleString()} | TT trang: ${tongTien.toLocaleString()}`;
      const trTong = document.createElement("tr");
      trTong.style.fontWeight = "bold";
      trTong.style.background = "#f8f8f8";
      trTong.innerHTML = `
    <td colspan="7" style="text-align:right">TỔNG</td>
    <td id="tongSoLuong">${tongSL.toLocaleString()}</td>
    <td id="tongThanhTien">${tongThanhTien.toLocaleString()}</td>
    <td id="tongChietKhau">${tongChietKhau.toLocaleString()}</td>
    <td id="tongTien">${tongTien.toLocaleString()}</td>
    <td></td>
  `;
      tbody.appendChild(trTong);

      // GẮN SỰ KIỆN CHỌN TẤT CẢ
      setTimeout(() => {
        const chonTatCa = document.getElementById('chonTatCaHD');
        if (chonTatCa) {
          chonTatCa.onclick = function () {
            const checkboxes = document.querySelectorAll('.chonHD');
            checkboxes.forEach(cb => { cb.checked = chonTatCa.checked; });
          };
        }
      }, 10);

    }




    async function xemChiTiet(sohd) {
      const popupEl = document.getElementById("popup");
      popupEl.style.display = "block";

      // Luôn neo popup ở góc trên bên phải (mở lần nào cũng reset về vị trí này)
      popupEl.style.top = "10px";
      popupEl.style.right = "10px";
      popupEl.style.left = "auto";

      document.getElementById("sohdCT").textContent = sohd;

      const { data, error } = await window.supabase.from('ct_hoadon_banle').select('*').eq('sohd', sohd);
      const tbody = document.getElementById("ctHoaDon");
      tbody.innerHTML = "";
      if (error) return tbody.innerHTML = `<tr><td colspan='7'>Lỗi: ${error.message}</td></tr>`;
      data.forEach(row => {
        const tt = (row.gia - row.km) * row.soluong;
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${row.masp}</td><td>${row.tensp}</td><td>${row.size}</td><td>${row.soluong}</td><td>${row.dvt}</td><td>${row.gia}</td><td>${row.km}</td><td>${tt.toLocaleString()}</td>`;
        tbody.appendChild(tr);
      });
    }

    function dongPopup() {
      document.getElementById("popup").style.display = "none";
    }

    async function xoaHoaDonDaChon() {
      const dsSoHd = getSelectedSoHdFromHot();
      if (!dsSoHd.length) {
        alert("❌ Bạn chưa chọn hóa đơn nào để xóa.");
        return;
      }


      // Gọi xác thực và chỉ xóa nếu xác thực thành công
      kiemTraNhanVienTruocKhiXoa(async function () {

        let dsXoa = [];
        let doiUngList = [];
        let coCCN = false;

        for (const sohd of dsSoHd) {
          if (!sohd) continue;

          const prefix = sohd.split("_")[0] || "";

          if (prefix.startsWith("xcn") || prefix.startsWith("ncn")) {
            coCCN = true;
            const so = sohd.split("_")[1];
            let doiUng = "";
            if (prefix === "xcncs1") doiUng = `ncncs2_${so}`;
            if (prefix === "xcncs2") doiUng = `ncncs1_${so}`;

    (function dragPopup() {
      let popup = document.getElementById('popup');
      let header = document.getElementById('popupHeader');
      let offsetX, offsetY, isDragging = false;
      if (header) {
        header.onmousedown = function (e) {
          isDragging = true;
          let rect = popup.getBoundingClientRect();
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
          document.onmousemove = function (ev) {
            if (isDragging) {
              popup.style.left = (ev.clientX - offsetX) + 'px';
              popup.style.top = (ev.clientY - offsetY) + 'px';
              popup.style.right = 'auto';
            }
          };
          document.onmouseup = function () { isDragging = false; document.onmousemove = null; };
        };
      }
    })();

    // 👉 Hàm mở popup xác thực + kiểm tra quyền xóa hóa đơn
    async function kiemTraNhanVienTruocKhiXoa(callbackSauXacThuc) {
      (async () => {
        // Không hỏi lại mật khẩu nữa: chỉ Confirm thao tác và để RLS quyết định quyền
        const ok = confirm("Bạn có chắc muốn XÓA hóa đơn đã chọn không?");
        if (!ok) return;

        // Phải có session đăng nhập
        try {
          const { data: { user } } = await supabase.auth.getUser();
          if (!user) {
            alert("Phiên đăng nhập đã hết. Vui lòng đăng xuất và đăng nhập lại.");
            return;
          }

          // (Khuyến nghị) kiểm tra quyền nhanh qua RPC is_admin() nếu có
          try {
            const { data: isAdmin, error } = await supabase.rpc('is_admin');
            if (!error && isAdmin !== true) {
              alert("Bạn không có quyền xóa hóa đơn.");
              return;
            }
          } catch (e) {
            // Nếu chưa có RPC is_admin() thì bỏ qua, để RLS tự chặn khi DELETE
          }

          if (typeof callbackSauXacThuc === 'function') {
            await callbackSauXacThuc({ user_id: user.id, is_admin: true });
          }
        } catch (e) {
          alert("Không kiểm tra được phiên đăng nhập. Vui lòng tải lại trang.");
        }
      })();
    }

    function openInvoiceBySohd(sohd) {
      if (!sohd) return;

      const prefix = sohd.split('_')[0].toLowerCase();  // ví dụ: bancs1, nmcs2, xcncs2_...
      let url = null;

      // Bán lẻ thường
      if (prefix === 'bancs1') {
        url = `banlemtcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'bancs2') {
        url = `banlemtcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Bán nhân viên
      else if (prefix === 'bannvcs1') {
        url = `bannvcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'bannvcs2') {
        url = `bannvcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Nhập mới
      else if (prefix === 'nmcs1') {
        url = `nhapmoimtcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nmcs2') {
        url = `nhapmoimtcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Chuyển chi nhánh (2v1) – dùng cùng trang CCN2V1
      else if (prefix === 'xcncs1' || prefix === 'ncncs1') {
        url = `ccn2v1cs1.html?sohd=${encodeURIComponent(sohd)}&loaihd=${prefix}&diadiem=cs1`;
      } else if (prefix === 'xcncs2' || prefix === 'ncncs2') {
        url = `ccn2v1cs2.html?sohd=${encodeURIComponent(sohd)}&loaihd=${prefix}&diadiem=cs2`;
      }

      // Nhập kiểm, xuất kiểm
      else if (prefix === 'nhapkiemcs1') {
        url = `nhapkiemcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nhapkiemcs2') {
        url = `nhapkiemcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      } else if (prefix === 'xuatkiemcs1') {
        url = `xuatkiemcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'xuatkiemcs2') {
        url = `xuatkiemcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Nhập tạm
      else if (prefix === 'nhaptamcs1') {
        url = `nhaptamcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nhaptamcs2') {
        url = `nhaptamcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Nhập đổi từ khách
      else if (prefix === 'nhapdoics1') {
        url = `nhapdoimtcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nhapdoics2') {
        url = `nhapdoimtcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Xuất hủy
      else if (prefix === 'xuathuycs1') {
        url = `xuathuycs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'xuathuycs2') {
        url = `xuathuycs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Chưa cấu hình
      if (!url) {
        alert("Chưa cấu hình mở hóa đơn cho loại: " + prefix);
        return;
      }

      window.open(`https://banle-js.vercel.app/${url}`, "_blank");
    }

  <script type="module">

    // ================= HANDSONTABLE (Sort + Filter) =================
    let hotHoaDon = null;
    let hotMode = null; // 'chitiet' | 'ngay' | 'thang' | 'nam'
    var hotData = [];   // data đang hiển thị (array of objects)

    function _numRenderer(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      const v = (value === null || value === undefined || value === "") ? "" : Number(value);
      td.textContent = (v === "" || Number.isNaN(v)) ? "" : v.toLocaleString();
      td.style.textAlign = "right";
    }

    function _textRenderer(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.textContent = (value === null || value === undefined) ? "" : String(value);
    }

    function ensureHot(mode) {
      const el = document.getElementById('hotHoaDon');
      if (!el) return;

      // cấu hình cột theo mode
      const isChiTiet = (mode === 'chitiet');

      const columns = [
        { data: 'stt', type: 'numeric', readOnly: true, width: 60, renderer: _textRenderer },
        { data: '_chk', type: 'checkbox', readOnly: !isChiTiet, width: 60 },
        { data: 'sohd', type: 'text', readOnly: true, width: 150, renderer: _textRenderer },
        { data: 'ngaytao', type: 'text', readOnly: true, width: 160, renderer: _textRenderer },
        { data: 'ngaysua', type: 'text', readOnly: true, width: 160, renderer: _textRenderer },
        { data: 'nv', type: 'text', readOnly: true, width: 90, renderer: _textRenderer },
        { data: 'khach', type: 'text', readOnly: true, width: 180, renderer: _textRenderer },
        { data: 'tongsl', type: 'numeric', readOnly: true, width: 90, renderer: _numRenderer },
        { data: 'tongthanhtien', type: 'numeric', readOnly: true, width: 150, renderer: _numRenderer },
        { data: 'chietkhau', type: 'numeric', readOnly: true, width: 120, renderer: _numRenderer },
        { data: 'thanhtoan', type: 'numeric', readOnly: true, width: 150, renderer: _numRenderer },
        { data: 'ghichu', type: 'text', readOnly: true, width: 260, renderer: _textRenderer },
      ];

      // Header theo chế độ tổng hợp: cột 'Số HĐ' thực tế là số lượng hóa đơn
      const colHeaders = isChiTiet
        ? ['stt', 'Chọn', 'Số HĐ', 'Ngày tạo', 'Ngày sửa', 'NV', 'Khách', 'Tổng SL', 'Tổng thành tiền', 'Chiết khấu', 'TT', 'Ghi chú']
        : ['stt', 'Chọn', 'Số HĐ', 'Ngày', 'Ngày sửa', 'NV', 'Khách', 'Tổng SL', 'Tổng thành tiền', 'Chiết khấu', 'TT', 'Ghi chú'];

      if (!hotHoaDon) {
        hotHoaDon = new Handsontable(el, {
          data: hotData,
          columns,
          colHeaders,
          rowHeaders: true,
          height: 560,
          stretchH: 'all',
          licenseKey: 'non-commercial-and-evaluation',

          // SORT + FILTER
          dropdownMenu: true,
          filters: true,
          columnSorting: true,

          // UX
          manualColumnResize: true,
          manualRowResize: true,
          contextMenu: ['copy'],
          copyPaste: true,
          search: true,
          outsideClickDeselects: false,

          afterOnCellMouseDown: async function (event, coords, td) {
            try {
              if (!isChiTiet) return;
              if (!coords || coords.row < 0) return;

              const colProp = this.colToProp(coords.col);
              if (colProp === '_chk') return; // click checkbox không mở chi tiết

              const rowObj = this.getSourceDataAtRow(coords.row);
              if (rowObj && rowObj.sohd) {
                await xemChiTiet(rowObj.sohd);
              }
            } catch (e) {
              console.error(e);
            }
          }
        });
      } else if (hotMode !== mode) {
        hotHoaDon.updateSettings({ columns, colHeaders });
      }

      hotMode = mode;
      hotHoaDon.loadData(hotData);
      hotHoaDon.render();
    };
    // expose for older code paths
    window.ensureHot = ensureHot;


    function getSelectedSoHdFromHot() {
      if (!Array.isArray(hotData)) return [];
      return hotData
        .filter(r => r && r._chk && r.sohd)
        .map(r => String(r.sohd));
    }
