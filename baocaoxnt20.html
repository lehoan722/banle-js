<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Báo cáo XNT20</title>
    <!-- Liên kết Supabase và JS mới -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script type="module" src="scripts/supabaseClient.js"></script>
    <script src="scripts/stockQuickPopup.js"></script>

    <script type="module" src="./scripts/baocaoxnt20.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/handsontable/14.3.0/handsontable.full.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.js"></script>

   

    <style>
        /* Body không cuộn; bảng cuộn trong vùng của nó */
        html,
        body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            /* mobile */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* không cuộn toàn trang */
        }

        .filters-row {
            display: flex;
            width: 100%;
            gap: 0;
            align-items: flex-start;
            margin-bottom: 7px;
            /* giảm margin-bottom */
        }

        .filters-left {
            flex: 0 0 87%;
            max-width: 87%;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 10px 22px;
        }


        .filters {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 10px 22px;
            margin-bottom: 0;
        }

        .input-popup-group {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            margin-right: 8px;
        }

        .input-popup-group input {
            width: 130px;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }

        .input-popup-group button {
            background: #eee;
            color: #222;
            border: 1px solid #bbb;
            padding: 0 8px;
            font-size: 15px;
            border-radius: 3px;
            cursor: pointer;
            height: 32px;
        }

        .input-popup-group button:hover {
            background: #ddd;
        }

        .filters label {
            margin-bottom: 0;
        }

        .filters select,
        .filters input[type="date"],
        .filters input[type="number"] {
            padding: 6px 8px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }

        button.main {
            background: #2196f3;
            color: #fff;
            border: none;
            font-weight: bold;
            padding: 8px 22px;
            border-radius: 5px;
            margin-right: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button.main:hover {
            background: #1769aa;
        }

        #authBox {
            background: #f6f8fa;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px #eee;
        }

        /* Popup tìm kiếm */
        #popupSearch {
            display: none;
            position: fixed;
            top: 16%;
            left: 50%;
            transform: translate(-50%, 0);
            background: #fff;
            z-index: 2000;
            border: 1px solid #ccc;
            min-width: 340px;
            max-width: 98vw;
            box-shadow: 0 0 12px #888;
            border-radius: 8px;
        }

        #popupSearch input {
            width: 94%;
            margin-bottom: 5px;
        }

        #popupSearchList {
            max-height: 260px;
            overflow: auto;
            font-size: 15px;
        }

        #popupSearchList div {
            padding: 5px 10px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }

        #popupSearchList div:hover {
            background: #e3f0ff;
        }


        /* Trang cao đúng màn hình, không cuộn body */
        html,
        body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            /* desktop */
            min-height: 100dvh;
            /* mobile an toàn thanh địa chỉ */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* chặn cuộn toàn trang */
            overscroll-behavior: none;
            /* tránh bounce trên mobile */
        }


        /* Scroll ngang khi bảng rộng */
        #hot .ht_master .wtHolder {
            overflow: auto !important;
        }

        /* Thanh phân trang vẫn giữ kích thước tự nhiên */
        #pager {
            flex: 0 0 auto;
        }

        /* Khóa chiều cao 10 dòng cho ô mã sản phẩm */
        #maspList {
            line-height: 1.4;
            height: calc(1.4em * 10 + 10px);
            max-height: calc(1.4em * 6 + 6px);
            resize: vertical;
        }

        .filters-right textarea {
            width: 100%;
            min-width: 110px;
            max-width: 220px;
            resize: vertical;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #bbb;
            padding: 2px;
            margin: 0;
            height: 110px;
            /* giúp nó kéo cao hết phần trên */
            box-sizing: border-box;
        }

        /* ghi đè rule cũ "height:100%" */

        /* Cho phép tiêu đề cột xuống dòng theo \n */
        #hot .handsontable .colHeader {
            white-space: pre-line !important;
            line-height: 1.15;
            word-break: keep-all;
            /* xuống tại khoảng trắng, không cắt chữ */
        }

        /* Giảm padding tiêu đề để gọn hơn */
        #hot .handsontable thead th {
            padding: 4px 6px;
        }

        /* Ẩn cụm cũ phòng khi bạn chưa xóa */
        #pager {
            display: none !important;
        }

        /* Cụm phân trang hoạt động: cố định cuối màn hình, luôn thấy được */
        #pagination {
            position: fixed;
            left: 0;
            right: 0;
            bottom: env(safe-area-inset-bottom);
            border-top: 1px solid #e5e7eb;
            padding: 6px 10px calc(6px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(2px);
        }


        /* Cho vùng lưới HOT có thể cuộn ngang khi quá rộng */
        #hot .ht_master .wtHolder {
            overflow: auto !important;
            /* rất quan trọng để lộ scrollbar ngang */
        }

        #hot .handsontable thead th,
        #hot .handsontable thead th .colHeader {
            white-space: normal !important;
            line-height: 1.1;
            text-align: center;
            padding: 4px 6px;
        }

        /* Popup ảnh sản phẩm */
        #imgModal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .55);
            z-index: 3000;
        }

        #imgModal .box {
            position: relative;
            background: #fff;
            border-radius: 12px;
            padding: 10px;
            max-width: 90vw;
            max-height: 90vh;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
        }

        #imgModal img {
            max-width: 86vw;
            max-height: 80vh;
            object-fit: contain;
            display: block;
        }

        #imgModal .cap {
            margin-top: 6px;
            text-align: center;
            font-weight: 600
        }

        #imgModal .close {
            position: absolute;
            top: 6px;
            right: 8px;
            border: 0;
            background: #fff;
            border-radius: 8px;
            padding: 4px 8px;
            cursor: pointer
        }

        .masp-link {
            color: #1d4ed8;
            text-decoration: underline;
            cursor: pointer
        }

        /* Cho lưới chiếm hết phần còn lại của màn hình */
        #hot {
            flex: 1 1 auto;
            min-height: 0;
        }

        /* Nút mũi tên thu gọn/hiện tiêu đề */
        #headerToggle {
            position: fixed;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1201;
            width: 28px;
            height: 28px;
            border-radius: 9999px;
            border: 1px solid #cbd5e1;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* Khi thu gọn: ẩn khối đăng nhập + khối bộ lọc */
        body.header-collapsed #authBox,
        body.header-collapsed .filters-row {
            display: none !important;
        }

        /* Lưới 60/40 – giảm gap giữa 2 cột để rộng chỗ cho ảnh */
        .main-grid {
            display: flex;
            gap: 6px;
            height: calc(100vh - 140px);
        }

        /* Giữ 60/40, nhưng bỏ mọi padding/margin thừa ở cột phải */
        .grid-left {
            flex: 0 0 60%;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .grid-right {
            flex: 0 0 40%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
        }

        #hot {
            flex: 1 1 auto;
            min-height: 0;
        }

        /* Tiêu đề khu ảnh – gom gọn */
        #previewTitle {
            font-weight: 700;
            margin: 2px 0 4px 0;
            line-height: 1.2;
        }

        /* Grid ảnh: sát nhau tối đa, bỏ khoảng đệm */
        #previewGrid {
            overflow: auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            /* 2 cột đều */
            gap: 2px;
            /* gần như sát nhau */
            padding: 0;
            /* bỏ mọi padding */
        }

        /* Ảnh: full chiều ngang, giữ tỉ lệ, không bo tròn, auto cao theo nội dung */
        #previewGrid img {
            width: 100%;
            height: auto;
            /* cho phép tự cao theo tỉ lệ */
            aspect-ratio: 3 / 4;
            /* giữ khung đứng đồng đều; có thể chuyển 1/1 nếu muốn vuông */
            object-fit: cover;
            border-radius: 0;
            /* bỏ bo góc để nhìn sát */
            display: block;
        }


        /* Xen kẽ màu dòng cho Handsontable */
        #hot .handsontable td.row-even {
            background: #f7eeee;
            /* màu nhạt */
        }

        #hot .handsontable td.row-odd {
            background: #ffffff;
            /* trắng */
        }

        /* Khi hover vẫn thấy rõ */
        #hot .handsontable tbody tr:hover td {
            filter: brightness(0.98);
        }
    

        /* ===== Bộ lọc nghiệp vụ đa lựa chọn XNT20 ===== */
        .xnt-filter-wrap {
            display: inline-block;
            position: relative;
            vertical-align: middle;
        }
        .xnt-filter-box {
            display: inline-flex;
            align-items: stretch;
            min-width: 280px;
        }
        #xntConditionDisplay {
            width: 250px;
            background: #fff;
            cursor: pointer;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 3px 0 0 3px;
        }
        .xnt-filter-btn {
            width: 34px;
            border: 1px solid #999;
            border-left: none;
            background: #f3f3f3;
            cursor: pointer;
            border-radius: 0 3px 3px 0;
        }
        .xnt-filter-popup {
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 9999;
            background: #f8f3df;
            border: 1px solid #c8b98b;
            border-radius: 4px;
            box-shadow: 0 3px 10px rgba(0,0,0,.12);
            width: 390px;
            max-height: 420px;
            overflow-y: auto;
            margin-top: 2px;
            padding: 4px 0;
        }
        .xnt-filter-section-title {
            padding: 7px 10px 4px;
            font-weight: 700;
            color: #445;
            background: #efe6c9;
            border-top: 1px solid #ded2ab;
        }
        .xnt-filter-row {
            display: grid;
            grid-template-columns: 1fr 30px;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            border-bottom: 1px solid #eadfb9;
        }
        .xnt-filter-row:hover { background: #efe5bf; }
        .xnt-filter-row.is-disabled { opacity: .45; }
        .xnt-filter-label {
            border: 1px solid #aaa;
            background: #fff;
            padding: 6px 8px;
            line-height: 1.2;
            font-size: 13px;
        }
        .xnt-filter-check { width: 16px; height: 16px; justify-self: center; }
        .xnt-filter-actions {
            display: flex;
            gap: 6px;
            padding: 6px 8px;
            border-bottom: 1px solid #d8cfa5;
            background: #f5ecd0;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .xnt-filter-actions button {
            flex: 1; padding: 6px; font-size: 12px; border: 1px solid #aaa; background: #fff; cursor: pointer;
        }

        /* =========================================================
           XNT20 - GIAO DIEN CUON TU NHIEN + BANG STICKY TOAN MAN HINH
           - Header / bo loc cuon di theo trang
           - Khi bang cham dinh viewport, bang bam tren dinh
           - Tieu de cot Handsontable luon nam tren cung cua bang
           - Khong con nut mui ten an/hien header ben phai
           ========================================================= */

        html {
            height: auto !important;
            min-height: 100% !important;
            overflow-y: auto !important;
        }

        body {
            height: auto !important;
            min-height: 100vh !important;
            min-height: 100dvh !important;
            display: block !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            overscroll-behavior-y: auto !important;
        }

        #app-container {
            min-height: 100vh;
        }

        /* Bo nut an/hien header cu */
        #headerToggle {
            display: none !important;
        }

        /* Header/filter se cuon tu nhien ra khoi man hinh */
        .filters-row {
            position: relative !important;
            z-index: 2;
            background: #fff;
        }

        /* Cum bang + anh bam tren dinh sau khi nguoi dung cuon het bo loc */
        .main-grid {
            position: sticky !important;
            top: 0 !important;
            z-index: 50;
            display: flex !important;
            gap: 6px !important;
            height: calc(100dvh - 58px) !important;
            min-height: 420px;
            background: #fff;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden;
        }

        .grid-left,
        .grid-right {
            min-height: 0 !important;
            height: 100% !important;
        }

        .grid-left {
            flex: 0 0 60% !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
        }

        .grid-right {
            flex: 0 0 40% !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
        }

        /* Tong hop tach thanh 2 hang ro rang, khong de chu de len nhau */
        #xntSummary {
            flex: 0 0 auto;
            margin: 0 0 6px 0 !important;
            padding: 0 !important;
            color: #2a394d;
            line-height: 1.35 !important;
            position: relative;
            z-index: 60;
            background: #fff;
        }

        #xntSummary .xnt-summary-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px 10px;
            border: 1px solid #cfe0f4;
            border-radius: 6px;
            background: #eaf4ff;
            box-sizing: border-box;
        }

        #xntSummary .xnt-summary-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            column-gap: 8px;
            row-gap: 2px;
            min-height: 24px;
            white-space: normal;
        }

        #xntSummary .xnt-summary-label {
            font-weight: 800;
            margin-right: 6px;
        }

        #xntSummary .xnt-summary-item {
            display: inline-flex;
            align-items: baseline;
            gap: 3px;
            white-space: nowrap;
        }

        #xntSummary .xnt-summary-sep {
            color: #91a4b8;
        }

        /* HOT chiem toan bo chieu cao con lai */
        #hot {
            flex: 1 1 auto !important;
            min-height: 0 !important;
            margin-top: 0 !important;
            overflow: hidden !important;
        }

        #hot > .handsontable {
            height: 100% !important;
        }

        #hot .ht_master .wtHolder {
            overflow: auto !important;
        }

        /* Anh nhanh cung chiem het chieu cao ben phai */
        #previewTitle {
            flex: 0 0 auto;
            margin: 2px 0 4px 0;
        }

        #previewGrid {
            flex: 1 1 auto !important;
            min-height: 0 !important;
            overflow: auto !important;
        }

        /* Pagination van co dinh cuoi man hinh */
        #pagination {
            z-index: 1200 !important;
        }

        @media (max-width: 900px) {
            .main-grid {
                height: calc(100dvh - 54px) !important;
            }
        }


        /* =========================================================
           XNT20 FULLSCREEN V2
           Muc tieu:
           - cuon het bo loc + tong hop ra khoi man hinh
           - khi den bang: CHI tieu de cot nam sat dinh viewport
           - bang/anh chiem het chieu cao con lai
           - khong can nut an/hien header cu
           - giu day du hit-test / click / selection cua Handsontable
           ========================================================= */

        html {
            height: auto !important;
            min-height: 100% !important;
            overflow-y: auto !important;
        }

        body {
            height: auto !important;
            min-height: 100vh !important;
            min-height: 100dvh !important;
            display: block !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            overscroll-behavior-y: auto !important;
        }

        #app-container {
            min-height: 100vh;
            min-height: 100dvh;
        }

        #headerToggle {
            display: none !important;
        }

        /* Bo loc va tong hop la noi dung binh thuong: cuon di hoan toan */
        .filters-row,
        #xntSummary {
            position: relative !important;
            top: auto !important;
            z-index: 2 !important;
        }

        #xntSummary {
            margin: 6px 8px 8px !important;
        }

        /* Workspace du lieu cao DUNG 1 viewport.
           Nho vay body co du do dai de workspace cuon len sat top=0. */
        .main-grid {
            position: sticky !important;
            top: 0 !important;
            z-index: 80 !important;
            height: 100vh !important;
            height: 100dvh !important;
            min-height: 500px !important;
            display: flex !important;
            gap: 6px !important;
            margin: 0 !important;
            padding: 0 0 58px 0 !important; /* nhường chỗ cho pagination fixed */
            box-sizing: border-box !important;
            overflow: hidden !important;
            background: #fff !important;
        }

        .grid-left,
        .grid-right {
            height: 100% !important;
            min-height: 0 !important;
            box-sizing: border-box !important;
        }

        .grid-left {
            flex: 0 0 60% !important;
            min-width: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
        }

        .grid-right {
            flex: 0 0 calc(40% - 6px) !important;
            min-width: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
        }

        /* Khi tat anh: bang an het chieu ngang */
        .main-grid.images-hidden .grid-right {
            display: none !important;
        }

        .main-grid.images-hidden .grid-left {
            flex: 1 1 100% !important;
            width: 100% !important;
        }

        /* HOT la flex item full-height.
           KHONG ep .handsontable height bang CSS:
           Handsontable can tu quan ly overlay de click/toa do dung. */
        #hot {
            flex: 1 1 auto !important;
            min-height: 0 !important;
            width: 100% !important;
            margin: 0 !important;
            overflow: hidden !important;
            pointer-events: auto !important;
        }

        #hot .handsontable,
        #hot .wtHolder,
        #hot .wtHider,
        #hot .wtSpreader,
        #hot table,
        #hot td,
        #hot th {
            pointer-events: auto !important;
        }

        #hot .ht_master .wtHolder {
            overflow: auto !important;
        }

        /* Hover: nhin ro ca dong chuot dang di qua */
        #hot .handsontable tbody tr:hover td {
            background: #eaf4ff !important;
            filter: none !important;
        }

        /* Dong dang duoc chon */
        #hot .handsontable td.xnt-current-row {
            background: #dceeff !important;
        }

        /* O hien tai noi bat hon dong */
        #hot .handsontable td.current {
            background: #cfe8ff !important;
        }

        /* Khong de mau xen ke che selection */
        #hot .handsontable td.area,
        #hot .handsontable td.highlight {
            background: #e4f2ff !important;
        }

        #previewTitle {
            flex: 0 0 auto !important;
            margin: 2px 0 4px !important;
        }

        #previewGrid {
            flex: 1 1 auto !important;
            min-height: 0 !important;
            overflow: auto !important;
        }

        .xnt-image-toggle {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            padding: 4px 7px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            background: #f8fafc;
        }

        /* Summary 2 dong ro rang */
        #xntSummary .xnt-summary-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px 10px;
            border: 1px solid #cfe0f4;
            border-radius: 6px;
            background: #eaf4ff;
            box-sizing: border-box;
        }

        #xntSummary .xnt-summary-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            column-gap: 8px;
            row-gap: 2px;
            min-height: 24px;
            line-height: 1.35;
        }

        #xntSummary .xnt-summary-label {
            font-weight: 800;
            margin-right: 6px;
        }

        #xntSummary .xnt-summary-item {
            display: inline-flex;
            align-items: baseline;
            gap: 3px;
            white-space: nowrap;
        }

        #xntSummary .xnt-summary-sep {
            color: #91a4b8;
        }

        #pagination {
            z-index: 1400 !important;
        }

        @media (max-width: 900px) {
            .main-grid {
                height: 100dvh !important;
                padding-bottom: 56px !important;
            }
        }


        /* XNT20 V3: hover visual row do JS quan ly, on dinh voi Handsontable overlays */
        #hot .handsontable td.xnt-hover-row {
            background: #dff0ff !important;
        }

        #hot .handsontable td.xnt-current-row {
            background: #cfe8ff !important;
        }
