<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auto Scheduling - Demo</title>
  <style>
    body{font-family:Arial, sans-serif; margin:16px;}
    .row{display:flex; gap:12px; align-items:end; flex-wrap:wrap;}
    label{font-size:12px; color:#444;}
    input{padding:8px; min-width:160px;}
    button{padding:10px 14px; cursor:pointer;}
    .card{border:1px solid #ddd; border-radius:8px; padding:12px; margin-top:14px;}
    table{width:100%; border-collapse:collapse; margin-top:8px;}
    th,td{border:1px solid #eee; padding:8px; font-size:13px;}
    th{background:#fafafa; text-align:left;}
    .muted{color:#777; font-size:12px;}
    .ok{color:green;}
    .err{color:#c00;}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, monospace;}
  </style>
</head>

<body>
  <h2>Auto Scheduling (Demo)</h2>
  <div class="muted">Chạy auto xếp ca + xem thiếu ca & gợi ý ứng viên</div>

  <div class="card">
    <div class="row">
      <div>
        <label>Từ ngày</label><br/>
        <input type="date" id="fromDate">
      </div>
      <div>
        <label>Đến ngày</label><br/>
        <input type="date" id="toDate">
      </div>

      <button id="btnRun">Chạy Auto Schedule</button>
      <button id="btnRefresh">Refresh dữ liệu</button>

      <span id="status" class="muted"></span>
    </div>
  </div>

  <div class="card">
    <h3>1) Shift Shortage + Suggestions</h3>
    <div class="muted">Nguồn: <span class="mono">v_shift_shortage_suggestions</span></div>
    <div id="shortageWrap"></div>
  </div>

  <div class="card">
    <h3>2) Shift Assignments (trong khoảng ngày)</h3>
    <div class="muted">Nguồn: <span class="mono">shift_assignments</span></div>
    <div id="assignWrap"></div>
  </div>

   <script type="module" src="scripts/phancatudong.js"></script>
</body>
</html>
