<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng lương tháng - tất cả nhân viên</title>

  <!-- Handsontable CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.css" />

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 8px;
      background: #f5f5f5;
    }

    h1,
    h2 {
      margin: 0;
      padding: 0;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    label {
      font-size: 12px;
      color: #333;
      margin-right: 4px;
      white-space: nowrap;
    }

    input,
    select {
      padding: 4px 6px;
      font-size: 12px;
    }

    button {
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    #status {
      font-size: 12px;
      margin-top: 4px;
    }

    .hot-container {
      height: 360px;
      /* hoặc 400px tuỳ bạn */
      overflow: auto;
      margin-top: 6px;
      background: #fff;
      /* cho dễ nhìn, không bắt buộc */
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 4px 6px;
      text-align: right;
      white-space: nowrap;
    }

    th {
      background: #eee;
      text-align: center;
    }

    td:first-child,
    td:nth-child(2),
    td:nth-child(3) {
      text-align: left;
    }

    .fw-bold {
      font-weight: bold;
    }

    .mt-2 {
      margin-top: 8px;
    }

    /* Cho tiêu đề cột Handsontable được xuống dòng */
    .handsontable .ht_clone_top th .relative {
      white-space: normal !important;
      line-height: 1.2;
    }

    /* ===== Auto fit column width theo dữ liệu (cho bảng HTML) ===== */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    /* Bảng sẽ rộng theo nội dung, nếu vượt màn hình sẽ có scroll ngang */
    .table-auto {
      width: max-content !important;
      min-width: 100%;
      table-layout: auto !important;
    }

    .table-auto th,
    .table-auto td {
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1 style="font-size: 16px; margin-bottom: 6px">
      Bảng lương tháng - tất cả nhân viên
    </h1>

    <div class="row">
      <div>
        <label for="tu_ngay">Từ ngày:</label>
        <input type="date" id="tu_ngay" />
      </div>

      <div>
        <label for="den_ngay">Đến ngày:</label>
        <input type="date" id="den_ngay" />
      </div>

      <div>
        <label for="diadiem">Cơ sở:</label>
        <select id="diadiem">
          <option value="">Tất cả</option>
          <option value="cs1">cs1</option>
          <option value="cs2">cs2</option>
        </select>
      </div>

      <div>
        <label for="luong_gio">Lương/giờ (VND):</label>
        <input id="luong_gio" type="number" value="26000" />
      </div>

      <div>
        <label for="khoan_gio">Khoán doanh thu / giờ (VND):</label>
        <input id="khoan_gio" type="number" value="700000" />
      </div>

      <div>
        <label for="pct_thuong">% thưởng trên phần vượt khoán:</label>
        <input id="pct_thuong" type="number" value="1" step="0.1" />
      </div>

      <div style="align-self: flex-end">
        <button id="btn-tai">Tải bảng lương</button>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <!-- DANH SÁCH LƯƠNG -->
  <div class="card">
    <h2 style="font-size: 14px; margin-bottom: 4px">Danh sách lương</h2>

    <!-- Handsontable -->
    <div id="hotLuong" class="hot-container"></div>

    <!-- Bảng HTML cũ: luôn hiển thị (fallback) -->
    <div style="max-height: 480px; overflow: auto; margin-top: 6px; display:none;">
      <div class="table-wrap">
        <table id="bangluongTable" class="table-auto">
          <thead>
            <tr>
              <th>Mã NV</th>
              <th>Tên NV</th>
              <th>Cơ sở</th>
              <th>Giờ công (thực)</th>
              <th>Giờ trừ TANCA_LỊCH</th>
              <th>Giờ tính lương</th>
              <th>Doanh thu</th>
              <th>Hoa hồng</th>
              <th>Khoán / giờ</th>
              <th>Khoán theo giờ công</th>
              <th>Doanh thu vượt khoán</th>
              <th>Thưởng vượt khoán</th>
              <th>Lương cứng</th>
              <th>Tổng lương</th>


              
            </tr>
          </thead>
          <tbody id="tbody-bangluong"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- BẢNG CÔNG THÁNG -->
  <div class="card">
    <h2 style="font-size: 14px; margin-bottom: 4px">BẢNG CÔNG THÁNG</h2>

    <div class="row" style="margin-bottom:6px;">
      <div>
        <label for="bc-thang">Tháng:</label>
        <input id="bc-thang" type="number" min="1" max="12" style="width:70px;" />
      </div>
      <div>
        <label for="bc-nam">Năm:</label>
        <input id="bc-nam" type="number" style="width:90px;" />
      </div>
      <div>
        <button id="btn-bangcong">Tải bảng công</button>
      </div>
    </div>

    <!-- Handsontable -->
    <div id="hotBangCong" class="hot-container"></div>

    <!-- Bảng HTML cũ: ẩn, chỉ dùng làm fallback -->
    <div class="table-responsive mt-2" style="max-height: 500px; overflow: auto; display:none;">
      <div class="table-wrap">
        <table id="bangcongTable" class="table table-bordered table-sm table-auto">
          <thead id="thead-bangcong" class="table-dark"></thead>
          <tbody id="tbody-bangcong"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Handsontable JS -->
  <script src="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.js"></script>

  <script>
    // Tự động ước lượng độ rộng cột theo nội dung (Handsontable)
    // LƯU Ý: sẽ có tác dụng nếu file JS không ép colWidths hoặc stretchH="all"
    if (window.Handsontable) {
      Handsontable.DefaultSettings.autoColumnSize = { useHeaders: true, syncLimit: 2000 };
      Handsontable.DefaultSettings.stretchH = 'none';
    }
  </script>

  <!-- Script xử lý -->
  <script type="module" src="./scripts/bangluongthangadminhoahong.js"></script>
</body>

</html>
