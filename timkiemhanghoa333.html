<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Tìm kiếm thông tin hàng hóa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.js"></script>


    <style>
        /* ====== Cơ bản ====== */
        :root {
            --card-gap: 16px;
            --img-max: 360px
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            background: #f6f8fa;
            font-family: Segoe UI, Arial, sans-serif;
            color: #1f2937
        }

        .main-container {
            max-width: 1100px;
            margin: 24px auto;
            padding: 12px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 4px 18px rgba(30, 41, 59, .08)
        }

        /* ====== Topbar gọn + panel ⋯ (theo trang 222) ====== */
        .topbar-compact {
            position: sticky;
            top: 0;
            z-index: 1000000;
            /* hoặc 999999 */
            background: #fff;
            padding: 8px 8px 0;
            border-radius: 12px
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: wrap
        }

        .icon-btn {
            border: 1px solid #d0d7de;
            background: #f6f8fa;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer
        }

        #maspInput {
            flex: 1 1 360px;
            min-width: 260px;
            height: 38px;
            padding: 0 10px;
            border: 1px solid #d0d7de;
            border-radius: 8px
        }

        .tools {
            display: none;
            margin-top: 8px;
            padding: 8px;
            border: 1px dashed #e0e6ef;
            border-radius: 12px;
            background: #fbfdff
        }

        .tools.open {
            display: block
        }

        .tool-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 6px
        }

        .chip,
        .chip-select {
            border: 1px solid #cfd8dc;
            background: #f3f7ff;
            border-radius: 10px;
            padding: 6px 10px
        }

        #bulkTextarea {
            width: min(920px, 100%);
            height: 6.5em;
            border: 1px solid #cfd8dc;
            border-radius: 10px;
            padding: 8px;
            font-family: Consolas, monospace
        }

        .muted {
            color: #6b7280
        }

        /* ====== Bảng thông tin + XNT ====== */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            background: #fafbfc
        }

        .info-table th,
        .info-table td {
            border: 1px solid #e5eefc;
            padding: 6px 8px;
            text-align: center
        }

        .info-table th {
            background: #eaf2ff;
            color: #0f5cc4;
            font-weight: 700
        }

        .right-xnt {
            width: 100%;
            overflow-x: auto
        }

        /* CHỈ vùng bảng cuộn ngang */
        .scroll-x {
            overflow-x: auto
        }

        /* ====== Ảnh ====== */
        .img-wrap {
            display: flex;
            align-items: flex-start;
            justify-content: center
        }

        .img-wrap img {
            width: 100%;
            max-width: var(--img-max);
            height: auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08)
        }

        /* ====== SINGLE (1 sản phẩm) ====== */
        /* markup theo file: #singleDetailBox.detail-layout > .left-pane + .right-pane  */
        .detail-layout {
            display: grid;
            grid-template-columns: 1fr minmax(280px, var(--img-max));
            gap: var(--card-gap);
            align-items: start
        }

        .detail-layout .left-pane {
            min-width: 0
        }

        .detail-layout .right-pane {
            position: sticky;
            top: 72px
        }

        /* ảnh đứng yên nhẹ khi cuộn bảng dài */
        @media (max-width: 900px) {
            .detail-layout {
                grid-template-columns: 1fr
            }

            .detail-layout .right-pane {
                position: static
            }
        }

        /* ====== MULTI (nhiều sản phẩm) ====== */
        /* Container chỉ 1 cột: các thẻ xếp DỌC, KHÔNG song song 2 cột */
        #multiDetailBox {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            margin-top: 12px
        }

        /* Mỗi thẻ “sản phẩm” dựng y như SINGLE: trái = info+xnt, phải = ảnh */
        #multiDetailBox .detail-grid {
            display: grid;
            grid-template-columns: 1fr minmax(300px, var(--img-max));
            gap: var(--card-gap);
            align-items: start;
            background: #fff;
            border: 1px solid #eef2f7;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 2px 12px rgba(15, 23, 42, .04)
        }

        #multiDetailBox .detail-grid .top-info {
            grid-column: 1
        }

        #multiDetailBox .detail-grid .right-xnt {
            grid-column: 1
        }

        #multiDetailBox .detail-grid .img-wrap {
            grid-column: 2;
            grid-row: 1/span 2
        }

        @media (max-width: 900px) {
            #multiDetailBox .detail-grid {
                grid-template-columns: 1fr
            }

            #multiDetailBox .detail-grid .img-wrap {
                grid-column: 1;
                grid-row: auto
            }

            #multiDetailBox .detail-grid .bulk-note-line {
                grid-column: 1;
            }
        }

        /* ====== Mobile tối ưu nhập liệu & popup ====== */
        @media (max-width:700px) {
            .toolbar {
                gap: 6px
            }

            #maspInput {
                flex-basis: 100%
            }

            .icon-btn {
                padding: 10px
            }

            .tools {
                padding: 10px
            }
        }

        /* ====== Phụ: flash/toast/popup sẵn có ====== */
        /* ====== Popup tìm kiếm: luôn nằm trên cùng ====== */
        #popupSearch {
            display: none;
            position: fixed;
            top: 16%;
            left: 50%;
            transform: translateX(-50%);
            min-width: 320px;
            max-width: 96vw;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .12);

            /* QUAN TRỌNG: cao hơn Handsontable / sticky header */
            z-index: 999999;
        }

        /* Danh sách kết quả: cuộn + không bị tràn */
        #popupSearchList {
            max-height: 60vh;
            overflow: auto;
        }

        /* Mỗi dòng trong danh sách: tăng khoảng cách 1.5 lần + dễ click */
        #popupSearchList>div {
            padding: 14px 14px;
            line-height: 1.5;
            /* ✅ tăng 1.5 lần */
            font-size: 16px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }

        #popupSearchList>div:hover {
            background: #f6f8fa;
        }

        #flashOverlay {
            position: fixed;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 20000;
            transition: .25s
        }

        #toastMsg {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .82);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            opacity: 0;
            z-index: 20001;
            transition: .3s
        }

        /* Giữ toolbar 1 hàng trên điện thoại */
        @media (max-width: 480px) {
            .toolbar {
                display: grid;
                grid-template-columns: 40px 1fr 40px 40px 40px;
                /* 🔍 | input | ↩︎ | 📷 | ⋯ */
                gap: 6px;
            }

            #maspInput {
                min-width: 0;
                width: 100%;
                height: 40px
            }

            /* cho phép co lại, không đẩy nút xuống dòng */
            .icon-btn {
                width: 40px;
                height: 40px;
                padding: 0
            }
        }

        /* Máy cực nhỏ (≤360px) thu nhỏ nút thêm chút */
        @media (max-width: 360px) {
            .toolbar {
                grid-template-columns: 36px 1fr 36px 36px 36px;
                gap: 4px
            }

            .icon-btn {
                width: 36px;
                height: 36px
            }
        }

        .bulk-note-line {
            margin-top: 6px;
            padding: 4px 0 0;
            color: #ff2a2a;
            font-size: 16px;
            line-height: 1.45;
            font-weight: 500;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>



</head>

<body>

    <div id="app-container" style="display:none;">
        <!-- Toàn bộ giao diện timkiemhanghoa333 hiện tại của bạn
       (form tìm kiếm, bảng, ảnh...) phải nằm BÊN TRONG div này -->

        <div class="main-container">

            <!-- ===== COMPACT TOPBAR (sticky) ===== -->
            <div id="compactTopbar" class="topbar-compact">

                <!-- Thanh công cụ siêu gọn -->
                <div class="toolbar">
                    <button class="icon-btn" title="Tìm nhanh" onclick="openPopupSearch('mahang')">🔍</button>

                    <input id="maspInput" placeholder="Nhập mã… (VD 66862-AP)" autocomplete="off"
                        onkeydown="if((event.key==='Enter'||event.keyCode===13)){event.preventDefault(); preCleanThenSearch();}" />

                    <button id="searchBtn" class="icon-btn" title="Tìm" onclick="preCleanThenSearch()">↩︎</button>
                    <button id="scanBtn" class="icon-btn" title="Quét">📷</button>
                    <button id="moreBtn" class="icon-btn" title="Công cụ" aria-expanded="false"
                        onclick="toggleTools()">⋯</button>
                </div>

                <!-- Popup tìm kiếm dùng chung -->
                <div id="popupSearch">
                    <div style="padding:6px 10px;border-bottom:1px solid #eee;background:#f8fafd;">
                        <input id="popupSearchInput" type="text" placeholder="Nhập từ khóa tìm kiếm..." autofocus />
                        <button onclick="closePopupSearch()"
                            style="float:right;background:#e57373;color:#fff;">Đóng</button>
                    </div>
                    <div id="popupSearchList"></div>
                </div>

                <!-- Scanner Modal (giữ nguyên) -->
                <div id="scannerModal"
                    style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3000;">
                    <div
                        style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,720px);background:#000;border-radius:12px;overflow:hidden">
                        <div style="position:relative;background:#000">
                            <video id="scannerVideo" playsinline autoplay muted
                                style="width:100%;height:auto;background:#000"></video>
                            <div
                                style="position:absolute;inset:12% 12%;border:2px solid rgba(255,255,255,.8);border-radius:10px;pointer-events:none;">
                            </div>
                            <div id="scannerStatus"
                                style="position:absolute;left:12px;bottom:10px;color:#fff;font-weight:600;text-shadow:0 1px 2px #000">
                            </div>
                        </div>
                        <div
                            style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px;background:#111;color:#eee">
                            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                                <select id="cameraSelect" style="max-width:48vw"></select>
                                <button id="flashBtn" class="popup-btn"
                                    style="background:#222;border-color:#666;color:#eee">🔦
                                    Đèn</button>
                                <label class="popup-btn"
                                    style="background:#222;border-color:#666;color:#eee;cursor:pointer">
                                    Ảnh có sẵn
                                    <input id="filePicker" type="file" accept="image/*" capture="environment" hidden />
                                </label>
                            </div>
                            <button id="closeScanner" class="popup-btn"
                                style="background:#e57373;border-color:#c62828;color:#fff">Đóng</button>
                        </div>
                    </div>
                </div>


                <!-- Dòng thông báo (tự ẩn khi trống) -->
                <div id="statusMsg" class="status-line"></div>
                <div id="flashOverlay"></div>
                <div id="toastMsg"></div>

                <!-- Bảng Công cụ: ẩn mặc định (desktop + mobile), bấm ⋯ để mở -->
                <div id="toolsPanel" class="tools">
                    <div class="tool-row">
                        <label class="chip icon-chip" title="Chọn ảnh">
                            📁 Chọn ảnh
                            <input id="imgFileInput" type="file" accept="image/*" capture="environment" hidden>
                        </label>
                        <button id="saveImgBtn" class="chip" title="Lưu ảnh">💾 Lưu ảnh</button>
                        <button id="clearBulkBtn" class="chip" title="Xoá dữ liệu dán">🧹 Xoá DL</button>
                        <span id="uploadStatus" class="muted"></span>
                    </div>

                    <div class="tool-row">
                        <button id="orderBtn" class="chip" title="Đặt hàng">🛒 Đặt hàng</button>
                        <select id="branchPicker" class="chip-select" title="Chọn cơ sở">
                            <option value="">-- Chưa chọn --</option>
                            <option value="cs1">CS1</option>
                            <option value="cs2">CS2</option>
                        </select>
                        <button id="saveVitriBtn" class="chip" title="Lưu vị trí">💾 Lưu vị trí</button>
                        <span id="saveVitriStatus" class="muted"></span>
                    </div>

                    <div class="tool-row">
                        <textarea id="bulkTextarea" placeholder="Dán 1 cột mã (mỗi dòng 1 mã)
                      VD:
                      11376-GDM
                        60252-GDE"></textarea>
                    </div>
                </div>

            </div>

            <!-- ===== END COMPACT TOPBAR ===== -->


            <!-- KHU HIỂN THỊ SẢN PHẨM / BẢNG / ẢNH -->
            <div id="multiDetailBox"></div>

            <!-- DESKTOP: 2 cột; MOBILE: xếp dọc -->
            <div id="singleDetailBox" class="detail-layout">
                <!-- Cột trái: 8 ô + bảng -->
                <div class="left-pane">
                    <div class="top-info">
                        <table id="infoTopTable" class="info-table"></table>
                    </div>
                    <div class="right-xnt scroll-x">
                        <table id="infoTableRight" class="info-table"></table>
                    </div>

                    <!-- Dòng chú thích màu đỏ dưới bảng -->
                    <div id="bulkNoteBox" class="bulk-note-line"></div>
                </div>

                <!-- Cột phải: ảnh -->
                <aside class="right-pane">
                    <div class="img-wrap">
                        <img id="productImage" alt="Ảnh sản phẩm" />
                    </div>
                </aside>
            </div>

        </div>

        <script>
            // CẮT HẬU TỐ _SIZE Ở CUỐI CHUỖI. VD: "ABC12-DG38_38" -> "ABC12-DG38"
            function stripSizeSuffixAtEnd(s) {
                if (!s) return "";
                s = String(s).trim();
                // chỉ cắt đoạn _... nếu NẰM Ở CUỐI
                const m = s.match(/^(.*)_[A-Za-z0-9.\-]+$/);
                return m ? m[1] : s;
            }

            // Làm sạch tất cả input/textarea liên quan rồi gọi hàm tìm kiếm cũ
            function preCleanThenSearch() {
                // 1) Ô nhập 1 mã (nếu có)
                var ip = document.getElementById('maspInput');
                if (ip && ip.value) {
                    ip.value = stripSizeSuffixAtEnd(ip.value);
                }

                // 2) Textarea nhiều mã (nếu có)
                var ta = document.getElementById('bulkTextarea');
                if (ta && ta.value) {
                    var cleaned = ta.value
                        .split(/[\r\n,;\t]+/)
                        .map(function (x) { return stripSizeSuffixAtEnd(x); })
                        .map(function (x) { return x.trim(); })
                        .filter(Boolean);
                    // không tự động loại trùng/đổi thứ tự — giữ nguyên “đơn giản”
                    ta.value = cleaned.join('\n');
                }

                // 3) Gọi lại hàm tìm kiếm cũ (nếu có tham số tuỳ trang thì để nguyên)
                if (typeof window.triggerSearch === 'function') {
                    window.triggerSearch();
                }
            }
        </script>

        <script>
            // lang nghe enter trong o maspInput
            document.addEventListener('DOMContentLoaded', function () {
                var ip = document.getElementById('maspInput');
                if (!ip) return;
                ip.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();          // chặn submit form / reload trang
                        preCleanThenSearch();        // làm sạch _SIZE rồi gọi triggerSearch()
                    }
                });

                // Nếu ô này nằm trong <form>, đảm bảo submit cũng đi qua "làm sạch"
                var form = ip.closest('form');
                if (form) {
                    form.addEventListener('submit', function (e) {
                        e.preventDefault();
                        preCleanThenSearch();
                    });
                }
            });
        </script>

        <!-- Popup Đặt hàng -->
        <div id="popupDatHang" style="display:none;position:fixed;inset:0;background:#f5f7fb;z-index:4000;">

                    <button id="dhCloseBtn" class="popup-btn" style="background:#e57373;color:#fff;">Trở về</button>

                    </label>

                    <label> Mã SP

                            style="width:100%;padding:8px;border:1px solid #90caf9;border-radius:6px">

                    <label> Màu (chọn 1 hoặc gõ)

                    </label>

                    <label> Còn size (chọn nhiều theo mô tả hoặc gõ thủ công, ngăn cách dấu phẩy)
                        <div style="display:flex;gap:6px;">
                            <input id="dhConSize" placeholder="ví dụ: S-38-46-240-165, M-39-48-245-170"

                    </label>

                    <label> Hết size (chọn nhiều theo mô tả hoặc gõ thủ công, ngăn cách dấu phẩy)
                        <div style="display:flex;gap:6px;">
                            <input id="dhHetSize" placeholder="ví dụ: XL-41-52-255-180"

                            <button id="pickHetSizeBtn" class="popup-btn">Chọn</button>

                    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px;">
                        <button id="dhSaveBtn" class="popup-btn"

        <!-- Popup chọn Màu -->
        <div id="popupPickMau" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:4500;">
            <div
                style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);background:#fff;border-radius:10px;overflow:hidden;">
                <div
                    style="padding:8px;background:#f6f8fa;border-bottom:1px solid #eee;display:flex;justify-content:space-between;">
                    <b>Chọn màu</b>
                    <button id="mauCloseBtn" class="popup-btn">Đóng</button>
                </div>
                <div id="mauList" style="max-height:60vh;overflow:auto;"></div>
            </div>
        </div>

        <!-- Popup chọn Size (dùng chung cho Còn & Hết) -->
        <div id="popupPickSize" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:4500;">
            <div
                style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);background:#fff;border-radius:10px;overflow:hidden;">
                <div
                    style="padding:8px;background:#f6f8fa;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center;">
                    <b style="flex:0 0 auto;">Chọn size</b>
                    <input id="sizeFilter" placeholder="Tìm nhanh theo mô tả..."
                        style="flex:1;padding:6px;border:1px solid #90caf9;border-radius:6px">
                    <button id="sizeDoneBtn" class="popup-btn">Xong</button>
                </div>
                <div id="sizeList" style="max-height:60vh;overflow:auto;"></div>
            </div>
        </div>

        <script>
            // Lưu trạng thái Tools (mở/đóng) để lần sau giữ nguyên
            (function () {
                const panel = document.getElementById('toolsPanel');
                const saved = localStorage.getItem('tk_tools_open') === '1';
                if (panel && saved) panel.classList.add('open');
            })();

            function toggleTools() {
                const panel = document.getElementById('toolsPanel');
                if (!panel) return;
                const isOpen = panel.classList.toggle('open');
                localStorage.setItem('tk_tools_open', isOpen ? '1' : '0');
            }
        </script>

        <script>
            (function syncLeftWidth() {
                const topInfo = document.getElementById('infoTopTable');
                const leftPane = document.querySelector('.detail-layout .left-pane');
                if (!topInfo || !leftPane) return;
                function apply() {
                    const w = topInfo.offsetWidth;
                    if (w) leftPane.style.width = w + 'px';
                }
                apply();
                window.addEventListener('resize', apply);
            })();
        </script>

        <script>
            /* Ẩn #singleDetailBox khi #multiDetailBox có nội dung (nhiều sản phẩm) */
            (function () {
                const multi = document.getElementById('multiDetailBox');
                const single = document.getElementById('singleDetailBox');
                if (!multi || !single) return;

                function toggle() {
                    // có phần tử con nào không?
                    const hasMulti = !!multi.querySelector('*') && multi.innerHTML.trim() !== '';
                    single.style.display = hasMulti ? 'none' : '';
                }

                // chạy ngay + theo dõi thay đổi danh sách
                toggle();
                new MutationObserver(toggle).observe(multi, { childList: true, subtree: true });
            })();
        </script>

    </div>

        import * as authModule from "./scripts/authModule.js";

        // Khởi tạo login chung
        authModule.khoiTaoDangNhapDungChung({

            onLoginSuccess: window.onLoginSuccessTimKiem,
            skipPagePermissionCheck: true // nếu trong authModule có flag kiểu này
        });
    </script>
