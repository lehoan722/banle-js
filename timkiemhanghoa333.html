<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Tìm kiếm nhanh hàng hóa</title>
    <style>
        :root {
            --bg: #f3f6fb;
            --card: #ffffff;
            --line: #dbe4f0;
            --blue: #1d4ed8;
            --blue-soft: #eaf2ff;
            --red: #dc2626;
            --text: #0f172a;
            --muted: #64748b;
            --green: #15803d;
            --yellow: #fff7cc;
            --cyan: #eaf4ff;
            --shadow: 0 8px 24px rgba(15, 23, 42, .08);
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            font-family: Arial, sans-serif;
            color: var(--text);
        }

        body {
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 10px 10px 80px;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(243, 246, 251, .96);
            backdrop-filter: blur(8px);
            padding: 8px 0 10px;
        }

        .search-row {
            display: grid;
            grid-template-columns: 44px 1fr 44px 44px;
            gap: 8px;
            align-items: center;
        }

        .icon-btn,
        .action-btn,
        .small-btn {
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text);
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            font-size: 18px;
            box-shadow: var(--shadow);
        }

        #maspInput {
            height: 44px;
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 0 12px;
            font-size: 18px;
            outline: none;
            box-shadow: var(--shadow);
            text-transform: uppercase;
        }

        .tools-card {
            margin-top: 8px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .tools-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            font-weight: 700;
            background: var(--blue-soft);
            color: var(--blue);
            cursor: pointer;
        }

        .tools-body {
            display: none;
            padding: 10px;
        }

        .tools-card.open .tools-body {
            display: block;
        }

        .row2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field label {
            font-size: 13px;
            color: var(--muted);
            font-weight: 700;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            font-size: 15px;
            outline: none;
            background: #fff;
        }

        .field textarea {
            min-height: 100px;
            resize: vertical;
            font-family: Consolas, monospace;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .action-btn,
        .small-btn {
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 700;
        }

        .action-btn.primary {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
        }

        .action-btn.green {
            background: #ecfdf5;
            color: var(--green);
            border-color: #bbf7d0;
        }

        .action-btn.red {
            background: #fef2f2;
            color: var(--red);
            border-color: #fecaca;
        }

        .status {
            margin-top: 8px;
            min-height: 20px;
            font-size: 14px;
            color: var(--blue);
            font-weight: 700;
        }

        .result-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .card-head {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            justify-content: space-between;
            padding: 10px 12px;
            background: linear-gradient(180deg, #fff, #f8fbff);
            border-bottom: 1px solid var(--line);
        }

        .card-title {
            min-width: 0;
            flex: 1;
        }

        .card-title .masp {
            font-size: 19px;
            font-weight: 800;
            color: #111827;
            word-break: break-word;
        }

        .card-title .meta {
            margin-top: 4px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.45;
        }

        .price-box {
            text-align: right;
            white-space: nowrap;
            font-size: 18px;
            font-weight: 800;
            color: var(--red);
        }

        .card-body {
            padding: 10px 12px 12px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .meta-item {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 8px 10px;
            background: #fff;
            min-height: 60px;
        }

        .meta-item .k {
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .meta-item .v {
            font-size: 15px;
            font-weight: 700;
            word-break: break-word;
        }

        .stock-wrap {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
        }

        table.stock-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 560px;
            font-size: 14px;
        }

        .stock-table th,
        .stock-table td {
            border-bottom: 1px solid #edf2f7;
            padding: 7px 8px;
            text-align: center;
            white-space: nowrap;
        }

        .stock-table th {
            background: #f8fafc;
            color: var(--blue);
            font-weight: 800;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .stock-table .c-k1,
        .stock-table .c-b1 {
            background: var(--yellow);
        }

        .stock-table .c-k2,
        .stock-table .c-b2 {
            background: var(--cyan);
        }

        .stock-table .sum td {
            font-weight: 800;
            color: var(--blue);
            text-decoration: underline;
        }

        .stock-table tr.size-row {
            cursor: pointer;
        }

        .stock-table tr.size-row:active td {
            background: #dbeafe;
        }

        .vitri-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .vitri-box {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            padding: 10px;
        }

        .vitri-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 800;
            color: var(--blue);
        }

        .vitri-input-row {
            display: grid;
            grid-template-columns: 1fr 88px;
            gap: 8px;
            align-items: center;
        }

        .vitri-input-row .small-btn,
        .vitri-input-row .save-vitri-btn {
            height: 42px;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        @media (max-width: 700px) {
            .vitri-input-row {
                grid-template-columns: 1fr;
            }

            .vitri-input-row .small-btn,
            .vitri-input-row .save-vitri-btn {
                width: 100%;
                height: 44px;
            }
        }

        .vitri-input-row input {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            font-size: 15px;
        }

        .thumb-box {
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }

        .thumb-box img {
            width: 100%;
            height: auto;
            display: block;
            max-height: 230px;
            object-fit: contain;
            background: #fff;
        }

        .empty {
            padding: 24px 12px;
            text-align: center;
            color: var(--muted);
            font-weight: 700;
        }

        .bulk-note-line {
            margin-top: 8px;
            padding: 4px 2px 0;
            color: #ff2a2a;
            font-size: 16px;
            line-height: 1.45;
            font-weight: 600;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #popupSearch,
        #scannerModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
        }

        #popupSearch {
            background: rgba(15, 23, 42, .35);
            padding: 14px 10px;
        }

        .popup-box {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0, 0, 0, .18);
        }

        .popup-head {
            display: grid;
            grid-template-columns: 1fr 70px;
            gap: 8px;
            padding: 10px;
            border-bottom: 1px solid var(--line);
            background: #f8fafc;
        }

        #popupSearchInput {
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 0 10px;
            font-size: 16px;
        }

        #popupSearchList {
            max-height: 70vh;
            overflow: auto;
        }

        #popupSearchList>div {
            padding: 14px 12px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            line-height: 1.45;
        }

        #popupSearchList>div:active {
            background: #eff6ff;
        }

        #scannerModal {
            background: rgba(0, 0, 0, .6);
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .scanner-box {
            width: min(96vw, 720px);
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0, 0, 0, .35);
        }

        #scannerVideo {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }

        .scanner-foot {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #111827;
            color: #fff;
        }

        #scannerStatus {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            padding: 8px 10px 0;
        }

        #flashOverlay {
            position: fixed;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 10000;
            transition: .2s;
        }

        #toastMsg {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, .9);
            color: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            opacity: 0;
            z-index: 10001;
            transition: .2s;
            max-width: calc(100vw - 24px);
            text-align: center;
        }

        @media (min-width: 700px) {
            .card-body {
                grid-template-columns: 1fr 190px;
                align-items: start;
            }

            .main-pane {
                min-width: 0;
            }

            .side-pane {
                min-width: 0;
            }
        }
    </style>
</head>

<body>
    <div id="app-container" style="display:none;">
        <div class="app">
            <div class="topbar">
                <div class="search-row">
                    <button class="icon-btn" id="popupBtn" title="Tìm mã">🔍</button>
                    <input id="maspInput" autocomplete="off" placeholder="Nhập mã sản phẩm" />
                    <button class="icon-btn" id="searchBtn" title="Tìm">↩</button>
                    <button class="icon-btn" id="scanBtn" title="Quét mã">📷</button>
                </div>

                <div class="tools-card" id="toolsCard">
                    <div class="tools-head" id="toggleToolsBtn">
                        <span>Công cụ nhanh</span>
                        <span id="toolsArrow">▾</span>
                    </div>
                    <div class="tools-body">
                        <div class="row2">
                            <div class="field">
                                <label>Cơ sở mặc định để lưu vị trí</label>
                                <select id="branchPicker">
                                    <option value="">Tự nhận theo tên trang</option>
                                    <option value="cs1">CS1</option>
                                    <option value="cs2">CS2</option>
                                </select>
                            </div>
                            <div class="field">
                                <label>Tìm nhiều mã</label>
                                <button class="action-btn primary" id="searchBulkBtn" type="button">Tìm danh sách
                                    mã</button>
                            </div>
                        </div>

                        <div class="field">
                            <label>Dán nhiều mã, mỗi dòng 1 mã</label>
                            <textarea id="bulkTextarea" placeholder="VD:
66862-AP
11376-GDM"></textarea>
                        </div>

                        <div class="actions">
                            <button class="action-btn" id="clearBulkBtn" type="button">Xóa danh sách</button>
                            <button class="action-btn green" id="pasteFromTransferBtn" type="button">Nhận dữ liệu đẩy
                                về</button>
                            <button class="action-btn red" id="closeToolsBtn" type="button">Thu gọn</button>
                        </div>
                    </div>
                </div>

                <div class="status" id="statusMsg"></div>
            </div>

            <div id="resultList" class="result-list"></div>
        </div>
    </div>

    <div id="popupSearch">
        <div class="popup-box">
            <div class="popup-head">
                <input id="popupSearchInput" type="text" placeholder="Nhập từ khóa mã hàng..." />
                <button class="action-btn red" id="closePopupBtn" type="button">Đóng</button>
            </div>
            <div id="popupSearchList"></div>
        </div>
    </div>

    <div id="scannerModal">
        <div class="scanner-box">
            <video id="scannerVideo" playsinline autoplay muted></video>
            <div id="scannerStatus">Đang chuẩn bị camera...</div>
            <div class="scanner-foot">
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <select id="cameraSelect" class="small-btn"></select>
                    <button id="switchCameraBtn" class="small-btn" type="button">Đổi camera</button>
                </div>
                <button id="closeScannerBtn" class="small-btn" type="button">Đóng</button>
            </div>
        </div>
    </div>

    <div id="flashOverlay"></div>
    <div id="toastMsg"></div>

    <script src="./scripts/stockQuickSimilar.js"></script>

    <script type="module">
        import * as authModule from "./scripts/authModule.js";
        import "./scripts/supabaseClient.js";

        const IMG_BASE = "https://rddjrmbyftlcvrgzlyby.supabase.co/storage/v1/object/public/anhsanpham/";
        const appContainer = document.getElementById('app-container');
        const statusMsg = document.getElementById('statusMsg');
        const resultList = document.getElementById('resultList');
        const maspInput = document.getElementById('maspInput');
        const bulkTextarea = document.getElementById('bulkTextarea');
        const branchPicker = document.getElementById('branchPicker');
        const toolsCard = document.getElementById('toolsCard');
        const popupSearch = document.getElementById('popupSearch');
        const popupSearchInput = document.getElementById('popupSearchInput');
        const popupSearchList = document.getElementById('popupSearchList');
        const toastMsg = document.getElementById('toastMsg');
        const flashOverlay = document.getElementById('flashOverlay');

        let ZXING = null;
        let codeReader = null;
        let scanControls = null;
        let scanTrack = null;
        let activeCameraId = '';
        let audioCtx = null;

        // trạng thái tìm 1 mã
        let singleSearchLastCode = '';
        let singleSearchMode = 'exact'; // 'exact' | 'similar'

        function playScanBeep() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;

                if (!audioCtx) audioCtx = new AC();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => { });
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.value = 1600;

                gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.13);
            } catch (_) { }
        }

        function getSupabaseClient() {
            const client = window.supabase;
            if (!client || typeof client.from !== 'function' || typeof client.rpc !== 'function') {
                showToast('Supabase chưa sẵn sàng', 'warn');
                return null;
            }
            return client;
        }

        function normCode(s) {
            return String(s || '').trim().toUpperCase();
        }

        function stripSizeSuffixAtEnd(s) {
            s = String(s || '').trim();
            const m = s.match(/^(.*)_[A-Za-z0-9.\-]+$/);
            return m ? m[1] : s;
        }

        function getSimilarPrefixFromCode(code) {
            const s = normCode(stripSizeSuffixAtEnd(code));
            if (!s) return '';
            const idx = s.lastIndexOf('.');
            if (idx <= 0) return '';
            return s.slice(0, idx);
        }

        function detectBranchFromPage() {
            const path = String(window.location.pathname || '').toLowerCase();
            if (path.includes('cs1')) return 'cs1';
            if (path.includes('cs2')) return 'cs2';
            return '';
        }

        function getCurrentBranch() {
            return branchPicker.value || detectBranchFromPage() || '';
        }

        function getDenNgay() {
            try {
                const raw = sessionStorage.getItem('XNT14_FILTERS');
                if (raw) {
                    const f = JSON.parse(raw);
                    if (f.den_ngay) return f.den_ngay;
                }
            } catch (_) { }
            return new Date().toISOString().slice(0, 10);
        }

        function formatPrice(v) {
            const n = Number(v || 0);
            return n ? n.toLocaleString('vi-VN') : '';
        }

        function showToast(msg, type = 'info') {
            toastMsg.textContent = msg;
            toastMsg.style.background = type === 'warn' ? 'rgba(185,28,28,.92)' : 'rgba(15,23,42,.92)';
            toastMsg.style.opacity = '1';
            clearTimeout(showToast._timer);
            showToast._timer = setTimeout(() => { toastMsg.style.opacity = '0'; }, 1800);
        }

        function showFlash() {
            flashOverlay.style.opacity = '1';
            clearTimeout(showFlash._timer);
            showFlash._timer = setTimeout(() => { flashOverlay.style.opacity = '0'; }, 130);
        }

        function normalizeSizeValue(v) {
            const raw = String(v || '').trim();
            const noPrefix = raw.replace(/^size\s+/i, '').trim();
            const m = noPrefix.match(/(\d{1,2})/);
            return m ? m[1] : noPrefix;
        }

        function displaySizeLabel(size) {
            const noPrefix = String(size || '').replace(/^size\s+/i, '').trim();
            if (!noPrefix) return '';
            if (noPrefix === '0') return '0';
            const map = {
                '38': '38,2,S,46,240,165',
                '39': '39,3,M,48,245,170',
                '40': '40,4,L,50,250,175',
                '41': '41,5,XL,52,255,180',
                '42': '42,6,2XL,54,260,185',
                '43': '43,7,3X,56,265,190',
                '44': '44,8,4X,58,270,195',
                '45': '45,9,5X,60,275,200'
            };
            return map[noPrefix] || noPrefix;
        }

        async function waitForSupabaseReady(maxWaitMs = 12000) {
            const start = Date.now();
            while (Date.now() - start < maxWaitMs) {
                const client = getSupabaseClient();
                if (client && client.auth && typeof client.auth.getSession === 'function') {
                    try {
                        await client.auth.getSession();
                        return client;
                    } catch (_) { }
                }
                await new Promise(r => setTimeout(r, 150));
            }
            return getSupabaseClient();
        }

        async function fetchTonBanByMasp(maspRaw) {
            const masp = normCode(maspRaw);
            if (!masp) return { masp: '', rows: [], vitri_cs1: '', vitri_cs2: '', nhap_dau_ma: '', nhap_cuoi_ma: '', giale: '', nhomhang: '' };

            const client = await waitForSupabaseReady(12000);
            if (!client) return { masp, rows: [], vitri_cs1: '', vitri_cs2: '', nhap_dau_ma: '', nhap_cuoi_ma: '', giale: '', nhomhang: '' };

            let rows = [];
            let vitri_cs1 = '';
            let vitri_cs2 = '';
            let nhap_dau_ma = '';
            let nhap_cuoi_ma = '';
            let giale = '';
            let nhomhang = '';

            try {
                const denNgay = getDenNgay();
                let [snapRes, hhRes] = await Promise.all([
                    client.rpc('xntnhanh', {
                        p_masps: [masp],
                        p_den_ngay: denNgay,
                        p_tonghop_size: false,
                    }),
                    client
                        .from('dmhanghoa')
                        .select('vitrikho1, vitrikho2, nhapdau, giale, nhomhang')
                        .eq('masp', masp)
                        .maybeSingle()
                ]);

                const firstRows = Array.isArray(snapRes?.data) ? snapRes.data : [];
                if (!firstRows.length && !snapRes?.error) {
                    await new Promise(r => setTimeout(r, 400));
                    snapRes = await client.rpc('xntnhanh', {
                        p_masps: [masp],
                        p_den_ngay: denNgay,
                        p_tonghop_size: false,
                    });
                }

                if (Array.isArray(snapRes?.data) && snapRes.data.length) {
                    nhap_dau_ma = String(snapRes.data[0].nhap_dau_ma || '').trim();
                    nhap_cuoi_ma = String(snapRes.data[0].nhap_cuoi_ma || '').trim();
                    rows = snapRes.data.map(r => ({
                        masp: normCode(r.masp),
                        size: String(r.size || '').trim(),
                        ton_cs1: Number(r.ton_cs1 || 0),
                        ton_cs2: Number(r.ton_cs2 || 0),
                        ban_cs1: Number(r.ban_cs1 || 0),
                        ban_cs2: Number(r.ban_cs2 || 0),
                        tong_ban: Number(r.tong_ban || 0),
                        tong_nhap: Number(r.tong_nhap || 0),
                        tong_ton: Number(r.tong_ton || 0),
                    }));
                }

                if (hhRes?.data) {
                    vitri_cs1 = hhRes.data.vitrikho1 || '';
                    vitri_cs2 = hhRes.data.vitrikho2 || '';
                    giale = hhRes.data.giale || '';
                    nhomhang = hhRes.data.nhomhang || '';
                    if (hhRes.data.nhapdau && !nhap_dau_ma) {
                        const d = new Date(hhRes.data.nhapdau);
                        if (!isNaN(d.getTime())) {
                            const yy = String(d.getFullYear()).slice(2);
                            const mm = String(d.getMonth() + 1).padStart(2, '0');
                            const dd = String(d.getDate()).padStart(2, '0');
                            nhap_dau_ma = `${dd}${mm}${yy}`;
                        }
                    }
                }
            } catch (e) {
                console.warn('[quicksearch] fetchTonBanByMasp error:', e);
            }

            return { masp, rows, vitri_cs1, vitri_cs2, nhap_dau_ma, nhap_cuoi_ma, giale, nhomhang };
        }

        async function fetchSimilarCodesByPrefix(codeRaw) {
            const prefix = getSimilarPrefixFromCode(codeRaw);
            if (!prefix) return [];

            const client = await waitForSupabaseReady(12000);
            if (!client) return [];

            try {
                const { data, error } = await client
                    .from('dmhanghoa')
                    .select('masp')
                    .ilike('masp', `${prefix}.%`)
                    .order('masp', { ascending: true })
                    .limit(100);

                if (error || !Array.isArray(data)) return [];

                const exactCode = normCode(stripSizeSuffixAtEnd(codeRaw));
                const codes = data
                    .map(r => normCode(r.masp))
                    .filter(Boolean);

                // đưa mã người dùng vừa tìm lên đầu
                const unique = [];
                const seen = new Set();

                if (exactCode && codes.includes(exactCode)) {
                    unique.push(exactCode);
                    seen.add(exactCode);
                }

                for (const c of codes) {
                    if (seen.has(c)) continue;
                    unique.push(c);
                    seen.add(c);
                }

                return unique;
            } catch (e) {
                console.warn('[quicksearch] fetchSimilarCodesByPrefix error:', e);
                return [];
            }
        }

        async function saveVitriKhoNhanh(maspRaw, cosoRaw, vitriRaw) {
            const masp = normCode(maspRaw);
            const coso = String(cosoRaw || '').trim().toLowerCase();
            const vitri = String(vitriRaw || '').trim();
            if (!masp || !coso || !vitri) return { ok: false, message: 'Thiếu dữ liệu lưu vị trí' };

            const client = getSupabaseClient();
            if (!client) return { ok: false, message: 'Supabase chưa sẵn sàng' };

            try {
                const { data, error } = await client.rpc('rpc_save_vitrikho_nhanh', {
                    p_masp: masp,
                    p_coso: coso,
                    p_vitri: vitri,
                });
                if (error) return { ok: false, message: error.message || 'Lỗi lưu vị trí' };
                return data || { ok: true, message: 'Đã lưu' };
            } catch (e) {
                return { ok: false, message: e.message || 'Lỗi lưu vị trí' };
            }
        }

        function isLikelyProductCode(line) {
            const s = normCode(line);

            if (!s) return false;

            // loại các dòng chỉ là size / số lượng / chi tiết size
            // ví dụ: 40/1 42/1 , 2 , / 2 , 38,2,S,46...
            if (/^\d+\s*$/.test(s)) return false;
            if (/^(\d{1,2}\/\d+\s*)+$/.test(s)) return false;
            if (/^\s*\/\s*\d+\s*$/.test(s)) return false;
            if (/^\d{1,2}(,\d+)*(,[A-Z0-9]+)*$/.test(s)) return false;

            // lấy phần trước dấu " / " nếu có kiểu: MDN600.NAU / 2
            const leftPart = s.split(/\s*\/\s*/)[0].trim();

            // mã hàng của bạn thường có chữ
            if (!/[A-Z]/.test(leftPart)) return false;

            // loại trường hợp size có chữ đơn lẻ kiểu XL/2 nếu có
            if (/^(S|M|L|XL|XXL|2XL|3XL|4XL|5XL)$/i.test(leftPart)) return false;

            return true;
        }

        function normalizeIncomingProductCode(line) {
            let s = normCode(line);
            if (!s) return '';

            // kiểu: MDN600.NAU / 2  -> lấy MDN600.NAU
            s = s.split(/\s*\/\s*/)[0].trim();

            s = stripSizeSuffixAtEnd(s);
            return normCode(s);
        }

        function buildBulkNoteMapFromTextarea() {
            const rawLines = String(bulkTextarea.value || '')
                .split(/[\r\n]+/)
                .map(x => String(x || '').trim())
                .filter(Boolean);

            const map = {};

            for (const line of rawLines) {
                if (!isLikelyProductCode(line)) continue;

                const code = normalizeIncomingProductCode(line);
                if (!code) continue;

                // giữ nguyên dòng gốc để hiển thị lại
                map[code] = line;
            }

            window.BULK_NOTE_MAP = map;
            return map;
        }

        function getBulkNoteByMasp(masp) {
            const key = normCode(masp);
            const map = window.BULK_NOTE_MAP || {};
            return map[key] || '';
        }

        function resetSingleSearchMode() {
            singleSearchLastCode = '';
            singleSearchMode = 'exact';
        }

        function parseBulkCodes() {
            const rawLines = String(bulkTextarea.value || '')
                .split(/[\r\n]+/)
                .map(x => String(x || '').trim())
                .filter(Boolean);

            const seen = new Set();
            const out = [];

            for (const line of rawLines) {
                if (!isLikelyProductCode(line)) continue;

                const code = normalizeIncomingProductCode(line);
                if (!code) continue;
                if (seen.has(code)) continue;

                seen.add(code);
                out.push(code);
            }

            return out;
        }

        async function renderSingle(masp) {
            const payload = await fetchTonBanByMasp(masp);
            if (!payload.masp) return '';
            return buildCardHtml(payload);
        }

        async function triggerSearch() {
            buildBulkNoteMapFromTextarea();

            const bulkCodes = parseBulkCodes();
            const singleCode = normCode(stripSizeSuffixAtEnd(maspInput.value));

            // ===== Trường hợp tìm nhiều mã: giữ nguyên như cũ =====
            if (bulkCodes.length) {
                statusMsg.textContent = `Đang tìm ${bulkCodes.length} mã...`;
                resultList.innerHTML = '<div class="empty">Đang tải dữ liệu...</div>';

                const htmlParts = [];
                for (const code of bulkCodes) {
                    const html = await renderSingle(code);
                    if (html) htmlParts.push(html);
                }

                if (!htmlParts.length) {
                    resultList.innerHTML = '<div class="empty">Không tìm thấy dữ liệu.</div>';
                    statusMsg.textContent = 'Không có dữ liệu phù hợp.';
                    return;
                }

                resultList.innerHTML = htmlParts.join('');
                statusMsg.textContent = `Hoàn thành: ${htmlParts.length} sản phẩm.`;
                bindCardEvents();
                return;
            }

            // ===== Trường hợp tìm 1 mã =====
            if (!singleCode) {
                statusMsg.textContent = 'Vui lòng nhập mã hoặc dán danh sách mã.';
                return;
            }

            // nếu đổi mã mới thì reset về exact
            if (singleCode !== singleSearchLastCode) {
                singleSearchLastCode = singleCode;
                singleSearchMode = 'exact';
            }

            const currentMode = singleSearchMode;
            resultList.innerHTML = '<div class="empty">Đang tải dữ liệu...</div>';

            let codes = [];

            if (currentMode === 'exact') {
                statusMsg.textContent = `Đang tìm chính xác: ${singleCode}`;
                codes = [singleCode];
            } else {
                const prefix = getSimilarPrefixFromCode(singleCode);
                statusMsg.textContent = prefix
                    ? `Đang tìm các mã tương tự: ${prefix}`
                    : `Mã không có hậu tố màu, đang tìm chính xác: ${singleCode}`;

                codes = prefix ? await fetchSimilarCodesByPrefix(singleCode) : [singleCode];

                if (!codes.length) {
                    codes = [singleCode];
                }
            }

            const htmlParts = [];
            for (const code of codes) {
                const html = await renderSingle(code);
                if (html) htmlParts.push(html);
            }

            if (!htmlParts.length) {
                resultList.innerHTML = '<div class="empty">Không tìm thấy dữ liệu.</div>';
                statusMsg.textContent = 'Không có dữ liệu phù hợp.';
                return;
            }

            resultList.innerHTML = htmlParts.join('');

            if (currentMode === 'exact') {
                statusMsg.textContent = `Đã tìm chính xác: ${singleCode}`;
                singleSearchMode = 'similar';
            } else {
                statusMsg.textContent = `Đã tìm tương tự: ${htmlParts.length} mã`;
                singleSearchMode = 'exact';
            }

            bindCardEvents();
        }

            let q = client.from('dmhanghoa').select('masp, tensp').limit(100);
            if (keyword && keyword.length >= 1) q = q.ilike('masp', `%${keyword}%`);

                popupSearchList.innerHTML = '<div>Không tìm thấy dữ liệu</div>';

            popupSearchList.innerHTML = data.map(r => `

        async function ensureZXing() {
            if (ZXING) return;
            ZXING = await import('https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm');
        }

        function scoreCameraLabel(label = '') {
            const s = String(label || '').toLowerCase();
            let score = 0;

            // ưu tiên camera sau
            if (/(back|rear|environment|mặt sau|camera sau)/.test(s)) score += 100;

            // ưu tiên CAO NHẤT: cực rộng / siêu rộng / 0.5x
            if (/(ultra\s*wide|ultrawide|0\.5x|0,5x|0\.5|0,5|cực rộng|siêu rộng)/.test(s)) score += 1000;

            // tránh tele / zoom
            if (/(tele|zoom|2x|3x|chụp xa)/.test(s)) score -= 300;

            // tránh camera trước
            if (/(front|trước|mặt trước)/.test(s)) score -= 1000;

            return score;
        }

        async function listVideoDevices() {
            await ensureZXing();
            const devices = await ZXING.BrowserCodeReader.listVideoInputDevices();
            return devices || [];
        }

        async function populateCameraList() {
            const sel = document.getElementById('cameraSelect');
            const devices = await listVideoDevices();

            devices.sort((a, b) => scoreCameraLabel(b.label) - scoreCameraLabel(a.label));

            sel.innerHTML = devices.map(d => `<option value="${d.deviceId}">${d.label || 'Camera'}</option>`).join('');

            // luôn mặc định chọn camera điểm cao nhất = cực rộng mặt sau nếu máy có
            if (devices[0]) {
                activeCameraId = devices[0].deviceId;
                sel.value = activeCameraId;
            }

            return devices;
        }

        async function startScanner(deviceId = '') {
            const scannerModal = document.getElementById('scannerModal');
            const scannerVideo = document.getElementById('scannerVideo');
            const scannerStatus = document.getElementById('scannerStatus');
            scannerModal.style.display = 'flex';
            scannerStatus.textContent = 'Đang mở camera...';

            await ensureZXing();
            await populateCameraList();
            codeReader = new ZXING.BrowserMultiFormatReader(undefined, { delayBetweenScanAttempts: 25 });

            try {
                scanControls?.stop?.();
            } catch (_) { }

            try {
                const useId = deviceId || activeCameraId;
                activeCameraId = useId;
                scanControls = await codeReader.decodeFromVideoDevice(useId || undefined, scannerVideo, (result, err, controls) => {
                    if (result?.getText) {
                        const code = normCode(stripSizeSuffixAtEnd(result.getText()));
                        if (!code) return;

                        playScanBeep();
                        showFlash();
                        showToast(`Đã quét ${code}`);

                        maspInput.value = code;
                        resetSingleSearchMode();
                        closeScanner();
                        triggerSearch();
                    }
                });

                const stream = scannerVideo.srcObject;
                if (stream) scanTrack = stream.getVideoTracks()[0] || null;
                scannerStatus.textContent = 'Đưa mã vạch hoặc QR vào khung.';
            } catch (e) {
                console.error(e);
                scannerStatus.textContent = 'Không mở được camera. Kiểm tra quyền camera.';
            }
        }

        function closeScanner() {
            document.getElementById('scannerModal').style.display = 'none';
            try { scanControls?.stop?.(); } catch (_) { }
            try { scanTrack?.stop?.(); } catch (_) { }
            scanControls = null;
            scanTrack = null;
        }

        function applyIncomingBulk() {
            const bulk = localStorage.getItem('TKHH333_BULK') || localStorage.getItem('STOCKQUICK_BULK') || '';

            bulkTextarea.value = String(bulk)

                .filter(Boolean)
                .join('\n');

            popupSearchInput.addEventListener('input', e => searchPopup(e.target.value.trim()));
            popupSearch.addEventListener('click', e => { if (e.target === popupSearch) closePopupSearch(); });

            maspInput.addEventListener('input', () => {
                const current = normCode(stripSizeSuffixAtEnd(maspInput.value));
                if (current !== singleSearchLastCode) {
                    resetSingleSearchMode();
                }
            });

            maspInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    triggerSearch();

        window.triggerSearch = triggerSearch;

        window.onLoginSuccessQuickSearch = async function (nhanvien, context) {
            const diadiem = (context && context.diadiem) || detectBranchFromPage() || '';
            if (diadiem) branchPicker.value = diadiem;
            appContainer.style.display = '';
            maspInput.focus();

            const hasIncoming = applyIncomingBulk();
            const urlMasp = new URLSearchParams(window.location.search).get('masp');
            if (urlMasp) {
                maspInput.value = normCode(stripSizeSuffixAtEnd(urlMasp));
                resetSingleSearchMode();
                await triggerSearch();
            } else if (hasIncoming) {
                resetSingleSearchMode();
                await triggerSearch();
            }
        };

        restoreToolsState();
        bindEvents();

        authModule.khoiTaoDangNhapDungChung({
            appContainerId: 'app-container',
            macDinhDiaDiem: '',
            tuDongKhoaCoSo: false,
            loginApiPath: '/api/login-cs1',
            onLoginSuccess: window.onLoginSuccessQuickSearch,
            skipPagePermissionCheck: true
        });
    </script>
