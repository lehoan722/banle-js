<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Tìm kiếm hàng hóa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.js"></script>
    <script type="module" src="scripts/supabaseClient.js"></script>
    <script type="module" src="scripts/timkiemhanghoa333.js"></script>
    <style>
        body {
            background: #f6f8fa;
            font-family: Segoe UI, Arial, sans-serif;
            margin: 0
        }

        .main-container {
            max-width: 900px;
            background: #fff;
            margin: 32px auto 0;
            border-radius: 16px;
            box-shadow: 0 3px 18px #d2d8e3;
            padding: 10px 10px 10px
        }

        h2 {
            margin: 0 0 20px;
            text-align: center;
            color: #1976d2;
            font-size: 2rem
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 20px
        }

        .input-group {
            display: flex;
            flex-direction: column
        }

        .input-group label {
            font-weight: 600;
            color: #1976d2;
            margin-bottom: 5px
        }

        .input-group input {
            font-size: 1.15rem;
            padding: 5px 5px;
            border-radius: 5px;
            border: 1px solid #90caf9;
            width: 200px;
            transition: box-shadow .2s
        }

        .input-group input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #90caf9
        }

        .popup-btn {
            background: #e3f0ff;
            border: 1px solid #1976d2;
            color: #1976d2;
            font-weight: 600;
            padding: 3px 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px
        }

        .popup-btn:hover {
            background: #bbdefb
        }

        /* Bảng thông tin */
        .info-table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 8px;
            background: #fafbfc;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 10px #ececec
        }

        .info-table th,
        .info-table td {
            padding: 5px 5px;
            border: 1px solid #dbe9fd;
            text-align: center
        }

        .info-table th {
            background: #e3f0ff;
            color: #1976d2;
            font-weight: 700
        }

        .info-table th.red {
            color: #d32f2f
        }

        .info-table td.size {
            font-weight: 600;
            background: #f4f9fd
        }

        .info-table td.number {
            font-variant-numeric: tabular-nums
        }

        .info-table .blue {
            color: #1565c0;
            font-weight: 700
        }

        .info-table .red {
            color: #d32f2f;
            font-weight: 700
        }

        .right-xnt {
            width: 100%;
            overflow-x: auto
        }

        .top-info {
            margin-top: 8px
        }

        /* TOP BAR: trái form – phải textarea */
        .topbar {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(160px, 1fr);
            gap: 16px;
            align-items: start
        }

        .bulk-box {
            min-width: 120px;
            max-width: 120px
        }

        #bulkTextarea {
            width: 100%;
            height: 3.5em;
            overflow: auto;
            resize: vertical;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            padding: 5px 5px;
            font-family: Consolas, monospace;
            background: #fff
        }

        /* ===== Layout CHUẨN bạn chọn ===== */
        /* 1 mã: cột trái = thông tin + XNT; cột phải = ảnh (ảnh cao bằng 2 hàng) */
        #singleDetailBox {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: min-content;
            gap: 16px
        }

        #singleDetailBox .top-info {
            grid-column: 1/2
        }

        #singleDetailBox .right-xnt {
            grid-column: 1/2
        }

        #singleDetailBox .img-wrap {
            grid-column: 2/3;
            grid-row: 1/span 2;
            align-self: start;
            margin-top: 0
        }

        /* nhiều mã: mỗi block .detail-grid giống hệt bố cục trên */
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: min-content;
            gap: 16px
        }

        .detail-grid .top-info {
            grid-column: 1
        }

        .detail-grid .right-xnt {
            grid-column: 1
        }

        .detail-grid .img-wrap {
            grid-column: 2;
            grid-row: 1/span 2;
            align-self: start;
            margin-top: 0
        }

        /* Ảnh: thu nhỏ 60% bằng width (KHÔNG dùng transform để tránh chiều cao ảo) */
        #singleDetailBox .img-wrap img,
        .detail-grid .img-wrap img {
            width: 80%;
            height: auto;
            display: block
        }

        /* Mobile (iPhone dọc): xếp theo thứ tự Thông tin → XNT → Ảnh, ảnh full width */
        @media (max-width:700px) {

            #singleDetailBox,
            .detail-grid {
                grid-template-columns: 1fr
            }

            #singleDetailBox .img-wrap,
            .detail-grid .img-wrap {
                grid-column: 1;
                grid-row: auto
            }

            #singleDetailBox .img-wrap img,
            .detail-grid .img-wrap img {
                width: 50%
            }
        }

        /* ===== Desktop tweaks (giữ bố cục gọn hàng 1) ===== */
        .topbar .input-row:first-child .input-group {
            flex: 1;
            min-width: 260px;
        }

        .topbar .input-row:first-child #maspInput {
            width: 100%;
        }

        /* ===== Mobile (iPhone dọc) — xếp topbar theo cột, không chồng chéo ===== */
        @media (max-width: 700px) {

            /* 1 cột cho toàn bộ topbar */
            .topbar {
                grid-template-columns: 1fr;
            }

            /* Các hàng trong topbar giãn cách vừa phải và full width */
            .topbar .input-row {
                gap: 8px;
            }

            .topbar .input-row>* {
                width: 100%;
            }

            /* nút + input full width */
            .topbar .input-group input {
                width: 100%;
            }

            /* ô nhập mã full width */
            #searchBtn,
            #scanBtn {
                width: 100%;
                height: 44px;
            }

            /* Hàng 2 (upload ảnh): cho 2 nút nằm cùng một hàng, trạng thái xuống dòng dưới */
            .topbar .input-row:nth-child(2) {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .topbar .input-row:nth-child(2) .popup-btn {
                width: 100%;
            }

            #uploadStatus {
                grid-column: 1 / -1;
            }

            /* chiếm trọn dòng để không đè nút */

            /* Hàng 3 (textarea nhiều mã) chiếm trọn chiều ngang */
            .bulk-box {
                min-width: 0;
                max-width: 100%;
            }

            #bulkTextarea {
                width: 100%;
                height: 6.5em;
            }
        }

        #popupSearch {
            display: none;
            position: fixed;
            top: 16%;
            left: 50%;
            padding: 5px 10px;
            transform: translate(-50%, 0);
            background: #fff;
            z-index: 2000;
            border: 1px solid #ccc;
            min-width: 340px;
            max-width: 96vw;
            box-shadow: 0 0 12px #888;
            border-radius: 8px;
        }

        /* Hiệu ứng flash toàn màn hình */
        #flashOverlay {
            position: fixed;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 20000;
            transition: opacity 0.25s ease;
        }

        /* Thông báo nhanh (toast) */
        #toastMsg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            opacity: 0;
            z-index: 20001;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* Ngăn iOS Safari auto-zoom khi focus input bằng cách đảm bảo font-size >= 16px */
#popupDatHang input,
#popupDatHang textarea,
#popupDatHang select,
#popupDatHang button {
  font-size: 16px;        /* quan trọng: >=16px */
  line-height: 1.25;
}

/* Nếu có ô tìm nhanh trong popup chọn size/màu */
#popupPickSize input#sizeFilter,
#popupPickMau input {
  font-size: 16px;
  line-height: 1.25;
}

html, body, #popupDatHang {
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation; /* hạn chế double-tap zoom trên mobile */
}

#popupDatHang {
  position: fixed;
  inset: 0;
  height: 100vh;       /* luôn chiếm toàn màn hình */
  overflow: auto;      /* cuộn bên trong nếu nội dung dài */
}

    </style>


</head>

<body>

        <div id="statusMsg" style="color:#c62828;font-weight:bold;min-height:30px;"></div>

    <script>
        // CẮT HẬU TỐ _SIZE Ở CUỐI CHUỖI. VD: "ABC12-DG38_38" -> "ABC12-DG38"
        function stripSizeSuffixAtEnd(s) {
            if (!s) return "";
            s = String(s).trim();
            // chỉ cắt đoạn _... nếu NẰM Ở CUỐI
            const m = s.match(/^(.*)_[A-Za-z0-9.\-]+$/);
            return m ? m[1] : s;
        }

        // Làm sạch tất cả input/textarea liên quan rồi gọi hàm tìm kiếm cũ
        function preCleanThenSearch() {
            // 1) Ô nhập 1 mã (nếu có)
            var ip = document.getElementById('maspInput');
            if (ip && ip.value) {
                ip.value = stripSizeSuffixAtEnd(ip.value);
            }

            // 2) Textarea nhiều mã (nếu có)
            var ta = document.getElementById('bulkTextarea');
            if (ta && ta.value) {
                var cleaned = ta.value
                    .split(/[\r\n,;\t]+/)
                    .map(function (x) { return stripSizeSuffixAtEnd(x); })
                    .map(function (x) { return x.trim(); })
                    .filter(Boolean);
                // không tự động loại trùng/đổi thứ tự — giữ nguyên “đơn giản”
                ta.value = cleaned.join('\n');
            }

            // 3) Gọi lại hàm tìm kiếm cũ (nếu có tham số tuỳ trang thì để nguyên)
            if (typeof window.triggerSearch === 'function') {
                window.triggerSearch();
            }
        }
    </script>

    <script>
        // lang nghe enter trong o maspInput
        document.addEventListener('DOMContentLoaded', function () {
            var ip = document.getElementById('maspInput');
            if (!ip) return;
            ip.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();          // chặn submit form / reload trang
                    preCleanThenSearch();        // làm sạch _SIZE rồi gọi triggerSearch()
                }
            });

            // Nếu ô này nằm trong <form>, đảm bảo submit cũng đi qua "làm sạch"
            var form = ip.closest('form');
            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    preCleanThenSearch();
                });
            }
        });
    </script>

    <!-- Popup Đặt hàng -->
