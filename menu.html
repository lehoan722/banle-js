<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MENU Google Sheet - Đăng nhập bằng mã nhân viên</title>
    <style>
        body {
            background: #f8f8f8;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .menu-container {
            max-width: 450px;
            margin: 30px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 16px 0 rgba(90, 100, 120, 0.08);
            padding: 0 0 18px 0;
        }

        .menu-title {
            background: #fff;
            color: #e53935;
            font-size: 1.38rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 18px 0 10px 0;
            border-bottom: 2px solid #ffd54f;
            text-align: center;
        }

        .menu-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .menu-item {
            cursor: pointer;
            font-size: 1.11rem;
            padding: 11px 20px;
            border-bottom: 1px solid #f0eee5;
            background: #fff;
            transition: background 0.18s;
            color: #34495e;
        }

        .menu-item:nth-child(even) {
            background: #fffbe7;
        }

        .menu-item:hover,
        .menu-item:active {
            background: #ffe082;
            color: #c62828;
        }

        /* LOGIN MODAL */
        .login-modal {
            position: fixed; z-index: 9999;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.13);
            display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 30px 0 #aaa8;
            padding: 35px 28px 28px 28px;
            min-width: 285px;
            max-width: 95vw;
            text-align: center;
            position: relative;
        }
        .login-title {
            color: #d32f2f;
            font-size: 1.21rem;
            font-weight: 700;
            margin-bottom: 18px;
            letter-spacing: 2px;
        }
        .login-label {
            text-align: left;
            margin-bottom: 4px;
            color: #333;
            font-size: 1rem;
            font-weight: 600;
        }
        .login-input {
            width: 100%;
            padding: 9px 10px;
            font-size: 1.04rem;
            margin-bottom: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #f7f7ff;
            box-sizing: border-box;
            transition: border 0.2s;
        }
        .login-input:focus { border-color: #ffc107; outline: none;}
        .login-btn {
            width: 100%;
            padding: 11px;
            font-size: 1.08rem;
            border: none;
            border-radius: 8px;
            background: #ffd54f;
            color: #c62828;
            font-weight: 700;
            cursor: pointer;
            margin-top: 7px;
        }
        .login-btn:hover { background: #ffc107; }
        .login-error { color: #d32f2f; font-size: 0.98rem; margin-bottom: 7px; min-height: 22px;}
        .logout-btn {
            float: right;
            margin: 9px 18px 0 0;
            background: #ffd54f;
            color: #d32f2f;
            font-size: 0.98rem;
            border: none;
            border-radius: 8px;
            padding: 4px 18px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 1px 4px #ffe08233;
            display: none;
        }
        .logout-btn.show { display: block; }
        @media (max-width: 600px) {
            .menu-container { max-width: 99vw; margin: 5px auto; border-radius: 0; box-shadow: none; }
            .menu-title { font-size: 1.12rem; padding: 12px 0 7px 0; }
            .menu-item { font-size: 0.98rem; padding: 10px 9vw; }
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <button class="logout-btn" id="logoutBtn" onclick="logout()">Đăng xuất</button>
        <div class="menu-title">MENU</div>
        <ul class="menu-list" id="menuList">
            <li style="text-align:center;color:#aaa;padding:20px 0;" id="loadingMenu">Đang tải menu...</li>
        </ul>
    </div>
    <!-- Login Modal -->
    <div class="login-modal" id="loginModal">
        <form class="login-box" id="loginForm" autocomplete="off">
            <div class="login-title">ĐĂNG NHẬP</div>
            <div class="login-error" id="loginError"></div>
            <div class="login-label">Nhập mã nhân viên</div>
            <input class="login-input" id="manvInput" type="password" required autocomplete="off" maxlength="32" autofocus placeholder="Mã nhân viên">
            <button class="login-btn" type="submit">Đăng nhập</button>
        </form>
    </div>
    <script>
        const SHEET_ID = '1LK_VKjXFRwLWuabZgjlIs1Q0EIEYF7Vf3EdCSGbTDOk';
        const SHEET_NAME = 'MENU'; // tên sheet
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;

        let menuData = [];
        let manvList = [];

        // Đọc sheet + lấy mã NV
        async function fetchSheet() {
            try {
                const res = await fetch(SHEET_URL);
                if (!res.ok) throw new Error('Không thể đọc Google Sheet');
                const csv = await res.text();
                const rows = csv.trim().split('\n').map(row => row.split(','));
                // Nếu dòng đầu là tiêu đề, bỏ qua
                let data = rows;
                if (rows[0][0].toLowerCase().includes('menu')) data = rows.slice(1);
                menuData = data;
                // Lấy danh sách mã NV (cột C, tức là row[2])
                manvList = data.map(row => (row[2]||"").trim()).filter(s => s);
            } catch (e) {
                document.getElementById('menuList').innerHTML = '<li style="color:#d32f2f;text-align:center;padding:20px 0;">Lỗi tải dữ liệu!<br>' + e.message + '</li>';
            }
        }

        // Kiểm tra trạng thái đăng nhập
        async function checkLogin() {
            await fetchSheet();
            const manv = localStorage.getItem('dmnv');
            if (manv && manvList.includes(manv)) {
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('logoutBtn').classList.add('show');
                loadMenu();
            } else {
                document.getElementById('loginModal').style.display = 'flex';
                document.getElementById('logoutBtn').classList.remove('show');
                document.getElementById('menuList').innerHTML = '<li style="text-align:center;color:#aaa;padding:20px 0;">Bạn cần đăng nhập để xem menu</li>';
            }
        }

        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const manv = document.getElementById('manvInput').value.trim();
            document.getElementById('loginError').textContent = '';
            if (!manv) return;
            if (!manvList.includes(manv)) {
                document.getElementById('loginError').textContent = 'Mã nhân viên không đúng!';
                return;
            }
            // Đúng, lưu trạng thái đăng nhập
            localStorage.setItem('dmnv', manv);
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('logoutBtn').classList.add('show');
            loadMenu();
        };

        function logout() {
            localStorage.removeItem('dmnv');
            document.getElementById('logoutBtn').classList.remove('show');
            document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('menuList').innerHTML = '<li style="text-align:center;color:#aaa;padding:20px 0;">Bạn cần đăng nhập để xem menu</li>';
        }

        // Hiển thị menu
        function loadMenu() {
            const menuList = document.getElementById('menuList');
            menuList.innerHTML = '';
            menuData.forEach((row, i) => {
                const [name, url] = row;
                if (!name || !url || name.trim()=='' || url.trim()=='') return;
                const li = document.createElement('li');
                li.className = 'menu-item';
                li.textContent = name.replace(/^"+|"+$/g, '');
                const urlFixed = url.replace(/^"+|"+$/g, '');
                li.onclick = () => window.open(urlFixed, '_blank');
                menuList.appendChild(li);
            });
            if (!menuList.children.length) {
                menuList.innerHTML = '<li style="text-align:center;color:#888;padding:18px;">Không có dữ liệu menu!</li>';
            }
        }

        // Tải lần đầu
        checkLogin();
    </script>
</body>
</html>
