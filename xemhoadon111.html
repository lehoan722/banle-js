  <!---//Thêm “hàng rào” đăng nhập chuẩn auth cho xemhoadon111.html-->

  <script>

    let rowDangChon = null;

    // Lấy đủ mọi dòng hóa đơn từ Supabase (bằng .range để lấy từng trang, rồi gộp lại)
    async function getAllHoaDon(query, pageSize = 1000) {
      let from = 0;
      let allData = [];
      while (true) {
        let { data, error } = await query.range(from, from + pageSize - 1);
        if (error) {
          alert("❌ Lỗi tải hóa đơn: " + error.message);
          break;
        }
        if (data && data.length > 0) {
          allData = allData.concat(data);
          if (data.length < pageSize) break; // Trang cuối cùng
          from += pageSize;
        } else {
          break;
        }
      }
      return allData;
    }


    // ... (đoạn createClient, getAllHoaDon, v.v. của bạn giữ nguyên)

    // Lấy tất cả sohd từ ct_hoadon_banle theo 1 mã (dùng phân trang .range giống getAllHoaDon)
    async function getSohdByOneMasp(masp, pageSize = 2000) {
      let from = 0;
      const sohdSet = new Set();
      while (true) {
        const { data, error } = await window.supabase
          .from('ct_hoadon_banle')
          .select('sohd, masp')
          .ilike('masp', `%${masp}%`)
          .range(from, from + pageSize - 1);

        if (error) { alert('❌ Lỗi tìm sohd theo mã: ' + error.message); break; }
        if (!data || data.length === 0) break;

        data.forEach(r => { if (r?.sohd) sohdSet.add(r.sohd); });
        if (data.length < pageSize) break;
        from += pageSize;
      }
      return sohdSet;
    }

    // Lấy tập sohd theo nhiều mã: matchAll=true → giao nhau; matchAll=false → hợp
    async function getSohdByMaspList(maspList, matchAll = true) {
      if (!maspList.length) return new Set();
      const sets = [];
      for (const m of maspList) {
        const s = await getSohdByOneMasp(m);
        sets.push(s);
      }
      if (sets.length === 1) return sets[0];

      if (matchAll) {
        // Giao nhau
        let inter = sets[0];
        for (let i = 1; i < sets.length; i++) {
          const next = sets[i];
          inter = new Set([...inter].filter(x => next.has(x)));
          if (inter.size === 0) break;
        }
        return inter;
      } else {
        // Hợp
        const uni = new Set();
        sets.forEach(s => s.forEach(x => uni.add(x)));
        return uni;
      }
    }


    async function taiDanhSachHoaDon() {
      // 1. Lấy các giá trị lọc từ giao diện
      const tuNgay = document.getElementById("tuNgay").value;
      let denNgay = document.getElementById("denNgay").value;
      if (denNgay) denNgay = denNgay + "T23:59:59.999";

      const nv = document.getElementById("locNV").value.trim().toUpperCase();
      const sohd = document.getElementById("locSoHD").value.trim();
      const khach = document.getElementById("locKhach").value.trim();
      const tienTu = Number(document.getElementById("tienTu").value);
      const tienDen = Number(document.getElementById("tienDen").value);

      const selectLoai = document.getElementById("loaiChungTu");
      const loaiChungTuArr = Array.from(selectLoai.selectedOptions).map(o => o.value);

      const loaiTongHop = document.getElementById("loaiTongHop")?.value || "chitiet";

      const tbody = document.getElementById("dsHoaDon");
      tbody.innerHTML = "";

      // --- THÊM: chuẩn bị lọc theo mã sản phẩm ---
      const maspRaw = document.getElementById('locMasp').value.trim();
      const matchAll = document.getElementById('chkMatchAll').checked;
      let sohdFilterSet = null;

      if (maspRaw) {
        // chuẩn hóa & loại trống
        const maspList = maspRaw.split(',')
          .map(s => s.trim().toUpperCase())
          .filter(Boolean);
        if (maspList.length) {
          sohdFilterSet = await getSohdByMaspList(maspList, matchAll);
          if (sohdFilterSet.size === 0) {
            tbody.innerHTML = `<tr><td colspan="9">Không có dữ liệu (không có HĐ chứa các mã đã nhập)</td></tr>`;
            // cũng reset tổng
            document.getElementById('tongSoLuong2').textContent = '0';
            document.getElementById('tongTien2').textContent = '0';
            return;
          }
        }
      }

      let filtered = [];

      // Nếu chọn loại chứng từ: Truy vấn từng loại (song song, gộp lại)
      if (loaiChungTuArr.length > 0) {
        let arr = [];
        for (const loai of loaiChungTuArr) {
          let query = supabase
            .from('hoadon_banle')
            .select('*')
            .order('ngay', { ascending: true })    // SỬA: dùng 'ngay'
            .ilike('sohd', `${loai}_%`);

          if (tuNgay && denNgay) query = query.gte('ngay', tuNgay).lte('ngay', denNgay);   // SỬA: dùng 'ngay'
          else if (tuNgay) query = query.gte('ngay', tuNgay);
          else if (denNgay) query = query.lte('ngay', denNgay);

          if (nv) query = query.ilike('manv', `%${nv}%`);

          if (sohd) query = query.ilike('sohd', `%${sohd}%`);
          if (khach) query = query.ilike('khachhang', `%${khach}%`);
          if (!isNaN(tienTu) && tienTu > 0) query = query.gte('thanhtoan', tienTu);
          if (!isNaN(tienDen) && tienDen > 0) query = query.lte('thanhtoan', tienDen);

          if (sohdFilterSet && sohdFilterSet.size > 0) {
            // Giới hạn sohd theo ct_hoadon_xxx đã tìm được
            query = query.in('sohd', Array.from(sohdFilterSet));
          }

          let data = await getAllHoaDon(query, 1000);
          arr = arr.concat(data);
        }
        // Loại bỏ trùng hóa đơn (nếu 2 loại overlap)
        const hash = {};
        filtered = arr.filter(hd => {
          if (hash[hd.sohd]) return false;
          hash[hd.sohd] = true;
          return true;
        });
      } else {
        // Không chọn loại, lấy toàn bộ
        let query = supabase
          .from('hoadon_banle')
          .select('*')
          .order('ngay', { ascending: true }) // Ưu tiên order theo ngày hóa đơn thực tế

        if (tuNgay && denNgay) query = query.gte('ngay', tuNgay).lte('ngay', denNgay);
        else if (tuNgay) query = query.gte('ngay', tuNgay);
        else if (denNgay) query = query.lte('ngay', denNgay);


        if (nv) query = query.ilike('manv', `%${nv}%`);

        if (sohd) query = query.ilike('sohd', `%${sohd}%`);
        if (khach) query = query.ilike('khachhang', `%${khach}%`);
        if (!isNaN(tienTu) && tienTu > 0) query = query.gte('thanhtoan', tienTu);
        if (!isNaN(tienDen) && tienDen > 0) query = query.lte('thanhtoan', tienDen);

        if (sohdFilterSet && sohdFilterSet.size > 0) {
          query = query.in('sohd', Array.from(sohdFilterSet));
        }
        let data = await getAllHoaDon(query, 1000);
        filtered = data || [];

      }

      if (!filtered.length) return tbody.innerHTML = `<tr><td colspan="9">Không có dữ liệu</td></tr>`;

      // SẮP XẾP THEO SỐ HÓA ĐƠN TỪ NHỎ ĐẾN LỚN (chỉ áp dụng cho chế độ chi tiết)
      if (loaiTongHop === "chitiet") {
        filtered.sort((a, b) => {
          const s1 = (a.sohd || "").toString();
          const s2 = (b.sohd || "").toString();
          return s1.localeCompare(s2); // tăng dần
        });
      }

      // ----------- XỬ LÝ TỔNG HỢP THEO NGÀY/THÁNG/NĂM ----------
      let hienThiData = filtered;
      if (loaiTongHop !== "chitiet") {
        const groupMap = new Map();
        filtered.forEach(hd => {
          const d = new Date(hd.created_at);
          let key = "";
          if (loaiTongHop === "ngay") key = d.toISOString().slice(0, 10);
          if (loaiTongHop === "thang") key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
          if (loaiTongHop === "nam") key = d.getFullYear() + "";
          if (!groupMap.has(key)) {
            groupMap.set(key, {
              sohd: 1,
              created_at: hd.created_at,
              tongsl: Number(hd.tongsl || 0),
              thanhtoan: Number(hd.thanhtoan || 0)
            });
          } else {
            let obj = groupMap.get(key);
            obj.sohd += 1;
            obj.tongsl += Number(hd.tongsl || 0);
            obj.thanhtoan += Number(hd.thanhtoan || 0);
          }
        });
        hienThiData = Array.from(groupMap.entries()).map(([key, val]) => {
          // Định dạng lại ngày/tháng/năm để hiển thị
          if (loaiTongHop === "ngay") val.created_at = key.split('-').reverse().join('/');
          if (loaiTongHop === "thang") val.created_at = key.slice(5, 7) + "/" + key.slice(0, 4);
          if (loaiTongHop === "nam") val.created_at = key;
          return val;
        });
      }

      // ------------- HÀM ĐỊNH DẠNG NGÀY  -------------

      function dinhDangNgay(ngayStr) {
        if (!ngayStr) return "";
        const d = new Date(ngayStr);
        const ngay = d.getDate().toString().padStart(2, "0");
        const thang = (d.getMonth() + 1).toString().padStart(2, "0");
        const nam = d.getFullYear();
        return `${ngay}/${thang}/${nam}`;
      }


      // ------------- HÀM ĐỊNH DẠNG NGÀY GIỜ -------------
      function dinhDangNgayGio(ngayStr) {
        if (!ngayStr) return "";
        // Nếu chuỗi có dạng dd/mm/yyyy thì giữ nguyên (đang tổng hợp)
        if (ngayStr.match(/^\d{2}\/\d{2}\/\d{4}$/) || ngayStr.match(/^\d{2}\/\d{4}$/) || ngayStr.length === 4) return ngayStr;
        const d = new Date(ngayStr);
        const ngay = d.getDate().toString().padStart(2, "0");
        const thang = (d.getMonth() + 1).toString().padStart(2, "0");
        const nam = d.getFullYear();
        const gio = d.getHours().toString().padStart(2, "0");
        const phut = d.getMinutes().toString().padStart(2, "0");
        return `${ngay}/${thang}/${nam} ${gio}h${phut}`;
      }

      // ------------- HIỂN THỊ RA BẢNG -------------
      hienThiData.forEach((hd, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
  <td>${idx + 1}</td>
  <td><input type="checkbox" class="chonHD" data-sohd="${hd.sohd || ""}"></td>
  <td>${hd.sohd || ""}</td>
  <td>${dinhDangNgay(hd.ngay)}</td>
  <td>${dinhDangNgayGio(hd.created_at)}</td>
  <td>${hd.manv || ""}</td>
  <td>${hd.khachhang || ""}</td>
  <td>${hd.tongsl || 0}</td>
  <td>${hd.thanhtoan?.toLocaleString()}</td>
  <td>${hd.ghichu || ""}</td>
`;
        tr.onclick = (e) => {
          if (e.target.tagName !== 'INPUT' && loaiTongHop === "chitiet") {
            document.querySelectorAll("#dsHoaDon tr").forEach(tr2 => tr2.style.backgroundColor = "");
            tr.style.backgroundColor = "#ffe066";
            rowDangChon = tr;
            xemChiTiet(hd.sohd);
          }
        };

        // Double-click vào cột Số HĐ để mở trang hóa đơn tương ứng
        const sohdCell = tr.cells[2]; // cột thứ 3 = Số HĐ
        if (sohdCell) {
          sohdCell.style.cursor = 'pointer';
          sohdCell.style.textDecoration = 'underline';

          sohdCell.ondblclick = (ev) => {
            ev.stopPropagation();           // không kích hoạt click chọn dòng
            if (!hd.sohd) return;
            openInvoiceBySohd(hd.sohd);     // hàm sẽ khai báo ở dưới
          };
        }

        tbody.appendChild(tr);
      });

      // ------------- DÒNG TỔNG CUỐI BẢNG -------------
      let tongSL = 0, tongTien = 0;
      hienThiData.forEach(hd => {
        tongSL += Number(hd.tongsl || 0);
        tongTien += Number(hd.thanhtoan || 0);
      });
      document.getElementById('tongSoLuong2').textContent = tongSL.toLocaleString();
      document.getElementById('tongTien2').textContent = tongTien.toLocaleString();

      const trTong = document.createElement("tr");
      trTong.style.fontWeight = "bold";
      trTong.style.background = "#f8f8f8";
      trTong.innerHTML = `
    <td colspan="6" style="text-align:right">TỔNG</td>
    <td id="tongSoLuong">${tongSL.toLocaleString()}</td>
    <td id="tongTien">${tongTien.toLocaleString()}</td>
    <td></td>
  `;
      tbody.appendChild(trTong);

      // GẮN SỰ KIỆN CHỌN TẤT CẢ
      setTimeout(() => {
        const chonTatCa = document.getElementById('chonTatCaHD');
        if (chonTatCa) {
          chonTatCa.onclick = function () {
            const checkboxes = document.querySelectorAll('.chonHD');
            checkboxes.forEach(cb => { cb.checked = chonTatCa.checked; });
          };
        }
      }, 10);

    }




    async function xemChiTiet(sohd) {
      const popupEl = document.getElementById("popup");
      popupEl.style.display = "block";

      // Luôn neo popup ở góc trên bên phải (mở lần nào cũng reset về vị trí này)
      popupEl.style.top = "10px";
      popupEl.style.right = "10px";
      popupEl.style.left = "auto";

      document.getElementById("sohdCT").textContent = sohd;

      const { data, error } = await window.supabase.from('ct_hoadon_banle').select('*').eq('sohd', sohd);
      const tbody = document.getElementById("ctHoaDon");
      tbody.innerHTML = "";
      if (error) return tbody.innerHTML = `<tr><td colspan='7'>Lỗi: ${error.message}</td></tr>`;
      data.forEach(row => {
        const tt = (row.gia - row.km) * row.soluong;
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${row.masp}</td><td>${row.tensp}</td><td>${row.size}</td><td>${row.soluong}</td><td>${row.dvt}</td><td>${row.gia}</td><td>${row.km}</td><td>${tt.toLocaleString()}</td>`;
        tbody.appendChild(tr);
      });
    }

    function dongPopup() {
      document.getElementById("popup").style.display = "none";
    }

    async function xoaHoaDonDaChon() {
      const checkboxes = document.querySelectorAll(".chonHD:checked");
      if (checkboxes.length === 0) {
        alert("❌ Bạn chưa chọn hóa đơn nào để xóa.");
        return;
      }

      // Gọi xác thực và chỉ xóa nếu xác thực thành công
      kiemTraNhanVienTruocKhiXoa(async function () {

        let dsXoa = [];
        let doiUngList = [];
        let coCCN = false;

        for (const cb of checkboxes) {
          const sohd = cb.getAttribute("data-sohd");
          if (!sohd) continue;

          const prefix = sohd.split("_")[0] || "";

          if (prefix.startsWith("xcn") || prefix.startsWith("ncn")) {
            coCCN = true;
            const so = sohd.split("_")[1];
            let doiUng = "";
            if (prefix === "xcncs1") doiUng = `ncncs2_${so}`;
            if (prefix === "xcncs2") doiUng = `ncncs1_${so}`;
            if (prefix === "ncncs1") doiUng = `xcncs2_${so}`;
            if (prefix === "ncncs2") doiUng = `xcncs1_${so}`;

            dsXoa.push(sohd);
            if (doiUng) {
              dsXoa.push(doiUng);
              doiUngList.push(`${sohd} ↔ ${doiUng}`);
            }
          } else {
            dsXoa.push(sohd);
          }
        }

        dsXoa = [...new Set(dsXoa)]; // loại trùng

        let xacNhan = false;
        if (coCCN) {
          xacNhan = confirm(

    (function dragPopup() {
      let popup = document.getElementById('popup');
      let header = document.getElementById('popupHeader');
      let offsetX, offsetY, isDragging = false;
      if (header) {
        header.onmousedown = function (e) {
          isDragging = true;
          let rect = popup.getBoundingClientRect();
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
          document.onmousemove = function (ev) {
            if (isDragging) {
              popup.style.left = (ev.clientX - offsetX) + 'px';
              popup.style.top = (ev.clientY - offsetY) + 'px';
              popup.style.right = 'auto';
            }
          };
          document.onmouseup = function () { isDragging = false; document.onmousemove = null; };
        };

    document.getElementById('btnCopyTable').onclick = function () {
      let table = document.querySelector("table");
      if (!table) return alert("Không tìm thấy bảng dữ liệu!");

      // Xác định vị trí cột checkbox
      let ths = Array.from(table.querySelectorAll("thead tr th"));
      let colChon = ths.findIndex(th => th.innerText.toLowerCase().includes("chon"));

      // Lấy tiêu đề (bỏ cột chon nếu có)
      let headers = ths.map((th, i) => i !== colChon ? th.innerText.replace(/\n/g, " ") : null)
        .filter(x => x !== null).join('\t');

      // Lấy từng dòng dữ liệu
      let rows = Array.from(table.querySelectorAll("tbody#dsHoaDon tr"));
      if (!rows.length) return alert("Không có dữ liệu để copy!");

      let lines = rows
        .filter(tr => !tr.textContent.includes("Không có dữ liệu"))
        .map(tr => Array.from(tr.cells)
          .map((td, i) => i !== colChon ? td.innerText.replace(/\n/g, " ") : null)
          .filter(x => x !== null).join('\t')
        );

      let all = [headers].concat(lines).join('\n');

      navigator.clipboard.writeText(all).then(() => {
        alert("✅ Đã copy toàn bộ bảng dữ liệu! Ctrl+V để dán vào Excel.");
      });
    };

  <script>
    // 👉 Hàm mở popup xác thực + kiểm tra quyền xóa hóa đơn
    async function kiemTraNhanVienTruocKhiXoa(callbackSauXacThuc) {
      const popup = document.getElementById('popupXacThucNV');
      const txtMa = document.getElementById('maNVCheck');
      const txtMk = document.getElementById('matkhauNVCheck');
      const msg = document.getElementById('msgCheckNV');

      // 1. Đọc thông tin đã lưu khi đăng nhập (authModule.js)
      const savedMa =
        localStorage.getItem('manv') ||
        localStorage.getItem('last_login_manv') ||
        '';

      const savedMk =
        localStorage.getItem('last_login_password') || '';

      // 2. Đẩy vào ô nhập
      if (txtMa) txtMa.value = savedMa;
      if (txtMk) txtMk.value = savedMk;

      // 3. Reset message + mở popup
      if (msg) {
        msg.textContent = '';
        msg.style.color = '#ad3a2b';
      }
      if (popup) popup.style.display = 'block';

      // 4. Focus hợp lý
      setTimeout(() => {
        if (savedMa && savedMk) {
          if (txtMk) { txtMk.focus(); txtMk.select(); }
        } else if (txtMa) {
          txtMa.focus(); txtMa.select();
        }
      }, 0);

      // 5. Gán sự kiện cho nút "Kiểm tra"
      const btn = document.getElementById('btnKiemTraNV');
      if (!btn) return;

      btn.onclick = async function () {
        const manv = (txtMa.value || '').trim().toUpperCase();
        const matkhau = (txtMk.value || '').trim();

        if (!manv || !matkhau) {
          msg.textContent = 'Vui lòng nhập đủ Mã NV và Mật khẩu.';
          return;
        }

        // đảm bảo đã có client Supabase do authModule.js khởi tạo
        if (!window.supabase || !window.supabase.from) {
          console.error('Supabase client chưa khởi tạo trên window');
          msg.textContent = 'Không khởi tạo được Supabase, hãy tải lại trang.';
          return;
        }

        try {
          // kiểm tra nhân viên trong bảng dmnhanvien
          const { data, error } = await window.supabase
            .from('dmnhanvien')
            .select('manv, tennv, matkhau, xoa_hoadon, is_admin')
            .eq('manv', manv)
            .eq('matkhau', matkhau)
            .maybeSingle();

          if (error) {
            console.error('Lỗi kiểm tra nhân viên:', error);
            msg.textContent = 'Lỗi kiểm tra nhân viên: ' + error.message;
            return;
          }

          if (!data) {
            msg.textContent = 'Sai mã nhân viên hoặc mật khẩu.';
            return;
          }

          // chỉ cho xóa nếu có quyền xóa hoặc là admin
          if (!data.xoa_hoadon && !data.is_admin) {
            msg.textContent = 'Nhân viên này không có quyền xóa hóa đơn.';
            return;
          }

          // OK – đóng popup và chạy callback xóa hóa đơn
          if (popup) popup.style.display = 'none';
          msg.textContent = '';

          if (typeof callbackSauXacThuc === 'function') {
            callbackSauXacThuc(data);
          }
        } catch (err) {
          console.error('Exception khi kiểm tra NV:', err);
          msg.textContent = 'Có lỗi xảy ra khi kiểm tra nhân viên.';
        }
      };
    }
  </script>

  <script>
    function openInvoiceBySohd(sohd) {
      if (!sohd) return;

      const prefix = sohd.split('_')[0].toLowerCase();  // ví dụ: bancs1, nmcs2, xcncs2_...
      let url = null;

      // Bán lẻ thường
      if (prefix === 'bancs1') {
        url = `banlemtcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'bancs2') {
        url = `banlemtcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Bán nhân viên
      else if (prefix === 'bannvcs1') {
        url = `bannvcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'bannvcs2') {
        url = `bannvcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Nhập mới
      else if (prefix === 'nmcs1') {
        url = `nhapmoimtcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nmcs2') {
        url = `nhapmoimtcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Chuyển chi nhánh (2v1) – dùng cùng trang CCN2V1
      else if (prefix === 'xcncs1' || prefix === 'ncncs1') {
        url = `ccn2v1cs1.html?sohd=${encodeURIComponent(sohd)}&loaihd=${prefix}&diadiem=cs1`;
      } else if (prefix === 'xcncs2' || prefix === 'ncncs2') {
        url = `ccn2v1cs2.html?sohd=${encodeURIComponent(sohd)}&loaihd=${prefix}&diadiem=cs2`;
      }

      // Nhập kiểm, xuất kiểm
      else if (prefix === 'nhapkiemcs1') {
        url = `nhapkiemcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nhapkiemcs2') {
        url = `nhapkiemcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      } else if (prefix === 'xuatkiemcs1') {
        url = `xuatkiemcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'xuatkiemcs2') {
        url = `xuatkiemcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Nhập tạm
      else if (prefix === 'nhaptamcs1') {
        url = `nhaptamcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nhaptamcs2') {
        url = `nhaptamcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Nhập đổi từ khách
      else if (prefix === 'nhapdoics1') {
        url = `nhapdoimtcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nhapdoics2') {
        url = `nhapdoimtcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Xuất hủy
      else if (prefix === 'xuathuycs1') {
        url = `xuathuycs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'xuathuycs2') {
        url = `xuathuycs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Chưa cấu hình
      if (!url) {
        alert("Chưa cấu hình mở hóa đơn cho loại: " + prefix);
        return;
      }

      window.open(url, "_blank");
    }

  </script>
