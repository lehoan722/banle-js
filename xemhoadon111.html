  <!---//Thêm “hàng rào” đăng nhập chuẩn auth cho xemhoadon111.html-->

  <script>
    // ===== Helper: parse ngày theo local (tránh lệch UTC) =====
    function toLocalDate(ngayStr, isoStr) {
      if (ngayStr) {
        const parts = String(ngayStr).split('-').map(Number);
        const y = parts[0] || 1970;
        const m = (parts[1] || 1) - 1;
        const d = parts[2] || 1;
        return new Date(y, m, d, 12, 0, 0); // 12h để tránh edge UTC/DST
      }
      return new Date(isoStr);
    }


    let rowDangChon = null;



    // ====== V2 PAGING (tối đa 10.000 dòng/trang) ======
    let currentPage = 1;
    let totalPages = 1;
    let lastParamsBase = null;   // params lọc (không gồm limit/offset)
    let lastTotalRows = 0;
    let lastLoaiTongHop = "chitiet";

    // Lấy đủ mọi dòng hóa đơn từ Supabase (bằng .range để lấy từng trang, rồi gộp lại)
    async function getAllHoaDon(query, pageSize = 1000) {
      let from = 0;
      let allData = [];
      while (true) {
        // nếu đã biết tổng dòng (count) thì có thể dừng sớm
        if (lastTotalRows && offset >= lastTotalRows) break;
        let { data, error } = await query.range(from, from + pageSize - 1);
        if (error) {
          alert("❌ Lỗi tải hóa đơn: " + error.message);
          break;
        }
        if (data && data.length > 0) {
          allData = allData.concat(data);
          if (data.length < pageSize) break; // Trang cuối cùng
          from += pageSize;
        } else {
          break;
        }
      }
      return allData;
    }


    // ... (đoạn createClient, getAllHoaDon, v.v. của bạn giữ nguyên)

    // Lấy tất cả sohd từ ct_hoadon_banle theo 1 mã (dùng phân trang .range giống getAllHoaDon)
    async function getSohdByOneMasp(masp, pageSize = 2000) {
      let from = 0;
      const sohdSet = new Set();
      while (true) {
        // nếu đã biết tổng dòng (count) thì có thể dừng sớm
        if (lastTotalRows && offset >= lastTotalRows) break;
        const { data, error } = await window.supabase
          .from('ct_hoadon_banle')
          .select('sohd, masp')
          .ilike('masp', `%${masp}%`)
          .range(from, from + pageSize - 1);

        if (error) { alert('❌ Lỗi tìm sohd theo mã: ' + error.message); break; }
        if (!data || data.length === 0) break;

        data.forEach(r => { if (r?.sohd) sohdSet.add(r.sohd); });
        if (data.length < pageSize) break;
        from += pageSize;
      }
      return sohdSet;
    }

    // Lấy tập sohd theo nhiều mã: matchAll=true → giao nhau; matchAll=false → hợp
    async function getSohdByMaspList(maspList, matchAll = true) {
      if (!maspList.length) return new Set();
      const sets = [];
      for (const m of maspList) {
        const s = await getSohdByOneMasp(m);
        sets.push(s);
      }
      if (sets.length === 1) return sets[0];

      if (matchAll) {
        // Giao nhau
        let inter = sets[0];
        for (let i = 1; i < sets.length; i++) {
          const next = sets[i];
          inter = new Set([...inter].filter(x => next.has(x)));
          if (inter.size === 0) break;
        }
        return inter;
      } else {
        // Hợp
        const uni = new Set();
        sets.forEach(s => s.forEach(x => uni.add(x)));
        return uni;
      }
    }


    async function taiDanhSachHoaDon() {
      // 1. Lấy các giá trị lọc từ giao diện
      const tuNgay = document.getElementById("tuNgay").value;
      let denNgay = document.getElementById("denNgay").value;
      // v2 lọc theo DATE => KHÔNG nối giờ phút giây

      const nv = document.getElementById("locNV").value.trim().toUpperCase();
      const sohd = document.getElementById("locSoHD").value.trim();
      const khach = document.getElementById("locKhach").value.trim();
      const tienTu = Number(document.getElementById("tienTu").value);
      const tienDen = Number(document.getElementById("tienDen").value);

      const selectLoai = document.getElementById("loaiChungTu");
      const loaiChungTuArr = Array.from(selectLoai.selectedOptions).map(o => o.value);

      const loaiTongHop = document.getElementById("loaiTongHop")?.value || "chitiet";

      const tbody = document.getElementById("dsHoaDon");
      tbody.innerHTML = "";

      // ====== V2: GỌI RPC (DETAIL LÀM CHUẨN) ======
      const maspRaw = document.getElementById('locMasp').value.trim();
      const matchAll = document.getElementById('chkMatchAll').checked;

      const maspList = maspRaw
        ? maspRaw.split(',').map(s => s.trim().toUpperCase()).filter(Boolean)
        : null;

      // loaiChungTuArr đang là mảng multi-select => pass thẳng vào RPC
      const loaiList = (loaiChungTuArr && loaiChungTuArr.length) ? loaiChungTuArr : null;

      // chuẩn hóa tiền
      const tienTu2 = (!isNaN(tienTu) && tienTu > 0) ? tienTu : null;
      const tienDen2 = (!isNaN(tienDen) && tienDen > 0) ? tienDen : null;

      // params chung
      const paramsBase = {
        p_tu_ngay: tuNgay || null,
        p_den_ngay: denNgay || null,
        p_loaihd_list: loaiList,
        p_manv: nv || null,
        p_khachhang: khach || null,
        p_sohd: sohd || null,
        p_tien_tu: tienTu2,
        p_tien_den: tienDen2,
        p_masp_list: maspList,
        p_must_contain_all: !!matchAll
      };

      // 1) COUNT (để set tổng nhanh)
      {
        const { data, error } = await window.supabase.rpc('xemhoadon111_v2_count', paramsBase);
        if (error) {
          tbody.innerHTML = `<tr><td colspan="12">❌ Lỗi count: ${error.message}</td></tr>`;
          return;
        }
        const row = data?.[0] || {};
        // tổng trên UI: dùng số "chuẩn theo detail"
        document.getElementById('tongSoLuong2').textContent = Number(row.total_sl_detail || 0).toLocaleString();
        document.getElementById('tongTien2').textContent = Number(row.total_thanhtoan_v2 || 0).toLocaleString();


        const totalRows = Number(row.total_rows || 0);
        lastTotalRows = totalRows;

        // Phân trang: chỉ áp dụng cho chế độ "Chi tiết từng hóa đơn"
        // Với Tổng hợp ngày/tháng/năm: tải toàn bộ theo filter rồi gom nhóm, nên không phân trang.
        const pagingBar = document.getElementById('pagingBar');
        const pageSizeSel = document.getElementById('pageSize');
        const btnPrev = document.getElementById('btnPrevPage');
        const btnNext = document.getElementById('btnNextPage');
        const pageInfoEl = document.getElementById('pageInfo');
        const dangHienThiEl = document.getElementById('dangHienThiInfo');

        if (pagingBar) pagingBar.style.display = 'flex';

        const isChiTiet = (loaiTongHop === 'chitiet');
        if (pageSizeSel) pageSizeSel.disabled = !isChiTiet;
        if (btnPrev) btnPrev.disabled = !isChiTiet;
        if (btnNext) btnNext.disabled = !isChiTiet;

        if (!isChiTiet) {
          if (pageInfoEl) pageInfoEl.textContent = 'Tổng hợp: không phân trang';
          if (dangHienThiEl) dangHienThiEl.textContent = '';
        }

        if (loaiTongHop === 'chitiet') {
          const pageSize = Number(document.getElementById('pageSize')?.value || 10000);
          totalPages = Math.max(1, Math.ceil(totalRows / pageSize));
          currentPage = 1;
          lastParamsBase = paramsBase;
          lastLoaiTongHop = loaiTongHop;

          await loadPage();
          return;
        }
      }

      // 2) TỔNG HỢP (ngày/tháng/năm) => tải TOÀN BỘ theo batch và gom nhóm chuẩn
      // Lưu ý: KHÔNG dựa vào "rows.length < LIMIT" để break, vì RPC có thể trả ít hơn p_limit.
      const groupMap = new Map();
      const LIMIT = 10000; // batch tối đa 10.000
      let offset = 0;

      // helper: parse ngày local (tránh lệch UTC)
      function toLocalDate(ngayStr, isoStr) {
        if (ngayStr) {
          const s = String(ngayStr);
          // hỗ trợ cả YYYY-MM-DD và DD/MM/YYYY
          if (s.includes("-")) {
            const [y, m, d] = s.split("-").map(Number);
            if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return new Date(y, m - 1, d, 12, 0, 0);
          }
          if (s.includes("/")) {
            const [d, m, y] = s.split("/").map(Number);
            if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return new Date(y, m - 1, d, 12, 0, 0);
          }
        }
        return isoStr ? new Date(isoStr) : new Date();
      }

      // reset hiển thị "đang hiển thị"
      const dangHienThiEl2 = document.getElementById('dangHienThiInfo');
      if (dangHienThiEl2) dangHienThiEl2.textContent = 'Đang tổng hợp...';

      while (true) {
        if (lastTotalRows && offset >= lastTotalRows) break;

        const { data, error } = await window.supabase.rpc('xemhoadon111_v2_paged', {
          ...paramsBase,
          p_limit: LIMIT,
          p_offset: offset
        });

        if (error) {
          tbody.innerHTML = `<tr><td colspan="12">❌ Lỗi paged: ${error.message}</td></tr>`;
          return;
        }

        const rows = data || [];
        if (rows.length === 0) break;

        // gom nhóm trực tiếp để tránh giữ toàn bộ mảng
        rows.forEach(r => {
          const ngay = r.ngay; // date (YYYY-MM-DD) hoặc string
          const d = toLocalDate(ngay, r.created_at);

          let key = "";
          if (loaiTongHop === "ngay") key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
          if (loaiTongHop === "thang") key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
          if (loaiTongHop === "nam") key = `${d.getFullYear()}`;

          if (!groupMap.has(key)) {
            groupMap.set(key, {
              sohd: 1,
              created_at: key, // sẽ format lúc render
              tongsl: Number(r.sl_detail || 0),
              tongthanhtien: Number(r.tong_detail || 0),
              chietkhau: Number(r.chietkhau || 0),
              thanhtoan: Number(r.thanhtoan_v2 || 0)
            });
          } else {
            const obj = groupMap.get(key);
            obj.sohd += 1;
            obj.tongsl += Number(r.sl_detail || 0);
            obj.tongthanhtien += Number(r.tong_detail || 0);
            obj.chietkhau += Number(r.chietkhau || 0);
            obj.thanhtoan += Number(r.thanhtoan_v2 || 0);
          }
        });

        // QUAN TRỌNG: tăng offset theo số dòng thực tế nhận được
        offset += rows.length;

        if (lastTotalRows && offset >= lastTotalRows) break;
      }

      // map => array + format hiển thị ngày/tháng/năm
      let hienThiData = Array.from(groupMap.entries())
        .map(([key, val]) => {
          if (loaiTongHop === "ngay") val.created_at = key.split('-').reverse().join('/');
          if (loaiTongHop === "thang") val.created_at = key.slice(5, 7) + "/" + key.slice(0, 4);
          if (loaiTongHop === "nam") val.created_at = key;
          return val;
        })
        .sort((a, b) => (a.created_at || "").localeCompare(b.created_at || ""));

      // render bảng theo format giống renderFromFiltered (cột sohd = số hóa đơn)
      tbody.innerHTML = "";
      let stt = 1;
      let sumSL = 0, sumTong = 0, sumCK = 0, sumTT = 0;

      hienThiData.forEach(hd => {
        sumSL += Number(hd.tongsl || 0);
        sumTong += Number(hd.tongthanhtien || 0);
        sumCK += Number(hd.chietkhau || 0);
        sumTT += Number(hd.thanhtoan || 0);

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${stt++}</td>
          <td><input type="checkbox" class="chkRow"/></td>
          <td style="font-weight:600">${Number(hd.sohd || 0).toLocaleString()}</td>
          <td>${hd.created_at || ""}</td>
          <td></td>
          <td></td>
          <td></td>
          <td style="text-align:right">${Number(hd.tongsl || 0).toLocaleString()}</td>
          <td style="text-align:right">${Number(hd.tongthanhtien || 0).toLocaleString()}</td>
          <td style="text-align:right">${Number(hd.chietkhau || 0).toLocaleString()}</td>
          <td style="text-align:right">${Number(hd.thanhtoan || 0).toLocaleString()}</td>
          <td></td>
        `;
        tbody.appendChild(tr);
      });

      // footer tổng
      const trSum = document.createElement("tr");
      trSum.innerHTML = `
        <td colspan="7" style="text-align:right; font-weight:700">TỔNG</td>
        <td style="text-align:right; font-weight:700">${sumSL.toLocaleString()}</td>
        <td style="text-align:right; font-weight:700">${sumTong.toLocaleString()}</td>
        <td style="text-align:right; font-weight:700">${sumCK.toLocaleString()}</td>
        <td style="text-align:right; font-weight:700">${sumTT.toLocaleString()}</td>
        <td></td>
      `;
      tbody.appendChild(trSum);

      // cập nhật info
      if (dangHienThiEl2) {
        dangHienThiEl2.textContent = `Đang hiển thị ${hienThiData.length} dòng tổng hợp | SL: ${sumSL.toLocaleString()} | TT: ${sumTT.toLocaleString()}`;
      }
      return;
      // ====== END V2 ======

      renderFromFiltered(filtered, loaiTongHop);
    }
    function renderFromFiltered(filtered, loaiTongHop) {
      const tbody = document.getElementById('dsHoaDon');
      // SẮP XẾP THEO SỐ HÓA ĐƠN TỪ NHỎ ĐẾN LỚN (chỉ áp dụng cho chế độ chi tiết)
      if (loaiTongHop === "chitiet") {
        filtered.sort((a, b) => {


          const s1 = (a.sohd || "").toString();
          const s2 = (b.sohd || "").toString();
          return s1.localeCompare(s2); // tăng dần
        });
      }

      // ----------- XỬ LÝ TỔNG HỢP THEO NGÀY/THÁNG/NĂM ----------
      let hienThiData = filtered;
      if (loaiTongHop !== "chitiet") {
        const groupMap = new Map();
        filtered.forEach(hd => {
          const d = toLocalDate(hd.ngay, hd.created_at);

          let key = "";
          if (loaiTongHop === "ngay") key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
          if (loaiTongHop === "thang") key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
          if (loaiTongHop === "nam") key = d.getFullYear() + "";
          if (!groupMap.has(key)) {
            groupMap.set(key, {
              sohd: 1,
              created_at: hd.created_at,
              tongsl: Number(hd.tongsl || 0),
              tongthanhtien: Number(hd.tongthanhtien || 0),
              chietkhau: Number(hd.chietkhau || 0),
              thanhtoan: Number(hd.thanhtoan || 0)
            });
          } else {
            let obj = groupMap.get(key);
            obj.sohd += 1;
            obj.tongsl += Number(hd.tongsl || 0);
            obj.tongthanhtien += Number(hd.tongthanhtien || 0);
            obj.chietkhau += Number(hd.chietkhau || 0);
            obj.thanhtoan += Number(hd.thanhtoan || 0);
          }
        });

          // Định dạng lại ngày/tháng/năm để hiển thị
          if (loaiTongHop === "ngay") val.created_at = key.split('-').reverse().join('/');
          if (loaiTongHop === "thang") val.created_at = key.slice(5, 7) + "/" + key.slice(0, 4);
          if (loaiTongHop === "nam") val.created_at = key;
          return val;
        });
      }

      // ------------- HÀM ĐỊNH DẠNG NGÀY  -------------

      function normalizePgTimestamp(s) {
        if (!s) return s;
        s = String(s).trim();

        // Nếu dạng "YYYY-MM-DD HH:mm:ss(.ms)?+00" hoặc "+00:00" => đổi " " -> "T"
        // để JS parse đúng timezone
        if (/^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}/.test(s) && !s.includes("T")) {
          s = s.replace(" ", "T");
        }

        // Nếu offset dạng "+00" hoặc "-07" => đổi thành "+00:00" để chuẩn ISO
        s = s.replace(/([+-]\d{2})$/, "$1:00");

        return s;
      }


      // ------------- HÀM ĐỊNH DẠNG NGÀY  -------------

      function dinhDangNgay(ngayStr) {
        if (!ngayStr) return "";
        const d = new Date(ngayStr);
        return new Intl.DateTimeFormat("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        }).format(d);
      }

      // ------------- HÀM ĐỊNH DẠNG NGÀY GIỜ -------------
      function dinhDangNgayGio(ngayStr) {
        if (!ngayStr) return "";

        // Nếu chuỗi có dạng dd/mm/yyyy hoặc mm/yyyy hoặc yyyy thì giữ nguyên (đang tổng hợp)
        if (
          /^\d{2}\/\d{2}\/\d{4}$/.test(ngayStr) ||
          /^\d{2}\/\d{4}$/.test(ngayStr) ||
          /^\d{4}$/.test(ngayStr)
        ) return ngayStr;

        const d = new Date(ngayStr);
        const datePart = new Intl.DateTimeFormat("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        }).format(d);

        const timePart = new Intl.DateTimeFormat("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(d);

        // timePart thường ra "09:18" => đổi thành "09h18"
        return `${datePart} ${timePart.replace(":", "h")}`;
      }
      // ------------- HIỂN THỊ RA BẢNG -------------
      hienThiData.forEach((hd, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `

  <td>${Number(hd.thanhtoan || 0).toLocaleString()}</td>

`;

        // Click chọn dòng => tô vàng + hiện popup chi tiết

        // tránh click checkbox làm kích hoạt chọn dòng
        const chk = tr.querySelector('input.chonHD');
        if (chk) chk.addEventListener('click', (e) => e.stopPropagation());
        tr.onclick = (e) => {

        // Double-click vào cột Số HĐ để mở trang hóa đơn tương ứng
        const sohdCell = tr.cells[2]; // cột thứ 3 = Số HĐ

        }

        tbody.appendChild(tr);
      });

      // ------------- DÒNG TỔNG CUỐI BẢNG -------------
      let tongSL = 0, tongThanhTien = 0, tongChietKhau = 0, tongTien = 0;
      hienThiData.forEach(hd => {
        tongSL += Number(hd.tongsl || 0);
        tongThanhTien += Number(hd.tongthanhtien || 0);

        tongTien += Number(hd.thanhtoan || 0);
      });
      // (v2) KHÔNG ghi đè tổng chuẩn (đã lấy từ RPC count)
      // Nếu cần, chỉ dùng để hiển thị tổng của TRANG hiện tại:
      const info = document.getElementById('dangHienThiInfo');

      const trTong = document.createElement("tr");
      trTong.style.fontWeight = "bold";

          <td colspan="7" style="text-align:right">TỔNG</td>

    async function loadPage() {
      if (!lastParamsBase) return;

      const pageSize = Number(document.getElementById('pageSize')?.value || 10000);
      const baseOffset = (currentPage - 1) * pageSize;

      const BATCH = 1000; // Supabase thường giới hạn ~1000 rows mỗi request
      let filtered = [];

      const infoEl = document.getElementById('dangHienThiInfo');
      if (infoEl) infoEl.textContent = `Đang tải trang ${currentPage}...`;

      for (let i = 0; i < pageSize; i += BATCH) {
        const take = Math.min(BATCH, pageSize - i);

        const { data, error } = await window.supabase.rpc('xemhoadon111_v2_paged', {
          ...lastParamsBase,
          p_limit: take,
          p_offset: baseOffset + i
        });

        if (error) {
          const tbody = document.getElementById('dsHoaDon');
          if (tbody) tbody.innerHTML = `<tr><td colspan="12">❌ Lỗi paged: ${error.message}</td></tr>`;
          return;
        }

        const rows = data || [];
        if (rows.length === 0) break;

        rows.forEach(r => {
          filtered.push({
            sohd: r.sohd,
            ngay: r.ngay,
            created_at: r.created_at,
            updated_at: r.updated_at,
            manv: r.manv,
            tennv: r.tennv,
            khachhang: r.khachhang,
            ghichu: r.ghichu,

            tongsl: r.sl_detail,
            tongthanhtien: r.tong_detail,
            chietkhau: r.chietkhau,
            thanhtoan: r.thanhtoan_v2,

            tongsl_header: r.sl_header,
            lech_sl: r.lech_sl
          });
        });

        if (rows.length < take) break;
      }

      renderFromFiltered(filtered, lastLoaiTongHop);

      const pageInfo = document.getElementById('pageInfo');
      if (pageInfo) pageInfo.textContent = `Trang ${currentPage}/${totalPages}`;

      if (infoEl) infoEl.textContent = `Đang hiển thị ${filtered.length.toLocaleString()} hóa đơn của trang này`;
    }

    function bindPagingEvents() {
      const prev = document.getElementById('btnPrevPage');
      const next = document.getElementById('btnNextPage');
      const pageSizeEl = document.getElementById('pageSize');

      if (prev) prev.addEventListener('click', async () => {
        if (currentPage <= 1) return;
        currentPage -= 1;
        await loadPage();
      });

      if (next) next.addEventListener('click', async () => {
        if (currentPage >= totalPages) return;
        currentPage += 1;
        await loadPage();
      });

      if (pageSizeEl) pageSizeEl.addEventListener('change', async () => {
        // đổi số dòng/trang -> về trang 1
        currentPage = 1;
        const ps = Number(pageSizeEl.value || 10000);
        totalPages = Math.max(1, Math.ceil((lastTotalRows || 0) / ps));
        const pageInfo = document.getElementById('pageInfo');
        if (pageInfo) pageInfo.textContent = `Trang ${currentPage}/${totalPages}`;
        if (lastParamsBase) await loadPage();
      });
    }

    async function kiemTraNhanVienTruocKhiXoa(callbackSauXacThuc) {
      (async () => {
        // Không hỏi lại mật khẩu nữa: chỉ Confirm thao tác và để RLS quyết định quyền

            alert("Phiên đăng nhập đã hết. Vui lòng đăng xuất và đăng nhập lại.");
            return;

          // (Khuyến nghị) kiểm tra quyền nhanh qua RPC is_admin() nếu có

              return;

          } catch (e) {
            // Nếu chưa có RPC is_admin() thì bỏ qua, để RLS tự chặn khi DELETE
          }

          if (typeof callbackSauXacThuc === 'function') {
            await callbackSauXacThuc({ user_id: user.id, is_admin: true });
          }
        } catch (e) {
          alert("Không kiểm tra được phiên đăng nhập. Vui lòng tải lại trang.");
        }
      })();

      let url = null;

      // Bán lẻ thường
      if (prefix === 'bancs1') {

      }

      // Bán nhân viên
      else if (prefix === 'bannvcs1') {
        url = `bannvcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'bannvcs2') {
        url = `bannvcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Nhập mới
      else if (prefix === 'nmcs1') {
        url = `nhapmoimtcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nmcs2') {
        url = `nhapmoimtcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Chuyển chi nhánh (2v1) – dùng cùng trang CCN2V1
      else if (prefix === 'xcncs1' || prefix === 'ncncs1') {
        url = `ccn2v1cs1.html?sohd=${encodeURIComponent(sohd)}&loaihd=${prefix}&diadiem=cs1`;
      } else if (prefix === 'xcncs2' || prefix === 'ncncs2') {
        url = `ccn2v1cs2.html?sohd=${encodeURIComponent(sohd)}&loaihd=${prefix}&diadiem=cs2`;
      }

      // Nhập kiểm, xuất kiểm
      else if (prefix === 'nhapkiemcs1') {
        url = `nhapkiemcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nhapkiemcs2') {
        url = `nhapkiemcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      } else if (prefix === 'xuatkiemcs1') {
        url = `xuatkiemcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'xuatkiemcs2') {
        url = `xuatkiemcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Nhập tạm
      else if (prefix === 'nhaptamcs1') {
        url = `nhaptamcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nhaptamcs2') {
        url = `nhaptamcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Nhập đổi từ khách
      else if (prefix === 'nhapdoics1') {
        url = `nhapdoimtcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nhapdoics2') {
        url = `nhapdoimtcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Xuất hủy
      else if (prefix === 'xuathuycs1') {
        url = `xuathuycs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'xuathuycs2') {
        url = `xuathuycs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Chưa cấu hình
      if (!url) {
        alert("Chưa cấu hình mở hóa đơn cho loại: " + prefix);
        return;
      }

      window.open(`https://banle-js.vercel.app/${url}`, "_blank");
    }

  <script type="module">
    import { khoiTaoDangNhapDungChung } from './scripts/authModule.js';

    khoiTaoDangNhapDungChung({
      appContainerId: 'app-container',

      // Không khóa cứng cơ sở, để nhân viên chọn CS1 / CS2
      macDinhDiaDiem: '',
      tuDongKhoaCoSo: false,

      // API backend đăng nhập (tự theo cơ sở chọn: cs1/cs2)
      loginApiPath: (cs) => `/api/login-${cs}`,

      async onLoginSuccess(nv, ctx) {
        // ✅ Check quyền admin bằng RPC (nguồn thật) => không tin localStorage / nv.is_admin
        let isAdmin = false;
        try {
          const { data, error } = await window.supabase.rpc('is_admin');
          isAdmin = (!error && data === true);
        } catch (e) {
          isAdmin = false;
        }

        if (!isAdmin) {
          alert('Bạn không phải ADMIN, không được phép xem báo cáo này.');
          const login = document.getElementById('login-container');
          if (login) login.style.display = 'none';
          const app = document.getElementById('app-container') || document.body;
          app.style.display = '';
          app.innerHTML = `
            <h2 style="color:#c00; margin-top:20px; font-weight:bold;">🚫 Bạn không có quyền xem báo cáo này</h2>
          `;
          return false; // chặn không cho show app theo flow mặc định
        }

        // ✅ Admin OK -> lúc này mới init filter + bind events + load data
        await initFiltersFromUrl();
        bindEventsAfterAdmin();

        // Gắn popup tìm mã sản phẩm (chỉ admin)
        try {
          const { attachMaspPopup } = await import('./scripts/productSearchModule.js');
          const elMasp = document.getElementById('locMasp');
          if (elMasp) {
            attachMaspPopup({
              supabase: window.supabase,
              maspInput: elMasp,
              onPick: (p) => {
                const cur = (elMasp.value || '').trim();
                const v = (p?.masp || '').trim();
                if (!v) return;
                const set = new Set(
                  cur ? cur.split(',').map(s => s.trim().toUpperCase()).filter(Boolean) : []
                );
                set.add(v.toUpperCase());
                elMasp.value = Array.from(set).join(',');
              }
            });
          }
        } catch (e) {
          // nếu module popup không tồn tại thì bỏ qua
        }

        await taiDanhSachHoaDon();
        return true;
      }
    });

    function toLocalDate(ngayStr, isoStr) {
      // ngayStr dạng YYYY-MM-DD (hoặc YYYY-MM) => tự dựng Date local để không bị lệch ngày do UTC
      if (ngayStr) {
        const parts = String(ngayStr).split('-').map(Number);
        const y = parts[0] || 1970;
        const m = (parts[1] || 1) - 1;
        const d = parts[2] || 1;
        return new Date(y, m, d, 12, 0, 0); // 12h để tránh DST/UTC edge
      }
      return new Date(isoStr);
    }

  </script>
