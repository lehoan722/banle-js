<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BÁN LẺ - MOBILE</title>
    <style>
        :root {
            --main-color: #0088cc;
            --action-color: #006699;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background: #f6fafd;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--main-color);
            color: white;
            height: 56px;
            padding: 0 10px;
        }

        .topbar-title {
            flex: 1;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .topbar-icon {
            font-size: 24px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            margin: 0 5px;
        }

        .qr-box {
            width: 100vw;
            height: 210px;
            background: #222;
            color: white;
            display: none;
            /* bật lên khi nhấn QR */
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin: 14px 12px 4px 12px;
        }

        .input-group input {
            flex: 1;
            font-size: 18px;
            padding: 11px 44px 11px 14px;
            border: 1.5px solid #b5c3d1;
            border-radius: 8px;
            background: #fff;
            margin-right: 7px;
        }

        .input-group .btn-voice {
            background: none;
            border: none;
            font-size: 22px;
            color: var(--main-color);
            cursor: pointer;
            margin-left: -40px;
            z-index: 2;
        }

        .input-group .btn-search {
            background: var(--main-color);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            margin-left: 7px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-fields {
            display: flex;
            gap: 7px;
            margin: 2px 12px 0 12px;
        }

        .info-fields input {
            width: 32%;
            font-size: 17px;
            border: 1px solid #bbb;
            border-radius: 7px;
            padding: 7px 7px;
        }

        .btn-add {
            width: 97%;
            margin: 8px 0 2px 1.5%;
            padding: 12px;
            background: var(--action-color);
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px #0088cc14;
        }

        .product-table {
            width: 98%;
            margin: 10px 1%;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 7px #0088cc0e;
        }

        .product-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .product-table th,
        .product-table td {
            padding: 9px 2px;
            border-bottom: 1px solid #ebebeb;
            text-align: center;
            font-size: 17px;
        }

        .product-table th {
            background: #e5f3fa;
            font-weight: bold;
        }

        .btn-delete-row {
            background: none;
            border: none;
            color: #c22;
            font-size: 19px;
            cursor: pointer;
        }

        .summary-block {
            margin: 8px 1%;
            background: #e5f8f1;
            border-radius: 10px;
            padding: 11px;
        }

        .summary-block label {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            margin: 2px 0;
        }

        .customer-fields {
            margin: 10px 1% 7px 1%;
            display: flex;
            gap: 8px;
        }

        .customer-fields input {
            flex: 1;
            padding: 9px 10px;
            font-size: 16px;
            border-radius: 7px;
            border: 1px solid #b5c3d1;
        }

        .customer-fields button {
            font-size: 17px;
            padding: 0 7px;
            border: none;
            background: var(--main-color);
            color: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .pay-fields {
            margin: 7px 1%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pay-fields select {
            flex: 1;
            font-size: 17px;
            padding: 8px 8px;
            border-radius: 6px;
            border: 1px solid #bbb;
            background: #fff;
        }

        .bottom-actions {
            display: flex;
            gap: 8px;
            margin: 13px 1.5% 14px 1.5%;
        }

        .bottom-actions button {
            flex: 1;
            padding: 15px 0;
            font-size: 18px;
            border-radius: 10px;
            font-weight: bold;
            border: none;
            background: var(--main-color);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 2px 7px #0088cc1d;
        }

        .bottom-actions .btn-bluetooth {
            background: #12bb68;
        }

        @media (max-width: 450px) {

            .product-table th,
            .product-table td {
                font-size: 15px;
            }

            .summary-block label {
                font-size: 16px;
            }
        }

        .input-group.input-khach,
        .input-group.input-nv {
            margin: 8px 12px 2px 12px;
            width: calc(100% - 24px);
        }

        .input-group.input-khach input,
        .input-group.input-nv input {
            width: 100%;
            margin-right: 7px;
        }
    </style>
</head>

<body>
    <!-- Top bar -->
    <div class="topbar">
        <button class="topbar-icon" id="btn-menu" title="Menu">☰</button>
        <div class="topbar-title">BÁN LẺ CS1</div>
        <button class="topbar-icon" id="btn-qr" title="Quét mã vạch">📷</button>
    </div>

    <!-- QR code scanner area -->
    <div class="qr-box" id="qr-box">
        <!-- Camera, khung quét, sẽ render bằng js/html5-qrcode -->
        <span>Đang mở camera quét mã...</span>
        <button class="topbar-icon" style="position:absolute;top:7px;right:12px;"
            onclick="document.getElementById('qr-box').style.display='none'">✕</button>
    </div>

    <!-- Nhập sản phẩm -->
    <div class="input-group">
        <input id="masp" placeholder="Nhập mã SP hoặc quét..." autocomplete="off" />
        <button class="btn-voice" title="Nhập bằng giọng nói" id="btn-voice">🎤</button>
        <button class="btn-search" title="Tìm sản phẩm" id="btn-search">🔍</button>
    </div>

    <div class="info-fields">
        <input id="size" placeholder="Size">
        <input id="soluong" placeholder="SL" value="1" type="number" min="1">
        <input id="gia" placeholder="Giá" readonly>
    </div>

    <div class="input-group">
        <input id="sohd" placeholder="Số hóa đơn" readonly style="font-weight:bold; background:#eee;">
    </div>

    <!-- Bảng kết quả -->
    <div class="product-table">
        <table id="bangketqua">
            <thead>
                <tr>

                    <th>Mã</th>
                    <th>Size</th>
                    <th>Giá</th>
                    <th>SL</th>
                    <th>T Tiền</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <!-- Dòng mẫu sẽ render JS -->
            </tbody>
        </table>
    </div>
    <!-- Tổng kết -->

    <div class="summary-block">
        <label>Tổng tiền <span id="tongtien">0</span></label>
        <label>Khuyến mại <span id="tongkm">0</span></label>
        <label>
            Chiết khấu
            <input id="chietkhau_input" value="0"
                style="width:100px; text-align:right; font-size: 18px; border: 1px solid #b5c3d1; border-radius: 5px; padding:2px 7px; margin-left:7px" />
        </label>
        <label>Phải trả <span id="phaithanhtoan">0</span></label>
    </div>

    <!-- Thông tin khách và nhân viên -->
    <div class="input-group input-khach">
        <input id="makh" placeholder="Mã KH" autocomplete="off" />
        <button class="btn-search" id="btn-kh">🔍</button>
    </div>
    <div class="input-group input-nv">
        <input id="manv" placeholder="Mã NV" autocomplete="off" />
        <button class="btn-search" id="btn-nv">🔍</button>
    </div>
    <!-- Thanh toán -->
    <div class="pay-fields">
        <select id="hinhthuctt">
            <option value="tm">Tiền mặt</option>
            <option value="ck">Chuyển khoản</option>
        </select>
    </div>
    <!-- Nút thao tác -->
    <div class="bottom-actions">
        <button id="btn-luu">💾 Lưu</button>
        <button id="btn-them-moi">🆕 Thêm mới</button>
        <button class="btn-bluetooth" id="btn-bluetooth">🖨️ In Bluetooth</button>
    </div>
    <!-- Popup tìm khách, NV, sản phẩm sẽ bổ sung sau -->

    <script>
        // Placeholder js cho các nút: sẽ gắn logic sau
        document.getElementById('btn-qr').onclick = () => {
            document.getElementById('qr-box').style.display = 'flex';
        };
        document.getElementById('btn-menu').onclick = () => {
            window.location.href = 'menu.html';
        };
        document.getElementById('btn-voice').onclick = () => {
            alert('Chức năng nhập giọng nói đang phát triển...');
        };
        document.getElementById('btn-bluetooth').onclick = () => {
            alert('Sẽ tích hợp in Bluetooth ở bản tới!');
        };
    </script>
    <script type="module" src="scripts/banlemobilecs1.js"></script>

</body>

</html>
