<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gợi Ý Nhập Bù</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.js"></script>

  <style>
    :root {
      --bg: #f7f7f8;
      --card: #fff;
      --text: #111;
      --muted: #666;
      --primary: #2563eb;
      --br: 14px;
      --shadow: 0 6px 20px rgba(0, 0, 0, .06);
      --gap: 16px;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial
    }

    .container {
      max-width: 100%;
      margin: 24px auto;
      padding: 0 16px;
    }


    /* Header summary */
    .page-title {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 16px
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 14px;
      background: var(--card);
      border-radius: var(--br);
      box-shadow: var(--shadow);
      align-items: center
    }

    .chip {
      padding: 6px 10px;
      background: #eef2ff;
      border-radius: 999px;
      color: #334155;
      font-weight: 600
    }

    .grow {
      flex: 1
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer
    }

    .btn.secondary {
      background: #e5e7eb;
      color: #111
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed
    }

    /* Panel tham số gợi ý */
    .card {
      background: var(--card);
      border-radius: var(--br);
      box-shadow: var(--shadow);
      padding: 16px
    }

    .card h3 {
      margin: 0 0 12px
    }

    .params {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 12px
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700
    }

    .field input {
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      outline: none
    }

    .actions {
      margin-top: 10px;
      display: flex;
      gap: 10px
    }

    /* Layout chính: bảng + (sau này có thể thêm panel chi tiết) */
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--gap);
      margin-top: var(--gap)
    }

    /* Bảng */
    .table-wrap {
      background: var(--card);
      border-radius: var(--br);
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 12px;
      border-bottom: 1px solid #eee
    }

    .toolbar .left {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .toolbar .right {
      display: flex;
      gap: 8px
    }

    .table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0
    }

    .table th,
    .table td {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      text-align: left;
      white-space: nowrap
    }

    .table thead th {
      position: sticky;
      top: 0;
      background: #fafafa;
      z-index: 2;
      font-size: 12px;
      color: #374151;
      letter-spacing: .02em;
      border-bottom: 1px solid #e5e7eb
    }

    .table tbody tr:hover {
      background: #fafafa
    }

    .num {
      text-align: right
    }

    .nowrap {
      white-space: nowrap
    }

    .link {
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
      font-weight: 600
    }

    /* Responsive */
    @media (max-width: 900px) {
      .params {
        grid-template-columns: repeat(2, minmax(140px, 1fr))
      }

      .summary {
        gap: 6px
      }

      .toolbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px
      }

      .table th,
      .table td {
        padding: 8px 10px
      }
    }

    /* ====== 2 cột: bảng trái 70% | ảnh phải 30% ====== */
    .layout-2cols {
      display: grid;
      grid-template-columns: 70% 30%;
      gap: 16px;
      align-items: start;
      margin-top: 16px;
    }

    .col-main {
      min-width: 0;
    }

    .col-preview {
      position: sticky;
      top: 14px;
      max-height: calc(100vh - 120px);
      overflow: auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .06);
      padding: 12px;
    }


    /* tiêu đề ảnh */
    .section-title {
      margin: 4px 0 10px;
      font-weight: 800;
      font-size: 16px
    }

    /* grid ảnh: 1 cột dọc để cuộn */
    #previewGrid {
      display: grid;
      grid-template-columns: 1fr;
      /* CHỈ 1 CỘT ẢNH */
      gap: 10px;
    }

    .preview-card {
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 0 0 1px #eee inset;
      padding: 8px;
    }

    .preview-card.selected {
      box-shadow: 0 0 0 2px #3b82f6 inset;
    }

    .preview-card img {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      cursor: zoom-in;
    }

    .preview-cap {
      margin-top: 6px;
      font-size: 13px;
      color: #374151;
      text-align: center;
    }

    .preview-cap .cap-link {
      font-weight: 700;
      color: #111;
      text-decoration: none;
      cursor: pointer;
    }

    .preview-cap .cap-link:hover {
      text-decoration: underline;
    }

    /* Mobile: chuyển sang 1 cột (ảnh dưới bảng) */
    @media (max-width: 1024px) {
      .layout-2cols {
        grid-template-columns: 1fr;
      }

      .col-preview {
        position: static;
        max-height: none;
      }
    }

    .table-wrap {
      overflow: visible;
    }

    
  </style>
</head>

<body>
  <div class="container">
    -Nếu bán chạy → tăng dự trữ lên 21, dự phòng 1,4; Nếu lọc tra ve quá ít mã → giảm % Bán/Nhập hoặc Bán/ngày

    <!-- Tóm tắt điều kiện đã áp dụng từ XNT17 -->
    <div class="summary">
      <span class="chip" id="chipTuNgay">Từ ngày: --/--/----</span>
      <span class="chip" id="chipDenNgay">Đến ngày: --/--/----</span>
      <span class="chip" id="chipDiaDiem">Địa điểm: Tất cả</span>
      <span class="chip" id="chipNhomHang">Nhóm hàng: Tất cả</span>
      <span class="chip" id="chipBoLocKhac">Bộ lọc: --</span>
      <div class="grow"></div>
      <button class="btn secondary" id="btnDoiDieuKien">Đổi điều kiện</button>
    </div>

    <!-- Tham số gợi ý riêng cho nhập bù (client-side) -->
    <div class="card" style="margin-top:16px">
      <h3>Tham số gợi ý</h3>
      <div class="params">
        <div class="field">
          <label for="inpSellThroughMin">60 là tỷ lệ bán=60% nhập</label>
          <input id="inpSellThroughMin" type="number" step="1" min="0" max="100" placeholder="60" value="60">
        </div>
        <div class="field">
          <label for="inpBanNgayMin">0.3 là. mỗi ngày bán 0.3 cái</label>
          <input id="inpBanNgayMin" type="number" step="0.1" min="0" placeholder="0.3" value="0.3">
        </div>
        <div class="field">
          <label for="inpTargetDays">14:số ngày để tính nhập dự trữ</label>
          <input id="inpTargetDays" type="number" step="1" min="1" placeholder="14" value="14">
        </div>
        <div class="field">
          <label for="inpSafetyFactor">1.2 nhập thêm 20% dự phòng</label>
          <input id="inpSafetyFactor" type="number" step="0.1" min="1" placeholder="1.2" value="1.2">
        </div>
        <div class="field">
          <label for="inpNhapToiThieu">Nhập kỳ tối thiểu (lọc nhiễu)</label>
          <input id="inpNhapToiThieu" type="number" step="1" min="0" placeholder="3" value="3">
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnApDung">Áp dụng</button>
        <button class="btn secondary" id="btnMacDinh">Về mặc định</button>
      </div>
    </div>

    <!-- Bảng kết quả gợi ý nhập bù -->
    <div class="layout-2cols">
      <!-- CỘT TRÁI: BẢNG -->
      <div class="col-main">
        <div class="table-wrap">
          <div class="toolbar">
            <div class="left">
              <strong>Gợi ý nhập bù</strong>
              <span id="countRows" class="chip">0 dòng</span>
            </div>
            <div class="right">
              <button class="btn secondary" id="btnBackXNT17">Quay lại Báo cáo XNT17</button>
              <button class="btn" id="btnExportExcel">Xuất Excel</button>
            </div>
          </div>

          <!-- NEW: wrapper cố định chiều cao cho HOT -->
          <div id="hotWrap" style="height:60vh; min-height:400px; overflow:auto;">
            <div id="hotGoiY" style="height:100%; width:100%"></div>
          </div>
        </div>

      </div>

      <!-- CỘT PHẢI: ẢNH NHANH -->
      <aside class="col-preview">
        <h3 id="previewTitle" class="section-title">Ảnh nhanh (0 mã)</h3>
        <div id="previewGrid"></div>
      </aside>

    </div>

    <!-- Lightbox -->
    <div id="lb" class="lb-backdrop">
      <div class="lb-close" title="Đóng">✕</div>
      <div class="lb-wrap"><img alt="Ảnh lớn"></div>
    </div>
    <script>
      (function () {
        const lb = document.getElementById('lb');
        lb.addEventListener('click', (e) => {
          if (e.target.id === 'lb' || e.target.classList.contains('lb-close')) lb.classList.remove('show');
        });
        window.openLightbox = (src) => { lb.querySelector('img').src = src; lb.classList.add('show'); };
      })();
    </script>




</body>
