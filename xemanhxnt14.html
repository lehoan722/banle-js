<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Ảnh sản phẩm (từ XNT14)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fafafa
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #111;
            color: #fff;
            position: sticky;
            top: 0
        }

        header .right small {
            opacity: .8
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
            padding: 14px;
            max-width: 1400px;
            margin: 0 auto
        }

        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .04)
        }

        .imgwrap {
            width: 100%;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f7f7
        }

        img {
            max-width: 100%;
            max-height: 100%;
            display: block;
            object-fit: contain
        }

        .cap {
            padding: 8px 10px;
            border-top: 1px dashed #e5e7eb;
            font-weight: 600
        }

        .cap small {
            font-weight: 400;
            opacity: .8;
            margin-left: 6px
        }

        .empty {
            padding: 32px;
            text-align: center;
            color: #666
        }

        a {
            color: inherit;
            text-decoration: none
        }

        @media (max-width:640px) {
            header {
                padding: 8px 10px
            }
        }

        .cap a.cap-link {
            display: block;
            text-decoration: none;
            color: #111;
        }

        .cap a.cap-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <header>
        <div>🖼️ Xem ảnh sản phẩm</div>
        <div class="right">
            <button onclick="history.back()" style="margin-right:8px">⬅ Quay lại</button>
            <small id="count"></small>
        </div>
    </header>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none">
        Không tìm thấy danh sách mã từ XNT14. Hãy quay lại và bấm “Hiển thị ảnh”.
    </div>

    <!-- 1. Dùng module để import supabase và gắn ra window -->
    <script type="module" src="scripts/supabaseClientGlobal.js"></script>

    <!-- 2. Popup bán/tồn – script thường, dùng window.supabase -->
    <script src="scripts/stockQuickPopup.js"></script>



    <!-- 3. Script tạo grid ảnh -->
    <script>
        const BASE = "https://rddjrmbyftlcvrgzlyby.supabase.co/storage/v1/object/public/anhsanpham/";
        const DETAIL_URL = "https://banle-js.vercel.app/timkiemhanghoa333.html";

        function fmtVND(n) {
            if (n == null || isNaN(n)) return "";
            return Number(n).toLocaleString("vi-VN");
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function getLocalYMD() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return `${y}-${m}-${day}`;
        }

        function ensureXNT14Filters() {
            try {
                const raw = sessionStorage.getItem("XNT14_FILTERS");
                if (raw) {
                    const obj = JSON.parse(raw);
                    if (obj && obj.den_ngay) return;
                }
            } catch (e) { }

            const fallback = {
                den_ngay: getLocalYMD()
            };

            try {
                sessionStorage.setItem("XNT14_FILTERS", JSON.stringify(fallback));
            } catch (e) {
                console.warn("[xemanhxnt14] Không ghi được XNT14_FILTERS:", e);
            }
        }

        async function waitForDependencies(maxWaitMs = 8000) {
            const start = Date.now();

            while (Date.now() - start < maxWaitMs) {
                const hasSQ =
                    !!(window.StockQuick && typeof window.StockQuick.attach === "function");

                const hasSupabase =
                    !!(window.supabase &&
                        typeof window.supabase.from === "function" &&
                        window.supabase.auth);

                if (hasSQ && hasSupabase) {
                    return true;
                }

                await sleep(100);
            }

            return false;
        }

        function createCard({ masp, giale, toncs1, toncs2 }) {
            const card = document.createElement("div");
            card.className = "card";
            card.dataset.masp = masp;

            const imgwrap = document.createElement("div");
            imgwrap.className = "imgwrap";

            const img = document.createElement("img");
            img.loading = "lazy";
            img.alt = masp;
            img.src = BASE + masp + ".JPG";
            img.onerror = function () {
                if (img.src.endsWith(".JPG")) {
                    img.src = BASE + masp + ".png";
                } else {
                    imgwrap.textContent = "Không có ảnh";
                }
            };

            imgwrap.appendChild(img);

            const cap = document.createElement("div");
            cap.className = "cap";
            cap.innerHTML =
                `<a class="cap-link"
                href="${DETAIL_URL}?masp=${encodeURIComponent(masp)}"
                target="_blank"
                rel="noopener">
                ${masp} / ${fmtVND(giale)} ${Number(toncs1 || 0)}/${Number(toncs2 || 0)}
            </a>`;

            card.appendChild(imgwrap);
            card.appendChild(cap);

            return card;
        }

        function renderList(list) {
            const grid = document.getElementById("grid");
            const empty = document.getElementById("empty");
            const count = document.getElementById("count");

            grid.innerHTML = "";
            count.textContent = list.length ? `Tổng: ${list.length}` : "";

            if (!list.length) {
                empty.style.display = "block";
                return [];
            }

            empty.style.display = "none";

            const cards = [];
            list.forEach(item => {
                const card = createCard(item);
                grid.appendChild(card);
                cards.push(card);
            });

            return cards;
        }

        function attachPopupToCards(cards) {
            if (!window.StockQuick || typeof window.StockQuick.attach !== "function") return;

            cards.forEach(card => {
                if (card.dataset.sqBound === "1") return;
                card.dataset.sqBound = "1";
                window.StockQuick.attach(card, card.dataset.masp);
            });

            // warmup để iPhone/Safari ổn định hơn khi mở trực tiếp từ popup bán lẻ
            const warmCard = (cards || []).find(c => c && c.dataset && c.dataset.masp) || null;

            if (warmCard && !window.__XNT14_STOCKQUICK_WARMED__) {
                window.__XNT14_STOCKQUICK_WARMED__ = true;

                setTimeout(async () => {
                    try {
                        await window.StockQuick.showFor(document.body, warmCard.dataset.masp);

                        await sleep(250);

                        const popup = document.querySelector(".sq-stock-popup.show");
                        if (popup) popup.classList.remove("show");
                    } catch (err) {
                        console.warn("[xemanhxnt14] warmup popup lỗi:", err);
                    }
                }, 700);
            }
        }

        async function initPage() {
            ensureXNT14Filters();

            const list = JSON.parse(sessionStorage.getItem("XNT14_MASP_LIST") || "[]");
            const cards = renderList(list);

            if (!list.length) return;

            const ok = await waitForDependencies(15000);

            if (!ok) {
                console.warn("[xemanhxnt14] StockQuick hoặc Supabase chưa sẵn sàng sau thời gian chờ.");
                return;
            }

            // đợi thêm cho Safari / iPhone phục hồi module + session ổn định hơn
            await sleep(500);

            attachPopupToCards(cards);
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initPage);
        } else {
            initPage();
        }
    </script>



</body>


</html>
