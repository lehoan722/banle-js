<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Tìm kiếm thông tin hàng hóa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.js"></script>
    <script type="module" src="scripts/supabaseClient.js"></script>
    <script type="module" src="scripts/timkiemhanghoa222.js"></script>
    <style>
        /* ===== Base sạch ===== */
        :root {
            --r: 12px;
            --gap: 8px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: #f6f8fb;
            font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Arial;
            color: #0f172a;
            overflow-x: hidden;
            /* chặn body trượt ngang */
        }

        /* Khung chính */
        .main-container {
            max-width: 1100px;
            margin: 10px auto;
            padding: 8px;
        }

        /* ===== Topbar compact (sticky) ===== */
        .topbar-compact {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #fff;
            border-bottom: 1px solid #e9eef3;
        }

        .topbar-compact .toolbar {
            display: grid;
            grid-template-columns: auto 1fr auto auto auto;
            gap: 6px;
            padding: 8px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid #cfd8dc;
            background: #f7f9fb;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
        }

        #maspInput {
            height: 40px;
            padding: 0 10px;
            border-radius: 10px;
            border: 1px solid #90caf9;
            font-size: 16px;
            /* tránh iOS auto-zoom */
        }

        .status-line {
            padding: 0 10px 8px;
            font-weight: 600;
            color: #c62828;
        }

        .status-line:empty {
            display: none;
        }

        /* ===== Tools panel (ẩn mặc định trên mọi thiết bị) ===== */
        .tools {
            display: none;
            padding: 8px;
            border-top: 1px solid #e9eef3;
        }

        .tools.open {
            display: block;
        }

        .tool-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .chip {
            border: 1px solid #cfd8dc;
            background: #f7f9fb;
            border-radius: 999px;
            height: 34px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }

        .chip-select {
            height: 34px;
            padding: 0 8px;
            border: 1px solid #cfd8dc;
            border-radius: 999px;
            background: #fff;
        }

        #bulkTextarea {
            width: 100%;
            min-height: 96px;
            resize: vertical;
            background: #fff;
            border: 1px solid #cfd8dc;
            border-radius: 10px;
            padding: 8px 10px;
            font: 14px ui-monospace, Menlo, Consolas, monospace;
        }

        .muted {
            color: #78909c;
            font-size: 12px;
        }

        /* ===== Bảng trượt ngang chỉ trong khung riêng ===== */
        .scroll-x {
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            /* ngăn “dính” sang body */
            touch-action: pan-x;
            /* ưu tiên kéo ngang trong khung */
            background: #fff;
            border: 1px solid #e9eef3;
            border-radius: 12px;
            padding: 6px;
            margin: 8px 0;
        }

        /* bảng rộng hơn khung -> xuất hiện thanh trượt ngang */
        .scroll-x>table {
            width: max-content;
            min-width: 960px;
            border-collapse: collapse;
        }

        .scroll-x th,
        .scroll-x td {
            padding: 8px 10px;
            border: 1px solid #e9eef3;
            white-space: nowrap;
            background: #fff;
        }

        .scroll-x th {
            background: #e8f2ff;
            font-weight: 700;
            color: #0b5394;
        }

        /* Giữ style ảnh gọn */
        .img-wrap img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }

        /* Mobile tinh gọn */
        @media (max-width:700px) {
            .topbar-compact .toolbar {
                padding: 6px;
                gap: 6px;
            }

            .icon-btn,
            #maspInput {
                height: 44px;
            }
        }

        /* ===== Desktop: 2 cột (trái = đúng bề rộng 8 ô) ===== */
        .detail-layout {
            display: grid;
            grid-template-columns: auto 1fr;
            /* trái theo nội dung, phải chiếm phần còn lại */
            gap: 16px;
            align-items: start;
        }

        .left-pane {
            width: max-content;
        }

        /* ăn theo phần tử con rộng nhất */
        .top-info {
            width: max-content;
        }

        /* 8 ô thông tin quyết định bề rộng cột trái */

        /* Bảng chỉ rộng bằng cột trái; nhiều cột -> scroll ngang trong khung */
        .scroll-x {
            width: 100%;
            max-width: 100%;
        }

        /* khớp bề rộng cột trái */
        .scroll-x>table {
            width: max-content;
            min-width: 720px;
            /* có thể chỉnh 680–820 tuỳ 8 ô của bạn */
            border-collapse: collapse;
        }

        /* Ảnh ở cột phải */
        .right-pane .img-wrap {
            position: sticky;
            top: 70px;
        }

        .img-wrap img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }

        /* Mobile: giữ nguyên (xếp dọc) */
        @media (max-width:900px) {
            .detail-layout {
                display: block;
            }

            .right-pane .img-wrap {
                position: static;
            }
        }
    </style>



</head>

<body>

        <button onclick="dangNhap()"

    <div class="main-container">

            <div class="toolbar">

            <!-- Scanner Modal (giữ nguyên) -->

            <!-- Dòng thông báo (tự ẩn khi trống) -->
            <div id="statusMsg" class="status-line"></div>

            <!-- Bảng Công cụ: ẩn mặc định (desktop + mobile), bấm ⋯ để mở -->
            <div id="toolsPanel" class="tools">
                <div class="tool-row">
                    <label class="chip icon-chip" title="Chọn ảnh">
                        📁 Chọn ảnh
                        <input id="imgFileInput" type="file" accept="image/*" capture="environment" hidden>
                    </label>
                    <button id="saveImgBtn" class="chip" title="Lưu ảnh">💾 Lưu ảnh</button>
                    <button id="clearBulkBtn" class="chip" title="Xoá dữ liệu dán">🧹 Xoá DL</button>
                    <span id="uploadStatus" class="muted"></span>

                <div class="tool-row">
                    <button id="orderBtn" class="chip" title="Đặt hàng">🛒 Đặt hàng</button>
                    <select id="branchPicker" class="chip-select" title="Chọn cơ sở">
                        <option value="">-- Chưa chọn --</option>

                    </select>
                    <button id="saveVitriBtn" class="chip" title="Lưu vị trí">💾 Lưu vị trí</button>
                    <span id="saveVitriStatus" class="muted"></span>

                <div class="tool-row">
                    <textarea id="bulkTextarea" placeholder="Dán 1 cột mã (mỗi dòng 1 mã)
                      VD:
                      11376-GDM

        <!-- ===== END COMPACT TOPBAR ===== -->


        <!-- KHU HIỂN THỊ SẢN PHẨM / BẢNG / ẢNH -->

        <!-- DESKTOP: 2 cột; MOBILE: xếp dọc -->
        <div id="singleDetailBox" class="detail-layout">
            <!-- Cột trái: 8 ô + bảng -->
            <div class="left-pane">

            <!-- Cột phải: ảnh -->

            </aside>

    </div>

    <script>
        // CẮT HẬU TỐ _SIZE Ở CUỐI CHUỖI. VD: "ABC12-DG38_38" -> "ABC12-DG38"
        function stripSizeSuffixAtEnd(s) {
            if (!s) return "";
            s = String(s).trim();
            // chỉ cắt đoạn _... nếu NẰM Ở CUỐI
            const m = s.match(/^(.*)_[A-Za-z0-9.\-]+$/);
            return m ? m[1] : s;
        }

        // Làm sạch tất cả input/textarea liên quan rồi gọi hàm tìm kiếm cũ
        function preCleanThenSearch() {
            // 1) Ô nhập 1 mã (nếu có)
            var ip = document.getElementById('maspInput');
            if (ip && ip.value) {
                ip.value = stripSizeSuffixAtEnd(ip.value);
            }

            // 2) Textarea nhiều mã (nếu có)
            var ta = document.getElementById('bulkTextarea');
            if (ta && ta.value) {
                var cleaned = ta.value
                    .split(/[\r\n,;\t]+/)
                    .map(function (x) { return stripSizeSuffixAtEnd(x); })
                    .map(function (x) { return x.trim(); })
                    .filter(Boolean);
                // không tự động loại trùng/đổi thứ tự — giữ nguyên “đơn giản”
                ta.value = cleaned.join('\n');
            }

            // 3) Gọi lại hàm tìm kiếm cũ (nếu có tham số tuỳ trang thì để nguyên)
            if (typeof window.triggerSearch === 'function') {
                window.triggerSearch();
            }
        }
    </script>

    <script>
        // lang nghe enter trong o maspInput
        document.addEventListener('DOMContentLoaded', function () {
            var ip = document.getElementById('maspInput');
            if (!ip) return;
            ip.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();          // chặn submit form / reload trang
                    preCleanThenSearch();        // làm sạch _SIZE rồi gọi triggerSearch()
                }
            });

            // Nếu ô này nằm trong <form>, đảm bảo submit cũng đi qua "làm sạch"
            var form = ip.closest('form');
            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    preCleanThenSearch();
                });
            }
        });
    </script>

    <!-- Popup Đặt hàng -->

    <!-- Popup chọn Màu -->

        <div
            style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);background:#fff;border-radius:10px;overflow:hidden;">

    <!-- Popup chọn Size (dùng chung cho Còn & Hết) -->
    <div id="popupPickSize" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:4500;">

            style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);background:#fff;border-radius:10px;overflow:hidden;">

    <script>
        // Lưu trạng thái Tools (mở/đóng) để lần sau giữ nguyên
        (function () {
            const panel = document.getElementById('toolsPanel');
            const saved = localStorage.getItem('tk_tools_open') === '1';
            if (panel && saved) panel.classList.add('open');
        })();

        function toggleTools() {
            const panel = document.getElementById('toolsPanel');
            if (!panel) return;
            const isOpen = panel.classList.toggle('open');
            localStorage.setItem('tk_tools_open', isOpen ? '1' : '0');
        }
    </script>

    <script>
        (function syncLeftWidth() {
            const topInfo = document.getElementById('infoTopTable');
            const leftPane = document.querySelector('.detail-layout .left-pane');
            if (!topInfo || !leftPane) return;
            function apply() {
                const w = topInfo.offsetWidth;
                if (w) leftPane.style.width = w + 'px';
            }
            apply();
            window.addEventListener('resize', apply);
        })();
    </script>





</body>
