<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Tìm kiếm thông tin hàng hóa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.js"></script>
    <script type="module" src="scripts/supabaseClient.js"></script>
    <script type="module" src="scripts/timkiemhanghoa222.js"></script>
    <style>
        /* ===== Reset ngắn gọn ===== */
        :root {
            --radius: 12px;
            --gap: 8px;
            --h40: 40px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Arial;
            color: #0f172a;
            background: #f6f8fb;
            overflow-x: hidden;
            /* Ngăn màn hình trượt ngang */
        }

        /* ===== Topbar compact (sticky) ===== */
        .topbar-compact {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #fff;
            border-bottom: 1px solid #e9eef3;
        }

        .topbar-compact .toolbar {
            display: grid;
            grid-template-columns: auto 1fr auto auto auto;
            gap: 6px;
            padding: 8px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid #cfd8dc;
            background: #f7f9fb;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
        }

        #maspInput {
            height: 40px;
            padding: 0 10px;
            border-radius: 10px;
            border: 1px solid #90caf9;
            font-size: 16px;
        }

        .status-line {
            padding: 0 10px 8px;
            font-weight: 600;
            color: #c62828;
        }

        .status-line:empty {
            display: none;
        }

        /* ===== Tools panel (thu gọn mặc định) ===== */
        .tools {
            padding: 8px;
            border-top: 1px solid #e9eef3;
            display: none;
        }

        .tools.open {
            display: block;
        }

        .tool-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .chip {
            border: 1px solid #cfd8dc;
            background: #f7f9fb;
            border-radius: 999px;
            height: 34px;
            padding: 0 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .chip-select {
            height: 34px;
            padding: 0 8px;
            border: 1px solid #cfd8dc;
            border-radius: 999px;
            background: #fff;
        }

        #bulkTextarea {
            width: 100%;
            min-height: 96px;
            resize: vertical;
            background: #fff;
            border: 1px solid #cfd8dc;
            border-radius: 10px;
            padding: 8px 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px;
        }

        .muted {
            color: #78909c;
            font-size: 12px;
        }

        /* ===== Khu dữ liệu: bảng trượt ngang trong khung riêng ===== */
        /* Bọc các bảng trong .table-scroll để chỉ khung đó kéo ngang, không kéo cả trang */
        .table-scroll {
            overflow-x: auto;
            overflow-y: visible;
            /* chỉ trượt ngang */
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            /* chặn cuộn ngang “dính” sang body */
            touch-action: pan-x;
            /* ưu tiên kéo ngang trong khung */
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e9eef3;
            padding: 6px;
            margin: 8px 0;
        }

        /* đảm bảo bảng rộng hơn khung -> có thanh trượt ngang */
        .table-scroll>table {
            width: max-content;
            min-width: 900px;
            border-collapse: collapse;
        }

        .table-scroll th,
        .table-scroll td {
            padding: 8px 10px;
            border: 1px solid #e9eef3;
            white-space: nowrap;
            background: #fff;
        }

        .table-scroll th {
            background: #e8f2ff;
            font-weight: 700;
            color: #0b5394;
        }

        /* layout các card/ảnh nếu có */
        .img-wrap img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }

        /* Mobile tinh gọn */
        @media (max-width:700px) {
            .topbar-compact .toolbar {
                gap: 6px;
                padding: 6px;
            }

            .icon-btn,
            #maspInput {
                height: 44px;
            }

            .status-line {
                padding: 0 8px 6px;
            }
        }

        /* Tùy chọn “không bành ra toàn màn hình” cho block nội dung chính */
        .main-container {
            max-width: 1100px;
            margin: 10px auto;
            padding: 8px;
        }
    </style>



</head>

<body>

    <!-- Đăng nhập (giữ nguyên) -->
    <div id="authBox"
        style="margin-bottom:18px;background:#f6f8fa;padding:12px 16px;border-radius:8px;box-shadow:0 2px 8px #eee;max-width:380px;">
        <label>Email: <input type="email" id="email" value="khohangcs1@gmail.com"></label>
        <label style="margin-left:12px;">Mật khẩu: <input type="password" id="password" value="123123"></label>
        <button onclick="dangNhap()"
            style="margin-left:12px;background:#1976d2;color:#fff;border:none;padding:4px 12px;border-radius:6px;">Đăng
            nhập</button>
        <span id="authStatus" style="color:red;margin-left:10px"></span>
    </div>

    <div class="main-container">

        <!-- ===== COMPACT TOPBAR (sticky) ===== -->
        <div id="compactTopbar" class="topbar-compact">
            <div class="toolbar">
                <button class="icon-btn" title="Tìm nhanh" onclick="openPopupSearch('mahang')">🔍</button>
                <input id="maspInput" placeholder="Nhập mã… (VD 66862-AP)" autocomplete="off"
                    onkeydown="if((event.key==='Enter'||event.keyCode===13)){event.preventDefault(); preCleanThenSearch();}">
                <button id="searchBtn" class="icon-btn" title="Tìm" onclick="preCleanThenSearch()">↩︎</button>
                <button id="scanBtn" class="icon-btn" title="Quét">📷</button>
                <button id="moreBtn" class="icon-btn" title="Công cụ" onclick="toggleTools()">⋯</button>
            </div>
            <div id="statusMsg" class="status-line"></div>

            <!-- Tools: luôn thu gọn mặc định (desktop & mobile) -->
            <div id="toolsPanel" class="tools">
                <div class="tool-row">
                    <label class="chip" style="gap:8px;cursor:pointer">📁 Chọn ảnh
                        <input id="imgFileInput" type="file" accept="image/*" capture="environment" hidden>
                    </label>
                    <button id="saveImgBtn" class="chip">💾 Lưu ảnh</button>
                    <button id="clearBulkBtn" class="chip">🧹 Xoá DL</button>
                    <span id="uploadStatus" class="muted"></span>
                </div>
                <div class="tool-row">
                    <button id="orderBtn" class="chip">🛒 Đặt hàng</button>
                    <select id="branchPicker" class="chip-select">
                        <option value="">-- Chưa chọn --</option>
                        <option value="cs1">CS1</option>
                        <option value="cs2">CS2</option>
                    </select>
                    <button id="saveVitriBtn" class="chip">💾 Lưu vị trí</button>
                    <span id="saveVitriStatus" class="muted"></span>
                </div>
                <div class="tool-row">
                    <textarea id="bulkTextarea" placeholder="Dán 1 cột mã (mỗi dòng 1 mã)
                     VD:
                     11376-GDM
                        60252-GDE"></textarea>
                </div>
            </div>
        </div>

        <!-- ===== END COMPACT TOPBAR ===== -->


        <!-- KHU HIỂN THỊ SẢN PHẨM / BẢNG / ẢNH -->
        <div id="multiDetailBox"></div>

        <div id="singleDetailBox">
            <div class="top-info">
                <table id="infoTopTable" class="info-table"></table>
            </div>

            <!-- Bảng có thể trượt ngang trên mobile -->
            <div class="right-xnt">
                <table id="infoTableRight" class="info-table"></table>
            </div>

            <div class="img-wrap">
                <img id="productImage" alt="Ảnh sản phẩm" />
            </div>
        </div>


        <!-- Popup tìm kiếm dùng chung -->
        <div id="popupSearch">
            <div style="padding:6px 10px;border-bottom:1px solid #eee;background:#f8fafd;">
                <input id="popupSearchInput" type="text" placeholder="Nhập từ khóa tìm kiếm..." autofocus />
                <button onclick="closePopupSearch()" style="float:right;background:#e57373;color:#fff;">Đóng</button>
            </div>
            <div id="popupSearchList"></div>
        </div>

        <!-- Scanner Modal (giữ nguyên) -->
        <div id="scannerModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3000;">
            <div
                style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,720px);background:#000;border-radius:12px;overflow:hidden">
                <div style="position:relative;background:#000">
                    <video id="scannerVideo" playsinline autoplay muted
                        style="width:100%;height:auto;background:#000"></video>
                    <div
                        style="position:absolute;inset:12% 12%;border:2px solid rgba(255,255,255,.8);border-radius:10px;pointer-events:none;">
                    </div>
                    <div id="scannerStatus"
                        style="position:absolute;left:12px;bottom:10px;color:#fff;font-weight:600;text-shadow:0 1px 2px #000">
                    </div>
                </div>
                <div
                    style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px;background:#111;color:#eee">
                    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                        <select id="cameraSelect" style="max-width:48vw"></select>
                        <button id="flashBtn" class="popup-btn" style="background:#222;border-color:#666;color:#eee">🔦
                            Đèn</button>
                        <label class="popup-btn" style="background:#222;border-color:#666;color:#eee;cursor:pointer">
                            Ảnh có sẵn
                            <input id="filePicker" type="file" accept="image/*" capture="environment" hidden />
                        </label>
                    </div>
                    <button id="closeScanner" class="popup-btn"
                        style="background:#e57373;border-color:#c62828;color:#fff">Đóng</button>
                </div>
            </div>
        </div>

        <div id="flashOverlay"></div>
        <div id="toastMsg"></div>


        <script>
            // CẮT HẬU TỐ _SIZE Ở CUỐI CHUỖI. VD: "ABC12-DG38_38" -> "ABC12-DG38"
            function stripSizeSuffixAtEnd(s) {
                if (!s) return "";
                s = String(s).trim();
                // chỉ cắt đoạn _... nếu NẰM Ở CUỐI
                const m = s.match(/^(.*)_[A-Za-z0-9.\-]+$/);
                return m ? m[1] : s;
            }

            // Làm sạch tất cả input/textarea liên quan rồi gọi hàm tìm kiếm cũ
            function preCleanThenSearch() {
                // 1) Ô nhập 1 mã (nếu có)
                var ip = document.getElementById('maspInput');
                if (ip && ip.value) {
                    ip.value = stripSizeSuffixAtEnd(ip.value);
                }

                // 2) Textarea nhiều mã (nếu có)
                var ta = document.getElementById('bulkTextarea');
                if (ta && ta.value) {
                    var cleaned = ta.value
                        .split(/[\r\n,;\t]+/)
                        .map(function (x) { return stripSizeSuffixAtEnd(x); })
                        .map(function (x) { return x.trim(); })
                        .filter(Boolean);
                    // không tự động loại trùng/đổi thứ tự — giữ nguyên “đơn giản”
                    ta.value = cleaned.join('\n');
                }

                // 3) Gọi lại hàm tìm kiếm cũ (nếu có tham số tuỳ trang thì để nguyên)
                if (typeof window.triggerSearch === 'function') {
                    window.triggerSearch();
                }
            }
        </script>

        <script>
            // lang nghe enter trong o maspInput
            document.addEventListener('DOMContentLoaded', function () {
                var ip = document.getElementById('maspInput');
                if (!ip) return;
                ip.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();          // chặn submit form / reload trang
                        preCleanThenSearch();        // làm sạch _SIZE rồi gọi triggerSearch()
                    }
                });

                // Nếu ô này nằm trong <form>, đảm bảo submit cũng đi qua "làm sạch"
                var form = ip.closest('form');
                if (form) {
                    form.addEventListener('submit', function (e) {
                        e.preventDefault();
                        preCleanThenSearch();
                    });
                }
            });
        </script>

        <!-- Popup Đặt hàng -->
        <div id="popupDatHang" style="display:none;position:fixed;inset:0;background:#f5f7fb;z-index:4000;">
            <div style="max-width:820px;margin:10px auto;padding:12px 14px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
                    <h3 style="margin:0;color:#1976d2">Phiếu đặt hàng</h3>
                    <button id="dhCloseBtn" class="popup-btn" style="background:#e57373;color:#fff;">Trở về</button>
                </div>

                <div style="display:grid;grid-template-columns:1fr;gap:10px">

                    <label> Số HĐ
                        <input id="dhSohd" readonly
                            style="width:100%;padding:8px;border:1px solid #90caf9;border-radius:6px;font-weight:700">
                    </label>

                    <label> Mã SP
                        <input id="dhMasp" readonly
                            style="width:100%;padding:8px;border:1px solid #90caf9;border-radius:6px">
                    </label>

                    <label> Màu (chọn 1 hoặc gõ)
                        <div style="display:flex;gap:6px;">
                            <input id="dhMau" placeholder="gõ màu..."
                                style="flex:1;padding:8px;border:1px solid #90caf9;border-radius:6px">
                            <button id="pickMauBtn" class="popup-btn">Chọn</button>
                        </div>
                    </label>

                    <label> Còn size (chọn nhiều theo mô tả hoặc gõ thủ công, ngăn cách dấu phẩy)
                        <div style="display:flex;gap:6px;">
                            <input id="dhConSize" placeholder="ví dụ: S-38-46-240-165, M-39-48-245-170"
                                style="flex:1;padding:8px;border:1px solid #90caf9;border-radius:6px">
                            <button id="pickConSizeBtn" class="popup-btn">Chọn</button>
                        </div>
                    </label>

                    <label> Hết size (chọn nhiều theo mô tả hoặc gõ thủ công, ngăn cách dấu phẩy)
                        <div style="display:flex;gap:6px;">
                            <input id="dhHetSize" placeholder="ví dụ: XL-41-52-255-180"
                                style="flex:1;padding:8px;border:1px solid #90caf9;border-radius:6px">
                            <button id="pickHetSizeBtn" class="popup-btn">Chọn</button>
                        </div>
                    </label>

                    <label> Ghi chú
                        <input id="dhGhichu" placeholder="ghi chú..."
                            style="width:100%;padding:8px;border:1px solid #90caf9;border-radius:6px">
                    </label>

                    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px;">
                        <button id="dhSaveBtn" class="popup-btn"
                            style="background:#1976d2;border-color:#1976d2;color:#fff;font-weight:700">💾 Lưu dữ
                            liệu</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Popup chọn Màu -->
        <div id="popupPickMau" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:4500;">
            <div
                style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);background:#fff;border-radius:10px;overflow:hidden;">
                <div
                    style="padding:8px;background:#f6f8fa;border-bottom:1px solid #eee;display:flex;justify-content:space-between;">
                    <b>Chọn màu</b>
                    <button id="mauCloseBtn" class="popup-btn">Đóng</button>
                </div>
                <div id="mauList" style="max-height:60vh;overflow:auto;"></div>
            </div>
        </div>

        <!-- Popup chọn Size (dùng chung cho Còn & Hết) -->
        <div id="popupPickSize" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:4500;">
            <div
                style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);background:#fff;border-radius:10px;overflow:hidden;">
                <div
                    style="padding:8px;background:#f6f8fa;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center;">
                    <b style="flex:0 0 auto;">Chọn size</b>
                    <input id="sizeFilter" placeholder="Tìm nhanh theo mô tả..."
                        style="flex:1;padding:6px;border:1px solid #90caf9;border-radius:6px">
                    <button id="sizeDoneBtn" class="popup-btn">Xong</button>
                </div>
                <div id="sizeList" style="max-height:60vh;overflow:auto;"></div>
            </div>
        </div>


        <script>
            function toggleTools() {
                const panel = document.getElementById('toolsPanel');
                const btn = document.getElementById('moreBtn');
                const collapsed = panel.classList.toggle('collapsed');
                btn.setAttribute('aria-expanded', (!collapsed).toString());
            }

            function applyToolsMode() {
                const panel = document.getElementById('toolsPanel');
                const btn = document.getElementById('moreBtn');
                if (!panel || !btn) return;
                if (window.innerWidth <= 900) {
                    panel.classList.add('collapsed');           // mobile: thu gọn mặc định
                    btn.style.display = 'inline-flex';
                } else {
                    panel.classList.remove('collapsed');        // desktop: luôn mở
                    btn.style.display = 'none';
                }
            }

            window.addEventListener('load', applyToolsMode);
            window.addEventListener('resize', applyToolsMode);
        </script>



</body>

</html>
