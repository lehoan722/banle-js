
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Báo cáo Xuất Nhập Tồn 12</title>
  <script type="module" src="scripts/supabaseClient.js"></script>
  <script type="module" src="scripts/baocaoxnt12.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@12.3.1/dist/handsontable.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/handsontable@12.3.1/dist/handsontable.min.js"></script>
  <style>
    body { font-family: Arial; padding: 16px; background: #f9f9f9; }
    h2 { margin-bottom: 10px; }
    label { margin-right: 10px; }
  </style>
</head>
<body>
  <div id="authBox">
    <label>Email: <input type="email" id="email"></label>
    <label>Mật khẩu: <input type="password" id="password"></label>
    <button onclick="dangNhap()">Đăng nhập</button>
    <span id="authStatus" style="color:red;"></span>
  </div>

  <h2>📊 Báo cáo Xuất Nhập Tồn 12</h2>
  <div>
    <label>Từ ngày: <input type="date" id="tuNgay"></label>
    <label>Đến ngày: <input type="date" id="denNgay"></label>
    <label>Địa điểm:
      <select id="diadiemSelect">
        <option value="">Tất cả</option>
        <option value="cs1">Cơ sở 1</option>
        <option value="cs2">Cơ sở 2</option>
      </select>
    </label>
    <button onclick="taiBaoCaoXNT()">Xem báo cáo</button>
  </div>

  <div id="hot" style="margin-top:20px;"></div>
</body>
</html>
