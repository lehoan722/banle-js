        // ==== Cáº¤U HĂŒNH THĂ”NG Sá» IN TEM ====

        // 1. Search products (khĂ´ng load all)
        async function searchProducts(keyword, callback) {
            let { data, error } = await supabase
                .from('dmhanghoa')
                .select('masp, tensp, dvt, giale, gianhap')
                .or(`masp.ilike.%${keyword}%,tensp.ilike.%${keyword}%`)
                .order('masp')
                .limit(100);
            filtered = data || [];
            products = data || [];
            renderProductList();
            if (typeof callback === 'function') callback();
        }


        searchInput.addEventListener('input', () => {
            const val = searchInput.value.trim().toLowerCase();
            if (val.length === 0) {
                filtered = [];
                products = [];
                renderProductList();
            } else {
                searchProducts(val);

        // Render product list
        function renderProductList() {
            let html = '<table>';
            html += '<tr><th>MĂ£ SP</th><th>TĂªn hĂ ng</th></tr>';
            for (let p of filtered) {
                html += `<tr data-masp="${p.masp}">
      <td>${p.masp}</td>
      <td>${p.tensp}</td>
    </tr>`;
            }
            html += '</table>';
            productListDiv.innerHTML = html;
            // Gáº¯n double click event cho tá»«ng dĂ²ng
            productListDiv.querySelectorAll('tr[data-masp]').forEach(row => {
                row.ondblclick = () => selectProduct(row.dataset.masp);
            });
        }

        function selectProduct(masp) {
            if (!hot) return;
            const p = products.find(x => x.masp === masp);
            if (!p) return;
            let data = hot.getSourceData();
            // Loáº¡i dĂ²ng tráº¯ng cuá»‘i báº£ng (dĂ²ng chá»‰ toĂ n rá»—ng/null)
            data = data.filter(row => Array.isArray(row)
                ? row.some(cell => cell !== null && cell !== "")
                : Object.values(row).some(cell => cell !== null && cell !== "")
            );

            // Kiá»ƒm tra mĂ£ Ä‘Ă£ cĂ³ chÆ°a
            //if (data.some(row => row[1] === p.masp)) return; //Bá» kiá»ƒm tra trĂ¹ng mĂ£ sáº£n pháº©m khi thĂªm tá»« danh sĂ¡ch
            // ThĂªm sáº£n pháº©m má»›i
            data.push([
                data.length + 1,        // STT
                p.masp,                 // MĂ£ hĂ ng
                p.tensp,                // TĂªn hĂ ng
                "0",                    // KĂ­ch cá»¡ (máº·c Ä‘á»‹nh "0")
                1,                      // Sá»‘ lÆ°á»£ng (default 1)
                p.dvt || "sp",          // ÄVT (náº¿u trá»‘ng thĂ¬ "sp")
                p.gianhap || 1,         // GiĂ¡ nháº­p (náº¿u trá»‘ng thĂ¬ 1)
                true,                   // In
                p.giale || 0            // GiĂ¡ láº» (náº¿u trá»‘ng thĂ¬ 0)
            ]);

            // Cáº­p nháº­t láº¡i STT liĂªn tá»¥c
            data.forEach((row, idx) => row[0] = idx + 1);
            hot.loadData(data);
        }

            if (!hot) return;
            const data = hot.getData().filter(row => row[1] && row[2]);
            selected = data.map(row => ({

                masp: row[1],        // MĂ£ hĂ ng

                tick: !!row[7],      // In

            }));

        }

        function renderSelectedTable() {

            positionMaspSuggestList();

            maspSuggestDiv.querySelectorAll('tr[data-masp]').forEach(row => {
                row.onclick = function () {
                    maspInput.value = row.dataset.masp;
                    document.getElementById('tenspInput').value = row.dataset.tensp;
                    maspSuggestDiv.style.display = 'none';
                    checkExistAndFillForm(); // Táº£i info náº¿u cĂ³
                    document.getElementById('tenspInput').focus();
                }
            });
        });

        // áº¨n popup khi click ra ngoĂ i hoáº·c tab/blur
        document.addEventListener('mousedown', function (e) {
            if (!maspInput.contains(e.target) && !maspSuggestDiv.contains(e.target)) {
                maspSuggestDiv.style.display = 'none';
            }
        });

        // Äáº·t láº¡i vá»‹ trĂ­ popup khi resize/scroll
        window.addEventListener('resize', positionMaspSuggestList);
        window.addEventListener('scroll', positionMaspSuggestList);

        maspInput.addEventListener('focus', function () {
            if (maspSuggestDiv.innerHTML.trim() !== '') maspSuggestDiv.style.display = 'block';
            positionMaspSuggestList();
        });


        const gianhapInput = document.getElementById('gianhapInput');
        const gialeInput = document.getElementById('gialeInput');

        //Format sá»‘ cho giĂ¡ nháº­p & giĂ¡ láº» trĂªn FORM
        [gianhapInput, gialeInput].forEach(inp => {
            inp.addEventListener('blur', function () {
                let val = inp.value.replace(/\./g, '').replace(/[^0-9]/g, '');
                if (val && !isNaN(val)) {
                    inp.value = Number(val).toLocaleString('vi-VN');
                } else {
                    inp.value = '';
                }
            });
            inp.addEventListener('focus', function () {
                inp.value = inp.value.replace(/\./g, '');
                setTimeout(() => inp.select(), 10);
            });
        });


        // Tá»± Ä‘á»™ng tĂ­nh giĂ¡ láº» khi nháº­p xong giĂ¡ nháº­p
        gianhapInput.addEventListener('change', function () {
            const val = parseFloat(this.value);
            if (!isNaN(val) && val > 0) {
                gialeInput.value = Math.round(val * 1.5);
            }
        });

        // THEM TRUONG/ Thá»© tá»± Enter (focus/bĂ´i Ä‘en)
        const formOrder = [
            'maspInput',
            'tenspInput',
            'gianhapInput',
            'gialeInput',
            'mausacInput',
            'khuyenmaiInput',
            'nhaccInput',
            'nhomhangInput',   // â¬… thĂªm vĂ o Ä‘Ă¢y
            'chungloaiInput'
        ];

        formOrder.forEach((id, idx) => {
            const inp = document.getElementById(id);
            if (!inp) return;
            inp.addEventListener('keydown', function (e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    // Náº¿u khĂ´ng pháº£i Ă´ cuá»‘i cĂ¹ng thĂ¬ focus Ă´ tiáº¿p theo
                    if (idx < formOrder.length - 1) {
                        const next = document.getElementById(formOrder[idx + 1]);
                        if (next) {
                            next.focus();
                            setTimeout(() => next.select(), 10); // BĂ´i Ä‘en toĂ n bá»™
                        }
                    } else {
                        // Náº¿u lĂ  Ă´ cuá»‘i cĂ¹ng, submit form
                        document.getElementById('saveFormBtn').focus();
                    }
                }
            });
            inp.addEventListener('focus', function () {
                setTimeout(() => inp.select(), 10);
            });
        });



        // ÄÄƒng nháº­p xong reload láº¡i Ä‘á»ƒ token cáº­p nháº­t
        import { renderLoginModule } from './scripts/loginSupabaseModule.js';
        renderLoginModule({
            supabaseUrl,
            supabaseKey,
            onLoginSuccess: (accessToken) => {
                window.location.reload(); // ÄÄƒng nháº­p xong reload láº¡i Ä‘á»ƒ token cáº­p nháº­t
            }
        });

        function pushProductToGrid(product) {
            if (!hot) return;
            let data = hot.getSourceData();
            // Loáº¡i dĂ²ng tráº¯ng cuá»‘i báº£ng (dĂ²ng chá»‰ toĂ n rá»—ng/null)
            data = data.filter(row => Array.isArray(row)
                ? row.some(cell => cell !== null && cell !== "")
                : Object.values(row).some(cell => cell !== null && cell !== "")
            );
            // Kiá»ƒm tra mĂ£ Ä‘Ă£ cĂ³ trĂªn lÆ°á»›i chÆ°a
            const idx = data.findIndex(row => row[1] === product.masp);
            if (idx !== -1) {
                // Náº¿u cĂ³ rá»“i, cáº­p nháº­t thĂ´ng tin má»›i
                data[idx] = [
                    idx + 1, // STT
                    product.masp,
                    product.tensp,
                    "0", // KĂ­ch cá»¡ máº·c Ä‘á»‹nh
                    1,   // Sá»‘ lÆ°á»£ng máº·c Ä‘á»‹nh
                    product.dvt || "sp",
                    product.gianhap || 1,
                    true,
                    product.giale || 0
                ];
            } else {
                // Náº¿u chÆ°a cĂ³, thĂªm vĂ o cuá»‘i
                data.push([
                    data.length + 1,
                    product.masp,
                    product.tensp,
                    "0",
                    1,
                    product.dvt || "sp",
                    product.gianhap || 1,
                    true,
                    product.giale || 0
                ]);
            }
            // Cáº­p nháº­t láº¡i STT liĂªn tá»¥c
            data.forEach((row, idx) => row[0] = idx + 1);
            hot.loadData(data);
        }



    </script>
