<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>BÁO CÁO CHI TIẾT BÁN HÀNG</title>
    <!-- Kết nối Supabase + Handsontable -->
    <script type="module" src="scripts/supabaseClient.js"></script>
    <script type="module" src="scripts/baocaochitiet.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f8f8; padding: 16px; }
        .container { max-width: 1300px; margin: auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 6px #e3e3e3; padding: 24px 26px 48px 26px; }
        h2 { text-align: center; color: #1976d2; margin-top: 0; }
        .filters-row { display: flex; gap: 0; margin-bottom: 10px; }
        .filters-left { flex: 1; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 22px; }
        .filters-right { min-width: 120px; max-width: 220px; padding: 6px 10px; background: #f7fafd; border-radius: 7px; border: 1px solid #e3e6f3; margin-left: 8px; display: flex; flex-direction: column; }
        .filters-right textarea { width: 100%; border-radius: 5px; padding: 7px; min-height: 140px; border: 1px solid #bbb; font-size: 15px; }
        .filters label { margin-bottom: 0; font-weight: 600; }
        .filters select, .filters input[type="date"], .filters input[type="number"], .filters input[type="text"] {
            padding: 6px 9px; border-radius: 3px; border: 1px solid #ccc; font-size: 15px;
        }
        .main-btn { background: #2196f3; color: #fff; border: none; font-weight: bold; padding: 8px 22px; border-radius: 5px; margin-right: 8px; cursor: pointer; font-size: 16px;}
        .main-btn:hover { background: #1769aa; }
        #hot { margin-top: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 BÁO CÁO CHI TIẾT BÁN HÀNG <span style="font-size:0.7em; color:#666;">(chuẩn hóa)</span></h2>
        <div class="filters-row">
            <div class="filters-left filters">
                <label>Từ ngày: <input type="date" id="tuNgay"></label>
                <label>Đến ngày: <input type="date" id="denNgay"></label>
                <label>Loại hóa đơn:
                    <select id="loaihdSelect" multiple style="min-width:140px; max-width:220px;">
                        <!-- JS sẽ fill option hoặc bạn có thể hardcode các loại hóa đơn tại đây -->
                        <option value="bancs1">Bán lẻ CS1</option>
                        <option value="bancs2">Bán lẻ CS2</option>
                        <option value="nmcs1">Nhập mới CS1</option>
                        <option value="nmcs2">Nhập mới CS2</option>
                        <option value="ccn1v2">Chuyển CN1</option>
                        <option value="ccn2v1">Chuyển CN2</option>
                    </select>
                </label>
                <label>Địa điểm:
                    <select id="diadiemSelect" style="min-width:90px;">
                        <option value="">Tất cả</option>
                        <option value="CS1">Cơ sở 1</option>
                        <option value="CS2">Cơ sở 2</option>
                    </select>
                </label>
                <label>Khách hàng: <input id="khachhangInput" type="text" placeholder="Tên hoặc mã khách"></label>
                <label>Nhân viên: <input id="nhanvienInput" type="text" placeholder="Tên hoặc mã NV"></label>
                <label>Mã hàng: <input id="maspInput" type="text" placeholder="Mã sản phẩm"></label>
                <label>Tên hàng: <input id="tenspInput" type="text" placeholder="Tên sản phẩm"></label>
                <label>Kích cỡ: <input id="sizeInput" type="text" style="width:60px" placeholder="Size"></label>
                <label>Từ giá: <input type="number" id="tuGia" min="0" style="width:90px;" placeholder="Từ"></label>
                <label>Đến giá: <input type="number" id="denGia" min="0" style="width:90px;" placeholder="Đến"></label>
                <button class="main-btn" onclick="taiBaoCaoChiTiet()">Xem báo cáo</button>
            </div>
            <div class="filters-right">
                <textarea id="maspList" rows="12" placeholder="Nhập/dán nhiều mã sản phẩm, mỗi mã 1 dòng..."></textarea>
            </div>
        </div>
        <div id="hot"></div>
    </div>
</body>
</html>
