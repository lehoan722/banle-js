<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Báo cáo Xuất Nhập Tồn Hàng Hóa</title>
  <script type="module" src="scripts/supabaseClient.js"></script>
  <script type="module" src="scripts/baocaoxnt.js"></script>
  <!-- Handsontable CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.js"></script>

  <style>
    body {
      font-family: Arial;
      padding: 16px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 7px;
      text-align: left;
    }

    thead th {
      position: sticky;
      top: 0;
      background: #f9f9f9;
      z-index: 2;
    }

    .filters input,
    .filters select {
      margin: 4px;
      padding: 6px;
    }

    button {
      background: #2196f3;
      color: #fff;
      border: none;
      font-weight: bold;
      padding: 7px 18px;
      border-radius: 4px;
      margin-right: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #1769aa;
    }

    #authBox {
      background: #f6f8fa;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px #eee;
    }
  </style>
</head>

<body>
  <div id="authBox">
    <label>Email: <input type="email" id="email"></label>
    <label>Mật khẩu: <input type="password" id="password"></label>
    <button onclick="dangNhap()">Đăng nhập</button>
    <span id="authStatus" style="color: red; margin-left: 10px"></span>
  </div>

  <h2>📦 BÁO CÁO XUẤT NHẬP TỒN HÀNG HÓA</h2>
  <div class="filters">
    <label>Chọn phương pháp:
      <select id="selectFunction">
        <option value="baocaoxnt">Chuẩn (theo cột loại/diadiem)</option>
        <option value="baocaoxnt_splithd">Tách từ Số HĐ (SPLIT)</option>
      </select>
    </label>
    <label>Từ ngày: <input type="date" id="tuNgay"></label>
    <label>Đến ngày: <input type="date" id="denNgay"></label>
    <label>Khách hàng: <input type="text" id="khachhang"></label>
    <label>Nhân viên: <input type="text" id="nhanvien"></label>
    <label>Nhóm hàng: <input type="text" id="nhomhang"></label>
    <label>Loại hàng: <input type="text" id="loaihang"></label>
    <label>Màu sắc: <input type="text" id="mausac"></label>
    <label>Kích cỡ: <input type="text" id="size"></label>
    <label>Mã hàng: <input type="text" id="masp"></label>
    <button onclick="taiBaoCaoXNT()">Xem báo cáo</button>
    <!-- Có thể thêm nút xuất Excel, hoặc các tính năng mở rộng khác -->
  </div>
  
  <div id="hot" style="margin-top: 16px;"></div>

</body>

</html>
