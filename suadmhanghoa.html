<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nhập vị trí kho hàng hóa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.5/dist/umd/supabase.min.js"></script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', 'Roboto', Arial, sans-serif;
            background: #f7fafc;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            box-sizing: border-box;
        }

        h2 {
            margin: 18px 0 8px 0;
            font-size: 1.25rem;
            text-align: center;
            letter-spacing: 1px;
        }

        #loginModule {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            max-width: 460px;
            margin: 6px 0 10px 0;
            gap: 7px;
        }

        #loginModule input {
            border-radius: 12px;
            padding: 7px 11px;
            border: 1px solid #dedede;
            font-size: 1rem;
            background: #fff;
            width: 44vw;
            max-width: 160px;
        }

        #login-submit {
            background: linear-gradient(90deg, #ff5858 0%, #f857a6 100%);
            color: #fff;
            font-weight: 600;
            border: none;
            padding: 7px 16px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(255, 87, 166, 0.11);
            cursor: pointer;
            transition: 0.18s;
        }

        #login-submit:active {
            filter: brightness(0.93);
            transform: scale(0.97);
        }

        .main-btn {
            display: inline-block;
            margin: 5px 7px 5px 0;
            font-size: 1.08rem;
            padding: 10px 14px;
            font-weight: 500;
            border: none;
            border-radius: 20px;
            box-shadow: 0 2px 10px rgba(72, 52, 212, 0.07);
            color: #fff;
            background: linear-gradient(100deg, #56ccf2 0%, #2f80ed 100%);
            cursor: pointer;
            outline: none;
            transition: background 0.23s, transform 0.18s;
        }

        .main-btn:active {
            background: linear-gradient(100deg, #4a95ff 0%, #395985 100%);
            transform: scale(0.97);
        }

        .main-btn:nth-child(3) {
            /* nút xóa */
            background: linear-gradient(100deg, #f7971e 0%, #ffd200 100%);
            color: #4a3a08;
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.09);
        }

        .main-btn:nth-child(4) {
            /* nút lưu */
            background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
            color: #134a2d;
            box-shadow: 0 2px 10px rgba(67, 233, 123, 0.13);
        }

        #hot {
            width: 99vw;
            max-width: 480px;
            margin: 0 auto 8px auto;
            touch-action: auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 2px 18px rgba(70, 130, 180, 0.07);
            overflow-x: auto;
        }

        .ht_master table {
            font-size: 1.05rem;
        }

        #preview {
            min-height: 36px;
            font-size: 1.06rem;
            text-align: center;
            color: #2f80ed;
            margin: 7px 0 0 0;
        }

        /* Trangthai màu */
        .trangthai-ok {
            color: #e53935 !important;
        }

        .trangthai-boqua {
            color: #039be5 !important;
        }

        .trangthai-loi {
            color: orange !important;
        }

        .trangthai-khongtontai {
            color: #e53935 !important;
            font-weight: bold;
        }

        .trangthai-chuacovitri {
            color: #e67e22 !important;
            font-weight: bold;
        }


        @media (max-width: 500px) {
            h2 {
                font-size: 1.04rem;
            }

            #hot {
                max-width: 99vw;
            }

            #loginModule input {
                font-size: .98rem;
                width: 42vw;
            }

            .main-btn {
                font-size: .99rem;
                padding: 9px 10px;
            }

            #preview {
                font-size: .95rem;
            }
        }
    </style>
</head>

<body>
    <h2>🏷️ NHẬP VỊ TRÍ KHO CS1</h2>
    <div id="loginModule">
        <!-- Ẩn input email (vẫn có trong DOM để JS lấy) -->
        <input id="login-email" type="email" value="khohangcs1@gmail.com" style="display:none">
        <input id="login-password" type="password" placeholder="Mật khẩu">
        <button id="login-submit">Đăng nhập</button>
        <span id="login-status"></span>
    </div>

    <div style="display:flex;justify-content:center;margin-bottom:7px;">

        <select id="col-select" style="margin-right:10px;padding:7px 14px;border-radius:12px;font-size:1rem;">
            <!-- Options sẽ được JS render -->
        </select>

        <button class="main-btn" onclick="resetTable()">🔁 Làm lại</button>
        <button class="main-btn" onclick="kiemTraDuLieu()">🔍 Kiểm tra du lieu dmhh</button>
        <button class="main-btn" onclick="xoaDaCoViTri()">🧹 Xóa sản phẩm đã có vị trí</button>
        <button class="main-btn" onclick="luuDuLieu()">💾 Lưu dữ liệu</button>
    </div>

    <div id="preview"></div>

    <div id="hot"></div>

    <script>


        // Thông tin Supabase
        const SUPABASE_URL = 'https://rddjrmbyftlcvrgzlyby.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZGpybWJ5ZnRsY3ZyZ3pseWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3NjU4MDQsImV4cCI6MjA2MjM0MTgwNH0.-0xtqxn6b9OBz4unTTvJ4klxizWhHa1iSuYGm7cOYTM';

        const TABLE_NAME = 'dmhanghoa';

        const COLS = [
            { name: "masp", label: "Mã sản phẩm" },
            { name: "tensp", label: "Tên sản phẩm" },
            { name: "gianhap", label: "Giá nhập" },
            { name: "giale", label: "Giá lẻ" },
            { name: "giasi", label: "Giá sỉ" },
            { name: "mangan", label: "Mã ngắn" },
            { name: "nhomhang", label: "Nhóm hàng" },
            { name: "nhacc", label: "Nhà CC" },
            { name: "chungloai", label: "Chủng loại" },
            { name: "vitrikho1", label: "Vị trí kho 1" },
            { name: "vitrikho2", label: "Vị trí kho 2" },
            { name: "mausac", label: "Màu sắc" },
            { name: "khuyenmai", label: "Khuyến mãi" },
            { name: "quanlykichco", label: "Quản lý kích cỡ" },
            { name: "active", label: "Đang dùng?" },
            { name: "ngaysua", label: "Ngày sửa" },
            { name: "ngaykiem", label: "Ngày kiểm" },
            { name: "dvt", label: "ĐVT" },
            { name: "nhapdau", label: "Ngày nhập đầu" },
            { name: "vitrikho3", label: "Vị trí kho 3" },
        ];
        window.COLS = COLS; // global cho tiện
        // Hàm khởi tạo dropdown:
        function renderColSelect() {
            let html = `<option value="" selected disabled>-- Chọn mục cần ghi --</option>` +
                COLS.filter(c => c.name !== "masp")
                    .map(c => `<option value="${c.name}">${c.label}</option>`).join("");
            document.getElementById('col-select').innerHTML = html;
        }


        renderColSelect();

        // Khởi tạo Supabase client (token đăng nhập)
        function getSupabaseClient() {
            const token = localStorage.getItem('supabase_access_token');
            return window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY,
                token ? { global: { headers: { Authorization: `Bearer ${token}` } } } : {}
            );
        }

        // Cấu hình bảng
        let hot;
        let colHeaders = ['Mã sản phẩm', 'Vị trí kho cs1', 'Trạng thái'];
        let columns = [
            { data: 'masp', type: 'text', width: 150 },
            { data: 'vitrikho1', type: 'text', width: 150 },
            { data: 'trangthai', type: 'text', width: 110 }
        ];

        function initTable(colname = 'vitrikho1') {
            // Lấy label từ COLS
            let colInfo = COLS.find(c => c.name === colname);
            let colLabel = colInfo ? colInfo.label : colname;

            let colHeaders = ['Mã sản phẩm', colLabel, 'Trạng thái'];
            let columns = [
                { data: 'masp', type: 'text', width: 150 },
                { data: colname, type: 'text', width: 150 },
                { data: 'trangthai', type: 'text', width: 110 }
            ];

            const container = document.getElementById('hot');
            if (hot) hot.destroy();
            hot = new Handsontable(container, {
                data: Array.from({ length: 30 }, () => ({ masp: null, [colname]: null, trangthai: null })),
                columns,
                colHeaders,
                rowHeaders: true,
                minSpareRows: 1,
                width: '100%',
                height: 420,
                stretchH: 'all',
                manualColumnResize: true,
                licenseKey: 'non-commercial-and-evaluation',
                cells: function (row, col) {
                    const cellProperties = {};
                    // Đổi trạng thái màu cho trạng thái
                    if (col === 2) {
                        const val = this.instance.getDataAtCell(row, col);
                        if (val === "OK") cellProperties.className = "trangthai-ok";
                        if (val === "BỎ QUA") cellProperties.className = "trangthai-boqua";
                        if (val === "LỖI") cellProperties.className = "trangthai-loi";
                        if (val === "MÃ KHÔNG TỒN TẠI") cellProperties.className = "trangthai-khongtontai";
                        if (val === "CHƯA CÓ GIÁ TRỊ") cellProperties.className = "trangthai-chuacovitri";
                    }
                    return cellProperties;
                }
            });
        }

        document.getElementById('col-select').onchange = function () {
            initTable(this.value);
            document.getElementById('preview').innerHTML = "";
        };


        initTable();

        // Đăng nhập Supabase (bắt buộc)
        document.getElementById('login-submit').onclick = async function () {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const sb = getSupabaseClient();
            document.getElementById('login-status').textContent = 'Đang đăng nhập...';
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('login-status').textContent = 'Sai tài khoản hoặc mật khẩu!';
            } else {
                document.getElementById('login-status').textContent = 'Đăng nhập thành công!';
                localStorage.setItem('supabase_access_token', data.session.access_token);
                setTimeout(() => window.location.reload(), 1000);
            }
        };

        // Làm lại bảng
        function resetTable() {
            // window.editableMASP = true;
            // window.editableVITRI = false;
            initTable();
            document.getElementById('preview').innerHTML = "";
        }

        // Kiểm tra vị trí kho
        async function kiemTraDuLieu() {

            const colname = document.getElementById('col-select').value;
            if (!colname) {
                alert("Bạn cần chọn mục cần ghi vào trước khi thực hiện thao tác này!");
                return;
            }

            hot.updateSettings({ cells: hot.getSettings().cells });

            let allRows = hot.getSourceData();
            let uniqueMasps = [];
            let uniqueRows = [];
            let seen = {};
            for (let row of allRows) {
                let masp = (row.masp || "").toString().trim().toUpperCase();
                if (masp && !seen[masp]) {
                    seen[masp] = true;
                    uniqueMasps.push(masp);
                    uniqueRows.push({ masp, [colname]: null, trangthai: null });
                }
            }
            if (uniqueMasps.length === 0) {
                alert("Nhập mã sản phẩm để kiểm tra!");
                return;
            }
            hot.loadData(uniqueRows);

            // Lấy cả cột cần kiểm tra
            const sb = getSupabaseClient();
            const { data: found, error } = await sb
                .from(TABLE_NAME)
                .select(`masp,${colname}`)
                .in('masp', uniqueMasps);

            if (error) return alert('Lỗi kết nối Supabase!');
            const maspMap = {};
            found.forEach(row => { maspMap[row.masp.toUpperCase()] = row[colname]; });

            hot.batch(() => {
                for (let r = 0; r < hot.countRows(); r++) {
                    const masp = (hot.getDataAtCell(r, 0) || "").toString().trim().toUpperCase();
                    hot.setDataAtCell(r, 0, masp);

                    if (!masp) {
                        hot.setDataAtCell(r, 1, null);
                        hot.setDataAtCell(r, 2, null);
                        continue;
                    }
                    if (typeof maspMap[masp] === "undefined") {
                        hot.setDataAtCell(r, 1, null);
                        hot.setDataAtCell(r, 2, "MÃ KHÔNG TỒN TẠI");
                    } else if (maspMap[masp]) {
                        hot.setDataAtCell(r, 1, maspMap[masp]);
                        hot.setDataAtCell(r, 2, "BỎ QUA");
                    } else {
                        hot.setDataAtCell(r, 1, null);
                        hot.setDataAtCell(r, 2, "CHƯA CÓ GIÁ TRỊ");
                    }
                }
            });
            document.getElementById('preview').innerHTML = `<span>✅ Đã kiểm tra, báo rõ mã không tồn tại, chưa có giá trị hoặc đã có giá trị.</span>`;
            hot.updateSettings({ cells: hot.getSettings().cells });
        }


        // Xóa các sản phẩm đã có vị trí kho (và dòng trống)
        function xoaDaCoViTri() {
            let tableData = hot.getSourceData();
            tableData = tableData.filter(row =>
                row.masp && row.trangthai !== "BỎ QUA" // chi xoa dong bo qua
            );
            // Nếu không còn dòng nào, thêm dòng trống mới
            if (tableData.length === 0) tableData.push({ masp: null, vitrikho1: null, trangthai: null });
            hot.loadData(tableData);

            // Cho phép nhập cột mã và cột vị trí
            // window.editableMASP = true;
            // window.editableVITRI = true;
            hot.updateSettings({ cells: hot.getSettings().cells });
            document.getElementById('preview').innerHTML = `<span>👉 Bây giờ bạn nhập <b>vị trí kho</b> cho các sản phẩm chưa có vị trí, có thể nhập thêm mã mới nếu cần.</span>`;
        }

        function normalizeDate(val) {
            if (!val) return null;
            let m = val.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{1,2}))?/);
            if (m) {
                let dd = m[1].padStart(2, '0');
                let mm = m[2].padStart(2, '0');
                let yyyy = m[3];
                let h = m[4] || '00', mi = m[5] || '00';
                return `${yyyy}-${mm}-${dd} ${h.padStart(2, '0')}:${mi.padStart(2, '0')}:00`;
            }
            if (["null", "NULL", "NaN", "undefined"].includes(val.toString().trim())) return null;
            if (/^\d{4}-\d{2}-\d{2}/.test(val)) return val;
            return null;
        }

        // Chia mảng thành các nhóm nhỏ
        function chunkArray(array, size) {
            const result = [];
            for (let i = 0; i < array.length; i += size) {
                result.push(array.slice(i, i + size));
            }
            return result;
        }



        // Lưu dữ liệu mới
        async function luuDuLieu() {
            const colname = document.getElementById('col-select').value;
            if (!colname) {
                alert("Bạn cần chọn mục cần ghi vào trước khi thực hiện thao tác này!");
                return;
            }
            const colLabel = COLS.find(c => c.name === colname)?.label || colname;

            let rows = hot.getSourceData().filter(r =>
                r.masp && r[colname]
            );
            if (rows.length === 0) return alert("Không có dữ liệu hợp lệ để ghi.");

            if (!confirm(`⚠️ Bạn chắc chắn muốn ghi đè toàn bộ dữ liệu cũ của cột "${colLabel}" không? Nhấn OK để ghi đè, hoặc Cancel để quay lại!`)) {
                document.getElementById('preview').innerHTML = `<span style="color:orange;">⏹️ Đã hủy thao tác ghi đè.</span>`;
                return;
            }

            const sb = getSupabaseClient();

            // CHUNK SIZE: Nên để 50–100, test thử với số lượng phù hợp mạng/máy bạn
            const chunkSize = 100;
            const chunks = chunkArray(rows, chunkSize);

            let success = 0, fail = 0, errorMsg = [];

            for (let i = 0; i < chunks.length; i++) {
                // Hiển thị trạng thái để người dùng biết đang xử lý đến đâu
                document.getElementById('preview').innerHTML = `<span>⏳ Đang ghi nhóm ${i + 1}/${chunks.length}...</span>`;

                // Tạo batch promises cho từng chunk nhỏ
                let promises = chunks[i].map((row, idx) => {
                    let updateObj = { [colname]: row[colname] };
                    if (["ngaysua", "ngaykiem", "nhapdau"].includes(colname)) {
                        updateObj[colname] = normalizeDate(row[colname]);
                    }
                    return sb.from(TABLE_NAME)
                        .update(updateObj)
                        .eq('masp', row.masp.toString().trim().toUpperCase())
                        .select()
                        .then(({ data, error }) => ({
                            idx: i * chunkSize + idx,
                            masp: row.masp,
                            success: !error && data && data.length === 1,
                            error: error?.message || (!data?.length && 'Không có dòng nào được cập nhật (mã không tồn tại)') || null
                        }));
                });

                // Đợi xong chunk hiện tại mới chạy chunk tiếp
                let results = await Promise.all(promises);

                results.forEach(res => {
                    if (res.success) {
                        hot.setDataAtCell(res.idx, 2, "OK");
                        success++;
                    } else {
                        hot.setDataAtCell(res.idx, 2, "LỖI");
                        fail++;
                        errorMsg.push(`Dòng ${res.idx + 1} (${res.masp}): ${res.error}`);
                    }
                });
            }

            let html = `<span>✅ Đã lưu xong: <b style="color:#e53935">${success} OK</b> &nbsp; <b style="color:orange">${fail} lỗi</b></span>`;
            if (fail) html += `<br><details><summary>Xem chi tiết lỗi</summary><div style="color:orange;text-align:left">${errorMsg.join('<br>')}</div></details>`;
            document.getElementById('preview').innerHTML = html;
            hot.updateSettings({ cells: hot.getSettings().cells });
        }





    </script>
</body>

</html>
