    // Auto-import từ localStorage (F8)

        setTimeout(() => kiemTraViTri(), 0);
      } catch (err) { console.error('VITRIKHO_IMPORT parse error:', err); }
    });

    // Đăng nhập
    document.getElementById('login-submit').onclick = async function () {

      } else {
        document.getElementById('login-status').textContent = 'Đăng nhập thành công!';
        localStorage.setItem('supabase_access_token', data.session.access_token);
        setTimeout(() => window.location.reload(), 1000);
      }
    };

    function resetTable() {
      window.editableMASP = true; window.editableVITRI = false; initTable(); document.getElementById('preview').innerHTML = "";
    }

    // Nút lấy từ Google Sheet (giữ y nguyên logic cũ)
    (() => {
      const SHEET_ID = '1JI3BMl8jsc__bCTH_HA-6uNWtReBy0zpDMGkqsX1JpA';
      const SHEET_TAB = 'ghivitrikhocs1';
      const HOT_COL_MASP = 0;
      const MAKE_UPPERCASE = true;
      const DEDUP = false;
      const CLEAR_BEFORE_INSERT = true;
      const $btn = document.getElementById('btnFetchSheet');
      function getHOT() { return window.hot || window.hotTable || window.HOT || null; }
      function parseGvizJson(txt) { const s = txt.indexOf('('), e = txt.lastIndexOf(')'); if (s === -1 || e === -1) return []; const payload = JSON.parse(txt.slice(s + 1, e)); const rows = payload?.table?.rows || []; const out = []; for (const r of rows) { const v = r?.c?.[0]?.v; if (v != null) out.push(String(v)); } return out; }
      async function fetchMaspsFromGoogleSheet() {
        const urlJSON = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_TAB)}&range=A:A&headers=0`;
        const resp = await fetch(urlJSON, { cache: 'no-store' }); if (!resp.ok) throw new Error(`Fetch Google Sheet lỗi: HTTP ${resp.status}`);
        const text = await resp.text(); let arr = parseGvizJson(text);
        arr = arr.map(s => (s ?? '').toString().trim()).filter(s => s.length > 0);
        if (MAKE_UPPERCASE) arr = arr.map(s => s.toUpperCase());
        if (DEDUP) { const set = new Set(), tmp = []; for (const v of arr) { if (!set.has(v)) { set.add(v); tmp.push(v); } } arr = tmp; }
        return arr;
      }
      function loadMaspsIntoHOT(masps) {
        const hot = getHOT(); if (!hot) { alert('Không tìm thấy bảng dữ liệu (Handsontable).'); return; }
        if (CLEAR_BEFORE_INSERT) { const old = hot.countRows(); if (old > 0) hot.alter('remove_row', 0, old); }
        if (masps.length > 0) { hot.alter('insert_row', 0, masps.length); const ops = []; for (let i = 0; i < masps.length; i++) ops.push([i, HOT_COL_MASP, masps[i]]); hot.setDataAtCell(ops); hot.render(); }
        const msg = `Đã nạp ${masps.length} mã từ Google Sheet (${SHEET_TAB}).`; console.log(msg); alert(msg);
      }
      async function handleFetchClick() {
        try { $btn.disabled = true; $btn.textContent = 'Đang lấy...'; const masps = await fetchMaspsFromGoogleSheet(); loadMaspsIntoHOT(masps); }
        catch (err) { console.error(err); alert('Không lấy được dữ liệu từ Google Sheet. Kiểm tra quyền chia sẻ & tên sheet.'); }
        finally { $btn.disabled = false; $btn.textContent = '📥 Lấy dữ liệu'; }
      }
      if ($btn) $btn.addEventListener('click', handleFetchClick);
    })();

    // ===== Gợi ý theo cache + TẢI TOÀN BỘ DANH MỤC (phân trang) =====
    (() => {
      const HOT_COL_MASP = 0;
      const MAX_SUGGESTIONS = 50;
      const DEBOUNCE_MS = 120;
      const CACHE_KEY = 'dmhanghoa_cache_full_v1';
      const CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6 giờ
      const PAGE_SIZE = 2000;

      const $input = document.getElementById('maspSearch');
      const $list = document.getElementById('maspSuggest');
      const $btnAll = document.getElementById('btnLoadAll');
      const $btnClear = document.getElementById('btnClearCache');
      const $prog = document.getElementById('catalogProgress');
      const $status = document.getElementById('catalogStatus');

      let cache = null;      // [{masp,tensp,_MASP,_TENSP}]
      let filtered = [];
      let activeIndex = -1;
      let debTimer = null;
      let cancelToken = { cancel: false };

      function norm(s) { return (s || '').toString().trim(); }
      function up(s) { return norm(s).toUpperCase(); }
      function saveCache(data) { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); }
      function loadCache() {
        try {
          const raw = localStorage.getItem(CACHE_KEY); if (!raw) return null;
          const obj = JSON.parse(raw); if (!obj || !obj.data) return null;
          if (Date.now() - (obj.ts || 0) > CACHE_TTL_MS) return null;
          return obj.data;
        } catch (e) { return null; }
      }
      function setProgress(pct) { $prog.style.width = Math.max(0, Math.min(100, pct)) + '%'; }

      async function countTotal() {
        try {
          const sb = getSupabaseClient();
          const { count, error } = await sb.from(TABLE_NAME).select('masp', { count: 'exact', head: true });
          if (error) throw error;
          return count || 0;
        } catch (e) { return 0; }
      }

      async function loadFullCatalog() {
        const sb = getSupabaseClient();
        const total = await countTotal();
        if (!total) { $status.textContent = 'Không đọc được tổng số (hoặc 0)'; }

        $status.textContent = 'Đang tải toàn bộ...';
        setProgress(0);
        $btnAll.disabled = true;
        cancelToken.cancel = false;

        const out = [];
        let offset = 0;
        while (true) {
          if (cancelToken.cancel) { $status.textContent = 'Đã hủy'; break; }
          const { data, error } = await sb
            .from(TABLE_NAME)
            .select('masp,tensp')
            .order('masp', { ascending: true })
            .range(offset, offset + PAGE_SIZE - 1);
          if (error) { console.error(error); $status.textContent = 'Lỗi khi tải'; break; }

          const rows = (data || []).map(r => ({
            masp: norm(r.masp), tensp: norm(r.tensp),
            _MASP: up(r.masp), _TENSP: up(r.tensp)
          })).filter(r => r.masp);

          out.push(...rows);
          offset += rows.length;

          const pct = total ? Math.round(offset / total * 100) : Math.min(100, Math.round(out.length / PAGE_SIZE) * (PAGE_SIZE / (PAGE_SIZE * 1.0)));
          setProgress(pct);

          if (rows.length < PAGE_SIZE) break;
        }

        // unique theo MASP
        const seen = new Set();
        const uniq = [];
        for (const r of out) {
          if (seen.has(r._MASP)) continue;
          seen.add(r._MASP);
          uniq.push(r);
        }

        cache = uniq;
        saveCache(cache);
        $status.textContent = `Đã tải đủ: ${cache.length.toLocaleString('vi-VN')} mã`;
        $btnAll.disabled = false;
        setProgress(100);
      }

      async function ensureCatalog() {
        if (cache) return;
        const local = loadCache();
        if (local) {
          cache = local;
          $status.textContent = `Đã có cache: ${cache.length.toLocaleString('vi-VN')} mã`;
          setProgress(100);
          return;
        }
        // Nếu chưa bấm "Tải toàn bộ", vẫn có thể tìm bằng cách tải nhanh 1 trang đầu để gõ đỡ trống
        const sb = getSupabaseClient();
        const { data, error } = await sb.from(TABLE_NAME).select('masp,tensp').order('masp', { ascending: true }).range(0, PAGE_SIZE - 1);
        if (error) { console.error(error); cache = []; $status.textContent = 'Không thể nạp nhanh'; return; }
        cache = (data || []).map(r => ({ masp: norm(r.masp), tensp: norm(r.tensp), _MASP: up(r.masp), _TENSP: up(r.tensp) })).filter(r => r.masp);
        $status.textContent = `Đang dùng cache tạm: ${cache.length.toLocaleString('vi-VN')} mã (hãy bấm "Tải toàn bộ")`;
        setProgress(Math.min(100, Math.round((cache.length) / (await countTotal() || cache.length) * 100)));
      }

      function renderList(items) {
        $list.innerHTML = ''; activeIndex = -1;
        if (!items.length) { $list.hidden = true; return; }
        const frag = document.createDocumentFragment();
        items.forEach((it, idx) => {
          const div = document.createElement('div');
          div.className = 'typeahead-item';
          div.dataset.index = idx;
          div.innerHTML = `<b>${it.masp}</b>${it.tensp ? ` <small>— ${it.tensp}</small>` : ''}`;
          div.addEventListener('mousedown', (e) => { e.preventDefault(); chooseItem(idx); });
          frag.appendChild(div);
        });
        $list.appendChild(frag);
        $list.hidden = false;
      }
      function moveActive(delta) {
        if ($list.hidden || !filtered.length) return;
        activeIndex = (activeIndex + delta + filtered.length) % filtered.length;
        [...$list.children].forEach((el, i) => el.classList.toggle('active', i === activeIndex));
        const el = $list.children[activeIndex]; if (!el) return;
        const r = el.getBoundingClientRect(), lr = $list.getBoundingClientRect();
        if (r.bottom > lr.bottom) $list.scrollTop += (r.bottom - lr.bottom);
        else if (r.top < lr.top) $list.scrollTop -= (lr.top - r.top);
      }
      function hideList() { $list.hidden = true; activeIndex = -1; }
      function getHOT() { return window.hot || window.hotTable || window.HOT || null; }
      function jumpToExistingRow(m) { const hot = getHOT(); if (!hot) return false; const rows = hot.countRows(); for (let r = 0; r < rows; r++) { const v = up(hot.getDataAtCell(r, 0)); if (v === m) { hot.selectCell(r, 0); const cell = hot.getCell(r, 0); if (cell) { cell.style.transition = 'background .15s'; cell.style.background = '#fff2cc'; setTimeout(() => { cell.style.background = ''; }, 350); } return true; } } return false; }
      function insertToNextEmpty(m) { const hot = getHOT(); if (!hot) return; let target = -1; const rows = hot.countRows(); for (let r = 0; r < rows; r++) { const v = norm(hot.getDataAtCell(r, 0)); if (!v) { target = r; break; } } if (target === -1) { target = rows; hot.alter('insert_row', target, 1); } hot.setDataAtCell(target, 0, m); hot.selectCell(target, 1); }
      function chooseItem(idx) { const it = filtered[idx]; if (!it) return; const masp = up(it.masp); const exists = jumpToExistingRow(masp); if (!exists) insertToNextEmpty(masp); $input.value = ''; hideList(); setTimeout(() => $input.focus(), 10); }
      function doFilter(q) {
        const Q = up(q); if (!Q) { hideList(); return; }
        const starts = [], contains = [];
        for (const it of (cache || [])) {
          if (it._MASP.startsWith(Q) || it._TENSP.startsWith(Q)) starts.push(it);
          else if (it._MASP.includes(Q) || it._TENSP.includes(Q)) contains.push(it);
          if (starts.length >= MAX_SUGGESTIONS) break;
        }
        const arr = starts.concat(contains).slice(0, MAX_SUGGESTIONS);
        filtered = arr; renderList(arr);
      }

      document.addEventListener('click', (e) => { if (!e.target.closest('.typeahead-wrap')) hideList(); });
      $input.addEventListener('input', async () => { clearTimeout(debTimer); debTimer = setTimeout(async () => { await ensureCatalog(); doFilter($input.value); }, DEBOUNCE_MS); });
      $input.addEventListener('keydown', (e) => {
        if ($list.hidden) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); moveActive(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); }
        else if (e.key === 'Enter') { if (activeIndex >= 0) { e.preventDefault(); chooseItem(activeIndex); } }
        else if (e.key === 'Escape') { hideList(); }
      });

      // Buttons
      $btnAll.addEventListener('click', async () => { cancelToken.cancel = false; await loadFullCatalog(); });
      $btnClear.addEventListener('click', () => {
        localStorage.removeItem(CACHE_KEY);
        cache = null; setProgress(0); $status.textContent = 'Đã xóa cache';
      });

      // Autopreload nhẹ
      ensureCatalog();
    })();

    // Nghiệp vụ
    async function kiemTraViTri() {
      window.editableMASP = false; window.editableVITRI = false; hot.updateSettings({ cells: hot.getSettings().cells });
      let allRows = hot.getSourceData();
      let uniqueMasps = [], uniqueRows = [], seen = {};
      for (let row of allRows) {
        let masp = (row.masp || "").toString().trim().toUpperCase();
        if (masp && !seen[masp]) { seen[masp] = true; uniqueMasps.push(masp); uniqueRows.push({ masp, vitrikho1: null, trangthai: null }); }
      }
      if (uniqueMasps.length === 0) { alert("Nhập mã sản phẩm để kiểm tra!"); return; }
      hot.loadData(uniqueRows);
      const sb = getSupabaseClient();
      const { data: found, error } = await sb.from(TABLE_NAME).select('masp,vitrikho1').in('masp', uniqueMasps);
      if (error) return alert('Lỗi kết nối Supabase!');
      const maspMap = {}; (found || []).forEach(row => { maspMap[row.masp.toUpperCase()] = row.vitrikho1; });
      hot.batch(() => {
        for (let r = 0; r < hot.countRows(); r++) {
          const masp = (hot.getDataAtCell(r, 0) || "").toString().trim().toUpperCase();
          hot.setDataAtCell(r, 0, masp);
          if (!masp) { hot.setDataAtCell(r, 1, null); hot.setDataAtCell(r, 2, null); continue; }
          if (typeof maspMap[masp] === "undefined") { hot.setDataAtCell(r, 1, null); hot.setDataAtCell(r, 2, "MÃ KHÔNG TỒN TẠI"); }
          else if (maspMap[masp]) { hot.setDataAtCell(r, 1, maspMap[masp]); hot.setDataAtCell(r, 2, "BỎ QUA"); }
          else { hot.setDataAtCell(r, 1, null); hot.setDataAtCell(r, 2, "CHƯA CÓ VỊ TRÍ"); }
        }
      });
      document.getElementById('preview').innerHTML = `<span>✅ Đã kiểm tra, báo rõ mã không tồn tại, chưa có vị trí hoặc đã có vị trí.</span>`;
      hot.updateSettings({ cells: hot.getSettings().cells });
    }

    function xoaDaCoViTri() {
      let tableData = hot.getSourceData();
      tableData = tableData.filter(row => row.masp && row.trangthai !== "BỎ QUA");
      if (tableData.length === 0) tableData.push({ masp: null, vitrikho1: null, trangthai: null });
      hot.loadData(tableData);
      window.editableMASP = true; window.editableVITRI = true; hot.updateSettings({ cells: hot.getSettings().cells });
      document.getElementById('preview').innerHTML = `<span>👉 Nhập <b>vị trí kho</b> cho sản phẩm chưa có vị trí, có thể nhập thêm mã mới nếu cần.</span>`;
    }

    async function luuDuLieu() {
      let rows = hot.getSourceData().filter(r => r.masp && r.vitrikho1 && r.trangthai === "CHƯA CÓ VỊ TRÍ");
      if (rows.length === 0) return alert("Không có dữ liệu hợp lệ để ghi.");
      if (!confirm(`Bạn chắc chắn muốn lưu ${rows.length} vị trí mới vào kho?`)) return;
      const sb = getSupabaseClient();
      let success = 0, fail = 0, errorMsg = [];
      for (let idx = 0; idx < rows.length; idx++) {
        let row = rows[idx];
        const { data, error } = await sb.from(TABLE_NAME)
          .update({ vitrikho1: row.vitrikho1 })
          .eq('masp', row.masp.toString().trim().toUpperCase())
          .is('vitrikho1', null).select();
        if (!error && data && data.length === 1) { hot.setDataAtCell(idx, 2, "OK"); success++; }
        else { hot.setDataAtCell(idx, 2, "LỖI"); fail++; let reason = error?.message || 'Không có dòng nào được cập nhật (mã không tồn tại hoặc đã có vị trí)'; errorMsg.push(`Dòng ${idx + 1} (${row.masp}): ${reason}`); }
      }
      let html = `<span>✅ Đã lưu xong: <b style="color:#e53935">${success} OK</b> &nbsp; <b style="color:orange">${fail} lỗi</b></span>`;
      if (fail) html += `<br><details><summary>Xem chi tiết lỗi</summary><div style="color:orange;text-align:left">${errorMsg.join('<br>')}</div></details>`;
      document.getElementById('preview').innerHTML = html;
      window.editableMASP = false; window.editableVITRI = false; hot.updateSettings({ cells: hot.getSettings().cells });
    }
  </script>
