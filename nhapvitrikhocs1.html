  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f7fafc;

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h2 {
      margin: 18px 0 8px 0;
      font-size: 1.25rem;
      text-align: center;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin: 6px 0 10px 0;
    }

    .main-btn {
      padding: 8px 12px;
      border-radius: 12px;
      border: none;
      color: #fff;
      cursor: pointer;
      background: #2f80ed;
    }

    #hot {
      width: 99vw;
      max-width: 520px;
      margin: 8px auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 18px rgba(0, 0, 0, .06);
    }

    .typeahead-wrap {
      position: relative;
      display: inline-block;
      min-width: 280px;
    }

    .typeahead-wrap input {
      width: 100%;
      height: 38px;
      border-radius: 8px;
      border: 1px solid #cfd7e6;
      padding: 0 10px;
    }

    .typeahead-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #d8e0ee;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .08);
      max-height: 300px;
      overflow: auto;
      z-index: 1000;
    }

    .typeahead-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #f3f6fb;
      line-height: 1.2
    }

    .typeahead-item:last-child {
      border-bottom: none
    }

    .typeahead-item.active {
      background: #eaf2ff
    }

    .diag {
      font-size: 12px;
      color: #465;
      margin-top: 6px
    }

    .progress {
      width: 200px;
      height: 6px;
      background: #eef3ff;
      border-radius: 999px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-left: 6px;
    }

    .progress>span {
      display: block;
      height: 100%;
      width: 0;
      background: #5b8cff;
      transition: width .2s;
    }

    .status {
      font-size: 12px;
      margin-left: 6px;
      color: #345
    }

    .trangthai-ok {
      color: #e53935 !important;
    }

    .trangthai-boqua {
      color: #039be5 !important;
    }

    .trangthai-loi {
      color: orange !important;
    }

    .trangthai-khongtontai {
      color: #e53935 !important;
    }

    .trangthai-chuacovitri {
      color: #e67e22 !important;
    }
  </style>

      });
    });

<body>
  <h2>🏷️ NHẬP VỊ TRÍ KHO CS1</h2>

  <div class="toolbar">
    <button class="main-btn" onclick="resetTable()">🔁 Làm lại</button>
    <button class="main-btn" onclick="kiemTraViTri()">🔍 Kiểm tra vị trí kho</button>
    <button class="main-btn" onclick="xoaDaCoViTri()">🧹 Xóa sản phẩm đã có vị trí</button>
    <button class="main-btn" onclick="luuDuLieu()">💾 Lưu dữ liệu</button>
  </div>

  <div class="typeahead-wrap">
    <input id="maspSearch" type="text" placeholder="Nhập mã/tên sản phẩm để tìm..." autocomplete="off" />
    <div id="maspSuggest" class="typeahead-list" hidden></div>
    <div class="diag">
      <span>Đã nạp: <b id="countLoaded">0</b> / <span id="countTotal">…</span> mã</span>
      <span class="progress"><span id="progressBar"></span></span>
      <span class="status" id="statusText">Chờ nhập để bắt đầu nạp toàn bộ…</span>
    </div>
  </div>

  <div id="preview"></div>
  <div id="hot"></div>

  <script>
    // ===== Supabase =====
    const SUPABASE_URL = 'https://rddjrmbyftlcvrgzlyby.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZGpybWJ5ZnRsY3ZyZ3pseWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3NjU4MDQsImV4cCI6MjA2MjM0MTgwNH0.-0xtqxn6b9OBz4unTTvJ4klxizWhHa1iSuYGm7cOYTM';
    const TABLE_NAME = 'dmhanghoa';
    function getSupabaseClient() {
      const token = localStorage.getItem('supabase_access_token');
      return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, token ? { global: { headers: { Authorization: `Bearer ${token}` } } } : {});
    }

    // ===== HOT =====
    let hot;
    let colHeaders = ['Mã sản phẩm', 'Vị trí kho cs1', 'Trạng thái'];
    let columns = [
      { data: 'masp', type: 'text', width: 150 },
      { data: 'vitrikho1', type: 'text', width: 150, readOnly: true },
      { data: 'trangthai', type: 'text', width: 110, readOnly: true }
    ];
    function initTable() {
      const container = document.getElementById('hot');
      if (hot) hot.destroy();
      hot = new Handsontable(container, {
        data: Array.from({ length: 30 }, () => ({ masp: null, vitrikho1: null, trangthai: null })),
        columns, colHeaders, rowHeaders: true, minSpareRows: 1,
        width: '100%', height: 420, stretchH: 'all', manualColumnResize: true,
        licenseKey: 'non-commercial-and-evaluation',
        cells: function (row, col) {
          const cellProperties = {};
          if (col === 0 && window.editableMASP) cellProperties.readOnly = false;
          if (col === 1 && window.editableVITRI) cellProperties.readOnly = false;
          if (col === 2) cellProperties.readOnly = true;
          if (col === 2) {
            const val = this.instance.getDataAtCell(row, col);
            if (val === "OK") cellProperties.className = "trangthai-ok";
            if (val === "BỎ QUA") cellProperties.className = "trangthai-boqua";
            if (val === "LỖI") cellProperties.className = "trangthai-loi";
            if (val === "MÃ KHÔNG TỒN TẠI") cellProperties.className = "trangthai-khongtontai";
            if (val === "CHƯA CÓ VỊ TRÍ") cellProperties.className = "trangthai-chuacovitri";
          }
          return cellProperties;
        }
      });
      window.hot = hot;
      window.editableMASP = true;
      window.editableVITRI = false;
    }
    initTable();

    // ===== Autocomplete + Nạp toàn bộ (paginated, tự động sau khi gõ) =====
    (() => {
      const PAGE_SIZE = 5000;           // tải 5000 mã mỗi trang (đổi 10.000 nếu bạn muốn)
      const MAX_SUGGESTIONS = 50;       // số dòng hiển thị trong dropdown
      const $input = document.getElementById('maspSearch');
      const $list = document.getElementById('maspSuggest');
      const $loaded = document.getElementById('countLoaded');
      const $total = document.getElementById('countTotal');
      const $bar = document.getElementById('progressBar');
      const $status = document.getElementById('statusText');

      // state catalog
      let catalog = [];                 // [{masp,tensp,_MASP,_TENSP}]
      let loadedCount = 0;
      let totalCount = 0;
      let nextOffset = 0;
      let allDone = false;
      let loading = false;
      let started = false;              // bắt đầu nạp sau lần gõ đầu tiên
      let activeIndex = -1;
      let filtered = [];

      const sb = getSupabaseClient();

      function norm(s) { return (s || '').toString().trim(); }
      function up(s) { return norm(s).toUpperCase(); }

      async function fetchTotal() {
        try {
          const { count } = await sb.from(TABLE_NAME).select('masp', { count: 'exact', head: true });
          return count || 0;
        } catch (e) { return 0; }
      }

      function updateUI() {
        $loaded.textContent = loadedCount.toLocaleString('vi-VN');
        $total.textContent = (totalCount || '…');
        const pct = totalCount ? Math.round((loadedCount / totalCount) * 100) : 0;
        $bar.style.width = pct + '%';
        $status.textContent = allDone ? 'Đã nạp đủ danh mục theo quyền' :
          loading ? 'Đang nạp thêm…' :
            started ? 'Đang nạp (nhập để tiếp tục lọc)…' :
              'Chờ nhập để bắt đầu nạp toàn bộ…';
      }

      async function loadNextPage() {
        if (loading || allDone) return;
        loading = true; updateUI();
        try {
          const { data, error } = await sb
            .from(TABLE_NAME)
            .select('masp,tensp')
            .order('masp', { ascending: true })
            .range(nextOffset, nextOffset + PAGE_SIZE - 1);
          if (error) throw error;
          const rows = (data || []).map(r => ({
            masp: norm(r.masp),
            tensp: norm(r.tensp),
            _MASP: up(r.masp),
            _TENSP: up(r.tensp)
          })).filter(r => r.masp);

          // unique theo _MASP
          const seen = new Set(catalog.map(x => x._MASP));
          for (const r of rows) if (!seen.has(r._MASP)) { catalog.push(r); seen.add(r._MASP); }

          nextOffset += rows.length;
          loadedCount = catalog.length;
          if (rows.length < PAGE_SIZE) allDone = true;
        } finally {
          loading = false; updateUI();
        }
      }

      async function ensureStarted() {
        if (started) return;
        started = true;
        totalCount = await fetchTotal();
        updateUI();
        // bắt đầu nạp trang đầu, sau đó tự nạp nền các trang tiếp
        await loadNextPage();
        // nạp nền liên tục cho đến khi đủ (không chặn gõ/lọc)
        (async function backgroundFill() {
          while (!allDone) {
            await loadNextPage();
            // sau mỗi trang, nếu người dùng đang gõ, re-filter để “bổ sung” kết quả mới
            if ($input.value.trim()) {
              doFilter($input.value);
            }
            // nhỏ delay để không dồn API quá gắt
            await new Promise(r => setTimeout(r, 60));
          }
        })();
      }

      function renderList(items) {
        $list.innerHTML = ''; activeIndex = -1;
        if (!items.length) { $list.hidden = true; return; }
        const frag = document.createDocumentFragment();
        items.forEach((it, idx) => {
          const div = document.createElement('div');
          div.className = 'typeahead-item';
          div.dataset.index = idx;
          div.innerHTML = `<b>${it.masp}</b>${it.tensp ? ` — <small>${it.tensp}</small>` : ''}`;
          div.addEventListener('mousedown', (e) => { e.preventDefault(); chooseItem(idx); });
          frag.appendChild(div);
        });
        $list.appendChild(frag);
        $list.hidden = false;
      }

      function doFilter(q) {
        const Q = up(q);
        if (!Q) { $list.hidden = true; return; }
        const starts = [], contains = [];
        for (const it of catalog) {
          if (it._MASP.startsWith(Q) || it._TENSP.startsWith(Q)) starts.push(it);
          else if (it._MASP.includes(Q) || it._TENSP.includes(Q)) contains.push(it);
          if (starts.length >= MAX_SUGGESTIONS) break;
        }
        filtered = starts.concat(contains).slice(0, MAX_SUGGESTIONS);
        renderList(filtered);
      }

      function moveActive(delta) {
        if ($list.hidden || !filtered.length) return;
        activeIndex = (activeIndex + delta + filtered.length) % filtered.length;
        [...$list.children].forEach((el, i) => el.classList.toggle('active', i === activeIndex));
        const el = $list.children[activeIndex]; if (!el) return;
        const r = el.getBoundingClientRect(), lr = $list.getBoundingClientRect();
        if (r.bottom > lr.bottom) $list.scrollTop += (r.bottom - lr.bottom);
        else if (r.top < lr.top) $list.scrollTop -= (lr.top - r.top);
      }

      function getHOT() { return window.hot || window.hotTable || window.HOT || null; }
      function jumpToExistingRow(m) { const hot = getHOT(); if (!hot) return false; const rows = hot.countRows(); for (let r = 0; r < rows; r++) { const v = up(hot.getDataAtCell(r, 0)); if (v === m) { hot.selectCell(r, 0); const cell = hot.getCell(r, 0); if (cell) { cell.style.transition = 'background .15s'; cell.style.background = '#fff2cc'; setTimeout(() => { cell.style.background = ''; }, 350); } return true; } } return false; }
      function insertToNextEmpty(m) { const hot = getHOT(); if (!hot) return; let target = -1; const rows = hot.countRows(); for (let r = 0; r < rows; r++) { const v = norm(hot.getDataAtCell(r, 0)); if (!v) { target = r; break; } } if (target === -1) { target = rows; hot.alter('insert_row', target, 1); } hot.setDataAtCell(target, 0, m); hot.selectCell(target, 1); }
      function chooseItem(idx) { const it = filtered[idx]; if (!it) return; const masp = up(it.masp); const exists = jumpToExistingRow(masp); if (!exists) insertToNextEmpty(masp); $input.value = ''; $list.hidden = true; setTimeout(() => $input.focus(), 10); }

      // Events
      let debTimer = null;
      function debounce(fn, ms = 120) { clearTimeout(debTimer); debTimer = setTimeout(fn, ms); }
      $input.addEventListener('input', () => { ensureStarted(); debounce(() => doFilter($input.value), 80); });
      $input.addEventListener('focus', () => { ensureStarted(); if ($input.value) doFilter($input.value); });

      document.addEventListener('click', (e) => { if (!e.target.closest('.typeahead-wrap')) { $list.hidden = true; } });
      $input.addEventListener('keydown', (e) => {
        if ($list.hidden) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); moveActive(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); }
        else if (e.key === 'Escape') { $list.hidden = true; }
        else if (e.key === 'Enter' && activeIndex >= 0) { e.preventDefault(); chooseItem(activeIndex); }
      });
    })();

    // ===== Business logic: kiểm tra / lưu =====
    async function kiemTraViTri() {
      window.editableMASP = false; window.editableVITRI = false; hot.updateSettings({ cells: hot.getSettings().cells });
      let allRows = hot.getSourceData();
      let uniqueMasps = [], uniqueRows = [], seen = {};
      for (let row of allRows) {
        let masp = (row.masp || "").toString().trim().toUpperCase();
        if (masp && !seen[masp]) { seen[masp] = true; uniqueMasps.push(masp); uniqueRows.push({ masp, vitrikho1: null, trangthai: null }); }
      }
      if (uniqueMasps.length === 0) { alert("Nhập mã sản phẩm để kiểm tra!"); return; }
      hot.loadData(uniqueRows);
      const sb = getSupabaseClient();
      const { data: found, error } = await sb.from(TABLE_NAME).select('masp,vitrikho1').in('masp', uniqueMasps);
      if (error) return alert('Lỗi kết nối Supabase!');
      const maspMap = {}; (found || []).forEach(row => { maspMap[row.masp.toUpperCase()] = row.vitrikho1; });
      hot.batch(() => {
        for (let r = 0; r < hot.countRows(); r++) {
          const masp = (hot.getDataAtCell(r, 0) || "").toString().trim().toUpperCase();
          hot.setDataAtCell(r, 0, masp);
          if (!masp) { hot.setDataAtCell(r, 1, null); hot.setDataAtCell(r, 2, null); continue; }
          if (typeof maspMap[masp] === "undefined") { hot.setDataAtCell(r, 1, null); hot.setDataAtCell(r, 2, "MÃ KHÔNG TỒN TẠI"); }
          else if (maspMap[masp]) { hot.setDataAtCell(r, 1, maspMap[masp]); hot.setDataAtCell(r, 2, "BỎ QUA"); }
          else { hot.setDataAtCell(r, 1, null); hot.setDataAtCell(r, 2, "CHƯA CÓ VỊ TRÍ"); }
        }
      });
      document.getElementById('preview').innerHTML = `<span>✅ Đã kiểm tra xong.</span>`;
      hot.updateSettings({ cells: hot.getSettings().cells });
    }

    function xoaDaCoViTri() {
      let tableData = hot.getSourceData();
      tableData = tableData.filter(row => row.masp && row.trangthai !== "BỎ QUA");
      if (tableData.length === 0) tableData.push({ masp: null, vitrikho1: null, trangthai: null });
      hot.loadData(tableData);
      window.editableMASP = true; window.editableVITRI = true; hot.updateSettings({ cells: hot.getSettings().cells });
      document.getElementById('preview').innerHTML = `<span>👉 Nhập <b>vị trí kho</b> cho sản phẩm chưa có vị trí.</span>`;
    }

    async function luuDuLieu() {
      let rows = hot.getSourceData().filter(r => r.masp && r.vitrikho1 && r.trangthai === "CHƯA CÓ VỊ TRÍ");
      if (rows.length === 0) return alert("Không có dữ liệu hợp lệ để ghi.");
      if (!confirm(`Bạn chắc chắn muốn lưu ${rows.length} vị trí mới vào kho?`)) return;
      const sb = getSupabaseClient();
      let success = 0, fail = 0, errorMsg = [];
      for (let idx = 0; idx < rows.length; idx++) {
        let row = rows[idx];
        const { data, error } = await sb.from(TABLE_NAME)
          .update({ vitrikho1: row.vitrikho1 })
          .eq('masp', row.masp.toString().trim().toUpperCase())
          .is('vitrikho1', null)
          .select();
        if (!error && data && data.length === 1) { hot.setDataAtCell(idx, 2, "OK"); success++; }
        else { hot.setDataAtCell(idx, 2, "LỖI"); fail++; let reason = error?.message || 'Không có dòng nào được cập nhật (mã không tồn tại hoặc đã có vị trí)'; errorMsg.push(`Dòng ${idx + 1} (${row.masp}): ${reason}`); }
      }
      let html = `<span>✅ Đã lưu xong: <b style="color:#e53935">${success} OK</b> &nbsp; <b style="color:orange">${fail} lỗi</b></span>`;
      if (fail) html += `<br><details><summary>Xem chi tiết lỗi</summary><div style="color:orange;text-align:left">${errorMsg.join('<br>')}</div></details>`;
      document.getElementById('preview').innerHTML = html;
      window.editableMASP = false; window.editableVITRI = false; hot.updateSettings({ cells: hot.getSettings().cells });
    }
  </script>
