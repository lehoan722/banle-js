<body>

  <script>
    // ===== Supabase config =====
    const SUPABASE_URL = 'https://rddjrmbyftlcvrgzlyby.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZGpybWJ5ZnRsY3ZyZ3pseWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3NjU4MDQsImV4cCI6MjA2MjM0MTgwNH0.-0xtqxn6b9OBz4unTTvJ4klxizWhHa1iSuYGm7cOYTM';
    const TABLE_NAME = 'dmhanghoa';

    function getSupabaseClient() {
      const token = localStorage.getItem('supabase_access_token');
      return window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        token ? { global: { headers: { Authorization: `Bearer ${token}` } } } : {}
      );
    }

    // ===== HOT table =====
    let hot;
    let colHeaders = ['Mã sản phẩm', 'Vị trí kho cs1', 'Trạng thái'];
    let columns = [
      { data: 'masp', type: 'text', width: 150 },
      { data: 'vitrikho1', type: 'text', width: 150, readOnly: true },
      { data: 'trangthai', type: 'text', width: 110, readOnly: true }
    ];

    function initTable() {
      const container = document.getElementById('hot');
      if (hot) hot.destroy();
      hot = new Handsontable(container, {
        data: Array.from({ length: 30 }, () => ({ masp: null, vitrikho1: null, trangthai: null })),
        columns,
        colHeaders,
        rowHeaders: true,
        minSpareRows: 1,
        width: '100%',
        height: 420,
        stretchH: 'all',
        manualColumnResize: true,
        licenseKey: 'non-commercial-and-evaluation',
        cells: function (row, col) {
          const cellProperties = {};
          if (col === 0 && window.editableMASP) cellProperties.readOnly = false;
          if (col === 1 && window.editableVITRI) cellProperties.readOnly = false;
          if (col === 2) cellProperties.readOnly = true;
          if (col === 2) {
            const val = this.instance.getDataAtCell(row, col);
            if (val === "OK") cellProperties.className = "trangthai-ok";
            if (val === "BỎ QUA") cellProperties.className = "trangthai-boqua";
            if (val === "LỖI") cellProperties.className = "trangthai-loi";
            if (val === "MÃ KHÔNG TỒN TẠI") cellProperties.className = "trangthai-khongtontai";
            if (val === "CHƯA CÓ VỊ TRÍ") cellProperties.className = "trangthai-chuacovitri";
          }
          return cellProperties;
        }
      });
      window.hot = hot;
      window.editableMASP = true;
      window.editableVITRI = false;
    }
    initTable();

    // ===== Auto-import from localStorage (F8 flow) =====
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const raw = localStorage.getItem('VITRIKHO_IMPORT');
        if (!raw) return;
        const payload = JSON.parse(raw);
        if (payload?.cs && payload.cs.toLowerCase() !== 'cs1') return;

        const list = Array.isArray(payload?.list) ? payload.list : [];
        if (!list.length) return;

        const uniq = Array.from(new Set(
          list.map(s => (s || '').toString().trim().toUpperCase()).filter(Boolean)
        ));
        const rows = uniq.map(masp => ({ masp, vitrikho1: null, trangthai: null }));
        hot.loadData(rows);
        localStorage.removeItem('VITRIKHO_IMPORT');
        setTimeout(() => kiemTraViTri(), 0);
      } catch (err) { console.error('VITRIKHO_IMPORT parse error:', err); }
    });

    // ===== Login =====
    document.getElementById('login-submit').onclick = async function () {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const sb = getSupabaseClient();
      document.getElementById('login-status').textContent = 'Đang đăng nhập...';
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('login-status').textContent = 'Sai tài khoản hoặc mật khẩu!';
      } else {
        document.getElementById('login-status').textContent = 'Đăng nhập thành công!';
        localStorage.setItem('supabase_access_token', data.session.access_token);
        setTimeout(() => window.location.reload(), 1000);
      }
    };

    function resetTable() {
      window.editableMASP = true;
      window.editableVITRI = false;
      initTable();
      document.getElementById('preview').innerHTML = "";
    }

    // ===== Fetch from Google Sheet to HOT =====
    (() => {
      const SHEET_ID = '1JI3BMl8jsc__bCTH_HA-6uNWtReBy0zpDMGkqsX1JpA';
      const SHEET_TAB = 'ghivitrikhocs1';
      const HOT_COL_MASP = 0;
      const MAKE_UPPERCASE = true;
      const DEDUP = false;
      const CLEAR_BEFORE_INSERT = true;
      const $btn = document.getElementById('btnFetchSheet');

      function getHOT() { return window.hot || window.hotTable || window.HOT || null; }

      function parseGvizJson(txt) {
        const start = txt.indexOf('(');
        const end = txt.lastIndexOf(')');
        if (start === -1 || end === -1) return [];
        const payload = JSON.parse(txt.slice(start + 1, end));
        const rows = payload?.table?.rows || [];
        const out = [];
        for (const r of rows) {
          const v = r?.c?.[0]?.v;
          if (v != null) out.push(String(v));
        }
        return out;
      }

      async function fetchMaspsFromGoogleSheet() {
        const urlJSON = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_TAB)}&range=A:A&headers=0`;
        const resp = await fetch(urlJSON, { cache: 'no-store' });
        if (!resp.ok) throw new Error(`Fetch Google Sheet lỗi: HTTP ${resp.status}`);
        const text = await resp.text();
        let arr = parseGvizJson(text);
        arr = arr.map(s => (s ?? '').toString().trim()).filter(s => s.length > 0);
        if (MAKE_UPPERCASE) arr = arr.map(s => s.toUpperCase());
        if (DEDUP) { const set = new Set(); const tmp = []; for (const v of arr) { if (!set.has(v)) { set.add(v); tmp.push(v); } } arr = tmp; }
        return arr;
      }

      function loadMaspsIntoHOT(masps) {
        const hot = getHOT();
        if (!hot) { alert('Không tìm thấy bảng dữ liệu (Handsontable).'); return; }
        if (CLEAR_BEFORE_INSERT) {
          const old = hot.countRows();
          if (old > 0) hot.alter('remove_row', 0, old);
        }
        if (masps.length > 0) {
          hot.alter('insert_row', 0, masps.length);
          const ops = [];
          for (let i = 0; i < masps.length; i++) ops.push([i, HOT_COL_MASP, masps[i]]);
          hot.setDataAtCell(ops); hot.render();
        }
        const msg = `Đã nạp ${masps.length} mã từ Google Sheet (${SHEET_TAB}).`;
        console.log(msg); alert(msg);
      }

      async function handleFetchClick() {
        try {
          $btn.disabled = true; $btn.textContent = 'Đang lấy...';
          const masps = await fetchMaspsFromGoogleSheet();
          loadMaspsIntoHOT(masps);
        } catch (err) {
          console.error(err);
          alert('Không lấy được dữ liệu từ Google Sheet. Kiểm tra quyền chia sẻ & tên sheet.');
        } finally { $btn.disabled = false; $btn.textContent = '📥 Lấy dữ liệu'; }
      }

      if ($btn) $btn.addEventListener('click', handleFetchClick);
    })();

    // ===== Realtime Autocomplete (adapter) with infinite scroll =====
    (function(){
      function resolveSupabase(){
        if (window.supabase) return window.supabase;
        if (typeof window.getSupabaseClient === 'function') return window.getSupabaseClient();
        throw new Error('Không tìm thấy Supabase client.');
      }
      function htmlEscape(s=''){ return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',\"'\":'&#039;'}[m])); }

      function initAutocompleteRealtimeMaspX({ input, popup, minLen = 2, pageSize = 100 }){
        const sbClient = resolveSupabase();
        const sb = (typeof sbClient.createClient === 'function') ? getSupabaseClient() : sbClient; // đảm bảo có auth header
        const $input = (typeof input === 'string') ? document.querySelector(input) : input;
        const $popup = (typeof popup === 'string') ? document.querySelector(popup) : popup;
        if (!$input || !$popup) return;

        const parent = $input.parentElement;
        if (parent && getComputedStyle(parent).position === 'static') parent.style.position = 'relative';

        let lastKeyword = '';
        let ticket = 0;
        let cursor = -1;
        let suppressBlur = false;
        let loading = false;
        let done = false;
        let offset = 0;
        let dataList = [];

        function hide(){ $popup.style.display='none'; }
        function show(){ $popup.style.display='block'; $popup.style.left='0'; $popup.style.top='100%'; $popup.style.zIndex=10000; }
        function isVisible(){ return $popup.style.display !== 'none'; }

        function render(){
          $popup.innerHTML = dataList.map(sp => `
            <div class="goi-y-item" data-masp="${htmlEscape(sp.masp)}">
              <b>${htmlEscape(sp.masp)}</b> - ${htmlEscape(sp.tensp||'')}
            </div>
          `).join('');
          if (dataList.length) show(); else hide();
          cursor = -1;
        }

        function appendAndRender(newRows){
          const existed = new Set(dataList.map(x => x.masp));
          for (const r of newRows) if (!existed.has(r.masp)) dataList.push(r);
          render();
        }

        function highlight(i){
          const items = $popup.querySelectorAll('.goi-y-item');
          items.forEach((el, idx) => el.style.background = (idx===i) ? '#e9f3ff' : '');
        }

        function choose(masp){
          $input.value = masp;
          hide();
          if (typeof window.xuLyKhiChonMaSanPham === 'function') {
            window.xuLyKhiChonMaSanPham(masp);
          } else {
            $input.dispatchEvent(new KeyboardEvent('keydown', { key:'Enter', bubbles:true }));
          }
        }

        async function fetchPage(keyword){
          const t = ++ticket;
          loading = true;
          try {
            const Q = (keyword||'').toUpperCase();
            const { data, error } = await sb
              .from('dmhanghoa')
              .select('masp,tensp')
              .or(`masp.ilike.%${Q}%,tensp.ilike.%${Q}%`)
              .order('masp', { ascending: true })
              .range(offset, offset + pageSize - 1);
            if (t !== ticket) return [];
            if (error) throw error;
            const rows = (data||[]).map(r => ({
              masp: (r.masp||'').trim(),
              tensp: (r.tensp||'').trim(),
            })).filter(r => r.masp);
            if (rows.length < pageSize) done = true;
            offset += rows.length;
            return rows;
          } finally { loading = false; }
        }

        let debTimer = null;
        function debounce(fn, ms=120){ clearTimeout(debTimer); debTimer = setTimeout(fn, ms); }

        async function doSearch(){
          const keyword = ($input.value||'').trim();
          if (!keyword || keyword.length < minLen) { hide(); return; }
          if (keyword !== lastKeyword){
            lastKeyword = keyword; done = false; offset = 0; dataList = []; $popup.scrollTop = 0;
          }
          if (done || loading) { render(); return; }
          const rows = await fetchPage(keyword);
          if (rows.length === 0 && dataList.length === 0){ hide(); return; }
          appendAndRender(rows);
        }

        $input.addEventListener('input', () => debounce(doSearch, 140));
        $input.addEventListener('focus',  () => debounce(doSearch, 0));

        $popup.addEventListener('scroll', () => {
          const nearBottom = $popup.scrollTop + $popup.clientHeight >= $popup.scrollHeight - 24;
          if (nearBottom && !loading && !done && lastKeyword.length >= minLen) doSearch();
        });

        $input.addEventListener('blur', () => { setTimeout(()=>{ if (!suppressBlur && !($popup.contains(document.activeElement))) hide(); }, 0); });
        $popup.addEventListener('pointerdown', () => { suppressBlur = true; });
        document.addEventListener('pointerup', () => { setTimeout(()=>{ suppressBlur = false; }, 0); });

        $popup.addEventListener('click', (e) => {
          const div = e.target.closest('.goi-y-item'); if (!div) return; choose(div.dataset.masp);
        });

        $input.addEventListener('keydown', (e) => {
          const items = $popup.querySelectorAll('.goi-y-item');
          const hasList = isVisible() && items.length > 0;
          if (hasList) {
            if (e.key === 'ArrowDown') { e.preventDefault(); cursor = (cursor+1) % items.length; highlight(cursor); return; }
            if (e.key === 'ArrowUp')   { e.preventDefault(); cursor = (cursor-1+items.length) % items.length; highlight(cursor); return; }
            if (e.key === 'Escape')    { hide(); return; }
            if (e.key === 'Enter') {
              if (cursor >= 0) { e.preventDefault(); choose(items[cursor].dataset.masp); return; }
              hide(); return;
            }
          } else if (e.key === 'Enter') { hide(); }
        });

        document.addEventListener('click', (e) => {
          if (e.target !== $input && !$popup.contains(e.target)) hide();
        });

        window.closePopupMasp = hide;
      }

      // Init
      initAutocompleteRealtimeMaspX({ input: '#maspSearch', popup: '#popup_masp', minLen: 2, pageSize: 100 });

      // Diagnostic: total count & check exact
      (async () => {
        const $total = document.getElementById('invDiagTotal');
        const $checkInput = document.getElementById('invDiagCheckInput');
        const $checkBtn = document.getElementById('invDiagCheckBtn');
        const $checkRes = document.getElementById('invDiagCheckResult');
        try {
          const sb = getSupabaseClient();
          const { count, error } = await sb.from('dmhanghoa').select('masp', { count: 'exact', head: true });
          if (!error) $total.textContent = (count ?? 0).toLocaleString('vi-VN'); else $total.textContent = 'Lỗi';
        } catch (e) { $total.textContent = 'Lỗi'; }
        $checkBtn.addEventListener('click', async () => {
          const code = ($checkInput.value||'').trim();
          if (!code) return;
          $checkRes.textContent = 'Đang kiểm tra…';
          try {
            const sb = getSupabaseClient();
            const { data, error } = await sb.from('dmhanghoa').select('masp,tensp').eq('masp', code).limit(1);
            if (error) throw error;
            if (data && data.length) $checkRes.textContent = `TÌM THẤY: ${data[0].masp} – ${data[0].tensp}`;
            else {
              const { data: near } = await sb.from('dmhanghoa').select('masp').ilike('masp', `%${code}%`).limit(5);
              if (near && near.length) $checkRes.textContent = 'Không thấy exact. Gần: ' + near.map(x=>x.masp).join(', ');
              else $checkRes.textContent = 'Không tìm thấy (có thể không tồn tại hoặc bị RLS).';
            }
          } catch (e) { console.error(e); $checkRes.textContent = 'Lỗi kiểm tra.'; }
        });
      })();
    })();

    // ===== Nghiệp vụ kiểm tra vị trí + lưu =====
    async function kiemTraViTri() {
      window.editableMASP = false;
      window.editableVITRI = false;
      hot.updateSettings({ cells: hot.getSettings().cells });

      let allRows = hot.getSourceData();
      let uniqueMasps = [];
      let uniqueRows = [];
      let seen = {};
      for (let row of allRows) {
        let masp = (row.masp || "").toString().trim().toUpperCase();
        if (masp && !seen[masp]) { seen[masp] = true; uniqueMasps.push(masp); uniqueRows.push({ masp, vitrikho1: null, trangthai: null }); }
      }
      if (uniqueMasps.length === 0) { alert("Nhập mã sản phẩm để kiểm tra!"); return; }

      hot.loadData(uniqueRows);

      const sb = getSupabaseClient();
      const { data: found, error } = await sb.from(TABLE_NAME).select('masp,vitrikho1').in('masp', uniqueMasps);
      if (error) return alert('Lỗi kết nối Supabase!');

      const maspMap = {};
      found.forEach(row => { maspMap[row.masp.toUpperCase()] = row.vitrikho1; });

      hot.batch(() => {
        for (let r = 0; r < hot.countRows(); r++) {
          const masp = (hot.getDataAtCell(r, 0) || "").toString().trim().toUpperCase();
          hot.setDataAtCell(r, 0, masp);
          if (!masp) { hot.setDataAtCell(r, 1, null); hot.setDataAtCell(r, 2, null); continue; }
          if (typeof maspMap[masp] === "undefined") {
            hot.setDataAtCell(r, 1, null); hot.setDataAtCell(r, 2, "MÃ KHÔNG TỒN TẠI");
          } else if (maspMap[masp]) {
            hot.setDataAtCell(r, 1, maspMap[masp]); hot.setDataAtCell(r, 2, "BỎ QUA");
          } else {
            hot.setDataAtCell(r, 1, null); hot.setDataAtCell(r, 2, "CHƯA CÓ VỊ TRÍ");
          }
        }
      });

      document.getElementById('preview').innerHTML = `<span>✅ Đã kiểm tra, báo rõ mã không tồn tại, chưa có vị trí hoặc đã có vị trí.</span>`;
      hot.updateSettings({ cells: hot.getSettings().cells });
    }

    function xoaDaCoViTri() {
      let tableData = hot.getSourceData();
      tableData = tableData.filter(row => row.masp && row.trangthai !== "BỎ QUA");
      if (tableData.length === 0) tableData.push({ masp: null, vitrikho1: null, trangthai: null });
      hot.loadData(tableData);
      window.editableMASP = true;
      window.editableVITRI = true;
      hot.updateSettings({ cells: hot.getSettings().cells });
      document.getElementById('preview').innerHTML = `<span>👉 Nhập <b>vị trí kho</b> cho sản phẩm chưa có vị trí, có thể nhập thêm mã mới nếu cần.</span>`;
    }

    async function luuDuLieu() {
      let rows = hot.getSourceData().filter(r => r.masp && r.vitrikho1 && r.trangthai === "CHƯA CÓ VỊ TRÍ");
      if (rows.length === 0) return alert("Không có dữ liệu hợp lệ để ghi.");
      if (!confirm(`Bạn chắc chắn muốn lưu ${rows.length} vị trí mới vào kho?`)) return;
      const sb = getSupabaseClient();
      let success = 0, fail = 0, errorMsg = [];
      for (let idx = 0; idx < rows.length; idx++) {
        let row = rows[idx];
        const { data, error } = await sb.from(TABLE_NAME)
          .update({ vitrikho1: row.vitrikho1 })
          .eq('masp', row.masp.toString().trim().toUpperCase())
          .is('vitrikho1', null)
          .select();
        if (!error && data && data.length === 1) {
          hot.setDataAtCell(idx, 2, "OK"); success++;
        } else {
          hot.setDataAtCell(idx, 2, "LỖI"); fail++;
          let reason = error?.message || 'Không có dòng nào được cập nhật (mã không tồn tại hoặc đã có vị trí)';
          errorMsg.push(`Dòng ${idx + 1} (${row.masp}): ${reason}`);
        }
      }
      let html = `<span>✅ Đã lưu xong: <b style="color:#e53935">${success} OK</b> &nbsp; <b style="color:orange">${fail} lỗi</b></span>`;
      if (fail) html += `<br><details><summary>Xem chi tiết lỗi</summary><div style="color:orange;text-align:left">${errorMsg.join('<br>')}</div></details>`;
      document.getElementById('preview').innerHTML = html;
      window.editableMASP = false;
      window.editableVITRI = false;
      hot.updateSettings({ cells: hot.getSettings().cells });
    }
  </script>
</body>
