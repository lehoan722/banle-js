<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sổ chi tiết tồn kho</title>
  <style>
    :root { --blue:#1976d2; --line:#d9dee7; --bg:#f5f7fb; --danger:#c62828; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:#1f2937; }
    #app-container { padding:14px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; box-shadow:0 1px 5px rgba(0,0,0,.05); }
    .toolbar { padding:12px; display:flex; flex-wrap:wrap; gap:9px; align-items:end; }
    label { font-size:13px; font-weight:700; color:#475569; }
    input,button { font:inherit; }
    input[type=date], input[type=text] { height:34px; border:1px solid #bfc7d4; border-radius:5px; padding:6px 9px; background:#fff; }
    #maspInput { width:210px; text-transform:uppercase; }
    .group { display:flex; align-items:end; gap:3px; }
    .btn { height:34px; border:0; border-radius:5px; padding:0 14px; cursor:pointer; font-weight:700; }
    .btn-main { background:#2196f3; color:#fff; }
    .btn-lite { background:#eef2f7; color:#334155; border:1px solid #cbd5e1; }
    .btn:disabled { opacity:.55; cursor:default; }
    #statusMsg { margin-left:auto; color:#64748b; font-size:13px; }
    #statusMsg.error { color:var(--danger); font-weight:700; }
    .titlebar { padding:10px 14px 2px; display:flex; gap:10px; align-items:baseline; }
    .titlebar h2 { margin:0; font-size:20px; color:#1d4ed8; }
    #maspTitle { color:#e11d48; font-weight:800; }
    .summary-wrap { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 14px 12px; }
    .summary { padding:9px 12px; border-radius:7px; background:#eef6ff; border:1px solid #cfe5ff; font-size:14px; }
    #closingBox { background:#effbf2; border-color:#ccebd4; }
    .table-card { margin-top:10px; overflow:auto; max-height:calc(100vh - 220px); }
    table { width:100%; border-collapse:separate; border-spacing:0; min-width:900px; background:#fff; }
    thead th { position:sticky; top:0; z-index:2; background:#eef3f9; color:#334155; border-bottom:1px solid #aeb8c6; border-right:1px solid #d6dde8; padding:8px 7px; font-size:13px; white-space:nowrap; }
    tbody td { border-bottom:1px solid #e4e8ef; border-right:1px solid #edf0f4; padding:7px 8px; font-size:13px; white-space:nowrap; }
    tbody tr:nth-child(even) td { background:#fbfcfe; }
    tbody tr:hover td { background:#fff6ce; }
    .center { text-align:center; }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    .strong { font-weight:800; }
    .inc { color:#08783e; font-weight:800; }
    .dec { color:#c62828; font-weight:800; }
    .transfer { color:#6d28d9; font-weight:800; }
    .neg { background:#ffe3e3 !important; color:#b00020; font-weight:800; }
    .invoice { color:#155bc2; cursor:pointer; text-decoration:underline; font-weight:600; }
    .empty { text-align:center; color:#64748b; padding:24px; }
    .popup-backdrop { display:none; position:fixed; inset:0; background:rgba(15,23,42,.28); z-index:5000; align-items:flex-start; justify-content:center; padding-top:90px; }
    .popup { width:min(650px,94vw); background:#fff; border-radius:9px; box-shadow:0 16px 45px rgba(0,0,0,.25); overflow:hidden; }
    .popup-head { display:flex; gap:6px; padding:10px; border-bottom:1px solid #e5e7eb; background:#f8fafc; }
    .popup-head input { flex:1; }
    #popupSearchList { max-height:420px; overflow:auto; }
    .product-row { display:flex; gap:14px; padding:9px 12px; border-bottom:1px solid #edf0f4; cursor:pointer; }
    .product-row:hover { background:#eaf4ff; }
    .product-row b { min-width:180px; color:#1d4ed8; }
    .product-row span { color:#475569; }
    .popup-info { padding:18px; color:#64748b; }
    @media(max-width:800px){ .summary-wrap{grid-template-columns:1fr;} #statusMsg{width:100%;margin-left:0;} }
  </style>
</head>
<body>
<div id="app-container" style="display:none;">
  <div class="card">
    <div class="titlebar">
      <h2>SỔ CHI TIẾT TỒN KHO</h2>
      <span id="maspTitle"></span>
    </div>

    <div class="toolbar">
      <label>Từ ngày<br><input type="date" id="tuNgay"></label>
      <label>Đến ngày<br><input type="date" id="denNgay"></label>
      <label>Mã sản phẩm<br>
        <span class="group">
          <input type="text" id="maspInput" placeholder="Nhập mã sản phẩm">
          <button class="btn btn-lite" onclick="openProductPopup()" title="Tìm sản phẩm">🔍</button>
          <button class="btn btn-lite" onclick="clearMasp()" title="Xóa mã">✕</button>
        </span>
      </label>
      <button id="btnView" class="btn btn-main" onclick="taiSoChiTietTonKho()">Xem báo cáo</button>
      <button class="btn btn-lite" onclick="copyTable()">Copy bảng</button>
      <span id="statusMsg"></span>
    </div>

    <div class="summary-wrap">
      <div id="openingBox" class="summary">TỒN ĐẦU KỲ &nbsp; CS1: <b>0</b> | CS2: <b>0</b> | Tổng: <b>0</b></div>
      <div id="closingBox" class="summary">TỒN CUỐI KỲ &nbsp; CS1: <b>0</b> | CS2: <b>0</b> | Tổng: <b>0</b></div>
    </div>
  </div>

  <div class="card table-card">
    <table>
      <thead>
        <tr>
          <th>STT</th>
          <th>Ngày giờ</th>
          <th>Hóa đơn</th>
          <th>Cơ sở</th>
          <th>+/- SL</th>
          <th>CS1</th>
          <th>CS2</th>
          <th>Tổng tồn</th>
          <th>Giá</th>
        </tr>
      </thead>
      <tbody id="reportBody">
        <tr><td colspan="9" class="empty">Nhập mã sản phẩm rồi bấm “Xem báo cáo”.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="productPopup" class="popup-backdrop">
  <div class="popup">
    <div class="popup-head">
      <input id="popupSearchInput" type="text" placeholder="Tìm theo mã hoặc tên sản phẩm...">
      <button class="btn btn-lite" onclick="closeProductPopup()">Đóng</button>
    </div>
    <div id="popupSearchList"></div>
  </div>
</div>

<script type="module" src="./scripts/sochitiettonkho.js"></script>
<script type="module">
  import { khoiTaoDangNhapDungChung } from './scripts/authModule.js';

  khoiTaoDangNhapDungChung({
    appContainerId: 'app-container',
    macDinhDiaDiem: '',
    tuDongKhoaCoSo: false,
    loginApiPath: '/api/login-cs1',

    async onLoginSuccess(nv) {
      // Admin luôn được xem. Nhân viên khác chỉ được xem nếu trang đã cấp trong nv_page.
      let ok = !!nv?.is_admin;
      if (!ok && nv?.manv) {
        try {
          const { data, error } = await window.supabase.rpc('get_pages_for_manv', { p_manv: nv.manv });
          if (!error) ok = (data || []).some(r => r.path === 'sochitiettonkho.html');
        } catch (e) {}
      }

      if (!ok) {
        const app = document.getElementById('app-container');
        app.style.display = '';
        app.innerHTML = '<h2 style="color:#b00020;padding:20px">⛔ Bạn không có quyền xem báo cáo này.</h2>';
        return false;
      }

      document.getElementById('app-container').style.display = '';
      window.initSoChiTietTonKho?.();
      return true;
    }
  });
</script>
</body>
</html>
