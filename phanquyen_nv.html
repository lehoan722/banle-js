<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <title>PHÂN QUYỀN NHÂN VIÊN</title>
  <meta name="viewport" content="width=600">
  <style>
    body {font-family: Arial, sans-serif; background:#f9f9fb; padding:30px;}
    h2 {margin-top:0;}
    table {border-collapse:collapse; width:100%; font-size:14px;}
    th,td {border:1px solid #ddd; padding:6px;}
    th {background:#e6eef8;}
    .center {text-align:center;}
    .container {max-width:750px; margin:0 auto;}

    /* overlay login */
    #login-container{
      position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
      justify-content:center; background:white; z-index:9999;
    }
    #login-box{
      width:330px; padding:20px; background:#f9f9f9; border-radius:10px;
      box-shadow:0 0 20px #ddd;
    }
    #login-box input{
      width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc;
    }
    #btnLogin{
      width:100%; padding:10px; border-radius:8px; background:#0b84ff; color:white;
      border:none; cursor:pointer;
    }
    #btnLogin:hover{opacity:.85;}
    #login-error{margin-top:8px; color:#c91616; min-height:22px;}
    #app{display:none;}
    .info{margin-bottom:20px; font-size:14px;}
    #who{color:#1164be;font-weight:bold;}
    .btn-save{
      padding:8px 18px; border:none;
      background:#159647; color:white;
      border-radius:8px; cursor:pointer;
      margin:20px 0;
    }
    .btn-save:hover{opacity:.85;}
    .disabled{background:#ccc !important;cursor:not-allowed;}
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login-container">
  <div id="login-box">
    <h2>Đăng nhập</h2>
    <form id="form-login">
      <input id="manvLogin" placeholder="Mã nhân viên" autocomplete="off" />
      <input id="passLogin" type="password" placeholder="Mật khẩu" />
      <button id="btnLogin">Đăng nhập</button>
    </form>
    <div id="login-error"></div>
  </div>
</div>

<div id="app" class="container">

  <div class="info">
    <span id="who"></span>
  </div>

  <h2>PHÂN QUYỀN NHÂN VIÊN</h2>

  <table id="tbl" class="center">
    <thead>
      <tr>
        <th>Mã NV</th>
        <th>Tên NV</th>
        <th>Được xem</th>
        <th>Được sửa</th>
        <th>Được xóa</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <button id="btnSave" class="btn-save">Lưu phân quyền</button>

</div>


<!-- --- SUPABASE --- -->
<script>
  window.SUPABASE_URL = "https://rddjrmbyftlcvrgzlyby.supabase.co";
  window.SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZGpybWJ5ZnRsY3ZyZ3pseWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3NjU4MDQsImV4cCI6MjA2MjM0MTgwNH0.-0xtqxn6b9OBz4unTTvJ4klxizWhHa1iSuYGm7cOYTM";
</script>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase = createClient(window.SUPABASE_URL, window.SUPABASE_ANON);

const rowsBox = document.getElementById("rows");
const btnSave = document.getElementById("btnSave");
const who = document.getElementById("who");

// AUTH ONLY ADMIN
async function doLogin(manv, password){
  const {data,error} = await supabase.rpc("nv_login",{p_manv:manv,p_password:password});
  if(error)throw new Error(error.message);
  const row=data&&data[0];
  if(!row||!row.ok)throw new Error("Sai mã NV hoặc mật khẩu!");
  if(!row.is_admin)throw new Error("Tài khoản này KHÔNG phải ADMIN!");
  return row;
}

// LOAD
async function load(){
  const {data,error} = await supabase
      .from("dmnhanvien")
      .select("manv,tennv,sua_hoadon,xoa_hoadon,trangthai,duoc_xem,duoc_sua,duoc_xoa")
      .order("manv",{ascending:true});
  if(error)return;
  rowsBox.innerHTML="";
  data.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${r.manv}</td>
      <td>${r.tennv||""}</td>
      <td><input type="checkbox" class="ex" data-manv="${r.manv}" ${r.duoc_xem?"checked":""}></td>
      <td><input type="checkbox" class="ed" data-manv="${r.manv}" ${r.duoc_sua?"checked":""}></td>
      <td><input type="checkbox" class="del" data-manv="${r.manv}" ${r.duoc_xoa?"checked":""}></td>
    `;
    rowsBox.appendChild(tr);
  });
}

async function save(){
  const ex=document.querySelectorAll(".ex");
  const ed=document.querySelectorAll(".ed");
  const del=document.querySelectorAll(".del");

  for(let i=0;i<ex.length;i++){
    const manv = ex[i].dataset.manv;
    const obj={
      duoc_xem: ex[i].checked,
      duoc_sua: ed[i].checked,
      duoc_xoa: del[i].checked
    };
    await supabase.from("dmnhanvien").update(obj).eq("manv",manv);
  }
  alert("Đã lưu!");
}

document.getElementById("form-login").addEventListener("submit", async e=>{
  e.preventDefault();
  const manv=document.getElementById("manvLogin").value.trim();
  const pass=document.getElementById("passLogin").value.trim();
  try{
    const u=await doLogin(manv,pass);
    document.getElementById("login-container").style.display="none";
    document.getElementById("app").style.display="";
    who.textContent=`Đang đăng nhập: ${u.tennv||u.manv} (ADMIN)`;
    btnSave.disabled=false;
    load();
  }catch(err){
    document.getElementById("login-error").textContent=err.message;
  }
});

btnSave.addEventListener("click",save);

</script>
</body>
</html>
