<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <title>Phân quyền nhân viên</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial;
      margin: 16px;
      background: #fafbfc
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px
    }

    .badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 20px;
      background: #eef6ff;
      color: #0b5cd9
    }

    .danger {
      color: #b00020
    }

    .card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .02)
    }

    .row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px
    }

    input[type=text],
    input[type=password] {
      padding: 10px;
      border: 1px solid #dcdfe4;
      border-radius: 10px;
      width: 100%
    }

    input[readonly] {
      background: #f6f7f9
    }

    button {
      padding: 10px 14px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      background: #fff;
      cursor: pointer
    }

    button.primary {
      background: #0b84ff;
      color: #fff;
      border-color: #0b84ff
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th,
    td {
      padding: 8px;
      border-bottom: 1px dashed #eee
    }

    th {
      text-align: left
    }

    .footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 12px
    }

    .hint {
      color: #6b7280;
      font-size: 13px
    }

    .ok {
      color: #0a7a0a
    }

    /* Có style cho #login-container cũng không sao – authModule sẽ override bằng inline style */
    #login-container {
      /* sẽ được authModule set lại bằng JS */
    }
  </style>
</head>

<body>
  <!-- APP CHÍNH – ẩn khi chưa login -->
  <div class="wrap" id="app" style="display:none">
    <div class="top">
      <h2>Phân quyền nhân viên</h2>
      <span id="who" class="badge">Đang kiểm tra…</span>
    </div>

    <!-- Khối tìm NV cần phân quyền -->
    <div class="card" id="searchCard">
      <div class="row">
        <label>Mã nhân viên</label>
        <input id="manv" type="text" placeholder=" 2222/NV001" />
      </div>
      <div class="row">
        <label>Tên nhân viên</label>
        <input id="tennv" type="text" readonly placeholder="(tự điền sau khi nhập mã)" />
      </div>
      <div class="row">
        <label></label>
        <div>
          <button id="btnLoad">Tải danh sách trang</button>
          <span class="hint">Nhập mã NV → tên NV tự hiện nếu tồn tại.</span>
        </div>
      </div>
      <div id="msgSearch" class="hint" style="margin-top:6px"></div>
    </div>

    <!-- Khối danh sách trang -->
    <div class="card" id="pagesCard" style="display:none">
      <table id="pagesTable">
        <thead>
          <tr>
            <th style="width:70px">Chọn</th>
            <th>Trang được sử dụng</th>
            <th class="hint">Đường dẫn</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="footer">
        <button id="btnUncheckAll">Bỏ chọn hết</button>
        <button id="btnCheckAll">Chọn hết</button>
        <button class="primary" id="btnSave">Lưu dữ liệu</button>
      </div>
      <div id="msg" class="hint" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- KHUNG LOGIN – để trống, authModule sẽ tự render form -->
  <div id="login-container"></div>

  <script type="module">
    import { khoiTaoDangNhapDungChung } from "./scripts/authModule.js";

    // Supabase client dùng chung đã được tạo trong authModule và gắn ở window.supabase
    const supabase = window.supabase;

    const el = (id) => document.getElementById(id);
    const elWho = el('who');

    // Người đang đăng nhập trang phân quyền
    let ACTOR = { manv: null, tennv: null, is_admin: false, _pass: "" };

    // ==== KHỞI TẠO ĐĂNG NHẬP CHUẨN AUTH (CHỈ ADMIN ĐƯỢC VÀO TRANG) ====
    khoiTaoDangNhapDungChung({
      loginContainerId: "login-container",
      appContainerId: "app",
      macDinhDiaDiem: "cs1",        // có thể đổi nếu muốn, chỉ là mặc định trong form
      tuDongKhoaCoSo: false,        // cho admin chọn cs1/cs2 nếu cần
      loginApiPath: "/api/login-cs1",

      onLoginSuccess: async (nhanvien, { diadiem, session }) => {
        // Lấy lại mật khẩu NV từ localStorage (authModule đã lưu ở last_login_password)
        const pass = (localStorage.getItem("last_login_password") || "").trim();

        // CHẶN KHÔNG PHẢI ADMIN
        if (!nhanvien.is_admin) {
          alert("Chỉ tài khoản ADMIN mới được phép sử dụng trang PHÂN QUYỀN NHÂN VIÊN.");

          // Ẩn app, hiện lại form login
          const app = document.getElementById("app");
          const loginDiv = document.getElementById("login-container");
          if (app) app.style.display = "none";
          if (loginDiv) loginDiv.style.display = "flex";

          return;
        }

        // Nếu là ADMIN → cho dùng trang
        ACTOR = {
          manv: nhanvien.manv,
          tennv: nhanvien.tennv,
          is_admin: true,
          _pass: pass
        };

        elWho.textContent = `Đang đăng nhập: ${ACTOR.tennv || ACTOR.manv} (ADMIN)`;

        // Đảm bảo nút Lưu được bật
        const btnSave = document.getElementById("btnSave");
        if (btnSave) {
          btnSave.disabled = false;
          btnSave.title = "";
        }
      }
    });


    // ---------- UI phân quyền ---------- //
    const elSearch = el('searchCard');
    const elManv = el('manv');
    const elTennv = el('tennv');
    const elBtnLoad = el('btnLoad');
    const elMsgSearch = el('msgSearch');
    const elPages = el('pagesCard');
    const elTableBody = document.querySelector('#pagesTable tbody');
    const elCheckAll = el('btnCheckAll');
    const elUncheckAll = el('btnUncheckAll');
    const elSave = el('btnSave');
    const elMsg = el('msg');

    let currentRows = []; // [{code,path,title,checked,can_edit}...]

    function renderRows(rows) {
      elTableBody.innerHTML = '';
      rows.forEach((r, idx) => {
        const tr = document.createElement('tr');

        const tdCheck = document.createElement('td');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!r.checked;
        cb.dataset.idx = idx;
        cb.addEventListener('change', (e) => {
          currentRows[Number(e.target.dataset.idx)].checked = e.target.checked;
        });
        tdCheck.appendChild(cb);

        const tdTitle = document.createElement('td');
        tdTitle.textContent = r.title || r.path;

        const tdPath = document.createElement('td');
        tdPath.className = 'hint';
        tdPath.textContent = r.path;

        tr.appendChild(tdCheck);
        tr.appendChild(tdTitle);
        tr.appendChild(tdPath);
        elTableBody.appendChild(tr);
      });
    }

    async function loadNvName(manv) {
      elMsgSearch.textContent = '';
      if (!manv) {
        elTennv.value = '';
        return;
      }
      const { data, error } = await supabase.rpc('get_nv_info', { p_manv: manv });
      if (error) {
        elMsgSearch.className = 'hint danger';
        elMsgSearch.textContent = 'Lỗi lấy tên NV: ' + error.message;
        elTennv.value = '';
        return;
      }
      if (!data || !data[0] || !data[0].found) {
        elMsgSearch.className = 'hint danger';
        elMsgSearch.textContent = 'Mã NV không tồn tại trong danh mục.';
        elTennv.value = '';
        return;
      }
      elMsgSearch.className = 'hint';
      elMsgSearch.textContent = '';
      elTennv.value = data[0].tennv || '';
    }

    // Khi rời ô mã NV → tự load tên
    elManv.addEventListener('blur', () => loadNvName(elManv.value.trim()));

    // Nút "Tải danh sách trang"
    elBtnLoad.addEventListener('click', async () => {
      const manv = elManv.value.trim();
      if (!manv) {
        alert('Hãy nhập Mã NV');
        return;
      }
      await loadNvName(manv);

      const { data, error } = await supabase.rpc('get_pages_for_manv', { p_manv: manv });
      if (error) {
        elMsg.className = 'hint danger';
        elMsg.textContent = 'Lỗi tải danh sách trang: ' + error.message;
        return;
      }
      currentRows = data || [];
      renderRows(currentRows);
      elPages.style.display = 'block';
    });

    // Chọn hết / Bỏ chọn hết
    elCheckAll.addEventListener('click', () => {
      currentRows.forEach(r => r.checked = true);
      renderRows(currentRows);
    });
    elUncheckAll.addEventListener('click', () => {
      currentRows.forEach(r => r.checked = false);
      renderRows(currentRows);
    });

    // Nút LƯU DỮ LIỆU
    elSave.addEventListener('click', async () => {
      elMsg.textContent = '';

      if (!ACTOR || !ACTOR.manv || !ACTOR.is_admin) {
        alert('Chỉ ADMIN đăng nhập bằng tài khoản hợp lệ mới được lưu phân quyền.');
        return;
      }

      const manvTarget = elManv.value.trim();
      if (!manvTarget) {
        alert('Chưa có Mã NV');
        return;
      }

      const codes = currentRows
        .filter(r => r.checked)
        .map(r => r.code);

      const payload = {
        p_actor_manv: ACTOR.manv,
        p_actor_pass: ACTOR._pass || null,
        p_target_manv: manvTarget,
        p_codes: codes.length ? codes : null,
        p_can_edit: false
      };

      const { data, error } = await supabase.rpc('set_pages_for_manv_nvauth', payload);

      if (error) {
        console.error('RPC error:', error);
        elMsg.className = 'hint danger';
        elMsg.textContent = 'Lỗi RPC: ' + (error.message || 'Bad Request');
        return;
      }

      const row = (data && data[0]) || {};
      if (!row.ok) {
        elMsg.className = 'hint danger';
        elMsg.textContent = 'Không lưu được: ' + (row.reason || 'Không rõ nguyên nhân');
        return;
      }

      elMsg.className = 'hint ok';
      elMsg.textContent = 'Đã lưu phân quyền cho ' + (elTennv.value || manvTarget) + ' (' + (codes.length || 0) + ' trang).';
    });

  </script>
</body>

</html>
