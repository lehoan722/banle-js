<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Phân quyền nhân viên (ADMIN)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;margin:16px;background:#fafbfc}
    .wrap{max-width:820px;margin:0 auto}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .badge{font-size:12px;padding:4px 8px;border-radius:20px;background:#eef6ff;color:#0b5cd9}
    .danger{color:#b00020}
    .card{background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin-top:14px;box-shadow:0 2px 10px rgba(0,0,0,.02)}
    .row{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center;margin-bottom:10px}
    input[type=text]{padding:10px;border:1px solid #dcdfe4;border-radius:10px;width:100%}
    input[readonly]{background:#f6f7f9}
    button{padding:10px 14px;border:1px solid #d0d7de;border-radius:10px;background:#fff;cursor:pointer}
    button.primary{background:#0b84ff;color:#fff;border-color:#0b84ff}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px dashed #eee}
    th{text-align:left}
    .footer{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
    .hint{color:#6b7280;font-size:13px}
    .ok{color:#0a7a0a}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h2>Phân quyền nhân viên</h2>
    <span id="who" class="badge">Đang kiểm tra…</span>
  </div>

  <!-- Điền cấu hình thật -->
  <script>
   window.SUPABASE_URL  = window.SUPABASE_URL  || "https://rddjrmbyftlcvrgzlyby.supabase.co";
    window.SUPABASE_ANON = window.SUPABASE_ANON || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZGpybWJ5ZnRsY3ZyZ3pseWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3NjU4MDQsImV4cCI6MjA2MjM0MTgwNH0.-0xtqxn6b9OBz4unTTvJ4klxizWhHa1iSuYGm7cOYTM";
  </script>

  <!-- Khối nhập mã NV cần phân quyền -->
  <div class="card" id="searchCard" style="display:none">
    <div class="row">
      <label>Mã nhân viên</label>
      <input id="manv" type="text" placeholder="vd: 33 / NV001" />
    </div>
    <div class="row">
      <label>Tên nhân viên</label>
      <input id="tennv" type="text" readonly placeholder="(tự điền sau khi nhập mã)" />
    </div>
    <div class="row">
      <label></label>
      <div>
        <button id="btnLoad">Tải danh sách trang</button>
        <span class="hint">Nhập mã NV → tên NV tự hiện nếu tồn tại.</span>
      </div>
    </div>
    <div id="msgSearch" class="hint" style="margin-top:6px"></div>
  </div>

  <!-- Khối danh sách trang -->
  <div class="card" id="pagesCard" style="display:none">
    <table id="pagesTable">
      <thead>
        <tr>
          <th style="width:70px">Chọn</th>
          <th>Trang được sử dụng</th>
          <th class="hint">Đường dẫn</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="footer">
      <button id="btnUncheckAll">Bỏ chọn hết</button>
      <button id="btnCheckAll">Chọn hết</button>
      <button class="primary" id="btnSave">Lưu dữ liệu</button>
    </div>
    <div id="msg" class="hint" style="margin-top:8px"></div>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase = createClient(window.SUPABASE_URL, window.SUPABASE_ANON, { auth:{persistSession:true} });

const elWho   = document.getElementById('who');
const elSearch= document.getElementById('searchCard');
const elManv  = document.getElementById('manv');
const elTennv = document.getElementById('tennv');
const elBtnLoad = document.getElementById('btnLoad');
const elMsgSearch = document.getElementById('msgSearch');
const elPages = document.getElementById('pagesCard');
const elTableBody = document.querySelector('#pagesTable tbody');
const elCheckAll = document.getElementById('btnCheckAll');
const elUncheckAll = document.getElementById('btnUncheckAll');
const elSave  = document.getElementById('btnSave');
const elMsg   = document.getElementById('msg');

let currentRows = []; // [{code,path,title,checked,can_edit}...]

async function requireAdmin() {
  // Bắt buộc đăng nhập
  const { data:{ user } } = await supabase.auth.getUser();
  if (!user) {
    elWho.className = 'badge danger';
    elWho.textContent = 'Chưa đăng nhập';
    alert('Bạn cần đăng nhập trước.');
    // location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname);
    return false;
  }
  // Kiểm tra admin
  const { data:isAdmin, error } = await supabase.rpc('me_is_admin');
  if (error) {
    elWho.className = 'badge danger';
    elWho.textContent = 'Lỗi kiểm tra quyền';
    alert('Không kiểm tra được quyền admin: ' + error.message);
    return false;
  }
  if (!isAdmin) {
    elWho.className = 'badge danger';
    elWho.textContent = 'Không phải ADMIN';
    alert('Bạn không có quyền truy cập trang này.');
    // location.href = '/403.html';
    return false;
  }
  // Hiển thị ai đang đăng nhập (không lộ khoá bí mật)
  elWho.className = 'badge';
  elWho.textContent = 'Đang đăng nhập: ' + (user.email || user.phone) + ' (ADMIN)';
  return true;
}

function renderRows(rows){
  elTableBody.innerHTML = '';
  rows.forEach((r, idx) => {
    const tr = document.createElement('tr');

    const tdCheck = document.createElement('td');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!r.checked;
    cb.dataset.idx = idx;
    cb.addEventListener('change',(e)=>{ currentRows[Number(e.target.dataset.idx)].checked = e.target.checked; });
    tdCheck.appendChild(cb);

    const tdTitle = document.createElement('td');
    tdTitle.textContent = r.title || r.path;

    const tdPath = document.createElement('td');
    tdPath.className = 'hint';
    tdPath.textContent = r.path;

    tr.appendChild(tdCheck); tr.appendChild(tdTitle); tr.appendChild(tdPath);
    elTableBody.appendChild(tr);
  });
}

async function loadNvName(manv){
  elMsgSearch.textContent = '';
  if (!manv) { elTennv.value=''; return; }
  const { data, error } = await supabase.rpc('get_nv_info', { p_manv: manv });
  if (error) {
    elMsgSearch.className = 'hint danger';
    elMsgSearch.textContent = 'Lỗi lấy tên NV: ' + error.message;
    elTennv.value = '';
    return;
  }
  if (!data || !data[0] || !data[0].exists) {
    elMsgSearch.className = 'hint danger';
    elMsgSearch.textContent = 'Mã NV không tồn tại trong danh mục.';
    elTennv.value = '';
    return;
  }
  elMsgSearch.className = 'hint';
  elMsgSearch.textContent = '';
  elTennv.value = data[0].tennv || '';
}

elManv.addEventListener('blur', ()=> loadNvName(elManv.value.trim()));
elBtnLoad.addEventListener('click', async ()=>{
  const manv = elManv.value.trim();
  if (!manv) { alert('Hãy nhập Mã NV'); return; }
  await loadNvName(manv);

  const { data, error } = await supabase.rpc('get_pages_for_manv', { p_manv: manv });
  if (error) {
    elMsg.className = 'hint danger';
    elMsg.textContent = 'Lỗi tải danh sách trang: ' + error.message;
    return;
  }
  currentRows = data || [];
  renderRows(currentRows);
  elPages.style.display = 'block';
});

elCheckAll.addEventListener('click', ()=>{ currentRows.forEach(r=>r.checked=true); renderRows(currentRows); });
elUncheckAll.addEventListener('click', ()=>{ currentRows.forEach(r=>r.checked=false); renderRows(currentRows); });

elSave.addEventListener('click', async ()=>{
  elMsg.textContent = '';
  const manv = elManv.value.trim();
  if (!manv) { alert('Chưa có Mã NV'); return; }
  const codes = currentRows.filter(r=>r.checked).map(r=>r.code);

  const { error } = await supabase.rpc('set_pages_for_manv', {
    p_manv: manv, p_codes: codes, p_can_edit: false
  });
  if (error) {
    elMsg.className = 'hint danger';
    elMsg.textContent = 'Lỗi lưu: ' + error.message;
  } else {
    elMsg.className = 'hint ok';
    elMsg.textContent = 'Đã lưu phân quyền cho ' + (elTennv.value || manv) + ' (' + codes.length + ' trang).';
  }
});

if (await requireAdmin()) {
  elSearch.style.display = 'block';
}
</script>
</body>
</html>
