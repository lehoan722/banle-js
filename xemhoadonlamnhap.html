  <style>
    body {

    button.xoa-btn {

      font-weight: bold;
      padding: 7px 18px;
      border-radius: 4px;
      cursor: pointer;
    }

    button.xoa-btn:hover {
      background: #ffe599;
    }
  </style>
</head>

<body>
  <h2>📋 Tra cứu Hóa Đơn Bán Lẻ</h2>


  <label>Từ ngày: <input type="date" id="tuNgay"></label>
  <label>Đến ngày: <input type="date" id="denNgay"></label>
  <label>Nhân viên: <input type="text" id="locNV"></label>
  <label>Khách hàng: <input type="text" id="locKhach"></label>
  <label>Tiền từ: <input type="number" id="tienTu" style="width:80px"></label>

    <option value="bancs1">bancs1</option>
    <option value="bancs2">bancs2</option>
    <option value="nmcs1">nmcs1</option>
    <option value="nmcs2">nmcs2</option>
    <option value="ccn1v2">ccn1v2</option>
    <option value="ccn2v1">ccn2v1</option>

  <label>
    Xem tổng hợp:
    <select id="loaiTongHop" style="min-width:120px">
      <option value="chitiet">Chi tiết từng hóa đơn</option>
      <option value="ngay">Tổng hợp theo ngày</option>
      <option value="thang">Tổng hợp theo tháng</option>
      <option value="nam">Tổng hợp theo năm</option>

  <button class="loc-btn" onclick="taiDanhSachHoaDon()">🔍 Lọc hóa đơn</button>
  <button class="xoa-btn" onclick="xoaHoaDonDaChon()">❌ Xóa hóa đơn đã chọn</button>
  <br />

  <div id="tongHopNhanh" style="font-size:1.1em;margin:12px 0;color:#0066cc;font-weight:bold;">
    Tổng số lượng hóa đơn: <span id="tongSoLuong2">0</span> | Tổng tiền thanh toán: <span id="tongTien2">0</span>

  <div id="dsHoaDonGrid" style="width:100%;min-height:400px;"></div>



  <div id="popup">
    <div class="drag-header" id="popupHeader">
      Chi tiết hóa đơn: <span id="sohdCT"></span>
      <span style="float:right;cursor:pointer;color:#999;" onclick="dongPopup()">✖</span>

      Tổng SL: <span id="tongSLCT">0</span> | Tổng thành tiền: <span id="tongTTCT">0</span>
    </div>
    <button onclick="dongPopup()">Đóng</button>

  </div>


  <script>
    const supabase = window.supabase.createClient(
      'https://rddjrmbyftlcvrgzlyby.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZGpybWJ5ZnRsY3ZyZ3pseWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3NjU4MDQsImV4cCI6MjA2MjM0MTgwNH0.-0xtqxn6b9OBz4unTTvJ4klxizWhHa1iSuYGm7cOYTM'
    );
    let rowDangChon = null;
    let hotCT = null; // Khai báo ngoài cùng nếu muốn reuse grid

    function renderHoaDonGrid(data, tongHopType = "chitiet") {
      // Chuẩn hóa lại data cho grid
      const tableData = data.map((row, idx) => [
        idx + 1,                         // STT
        false,                           // Chọn (checkbox)
        row.sohd || "",
        (row.ngay || row.created_at) ? dinhDangNgayGio(row.ngay || row.created_at) : "",
        row.tennv || "",
        row.khachhang || "",
        row.tongsl || 0,
        row.thanhtoan ? Number(row.thanhtoan) : 0,
        row.ghichu || "",
        row.trang_thai_gui || ""
      ]);

      // Hủy bảng cũ nếu có
      if (hotHD) { hotHD.destroy(); hotHD = null; }

      hotHD = new Handsontable(document.getElementById('dsHoaDonGrid'), {
        data: tableData,
        colHeaders: [
          "STT", "Chọn", "Số HĐ", "Ngày", "NV", "Khách", "Tổng SL", "TT", "Ghi chú", "Trạng thái gửi"
        ],
        columns: [
          { type: 'numeric', readOnly: true, width: 40 },
          {
            data: 1,
            type: 'checkbox',
            className: 'htCenter',
            readOnly: false,
            width: 38,
          },
          { type: 'text', readOnly: true, width: 120 },
          { type: 'text', readOnly: true, width: 120 },
          { type: 'text', readOnly: true, width: 110 },
          { type: 'text', readOnly: true, width: 140 },
          { type: 'numeric', readOnly: true, width: 80 },
          { type: 'numeric', readOnly: true, format: '0,0', width: 110 },
          { type: 'text', readOnly: true, width: 120 },
          { type: 'text', readOnly: true, width: 110 }
        ],
        width: '100%',
        height: 420,
        stretchH: 'all',
        rowHeaders: true,
        manualColumnResize: true,
        manualRowResize: true,
        filters: true,              // Filter cột
        dropdownMenu: true,         // Menu filter/sort
        columnSorting: true,        // Sắp xếp cột
        licenseKey: 'non-commercial-and-evaluation',
        afterOnCellMouseDown: function (r, c) {
          // Chọn dòng (ngoài checkbox) thì mở popup chi tiết
          if (c !== 1 && r >= 0 && tableData[r][2]) {
            xemChiTiet(tableData[r][2]);
          }
        }
      });
    }


    async function taiDanhSachHoaDon() {
      // 1. Lấy các giá trị lọc từ giao diện
      const tuNgay = document.getElementById("tuNgay").value;
      let denNgay = document.getElementById("denNgay").value;
      if (denNgay) denNgay = denNgay + "T23:59:59.999";

      const nv = document.getElementById("locNV").value.trim().toUpperCase();
      const sohd = document.getElementById("locSoHD").value.trim();
      const khach = document.getElementById("locKhach").value.trim();
      const tienTu = Number(document.getElementById("tienTu").value);
      const tienDen = Number(document.getElementById("tienDen").value);

      const selectLoai = document.getElementById("loaiChungTu");
      const loaiChungTuArr = Array.from(selectLoai.selectedOptions).map(o => o.value);

      const loaiTongHop = document.getElementById("loaiTongHop")?.value || "chitiet";

      const tbody = document.getElementById("dsHoaDon");
      tbody.innerHTML = "";

      let filtered = [];

      // Nếu chọn loại chứng từ: Truy vấn từng loại (song song, gộp lại)
      if (loaiChungTuArr.length > 0) {
        const queries = loaiChungTuArr.map(loai => {
          let query = supabase
            .from('hoadon_banle')
            .select('*')
            .order('created_at', { ascending: false })
            .ilike('sohd', `${loai}_%`);

          if (tuNgay && denNgay) query = query.gte('created_at', tuNgay).lte('created_at', denNgay);
          else if (tuNgay) query = query.gte('created_at', tuNgay);
          else if (denNgay) query = query.lte('created_at', denNgay);

          if (nv) query = query.ilike('tennv', `%${nv}%`);
          if (sohd) query = query.ilike('sohd', `%${sohd}%`);
          if (khach) query = query.ilike('khachhang', `%${khach}%`);
          if (!isNaN(tienTu) && tienTu > 0) query = query.gte('thanhtoan', tienTu);
          if (!isNaN(tienDen) && tienDen > 0) query = query.lte('thanhtoan', tienDen);

          return query;
        });

        // Chạy song song các truy vấn
        const results = await Promise.all(queries.map(q => q));
        let arr = [];
        for (const { data, error } of results) {
          if (error) {
            alert("❌ Lỗi tải hóa đơn: " + error.message);
            return;
          }
          arr = arr.concat(data || []);
        }
        // Loại bỏ trùng hóa đơn (nếu 2 loại overlap)
        const hash = {};
        filtered = arr.filter(hd => {
          if (hash[hd.sohd]) return false;
          hash[hd.sohd] = true;
          return true;
        });
      } else {
        // Không chọn loại, lấy toàn bộ
        let query = supabase
          .from('hoadon_banle')
          .select('*')
          .order('created_at', { ascending: false }); // Không limit

        if (tuNgay && denNgay) query = query.gte('created_at', tuNgay).lte('created_at', denNgay);
        else if (tuNgay) query = query.gte('created_at', tuNgay);
        else if (denNgay) query = query.lte('created_at', denNgay);

        if (nv) query = query.ilike('tennv', `%${nv}%`);
        if (sohd) query = query.ilike('sohd', `%${sohd}%`);
        if (khach) query = query.ilike('khachhang', `%${khach}%`);
        if (!isNaN(tienTu) && tienTu > 0) query = query.gte('thanhtoan', tienTu);
        if (!isNaN(tienDen) && tienDen > 0) query = query.lte('thanhtoan', tienDen);

        const { data, error } = await query;
        if (error) return alert("❌ Lỗi tải hóa đơn: " + error.message);
        filtered = data || [];
      }

      if (!filtered.length) return tbody.innerHTML = `<tr><td colspan="9">Không có dữ liệu</td></tr>`;

      // ----------- XỬ LÝ TỔNG HỢP THEO NGÀY/THÁNG/NĂM ----------
      let hienThiData = filtered;
      if (loaiTongHop !== "chitiet") {
        const groupMap = new Map();
        filtered.forEach(hd => {
          const d = new Date(hd.created_at);
          let key = "";
          if (loaiTongHop === "ngay") key = d.toISOString().slice(0, 10);
          if (loaiTongHop === "thang") key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
          if (loaiTongHop === "nam") key = d.getFullYear() + "";
          if (!groupMap.has(key)) {
            groupMap.set(key, {
              sohd: 1,
              created_at: hd.created_at,
              tongsl: Number(hd.tongsl || 0),
              thanhtoan: Number(hd.thanhtoan || 0)
            });
          } else {
            let obj = groupMap.get(key);
            obj.sohd += 1;
            obj.tongsl += Number(hd.tongsl || 0);
            obj.thanhtoan += Number(hd.thanhtoan || 0);
          }
        });
        hienThiData = Array.from(groupMap.entries()).map(([key, val]) => {
          // Định dạng lại ngày/tháng/năm để hiển thị
          if (loaiTongHop === "ngay") val.created_at = key.split('-').reverse().join('/');
          if (loaiTongHop === "thang") val.created_at = key.slice(5, 7) + "/" + key.slice(0, 4);
          if (loaiTongHop === "nam") val.created_at = key;
          return val;
        });
      }

      // ------------- HÀM ĐỊNH DẠNG NGÀY GIỜ -------------
      function dinhDangNgayGio(ngayStr) {
        if (!ngayStr) return "";
        // Nếu chuỗi có dạng dd/mm/yyyy thì giữ nguyên (đang tổng hợp)
        if (ngayStr.match(/^\d{2}\/\d{2}\/\d{4}$/) || ngayStr.match(/^\d{2}\/\d{4}$/) || ngayStr.length === 4) return ngayStr;
        const d = new Date(ngayStr);
        const ngay = d.getDate().toString().padStart(2, "0");
        const thang = (d.getMonth() + 1).toString().padStart(2, "0");
        const nam = d.getFullYear();
        const gio = d.getHours().toString().padStart(2, "0");
        const phut = d.getMinutes().toString().padStart(2, "0");
        return `${ngay}/${thang}/${nam} ${gio}h${phut}`;
      }

      // ------------- HIỂN THỊ RA BẢNG -------------
      renderHoaDonGrid(hienThiData, loaiTongHop);


      async function xemChiTiet(sohd) {
        document.getElementById("popup").style.display = "block";
        document.getElementById("sohdCT").textContent = sohd;

        const { data, error } = await supabase.from('ct_hoadon_banle').select('*').eq('sohd', sohd);

        // Kiểm tra lỗi/trống
        if (error || !data || !data.length) {
          document.getElementById("ctHoaDonGrid").innerHTML = `<div style="color:red">Không có dữ liệu hóa đơn hoặc lỗi: ${error?.message || ''}</div>`;
          document.getElementById("tongSLCT").textContent = "0";
          document.getElementById("tongTTCT").textContent = "0";
          if (hotCT) { hotCT.destroy(); hotCT = null; }
          return;
        }

        // Chuẩn hóa dữ liệu cho grid
        const tableData = data.map(row => {
          const tt = (Number(row.gia) - Number(row.km)) * Number(row.soluong);
          return [
            row.masp || "",
            row.tensp || "",
            row.size || "",
            Number(row.soluong) || 0,
            Number(row.gia) || 0,
            Number(row.km) || 0,
            tt
          ];
        });

        // Tính tổng
        let tongSL = 0, tongTT = 0;
        tableData.forEach(r => {
          tongSL += Number(r[3]);
          tongTT += Number(r[6]);
        });
        document.getElementById("tongSLCT").textContent = tongSL.toLocaleString();
        document.getElementById("tongTTCT").textContent = tongTT.toLocaleString();

        // Xóa/hủy bảng cũ nếu có
        if (hotCT) { hotCT.destroy(); hotCT = null; }

        // Render Handsontable với filter, sort
        hotCT = new Handsontable(document.getElementById("ctHoaDonGrid"), {
          data: tableData,
          colHeaders: ['Mã SP', 'Tên SP', 'Size', 'SL', 'Giá', 'KM', 'Thành tiền'],
          columns: [
            { type: 'text', readOnly: true },
            { type: 'text', readOnly: true },
            { type: 'text', readOnly: true },
            { type: 'numeric', readOnly: true },
            { type: 'numeric', readOnly: true },
            { type: 'numeric', readOnly: true },
            { type: 'numeric', readOnly: true }
          ],
          width: '100%',
          height: 220,
          stretchH: 'all',
          manualColumnResize: true,
          manualRowResize: true,
          rowHeaders: true,
          licenseKey: 'non-commercial-and-evaluation',
          dropdownMenu: true,     // Bật menu filter/sort trên tiêu đề
          filters: true,          // Bật lọc dữ liệu
          columnSorting: true,    // Cho phép sắp xếp từng cột
          autoWrapRow: true,
          readOnly: true,
        });
      }



      function dongPopup() {
        document.getElementById("popup").style.display = "none";
      }

      async function xoaHoaDonDaChon() {
        if (!hotHD) return alert("Bảng chưa tải xong!");
        const data = hotHD.getData();
        const sohdList = data.filter(row => row[1] === true).map(row => row[2]);
        if (!sohdList.length) return alert("❗ Vui lòng chọn ít nhất một hóa đơn cần xóa.");

        // Gọi xác thực và chỉ xóa nếu xác thực thành công
        kiemTraNhanVienTruocKhiXoa(async function () {
          if (!confirm(`Bạn có chắc muốn xóa ${sohdList.length} hóa đơn khỏi hệ thống?`)) return;
          // het doan  xác thực và chỉ xóa nếu xác thực thành công

          // Xóa khỏi ct_hoadon_banle trước
          const { error: errCT } = await supabase.from('ct_hoadon_banle').delete().in('sohd', sohdList);
          if (errCT) {
            alert("Không thể xóa chi tiết hóa đơn.");
            return;
          }

          // Sau đó xóa khỏi hoadon_banle
          const { error: errHD } = await supabase.from('hoadon_banle').delete().in('sohd', sohdList);
          if (errHD) {
            alert("Không thể xóa hóa đơn.");
            return;
          }

          alert(`✅ Đã xóa ${sohdList.length} hóa đơn.`);
          taiDanhSachHoaDon();
        });
      }



      window.onload = function () {
        // Set ngày mặc định là hôm nay
        const today = new Date().toISOString().slice(0, 10);
        document.getElementById('tuNgay').value = today;
        document.getElementById('denNgay').value = today;
        taiDanhSachHoaDon();
      };
      document.getElementById("loaiTongHop").onchange = taiDanhSachHoaDon;

      // DRAG POPUP (kéo popup)
      (function dragPopup() {
        let popup = document.getElementById('popup');
        let header = document.getElementById('popupHeader');
        let offsetX, offsetY, isDragging = false;
        if (header) {
          header.onmousedown = function (e) {
            isDragging = true;
            let rect = popup.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            document.onmousemove = function (ev) {
              if (isDragging) {
                popup.style.left = (ev.clientX - offsetX) + 'px';
                popup.style.top = (ev.clientY - offsetY) + 'px';
              }
            };
            document.onmouseup = function () { isDragging = false; document.onmousemove = null; };
          };
        }
      })();

      // Đóng popup bằng phím ESC
      document.addEventListener('keydown', function (e) {
        if (e.key === "Escape") dongPopup();
      });



  </script>

  <script>
      // Supabase project của bạn (dùng anon key)  xax nhan sua hoa don
      const SUPABASE_URL = 'https://rddjrmbyftlcvrgzlyby.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZGpybWJ5ZnRsY3ZyZ3pseWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3NjU4MDQsImV4cCI6MjA2MjM0MTgwNH0.-0xtqxn6b9OBz4unTTvJ4klxizWhHa1iSuYGm7cOYTM';

      // Hàm xác thực nhân viên, gọi ở bất kỳ đâu!
      async function kiemTraNhanVienTruocKhiXoa(callbackSauXacThuc) {
        document.getElementById('maNVCheck').value = '';
        document.getElementById('matkhauNVCheck').value = '';
        document.getElementById('msgCheckNV').textContent = '';
        document.getElementById('popupXacThucNV').style.display = 'block';

        // Đặt lại màu báo lỗi
        document.getElementById('msgCheckNV').style.color = '#ad3a2b';

        // Xử lý khi bấm nút kiểm tra
        document.getElementById('btnKiemTraNV').onclick = async function () {
          const manv = document.getElementById('maNVCheck').value.trim();
          const mk = document.getElementById('matkhauNVCheck').value.trim();
          const msg = document.getElementById('msgCheckNV');
          msg.style.color = '#ad3a2b';
          msg.textContent = '';

          if (!manv || !mk) {
            msg.textContent = "Vui lòng nhập đủ mã NV và mật khẩu!";
            return;
          }

          // Import SDK Supabase
          const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm');
          const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          const { data, error } = await supabase
            .from('dmnhanvien')
            .select('*')
            .eq('manv', manv)
            .single();

          if (error || !data) {
            msg.textContent = "❌ Sai mã nhân viên hoặc không tồn tại!";
            return;
          }
          if (data.matkhau !== mk) {
            msg.textContent = "❌ Mật khẩu không đúng!";
            return;
          }
          if (!data.xoa_hoadon) { // Nếu cần phân quyền khác thì đổi tên trường này
            msg.textContent = "❌ Bạn không có quyền thực hiện thao tác này!";
            return;
          }
          // Thành công!
          msg.style.color = 'green';
          msg.textContent = "✅ Đã xác thực, đang xử lý...";
          setTimeout(() => {
            document.getElementById('popupXacThucNV').style.display = 'none';
            msg.textContent = '';
            if (typeof callbackSauXacThuc === 'function') callbackSauXacThuc(data); // Truyền data nếu cần
          }, 450);
        };
      }
  </script>
