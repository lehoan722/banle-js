<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Shop Dictionary V2</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f4f6f8;margin:0;color:#111827}.wrap{max-width:1200px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dfe5eb;border-radius:15px;padding:12px;margin-bottom:10px}.row{display:flex;gap:7px;flex-wrap:wrap}input,select,button{min-height:42px;border:1px solid #cbd5e1;border-radius:9px;padding:0 10px}button{font-weight:800;cursor:pointer}.primary{background:#0b78d1;color:#fff;border:0}.grow{flex:1;min-width:180px}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab{background:#e9eef4}.tab.active{background:#111827;color:#fff}.panel{display:none}.panel.active{display:block}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.kpi{background:#f7f9fb;padding:9px;border-radius:10px}.kpi b{font-size:20px;display:block}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid #edf0f3;text-align:left;vertical-align:top}.tag{display:inline-block;padding:2px 6px;border-radius:999px;background:#eef4ff;color:#075f9f;margin:1px}.bad{color:#b42318}.good{color:#08783c}.status{padding:8px;border-radius:9px;background:#f2f4f7;margin-top:7px}@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.wrap{padding:6px}}
</style></head><body><div class="wrap"><div class="card"><h2>🧠 Admin · Shop Dictionary V2</h2><div class="row"><input id="key" type="password" class="grow" placeholder="Admin key Dictionary"><button id="load" class="primary">MỞ QUẢN TRỊ</button></div><div id="st" class="status">Admin key không lưu vào source; chỉ giữ trong tab hiện tại.</div></div><div id="main" style="display:none"><div class="card"><div id="kpis" class="kpis"></div></div><div class="card"><div class="tabs"><button class="tab active" data-p="unknown">Từ chưa hiểu</button><button class="tab" data-p="popular">Câu tìm nhiều</button><button class="tab" data-p="poor">Câu kết quả kém</button><button class="tab" data-p="dict">Từ điển</button><button class="tab" data-p="add">+ Thêm vào từ điển</button></div></div><div class="card panel active" id="p-unknown"><div class="table"><table><thead><tr><th>Từ/cụm</th><th>Số lần</th><th>Ví dụ</th><th></th></tr></thead><tbody id="unknownRows"></tbody></table></div></div><div class="card panel" id="p-popular"><div class="table"><table><thead><tr><th>Câu</th><th>Lượt</th><th>Click</th><th>Chọn</th><th>Bán</th></tr></thead><tbody id="popularRows"></tbody></table></div></div><div class="card panel" id="p-poor"><div class="table"><table><thead><tr><th>Thời gian</th><th>Câu</th><th>English</th><th>KQ</th></tr></thead><tbody id="poorRows"></tbody></table></div></div><div class="card panel" id="p-dict"><div class="table"><table><thead><tr><th>VI</th><th>EN</th><th>Loại</th><th>Dùng</th><th>Click</th><th>Chọn</th><th>Bán</th><th>Active</th></tr></thead><tbody id="dictRows"></tbody></table></div></div><div class="card panel" id="p-add"><h3>Thêm / sửa cụm từ</h3><div class="row"><input id="vi" class="grow" placeholder="Cụm tiếng Việt"><input id="vi0" class="grow" placeholder="Không dấu, ví dụ: ong con"></div><div class="row" style="margin-top:7px"><input id="en" class="grow" placeholder="English chính"><input id="alts" class="grow" placeholder="Biến thể EN, cách nhau dấu |"><select id="type"><option>loai_hang</option><option>mau</option><option>form</option><option>chi_tiet</option><option>hoa_tiet</option><option>chat_lieu</option><option>thuoc_tinh</option></select><button id="save" class="primary">LƯU VÀO TỪ ĐIỂN</button></div></div></div></div><script src="./siglip_lab_config.js"></script><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const C=window.SIGLIP_LAB_CONFIG,s=createClient(C.supabaseUrl,C.supabaseAnonKey),$=id=>document.getElementById(id);let key='';function msg(x){$('st').textContent=x}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9\s-]/g,' ').replace(/\s+/g,' ').trim()}async function rpc(fn,args){const{data,error}=await s.rpc(fn,args);if(error)throw error;return data}
async function loadAll(){key=$('key').value;const x=await rpc('dictionary_admin_tong_quan',{p_admin_key:key});$('main').style.display='block';const ks=[['Từ điển',x.tong_tu_dien],['Tìm kiếm',x.tong_tim_kiem],['7 ngày',x.tim_kiem_7_ngay],['Click',x.click],['Chọn',x.chon],['Bán',x.ban]];$('kpis').innerHTML=ks.map(a=>`<div class="kpi"><b>${a[1]}</b>${a[0]}</div>`).join('');await Promise.all([loadUnknown(),loadPopular(),loadPoor(),loadDict()]);msg('Đã tải dữ liệu quản trị.')}async function loadUnknown(){const d=await rpc('dictionary_admin_tu_chua_hieu',{p_admin_key:key,p_limit:100});$('unknownRows').innerHTML=(d||[]).map(r=>`<tr><td><b>${esc(r.tu)}</b></td><td>${r.so_lan}</td><td>${esc(r.vi_du)}</td><td><button data-word="${esc(r.tu)}" data-example="${esc(r.vi_du)}" class="addWord">Thêm vào từ điển</button></td></tr>`).join('');document.querySelectorAll('.addWord').forEach(b=>b.onclick=()=>{show('add');$('vi').value=b.dataset.word;$('vi0').value=norm(b.dataset.word);$('en').focus()})}async function loadPopular(){const d=await rpc('dictionary_admin_cau_tim_nhieu',{p_admin_key:key,p_limit:100});$('popularRows').innerHTML=(d||[]).map(r=>`<tr><td>${esc(r.cau_chuan_hoa)}</td><td>${r.so_lan}</td><td>${r.clicks}</td><td>${r.chons}</td><td>${r.bans}</td></tr>`).join('')}async function loadPoor(){const d=await rpc('dictionary_admin_cau_kem',{p_admin_key:key,p_limit:100});$('poorRows').innerHTML=(d||[]).map(r=>`<tr><td>${new Date(r.created_at).toLocaleString()}</td><td>${esc(r.cau_goc)}</td><td>${esc(JSON.stringify(r.query_en))}</td><td>${r.so_ket_qua??0}</td></tr>`).join('')}async function loadDict(){const d=await rpc('dictionary_admin_danh_sach',{p_admin_key:key,p_limit:1000});$('dictRows').innerHTML=(d||[]).map(r=>`<tr><td>${esc(r.cum_tu_vi)}</td><td>${esc(r.en_chinh)}<br><small>${esc(JSON.stringify(r.en_bien_the))}</small></td><td>${esc(r.loai)}</td><td>${r.so_lan_su_dung}</td><td>${r.so_lan_click}</td><td>${r.so_lan_chon}</td><td>${r.so_lan_ban}</td><td><button class="toggle" data-id="${r.id}" data-active="${!r.active}">${r.active?'ON':'OFF'}</button></td></tr>`).join('');document.querySelectorAll('.toggle').forEach(b=>b.onclick=async()=>{await rpc('dictionary_admin_bat_tat',{p_admin_key:key,p_id:Number(b.dataset.id),p_active:b.dataset.active==='true'});await loadDict()})}function show(p){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.p===p));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='p-'+p))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.p));$('load').onclick=()=>loadAll().catch(e=>msg('Lỗi: '+e.message));$('save').onclick=async()=>{try{const vi=$('vi').value.trim(),vi0=$('vi0').value.trim()||norm(vi),en=$('en').value.trim(),alts=$('alts').value.split('|').map(x=>x.trim()).filter(Boolean);if(!vi||!en)throw new Error('Thiếu VI hoặc EN');await rpc('dictionary_admin_luu_tu',{p_admin_key:key,p_cum_tu_vi:vi,p_cum_tu_khong_dau:vi0,p_en_chinh:en,p_en_bien_the:alts,p_loai:$('type').value,p_muc_uu_tien:150,p_ghi_chu:'admin page'});msg('Đã lưu. Lab sẽ nhận sau khi bấm Nạp lại từ điển.');await loadAll();show('dict')}catch(e){msg('Lỗi lưu: '+e.message)}};
</script></body></html>
