<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Nhập tạm Mobile CS1</title>
    <style>
        body {
            font-family: system-ui, Segoe UI, Roboto, Arial;
            margin: 6px;
            font-size: var(--fs);
        }

        :root {
            --gap: 6px;
            --pad: 8px;
            --h-input: 34px;
            --label: 86px;
            --fs: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
            max-width: 100vw;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: var(--pad);
            min-width: 0;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 6px 0;
        }

        .row label {
            min-width: var(--label);
            color: #444;
            font-size: var(--fs);
        }

        .row input,
        .row textarea {
            flex: 1;
            height: var(--h-input);
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .row .pill {
            padding: 3px 8px;
            border: 1px solid #ccc;
            border-radius: 999px;
            background: #fafafa;
            font-size: 12px
        }

        .sizes {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ⬅ 9 dòng, không còn lưới 4 cột */
        .sizes input {
            width: 100%;
            text-align: center;
            height: var(--h-input);
        }

        #col3 #taQuick {
            height: calc(9*var(--h-input) + 8*6px);
            resize: none;
        }

        /* cao bằng 9 ô size */
        .table-wrap {
            overflow: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        /* bảng có thanh kéo ngang */
        th,
        td {
            white-space: nowrap;
        }

        .toolbar {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 8px 0;
            margin-top: 10px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
            justify-content: space-between
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: #f5f5f5
        }

        .btn.primary {
            background: #1976d2;
            color: #fff;
            border-color: #1976d2
        }

        .btn.danger {
            background: #fff0f0;
            color: #b00020;
            border-color: #f3bcbc
        }

        .table-wrap {
            overflow: auto;
            border: 1px solid #ddd;
            border-radius: 10px
        }

        table {
            border-collapse: collapse;
            width: 100%
        }

        th,
        td {
            border: 1px solid #e6e6e6;
            padding: 6px 8px;
            text-align: center
        }

        th {
            background: #fafafa
        }

        td.locked {
            background: #f7f7f7;
            color: #888
        }

        td.err {
            background: #ffecec
        }

        .banner {
            position: sticky;
            bottom: 56px;
            background: #fff6e5;
            border: 1px solid #ffd699;
            color: #995700;
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 8px;
            display: none
        }

        .banner.show {
            display: block
        }
    </style>
</head>

<body>
    <h3>NHAP TAM – khu vực nhập liệu</h3>

    <div class="grid">
        <!-- CỘT 1 -->
        <div class="card" id="col1">
            <div class="row"><label>địa điểm</label>
                <div id="lblDiaDiem" class="pill">CS1</div>
            </div>
            <div class="row"><label>tổng mặt hàng</label>
                <div id="lblTongMatHang" class="pill">0</div>
            </div>
            <hr />
            <div class="row"><label></label><input id="inpMa" placeholder="mã sản phẩm" autocomplete="off" />
            </div>
            <div class="sizes" id="sizesC1">
                <!-- size 0,38..45 (tự bật/tắt bằng JS) -->
                <input id="sz0" data-size="0" placeholder="0" inputmode="numeric" />
                <input id="sz38" data-size="38" placeholder="38" inputmode="numeric" />
                <input id="sz39" data-size="39" placeholder="39" inputmode="numeric" />
                <input id="sz40" data-size="40" placeholder="40" inputmode="numeric" />
                <input id="sz41" data-size="41" placeholder="41" inputmode="numeric" />
                <input id="sz42" data-size="42" placeholder="42" inputmode="numeric" />
                <input id="sz43" data-size="43" placeholder="43" inputmode="numeric" />
                <input id="sz44" data-size="44" placeholder="44" inputmode="numeric" />
                <input id="sz45" data-size="45" placeholder="45" inputmode="numeric" />
            </div>
        </div>

        <!-- CỘT 2 -->
        <div class="card" id="col2">
            <div class="row"><label>tên nhân viên</label>
                <div id="lblTenNV" class="pill">-</div>
            </div>
            <div class="row"><label>tổng số lượng</label>
                <div id="lblTongSoLuong" class="pill">0</div>
            </div>
            <hr />
            <div class="row"><label></label><input id="tong" placeholder="tong kiem" autocomplete="off" />
            </div>
            <div class="sizes" id="sizesC2">
                <!-- các ô nhập SL theo size cho luồng Enter; trùng id với C1 là cố ý: JS sẽ đọc cả 2 cột -->
                <input id="q0" data-size="0" placeholder="0" inputmode="numeric" />
                <input id="q38" data-size="38" placeholder="38" inputmode="numeric" />
                <input id="q39" data-size="39" placeholder="39" inputmode="numeric" />
                <input id="q40" data-size="40" placeholder="40" inputmode="numeric" />
                <input id="q41" data-size="41" placeholder="41" inputmode="numeric" />
                <input id="q42" data-size="42" placeholder="42" inputmode="numeric" />
                <input id="q43" data-size="43" placeholder="43" inputmode="numeric" />
                <input id="q44" data-size="44" placeholder="44" inputmode="numeric" />
                <input id="q45" data-size="45" placeholder="45" inputmode="numeric" />
            </div>
        </div>

        <!-- CỘT 3 -->
        <div class="card" id="col3">
            <div class="row"><label>ngày giờ</label>
                <div id="lblNgayGio" class="pill">-</div>
            </div>
            <div class="row"><label>số hóa đơn</label>
                <div id="lblSoHD" class="pill">nhaptamcs1_...</div>
            </div>
            <hr />
            <div class="row"><label>nhập nhanh (textarea)</label></div>
            <div class="row"><textarea id="taQuick" rows="8" placeholder="VD:
DGA-DEN 40 40 39
6496-SM 0 38 38 45"></textarea></div>
            <div id="unknownSku" class="row" style="display:none;color:#b00020;font-size:12px"></div>
        </div>
    </div>

    <h4>bang ket qua</h4>
    <div class="table-wrap">
        <table id="tblKQ">
            <thead>
                <tr>
                    <th>Mã hàng</th>
                    <th>0</th>
                    <th>38</th>
                    <th>39</th>
                    <th>40</th>
                    <th>41</th>
                    <th>42</th>
                    <th>43</th>
                    <th>44</th>
                    <th>45</th>
                    <th>tổng</th>
                    <th>Vị trí</th>
                    <th>tồn cs1</th>
                    <th>tồn cs2</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="banner" class="banner"></div>

    <div class="toolbar">
        <button id="btnChuyen1" class="btn">chuyen 1</button>
        <button id="btnThemMoi" class="btn">them moi</button>
        <button id="btnLuu" class="btn primary" disabled>luu</button>
        <button id="btnChuyen2" class="btn">chuyen 2</button>
    </div>

    <!-- scripts -->
    <!-- modules: các file có import/export -->
    <script type="module" src="./scripts/main.js"></script>
    <script type="module" src="./scripts/bangketqua.js"></script>
    <script type="module" src="./scripts/hoadon.js"></script>
    <script type="module" src="./scripts/luuhoadon.js"></script>
    <script type="module" src="./scripts/sohoadon.js"></script>

    <!-- scripts thuần cho trang mobile (không dùng import) -->
    <script src="./scripts/nhaptammobile.grid.js"></script>
    <script src="./scripts/nhaptammobile.controller.js"></script>

    <!-- Đăng nhập -->
    <div id="login-container"
        style="position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:99999;">
        <div style="background:#f9f9f9;padding:20px;border-radius:8px;box-shadow:0 0 10px #ccc;">
            <h3>Đăng nhập</h3>
            <form onsubmit="NTLogin.doLogin();return false;">
                <div> Email: <input id="lg-email" value="khohangcs1@gmail.com" readonly style="background:#eee"></div>
                <div> Mật khẩu: <input id="lg-pass" type="password" value="123123"></div>
                <div> Mã NV: <input id="lg-manv" placeholder="VD: NV001"></div>
                <button>Đăng nhập</button>
                <div id="lg-msg" style="color:#b00020;margin-top:6px"></div>
            </form>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const supabase = createClient(
            'https://rddjrmbyftlcvrgzlyby.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZGpybWJ5ZnRsY3ZyZ3pseWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3NjU4MDQsImV4cCI6MjA2MjM0MTgwNH0.-0xtqxn6b9OBz4unTTvJ4klxizWhHa1iSuYGm7cOYTM'
        );
        window.NTLogin = {
            async doLogin() {
                const email = document.getElementById('lg-email').value.trim().toLowerCase();
                const pass = document.getElementById('lg-pass').value.trim();
                const manv = document.getElementById('lg-manv').value.trim().toUpperCase();
                const msg = document.getElementById('lg-msg');
                msg.textContent = '';
                const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
                if (error) { msg.textContent = 'Đăng nhập thất bại: ' + error.message; return; }

                const { data: nv, error: errNV } = await supabase
                    .from('dmnhanvien').select('manv,tennv').eq('manv', manv).maybeSingle();
                if (errNV || !nv) { msg.textContent = 'Mã nhân viên không đúng'; await supabase.auth.signOut(); return; }

                localStorage.setItem('diadiem', 'cs1');
                localStorage.setItem('manv', nv.manv);
                localStorage.setItem('tennv', nv.tennv);

                // Đẩy lên UI
                document.getElementById('lblDiaDiem').textContent = 'CS1';
                document.getElementById('lblTenNV').textContent = nv.tennv;

                // Ẩn overlay đăng nhập
                document.getElementById('login-container').style.display = 'none';

                // Lấy số HĐ dự kiến sau khi đăng nhập xong
                try {
                    const so = await window.SoHoaDon?.goiSoDuKien?.('nhaptamcs1');
                    if (so) document.getElementById('lblSoHD').textContent = so;
                } catch (e) { }
            }
        }
    </script>

</body>

</html>
