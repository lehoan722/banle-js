<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>QLNV Dashboard</title>

  <link rel="stylesheet" href="dashboard.css" />
</head>

<body>

  <div id="login-container"></div>

  <div id="app-container">

    <!-- HEADER -->

    <header class="topbar">

      <div class="left">

        <h1>QUẢN LÝ NHÂN VIÊN</h1>

        <select id="selectDiadiem">
          <option value="cs1">Cơ sở 1</option>
          <option value="cs2">Cơ sở 2</option>
        </select>

      </div>

      <div class="right">

        <span id="storeModeBadge">
          NORMAL
        </span>

      </div>

    </header>

    <!-- MAIN -->

    <main class="dashboard-grid">

      <!-- TỔNG QUAN -->

      <section class="card">

        <h2>Tổng quan</h2>

        <div class="overview-grid">

          <div class="overview-item">
            <label>Nhân viên trong ca</label>
            <span id="tongNhanVien">0</span>
          </div>

          <div class="overview-item">
            <label>Đang phục vụ khách</label>
            <span id="dangPhucVu">0</span>
          </div>

          <div class="overview-item">
            <label>Task chưa xong</label>
            <span id="taskChuaXong">0</span>
          </div>

          <div class="overview-item">
            <label>Task hoàn thành</label>
            <span id="taskHoanThanh">0</span>
          </div>

        </div>

      </section>

      <!-- NHÂN VIÊN -->

      <section class="card">

        <div class="section-header">
          <h2>Nhân viên trong ca</h2>
        </div>

        <div id="staffContainer">

        </div>

      </section>

      <!-- TASK -->

      <section class="card">

        <div class="section-header">

          <h2>Công việc hôm nay</h2>

          <button id="btnThemTask">
            + Thêm task
          </button>

        </div>

        <div id="taskContainer">

        </div>

      </section>

      <!-- LOG -->

      <section class="card">

        <h2>Nhật ký vận hành</h2>

        <div id="logContainer">

        </div>

      </section>

    </main>

  </div>

  <div id="taskModal" class="modal hidden">
    <div class="modal-content">

      <h2>Thêm công việc</h2>

      <label>Nhân viên</label>
      <select id="taskAssignedTo"></select>

      <label>Loại việc</label>
      <select id="taskType">
        <option value="vesinh">Vệ sinh</option>
        <option value="kiemhang">Kiểm hàng</option>
        <option value="treomau">Treo mẫu</option>
        <option value="baymau">Bày mẫu</option>
        <option value="luanchuyen">Luân chuyển hàng</option>
        <option value="khac">Khác</option>
      </select>

      <label>Tiêu đề</label>
      <input id="taskTitle" type="text" placeholder="Ví dụ: Vệ sinh giá giày 01-05">

      <label>Mô tả</label>
      <textarea id="taskDescription" placeholder="Ghi chú chi tiết công việc"></textarea>

      <label>Khu vực</label>
      <input id="taskArea" type="text" placeholder="Ví dụ: Giá giày, kho sau, quầy áo">

      <label>Mức ưu tiên</label>
      <select id="taskPriority">
        <option value="1">Cao</option>
        <option value="2" selected>Bình thường</option>
        <option value="3">Thấp</option>
      </select>

      <label>Thời lượng dự kiến</label>
      <input id="taskEstimatedMinutes" type="number" min="5" step="5" value="30" placeholder="Ví dụ: 30 phút">

      <label class="checkbox-line">
        <input id="taskImageRequired" type="checkbox">
        Cần ảnh xác nhận
      </label>

      <div class="modal-actions">
        <button id="btnSaveTask">Lưu task</button>
        <button id="btnCloseTaskModal" type="button">Đóng</button>
      </div>

    </div>
  </div>

  <script type="module" src="dashboard.js"></script>

</body>

</html>
