<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Nhập Danh Mục Khách Hàng</title>
    <meta name="viewport" content="width=450">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9fb;
            padding: 32px;
        }

        .center-box {
            width: 420px;
            margin: 40px auto 0 auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 3px 18px #d6e3ef44;
            border: 1.5px solid #e3e9f1;
            padding: 28px 24px 18px 24px;
        }

        .form-title {
            font-size: 1.18em;
            font-weight: bold;
            letter-spacing: .4px;
            margin-bottom: 22px;
            color: #163163;
            text-align: center;
        }

        .row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .row label {
            width: 120px;
            font-size: 1em;
        }

        .row input,
        .row select {
            flex: 1;
            padding: 7px 10px;
            font-size: 1em;
            border-radius: 7px;
            border: 1.2px solid #b5bed5;
            background: #fcfcfe;
            outline: none;
            transition: border-color .18s;
        }

        .row input:focus {
            border-color: #1164be;
        }

        .required {
            color: #e23a1b;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 13px;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        .actions button {
            font-size: 1em;
            padding: 8px 22px;
            border-radius: 7px;
            border: none;
            box-shadow: 0 2px 6px #dee6ff33;
            cursor: pointer;
            transition: .13s;
            font-weight: 500;
        }

        .actions button.save {
            background: #18804f;
            color: #fff;
        }

        .actions button.new {
            background: #eaeaec;
        }

        .actions button.logout {
            background: #efebfa;
            color: #45427b;
        }

        .actions button:hover {
            opacity: .87;
        }

        .msg {
            text-align: center;
            padding: 10px 0 5px 0;
            min-height: 26px;
        }

        .msg.error {
            color: #fff;
            background: #c44736;
            border-radius: 6px;
        }

        .msg.success {
            color: #18804f;
            background: #e6f4e7;
            border-radius: 6px;
        }

        .loginbox {
            width: 320px;
            margin: 90px auto 0 auto;
            padding: 26px 30px 18px 30px;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 3px 14px #d7e2f633;
            border: 1.5px solid #e6eaf1;
        }

        .loginbox h2 {
            text-align: center;
            margin-bottom: 16px;
            font-weight: 700;
            color: #17305c;
        }

        .loginrow {
            margin-bottom: 15px;
        }

        .loginrow label {
            display: block;
            margin-bottom: 6px;
            color: #234;
        }

        .loginrow input {
            width: 100%;
            font-size: 1em;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1.2px solid #b5bed5;
            background: #fcfcfe;
            outline: none;
        }

        .loginrow input:focus {
            border-color: #1164be;
        }

        .loginbox .msg {
            min-height: 22px;
        }

        #makhSuggestList {
            background: #fff;
            box-shadow: 0 3px 18px #c3d3f655;
            border: 1.2px solid #b5bed5;
            border-radius: 8px;
            max-height: 220px;
            overflow: auto;
            font-size: .99em;
        }

        .suggest-item {
            padding: 7px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .suggest-item:last-child {
            border-bottom: none;
        }

        .suggest-item.active,
        .suggest-item:hover {
            background: #f3f8ff;
            color: #1164be;
        }

        .suggest-makh {
            font-weight: 600;
            width: 80px;
            color: #18408d;
        }

        .suggest-tenkh {
            color: #333;
            flex: 1;
        }

        .suggest-note {
            font-size: 12px;
            color: #b0b;
        }
    </style>
    </head>

<body>
  <!-- Main Form -->
  <div id="app-container" style="display:none;">
    <div id="mainform" class="center-box">
      <div class="form-title">NHẬP DANH MỤC KHÁCH HÀNG</div>

      <!-- 1) Điện thoại -->
      <div class="row">
        <label class="required">Điện thoại *</label>
        <input id="dienthoai" maxlength="10" autocomplete="off" placeholder="Nhập SĐT 10 số...">
      </div>

      <!-- 2) Tên khách -->
      <div class="row">
        <label class="required">Tên KH *</label>
        <input id="tenkh" maxlength="60" autocomplete="off" placeholder="Nhập tên khách hàng...">
      </div>

      <!-- 3) Mã KH (tự động = SĐT 10 số) -->
      <div class="row">
        <label class="required">Mã KH *</label>
        <input id="makh" maxlength="20" autocomplete="off" placeholder="Tự động theo SĐT" readonly
               style="background:#f3f4f6;">
      </div>

      <div class="row">
        <label>Là nhà cung cấp</label>
        <select id="la_ncc">
          <option value=""></option>
          <option value="">Không</option>
          <option value="true">Có</option>
        </select>
      </div>
      <div class="row">
        <label>Ngày sinh</label>
        <input id="ngaysinh" type="date" maxlength="12">
      </div>
      <div class="row">
        <label>Địa chỉ</label>
        <input id="diachi" maxlength="100">
      </div>
      <div class="row">
        <label>Email</label>
        <input id="email" maxlength="60">
      </div>
      <div class="row">
        <label>Tài khoản NH</label>
        <input id="taikhoan" maxlength="40">
      </div>
      <div class="row">
        <label>Mã số thuế</label>
        <input id="mst" maxlength="20">
      </div>
      <div class="row">
        <label>CCCD/CMND</label>
        <input id="cccd" maxlength="20">
      </div>

      <div class="actions">
        <button class="save" onclick="saveKH()">Lưu dữ liệu</button>
        <button class="new" onclick="resetForm()">Thêm mới</button>
        <button class="logout" onclick="doLogout()">Đăng xuất</button>
        <button class="save" style="background:#a7362d" onclick="deleteKH()">Xóa</button>
      </div>

      <div id="msgBox" class="msg"></div>
    </div>
  </div>

  <script type="module">
    import {
      khoiTaoDangNhapDungChung,
      dangXuatDungChung,
      getSupabaseClient,
    } from "./scripts/authModule.js";

    const TABLE = "dmkhachhang";
    let supabase = null;
    let editingOld = false;
    let lastLookupKey = "";

    function showMsg(msg, type) {
      const box = document.getElementById("msgBox");
      if (!box) return;
      box.textContent = msg || "";
      box.className = "msg" + (type ? " " + type : "");
      if (msg && type !== "error") setTimeout(() => { box.textContent = ""; }, 2500);
    }

    function getVal(id) { return document.getElementById(id)?.value || ""; }
    function setVal(id, val) { const el = document.getElementById(id); if (el) el.value = val ?? ""; }

    function digits10FromPhone(raw) {
      const digits = (raw || "").replace(/[^\d]/g, "");
      return digits.slice(0, 10);
    }

    function clearFieldsExceptPhone() {
      ["tenkh","ngaysinh","diachi","email","taikhoan","mst","cccd"].forEach(id => setVal(id, ""));
      setVal("la_ncc", "");
    }

    function setReadOnlyForExisting(isExisting) {
      const phone = document.getElementById("dienthoai");
      const makh = document.getElementById("makh");
      if (makh) makh.readOnly = true; // luôn khóa
      if (phone) phone.readOnly = !!isExisting; // có dữ liệu thì khóa SĐT để tránh đổi khóa chính
    }

    function validateForm() {
      const phone10 = digits10FromPhone(getVal("dienthoai"));
      const makh = getVal("makh").trim();
      const tenkh = getVal("tenkh").trim();
      if (!phone10 || phone10.length !== 10) return "SĐT phải là số, 10 ký tự!";
      if (!makh) return "Mã khách hàng đang trống (tự động theo SĐT).";
      if (!tenkh) return "Tên khách hàng không được bỏ trống!";
      return null;
    }

    function resetForm() {
      setVal("dienthoai", "");
      setVal("makh", "");
      clearFieldsExceptPhone();
      editingOld = false;
      lastLookupKey = "";
      setReadOnlyForExisting(false);
      showMsg("");
      document.getElementById("dienthoai")?.focus();
    }

    async function fetchByMakh(makh) {
      if (!makh) return;
      if (makh === lastLookupKey) return; // tránh gọi lặp
      lastLookupKey = makh;

      showMsg("Đang kiểm tra...", "");
      const { data, error } = await supabase.from(TABLE).select("*").eq("makh", makh).maybeSingle();
      if (error) return showMsg("Lỗi đọc dữ liệu: " + error.message, "error");

      if (data && data.makh) {
        // tồn tại -> nạp dữ liệu
        setVal("tenkh", data.tenkh);
        setVal("dienthoai", digits10FromPhone(data.dienthoai || makh)); // hiển thị 10 số
        setVal("makh", data.makh);
        setVal("ngaysinh", data.ngaysinh ? String(data.ngaysinh).slice(0,10) : "");
        setVal("diachi", data.diachi);
        setVal("email", data.email);
        setVal("taikhoan", data.taikhoan);
        setVal("mst", data.mst);
        setVal("cccd", data.cccd);
        setVal("la_ncc", data.la_ncc ? "true" : "");
        editingOld = true;
        setReadOnlyForExisting(true);
        showMsg("Đã nạp thông tin khách hàng. (SĐT là mã KH)", "success");
        setTimeout(() => document.getElementById("tenkh")?.focus(), 80);
      } else {
        // mã mới -> cho nhập
        editingOld = false;
        setReadOnlyForExisting(false);
        clearFieldsExceptPhone();
        showMsg("SĐT chưa có trong hệ thống. Nhập thông tin và bấm Lưu để thêm mới.", "");
        setTimeout(() => document.getElementById("tenkh")?.focus(), 80);
      }
    }

    function onPhoneInput() {
      const inp = document.getElementById("dienthoai");
      if (!inp || inp.readOnly) return;

      const phone10 = digits10FromPhone(inp.value);
      inp.value = phone10; // luôn chuẩn 10 số (tối đa)
      setVal("makh", phone10); // tự động đẩy vào mã KH

      // Nếu chưa đủ 10 số -> coi như đang nhập, reset trạng thái "mới"
      if (phone10.length < 10) {
        editingOld = false;
        lastLookupKey = "";
        clearFieldsExceptPhone();
        showMsg("");
        return;
      }

      // đủ 10 số -> kiểm tra tồn tại
      fetchByMakh(phone10);
    }

    async function saveKH() {
      const err = validateForm();
      if (err) return showMsg(err, "error");

      const phone10 = digits10FromPhone(getVal("dienthoai"));
      const obj = {
        makh: phone10,                // khóa chính = SĐT 10 số
        tenkh: getVal("tenkh").trim(),
        dienthoai: phone10,           // lưu luôn chuẩn 10 số
        ngaysinh: getVal("ngaysinh") || null,
        diachi: getVal("diachi") || null,
        email: getVal("email") || null,
        taikhoan: getVal("taikhoan") || null,
        mst: getVal("mst") || null,
        cccd: getVal("cccd") || null,
        la_ncc: getVal("la_ncc") === "true",
      };

      let error;
      if (editingOld) {
        ({ error } = await supabase.from(TABLE).update(obj).eq("makh", obj.makh));
      } else {
        ({ error } = await supabase.from(TABLE).insert(obj));
      }

      if (!error) {
        showMsg(editingOld ? "Đã cập nhật khách hàng!" : "Đã thêm khách hàng mới!", "success");
        // sau khi lưu xong -> coi như đã có
        editingOld = true;
        setReadOnlyForExisting(true);
        setTimeout(() => document.getElementById("tenkh")?.focus(), 100);
      } else {
        showMsg("Lỗi: " + error.message, "error");
      }
    }

    async function deleteKH() {
      const makh = getVal("makh").trim();
      if (!makh) return showMsg("Không có mã khách hàng để xóa!", "error");
      if (!editingOld) return showMsg("SĐT này chưa có trong hệ thống để xóa!", "error");
      if (!confirm(`Bạn có chắc chắn muốn xóa khách hàng ${makh}?`)) return;

      const { error } = await supabase.from(TABLE).delete().eq("makh", makh);
      if (!error) {
        showMsg(`✅ Đã xóa khách hàng ${makh}!`, "success");
        resetForm();
      } else {
        showMsg("❌ Lỗi khi xóa: " + error.message, "error");
      }
    }

    function bindEvents() {
      const phone = document.getElementById("dienthoai");
      phone?.addEventListener("input", onPhoneInput);
      phone?.addEventListener("blur", onPhoneInput);

      // Enter: nhảy field theo thứ tự mới (SĐT -> Tên -> ... )
      const order = ["dienthoai","tenkh","la_ncc","ngaysinh","diachi","email","taikhoan","mst","cccd"];
      document.querySelectorAll("#mainform input, #mainform select").forEach(el => {
        el.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter") {
            ev.preventDefault();
            const idx = order.indexOf(el.id);
            if (idx >= 0 && idx < order.length - 1) document.getElementById(order[idx + 1])?.focus();
            else document.getElementById("tenkh")?.focus();
          }
        });
      });

      window.saveKH = saveKH;
      window.resetForm = resetForm;
      window.deleteKH = deleteKH;
      window.doLogout = () => dangXuatDungChung({ reloadPage: true });
    }

    document.addEventListener("DOMContentLoaded", () => {
      khoiTaoDangNhapDungChung({
        appContainerId: "app-container",
        tuDongKhoaCoSo: false,
        macDinhDiaDiem: localStorage.getItem("diadiem") || "cs1",
        onLoginSuccess: async () => {
          supabase = getSupabaseClient();
          bindEvents();
          resetForm();
        },
      });
    });
  </script>
</body>
</html>
