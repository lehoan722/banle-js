
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Nhập Danh Mục Khách Hàng</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.5/dist/umd/supabase.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { margin: 5px 8px 5px 0; }
    #hot { margin-top: 20px; }
    #preview { margin-top: 20px; }
  </style>
</head>
<body>
  <h2>📋 Cập nhật Danh Mục Khách Hàng từ Excel/CSV</h2>
  <input type="file" id="fileInput" accept=".csv" />
  <button onclick="loadCSV()">📂 Đọc dữ liệu từ file</button>
  <button onclick="uploadToSupabase()">📤 Ghi vào Supabase</button>
  <button onclick="kiemTraTuSupabase()">🔍 Kiểm tra dữ liệu</button>
  <select id="modeSelect">
    <option value="">-- Chọn cách ghi dữ liệu --</option>
    <option value="overwrite">📝 Ghi đè tất cả</option>
    <option value="update">✏️ Chỉ cập nhật dữ liệu</option>
  </select>
  <div id="hot"></div>
  <div id="preview"></div>
  <script>
    const SUPABASE_URL = 'https://rddjrmbyftlcvrgzlyby.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...';
    const TABLE_NAME = 'dmkhachhang';

    const columns = [
      { data: 'makh', type: 'text' },
      { data: 'tenkh', type: 'text' },
      { data: 'ngaysinh', type: 'date', dateFormat: 'YYYY-MM-DD', correctFormat: true },
      { data: 'diachi', type: 'text' },
      { data: 'dienthoai', type: 'text' },
      { data: 'email', type: 'text' },
      { data: 'taikhoan', type: 'text' },
      { data: 'mst', type: 'text' },
      { data: 'cccd', type: 'text' },
      { data: 'la_ncc', type: 'checkbox' }
    ];

    const hot = new Handsontable(document.getElementById('hot'), {
      data: Array.from({ length: 100 }, () => ({})),
      columns,
      colHeaders: columns.map(c => c.data),
      rowHeaders: true,
      minSpareRows: 1,
      width: '100%',
      height: 500,
      stretchH: 'all',
      licenseKey: 'non-commercial-and-evaluation'
    });

    function parseDate(val) {
      if (!val) return null;
      if (typeof val === 'string' && val.includes('/')) {
        const [d, m, y] = val.split('/');
        if (d && m && y) return `${y.padStart(4, '20')}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
      }
      const d = new Date(val);
      return isNaN(d.getTime()) ? null : d.toISOString().split("T")[0];
    }

    function cleanRow(row, full = true) {
      const fields = {
        makh: "text", tenkh: "text", ngaysinh: "date",
        diachi: "text", dienthoai: "text", email: "text",
        taikhoan: "text", mst: "text", cccd: "text",
        la_ncc: "boolean"
      };
      const cleaned = {};
      for (const key in fields) {
        let val = row[key];
        if (val === "" || val == null || (typeof val === "string" && val.trim() === "")) {
          if (full) cleaned[key] = null;
          continue;
        }
        if (fields[key] === "numeric") {
          cleaned[key] = isNaN(Number(val)) ? null : Number(val);
        } else if (fields[key] === "boolean") {
          const v = val.toString().toLowerCase();
          cleaned[key] = (v === "true" || v === "1" || v === "x" || v === "yes");
        } else if (fields[key] === "date") {
          cleaned[key] = parseDate(val);
        } else {
          let textVal = val.toString();
          if (key === "makh") textVal = textVal.toUpperCase();
          cleaned[key] = textVal;
        }
      }
      return cleaned;
    }

    function loadCSV() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return alert('Vui lòng chọn file CSV.');
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function (results) {
          const data = results.data.map(row => {
            const normalized = {};
            for (const key in row) {
              normalized[key.toLowerCase()] = row[key];
            }
            return normalized;
          });
          hot.loadData(data);
        }
      });
    }

    async function uploadToSupabase() {
      const rawData = hot.getData();
      const headers = columns.map(c => c.data);
      const data = rawData.map(row => {
        const obj = {};
        headers.forEach((key, i) => obj[key] = row[i]);
        return obj;
      }).filter(r => r.makh && r.makh.toString().trim() !== "");

      if (!data.length) return alert("Không có dòng hợp lệ.");
      if (!confirm("Bạn có chắc muốn ghi dữ liệu vào Supabase?")) return;

      let inserted = 0, updated = 0, failed = 0, errors = [];
      const mode = document.getElementById("modeSelect").value;
      if (!mode) return alert("❗ Vui lòng chọn cách ghi dữ liệu.");

      for (let i = 0; i < data.length; i += 1000) {
        const batch = data.slice(i, i + 1000).map(row => cleanRow(row, mode !== "update"));
        try {
          const res = await fetch(SUPABASE_URL + "/rest/v1/" + TABLE_NAME, {
            method: "POST",
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: "Bearer " + SUPABASE_KEY,
              "Content-Type": "application/json",
              Prefer: "resolution=merge-duplicates,return=representation"
            },
            body: JSON.stringify(batch)
          });
          const result = await res.json();
          if (!res.ok) {
            failed += batch.length;
            errors.push("❌ Batch lỗi: " + JSON.stringify(result));
          } else {
            result.forEach(r => {
              if (r.updated_at) updated++; else inserted++;
            });
          }
        } catch (e) {
          failed += batch.length;
          errors.push(`⚠️ Lỗi kết nối batch ${i + 1}: ${e.message}`);
        }
      }

      document.getElementById("preview").innerHTML = `
        <h3>Kết quả:</h3>
        <ul>
          <li>🆕 Thêm mới: ${inserted}</li>
          <li>♻️ Ghi đè: ${updated}</li>
          <li>❌ Lỗi: ${failed}</li>
        </ul>
        ${errors.length ? `<details><summary>Chi tiết lỗi</summary><pre>${errors.join('\n')}</pre></details>` : ""}
      `;
    }

    async function kiemTraTuSupabase() {
      const allData = hot.getData();
      const makhIndex = columns.findIndex(c => c.data === 'makh');
      const makhList = Array.from(new Set(allData.map(row => row[makhIndex]).filter(m => m && typeof m === 'string' && m.trim() !== '').map(m => m.trim().toUpperCase())));
      if (makhList.length === 0) return alert("Không có mã khách hàng hợp lệ.");

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const { data: serverData, error } = await client.from(TABLE_NAME).select(columns.map(c => c.data).join(",")).in('makh', makhList);
      if (error) return alert("❌ Lỗi truy vấn Supabase.");

      const dataMap = {};
      serverData.forEach(item => dataMap[item.makh.toUpperCase()] = item);

      hot.batch(() => {
        allData.forEach((row, rowIndex) => {
          const makh = row[makhIndex];
          if (!makh) return;
          const fresh = dataMap[makh.toUpperCase()];
          if (!fresh) return;
          columns.forEach((col, colIndex) => {
            if (col.data === 'makh') return;
            hot.setDataAtCell(rowIndex, colIndex, fresh[col.data] ?? null);
          });
        });
      });

      alert("✅ Đã cập nhật dữ liệu từ Supabase.");
    }
  </script>
</body>
</html>
