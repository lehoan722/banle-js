<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Tra cứu Hóa Đơn Bán Lẻ 222</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 12px; }
    h2 { margin-top: 0; }
    .filters { display: grid; grid-template-columns: repeat(6, minmax(160px,1fr)); gap: 8px; align-items: center; }
    select[multiple] { min-height: 110px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
    .summary { margin: 10px 0; }
    table.data { width: 100%; border-collapse: collapse; }
    table.data th, table.data td { border: 1px solid #ddd; padding: 6px 8px; }
    table.data th { background: #f7f7f7; text-align: left; }
    td.num { text-align: right; }
    .pager { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
    .btn-danger { background:#d33; color:#fff; border:0; padding:6px 10px; border-radius:6px; cursor:pointer;}
    .btn { padding:6px 10px; border:1px solid #ccc; border-radius:6px; cursor:pointer; background:#fff; }
    .badge-ok{color:green} .badge-err{color:#d00;font-weight:600}
    /* Hover & Active row (giống 111) */
    table.data tbody tr:hover { background: #fffbe6; }
    table.data tbody tr.active { background: #ffe08a; }
    table.data tbody tr td:first-child { width: 36px; }
    table.data tbody tr { cursor: pointer; }
    /* Popup */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;}
    .modal .panel{background:#fff;min-width:60vw;max-width:80vw;max-height:80vh;overflow:auto;border-radius:10px;padding:12px;}
    .modal h3{margin-top:0}
    .modal table{width:100%;border-collapse:collapse}
    .modal th,.modal td{border:1px solid #ddd;padding:6px 8px;}
  </style>
</head>
<body>
  <h2>🧾 Tra cứu Hóa Đơn Bán Lẻ (222)</h2>

  <div class="filters">
    <input type="date" id="tuNgay" />
    <input type="date" id="denNgay" />

    <select id="loaihd" multiple>
      <!-- mặc định chọn hai loại bán <option value="bancs1" selected>ban cs1</option> -->
      <option value="bancs1" >ban cs1</option>
      <option value="bancs2" >ban cs2</option>
      <!-- mở rộng đầy đủ như 111 -->
      <option value="bannvcs1">bannv cs1</option>
      <option value="bannvcs2">bannv cs2</option>
      <option value="nmcs1">nhập mua cs1</option>
      <option value="nmcs2">nhập mua cs2</option>
      <option value="xcncs1">xuất CN cs1</option>
      <option value="xcncs2">xuất CN cs2</option>
      <option value="ncncs1">nhập CN cs1</option>
      <option value="ncncs2">nhập CN cs2</option>
      <option value="nhapkiem">nhập kiểm</option>
      <option value="xuatkiem">xuất kiểm</option>
      <option value="nhaptam">nhập tạm</option>
      <option value="nhapdoi">nhập đổi</option>
      <option value="tralaincc">trả lại NCC</option>
      <!-- nếu còn loại khác, thêm ở đây -->
    </select>

    <select id="groupMode">
      <option value="invoice" selected>Chi tiết từng hóa đơn</option>
      <option value="day">Tổng hợp theo ngày</option>
      <option value="month">Tổng hợp theo tháng</option>
      <option value="year">Tổng hợp theo năm</option>
      
    </select>

    <select id="diadiem">
      <option value="">Tất cả cơ sở</option>
      <option value="cs1">Cơ sở 1</option>
      <option value="cs2">Cơ sở 2</option>
    </select>

    <input id="nhanvien" placeholder="Nhân viên" />
    <input id="khach" placeholder="Khách hàng" />
    <input id="tienTu" placeholder="Tiền từ" type="number" />
    <input id="tienDen" placeholder="Tiền đến" type="number" />
    <input id="sohd" placeholder="Số HĐ" />

    <textarea id="maspList" placeholder="Danh sách mã SP, cách nhau dấu cách hoặc xuống dòng" rows="3"></textarea>
    <label class="row"><input type="checkbox" id="mustAll" /> HĐ phải chứa tất cả mã</label>

    <div class="row">
      <label for="pageSize">Số dòng/trang:</label>
      <select id="pageSize">
        <option value="10000" selected>10.000</option>        
        <option value="5000">5.000</option>
        <option value="1000">1.000</option>        
      </select>
    </div>

    <div class="row">
      <button id="btnLoc" class="btn">🔎 Lọc</button>
      <button id="btnCopy" class="btn">📋 Copy bảng</button>
      <button id="btnDelete" class="btn-danger">❌ Xóa HĐ đã chọn</button>
    </div>
  </div>

  <div id="summary" class="summary"></div>

  <table id="tbl" class="data">
    <thead>
      <tr>
        <th><input type="checkbox" id="chkAll" /></th>
        <th>#</th>
        <th>Ngày</th>
        <th>Số HĐ</th>
        <th>Cơ sở</th>
        <th>NV</th>
        <th>Khách</th>
        <th>SL (chi tiết)</th>
        <th>TT (chi tiết)</th>
        <th>SL (header)</th>
        <th>Lệch SL</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="pager">
    <button id="prev" class="btn">&lt; Trang trước</button>
    <span id="pageInfo"></span>
    <button id="next" class="btn">Trang sau &gt;</button>
  </div>

  <!-- Popup chi tiết HĐ -->
  <div id="modal" class="modal">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3>Chi tiết hóa đơn: <span id="modalSohd"></span></h3>
        <div class="row">
          <button id="btnCopyDetail" class="btn">📋 Copy chi tiết</button>
          <button id="btnClose" class="btn">Đóng</button>
        </div>
      </div>
      <table id="tblDetail">
        <thead>
          <tr>
            <th>#</th><th>Mã SP</th><th>Tên SP</th><th>Size</th><th>SL</th><th>Giá</th><th>KM</th><th>Thành tiền</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

    );
  </script>

  <script src="scripts/xemhoadon222.js"></script>
</body>
</html>
