<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cài đặt tài khoản nhận tiền</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.6.1/dist/handsontable.full.min.css" />

  <style>
    :root {
      --border: #d8dde6;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #172033;
      --muted: #657087;
      --primary: #1769aa;
      --danger: #b42318;
      --success: #067647;
      --warning-bg: #fff7e6;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    #app-container { display: none; }

    .page {
      width: min(1500px, calc(100% - 24px));
      margin: 12px auto;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(16, 24, 40, 0.05);
    }

    .toolbar h1 {
      margin: 0 auto 0 0;
      font-size: 21px;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 12px;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover:not(:disabled) { background: #f2f4f7; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.primary { color: white; background: var(--primary); border-color: var(--primary); }
    button.danger { color: white; background: var(--danger); border-color: var(--danger); }

    .info-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 10px 0;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    #save-status { font-weight: 700; }
    #save-status.dirty { color: #b54708; }
    #save-status.saved { color: var(--success); }
    #save-status.error { color: var(--danger); }

    #table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      min-height: 520px;
    }

    #account-table { width: 100%; height: calc(100vh - 175px); min-height: 500px; }

    .help {
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid #fedf89;
      border-radius: 8px;
      background: var(--warning-bg);
      color: #7a2e0e;
      line-height: 1.45;
      font-size: 14px;
    }

    .htInvalid { background: #fee4e2 !important; }

    @media (max-width: 760px) {
      .toolbar h1 { width: 100%; }
      .toolbar button { flex: 1 1 auto; }
      #account-table { height: calc(100vh - 260px); }
    }
  </style>
</head>
<body>
  <div id="login-container"></div>

  <main id="app-container">
    <div class="page">
      <section class="toolbar">
        <h1>Cài đặt tài khoản nhận tiền</h1>
        <button id="btn-add" type="button">+ Thêm dòng</button>
        <button id="btn-delete" type="button" class="danger">Xóa dòng đã chọn</button>
        <button id="btn-reload" type="button">Tải lại</button>
        <button id="btn-save" type="button" class="primary" disabled>Lưu thay đổi</button>
        <button id="btn-logout" type="button">Đăng xuất</button>
      </section>

      <section class="info-row">
        <div>ADMIN: <strong id="admin-name">—</strong></div>
        <div id="save-status" class="saved">Dữ liệu đã đồng bộ</div>
      </section>

      <section id="table-wrap">
        <div id="account-table"></div>
      </section>

      <div class="help">
        Tài khoản chính phải để trống “Số cuối hóa đơn”. Tài khoản không phải tài khoản chính bắt buộc nhập số cuối từ 0 đến 9. Mỗi địa điểm và loại hóa đơn chỉ có một tài khoản chính, đồng thời không được trùng số cuối hóa đơn.
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/handsontable@14.6.1/dist/handsontable.full.min.js"></script>
  <script type="module" src="./scripts/caidattaikhoan.js"></script>
</body>
</html>
