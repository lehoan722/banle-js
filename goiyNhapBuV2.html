<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gợi ý nhập bù V2.3.4 - XNT19</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.css">
<script src="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.wrap{padding:12px}.card{background:#fff;border:1px solid #dbe4ed;border-radius:12px;padding:12px;margin-bottom:10px}
.title{font-size:23px;font-weight:900;color:#075f9f}.sub{font-size:13px;color:#5d6b7b;margin-top:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.field{display:flex;flex-direction:column;gap:4px}
label{font-size:12px;font-weight:800;color:#526171}textarea,input,select{border:1px solid #b9c8d6;border-radius:8px;padding:8px;font:inherit}
textarea{width:270px;min-height:72px}button{height:40px;border:0;border-radius:8px;padding:0 14px;font-weight:900;cursor:pointer}
.p{background:#0878d1;color:white}.g{background:#15945d;color:#fff}.s{background:#e6f1f8;color:#075f9f}.w{background:#fff1bf;color:#725100}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin-bottom:10px}
.box{background:#fff;border:1px solid #dbe4ed;border-radius:11px;padding:10px}.box .k{font-size:11px;color:#607086;font-weight:800}.box .v{font-size:22px;color:#075f9f;font-weight:900}
.tableWrap{overflow:auto;background:#fff;border:1px solid #dbe4ed;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:1500px}
th,td{padding:8px;border-bottom:1px solid #e4ebf1;border-right:1px solid #edf2f6;vertical-align:top}th{background:#f5f9fd;white-space:nowrap;position:sticky;top:0}
.code{font-weight:900;color:#075f9f}.codeLink{cursor:pointer;text-decoration:underline;text-underline-offset:2px}.num{font-weight:900}.mini{font-size:11px;color:#64748b;line-height:1.35}
.badge{padding:4px 7px;border-radius:999px;font-size:11px;font-weight:900}.need{background:#ffdada;color:#a51616}.watch{background:#fff0bd;color:#7f5b00}.no{background:#edf1f4;color:#64748b}
.nccRow{cursor:pointer}.nccRow:hover{background:#eef6ff}.hidden{display:none}.status{font-size:12px;color:#607086;margin-top:7px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;align-items:center;justify-content:center;padding:12px}
.modalCard{background:#fff;border-radius:12px;width:min(1000px,96vw);max-height:90vh;overflow:auto;padding:12px}
pre{white-space:pre-wrap;background:#f7fafc;border:1px solid #dbe4ed;border-radius:8px;padding:10px;font-size:12px}
.cfg{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:8px}

.win{font-weight:900;white-space:nowrap}.w3{color:#c62828}.w7{color:#1565c0}.w14{color:#2e7d32}.w21{color:#8e24aa}.w30{color:#ef6c00}
.groupRead{font-weight:900;color:#075f9f}.liveOk{color:#137333;font-weight:900}.liveWarn{color:#b42318;font-weight:900}
.auditTable{min-width:640px}.auditTable th{position:static}.sectionTitle{font-size:15px;color:#075f9f;margin:14px 0 6px;font-weight:900}
.autoSaveNote{font-size:11px;color:#64748b;margin-top:8px}


/* ===== V2.2: StockQuickPopup gọn riêng trên trang Nhập bù ===== */
body.nb2-page .sq-stock-popup{
  width:min(820px,calc(100vw - 18px)) !important;
  max-width:min(820px,calc(100vw - 18px)) !important;
  min-width:0 !important;
  top:6px !important;
  right:6px !important;
  height:calc(100vh - 12px) !important;
  max-height:calc(100vh - 12px) !important;
  padding:6px 8px !important;
  font-size:15px !important;
  line-height:1.18 !important;
}
body.nb2-page .sq-stock-popup .sq-stock-popup-header{font-size:14px !important;line-height:1.15 !important}
body.nb2-page .sq-stock-popup .sq-title-text,
body.nb2-page .sq-stock-popup .sq-title-masp{font-size:15px !important}
body.nb2-page .sq-stock-popup th,
body.nb2-page .sq-stock-popup td{font-size:14px !important;padding-top:3px !important;padding-bottom:3px !important}
body.nb2-page .sq-stock-popup .sq-stock-table-wrapper{overflow-x:auto !important;max-width:100% !important}
body.nb2-page .sq-stock-popup .sq-img-wrapper img{max-height:300px !important;object-fit:contain !important}
body.nb2-page .sq-stock-popup .sq-stock-table-wrapper{
  overflow-x:auto !important;
}
body.nb2-page .sq-stock-popup .sq-stock-table-wrapper table{

  min-width:0 !important;

}
body.nb2-page .sq-stock-popup .sq-stock-table-wrapper th,

}
body.nb2-page .sq-stock-popup .sq-stock-table-wrapper th:first-child,

  max-width:58px !important;
  text-align:center !important;
}


/* ===== Giải thích cấu hình ===== */
.infoTip{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;min-width:18px;padding:0;margin-left:4px;
  border-radius:50%;border:1px solid #93b4d1;background:#eef6ff;color:#075f9f;
  font-size:11px;font-weight:900;vertical-align:middle;cursor:pointer
}
.infoTip::after{
  content:attr(data-tip);display:none;position:absolute;z-index:10020;
  left:50%;top:calc(100% + 7px);transform:translateX(-50%);
  width:min(320px,80vw);padding:8px 10px;border-radius:8px;
  background:#172033;color:#fff;font-size:12px;font-weight:500;line-height:1.35;
  box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:normal;text-align:left
}
.infoTip:hover::after,.infoTip:focus::after,.infoTip.open::after{display:block}

.badge.sizeNeed{background:#ffd1d1;color:#9f1111;border:1px solid #f0a7a7}
.badge.sizeWatch{background:#ffeaa7;color:#765500;border:1px solid #e8cd70}
.sizeHot{color:#b42318;font-weight:900}
.sizeWatchTxt{color:#8a6500;font-weight:900}
.sizeTable{min-width:980px !important}
.sizeTable th{position:static}


/* ===== V2.3 - Tong hop bu NCC ===== */
.orderModal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:11000;padding:10px}
.orderModal.show{display:flex;align-items:stretch;justify-content:center}
.orderCard{width:min(1500px,99vw);height:calc(100vh - 20px);background:#fff;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.28)}
.orderHead{padding:9px 12px;border-bottom:1px solid #dbe4ed;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.orderHead h3{margin:0;color:#075f9f;font-size:19px}
.orderStats{font-size:12px;color:#526171;font-weight:700}
.orderActions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.orderBody{flex:1;min-height:0;padding:8px}
#hotOrder{width:100%;height:100%;overflow:hidden}
.orderBody .handsontable{max-width:100%!important}
.orderBody .wtHolder{max-width:100%!important}
.orderBody .ht_master .wtHolder{overflow:auto!important}
.orderBody .handsontable th,
.orderBody .handsontable td{padding-left:4px!important;padding-right:4px!important;white-space:nowrap!important}

.handsontable th{background:#f4f7fa!important;font-weight:800!important}
.handsontable td{font-size:12px}
.handsontable .htDropdownMenu,.htFiltersMenu{z-index:12000!important}
.handsontable td.order-red{color:#d71920!important;font-weight:900!important}
.handsontable td.order-blue{color:#143cff!important;font-weight:900!important}

.orderBody{
  overflow:auto !important;
  display:block !important;
}
#hotOrder{
  width:auto !important;
  height:100% !important;
  overflow:visible !important;
}
.orderBody .handsontable{
  max-width:none !important;
}
.orderBody .wtHolder{
  max-width:none !important;
}
.orderBody .handsontable th,
.orderBody .handsontable td{
  padding-left:4px !important;
  padding-right:4px !important;
  white-space:nowrap !important;
  line-height:1.15 !important;
}
.orderBody .handsontable th{
  height:34px !important;
}
.orderBody .handsontable td{
  height:24px !important;

/* Mỗi mã sản phẩm giữ cùng một nền; đổi mã thì đổi tông */
.orderBody .handsontable td.order-group-0{background:#ffffff !important}
.orderBody .handsontable td.order-group-1{background:#eef5ff !important}
.orderBody .handsontable td.order-group-2{background:#fff8e8 !important}
.orderBody .handsontable td.order-group-3{background:#eefaf1 !important}
.orderBody .handsontable td.order-group-start{
  border-top:2px solid #9eb1c4 !important;
}

/* Giữ màu chữ quan trọng trên nền nhóm */
.orderBody .handsontable td.order-red{color:#d71920 !important;font-weight:900 !important}
.orderBody .handsontable td.order-blue{color:#143cff !important;font-weight:900 !important}


/* V2.3.4 - đường tắt nghiệp vụ chính */
.nccOrderLink{
  color:#0b5fa5;
  font-weight:900;
  text-decoration:underline;
  cursor:pointer;
  font-size:16px;
}
.nccOrderLink:hover{color:#003f78}
.nccDetailHint{
  display:inline-block;
  margin-left:7px;
  font-size:11px;
  color:#6b7280;
  text-decoration:underline;
  cursor:pointer;
  font-weight:600;
}
.nccDetailHint:hover{color:#111827}

.orderMaspLink{
  color:#0b5fa5;
  text-decoration:underline;
  cursor:pointer;
  font-weight:800;
}
.orderMaspLink:hover{color:#003f78}

.orderBtn{height:34px;padding:0 12px;background:#0f766e;color:#fff}
.zeroBlank{color:transparent}

@media(max-width:800px){.summary,.cfg{grid-template-columns:1fr 1fr}textarea{width:100%}.field{flex:1 1 100%}}
</style>

<body class="nb2-page">
<div id="login-container"></div>
<div id="app-container"><main class="wrap">

<div class="card">
  <div class="title">GỢI Ý NHẬP BÙ V2.3.4 · ĐỘC LẬP XNT19</div>
  <div class="sub">Không dùng Năng lực bán. Nhập, bán, tồn và size đều lấy trực tiếp từ XNT19 V6 chuẩn.</div>
  <div class="row" style="margin-top:10px">
    <div class="field"><label>Mã sản phẩm (mỗi mã 1 dòng)</label><textarea id="codes" placeholder="409-AP.TRANG&#10;442-APMD.TRANG"></textarea></div>
    <div class="field"><label>Nhà cung cấp</label><input id="supplier" placeholder="Giá trị cột nhacc"></div>
    <div class="field"><label>Ngày tính</label><input id="date" type="date"></div>
    <div class="field"><label>Thao tác</label><div class="row">
      <button id="load" class="p">Tải dữ liệu</button>
      <button id="refresh" class="g">Tính lại dữ liệu nền</button>
      <button id="overview" class="s">Tổng quan NCC</button>
      <button id="config" class="w">Cấu hình</button>
    </div></div>
  </div>
  <div id="status" class="status">Sẵn sàng.</div>
</div>

<div id="cfgCard" class="card hidden">
  <div class="title" style="font-size:18px">CẤU HÌNH NHẬP BÙ V2</div>
  <div class="cfg">
    <div class="field">
      <label>Quan tâm hàng nhập trong (tháng)<button type="button" class="infoTip" data-tip="Chỉ những mã có nhập mua gần nhất trong khoảng thời gian này mới được đưa vào diện phân tích nhập bù.">ⓘ</button></label>
      <input id="c_recent" type="number" min="1">
    </div>
    <div class="field">
      <label>Gộp đợt nhập ≤ ngày<button type="button" class="infoTip" data-tip="Hai lần nhập mua cách nhau không quá số ngày này được coi là cùng một đợt nhập.">ⓘ</button></label>
      <input id="c_gap" type="number" min="0">
    </div>
    <div class="field">
      <label>Ngưỡng tỷ lệ bán đợt (%)<button type="button" class="infoTip" data-tip="Đối với nhập bù thông thường, mã phải bán được tối thiểu tỷ lệ này của tồn sau đợt mới được xét. Nhánh thiếu size nhanh hoạt động độc lập với ngưỡng này.">ⓘ</button></label>
      <input id="c_ratio" type="number">
    </div>
    <div class="field">
      <label>Hàng về sau (ngày)<button type="button" class="infoTip" data-tip="Số ngày trung bình từ lúc đặt hàng nhà cung cấp đến khi hàng thực tế về cửa hàng.">ⓘ</button></label>
      <input id="c_lead" type="number">
    </div>
    <div class="field">
      <label>Nhập đủ bán cho (ngày)<button type="button" class="infoTip" data-tip="Sau khi hàng về, hệ thống tính lượng nhập để đủ bán thêm số ngày này. Ví dụ hàng về 3 ngày và nhập đủ bán 14 ngày thì chân trời tính là 17 ngày.">ⓘ</button></label>
      <input id="c_target" type="number">
    </div>
    <div class="field">
      <label>Điểm cần quan tâm<button type="button" class="infoTip" data-tip="Mã chưa cần nhập ngay nhưng có điểm ưu tiên từ mức này trở lên sẽ nằm trong nhóm Cần quan tâm. Điểm không được dùng để phủ quyết mã đã thực sự cần nhập.">ⓘ</button></label>
      <input id="c_watch" type="number">
    </div>
    <div class="field">
      <label>Bán tối thiểu để học size riêng (SP)<button type="button" class="infoTip" data-tip="Nếu mã đã bán theo size ít nhất số lượng này trong 90 ngày, hệ thống học tỷ trọng size của chính mã. Nếu chưa đủ, hệ thống dùng tỷ trọng size của nhóm hàng trong 365 ngày.">ⓘ</button></label>
      <input id="c_size" type="number" min="1">
    </div>
    <div class="field">
      <label>Kiểm tra thiếu size trong (ngày)<button type="button" class="infoTip" data-tip="Cửa sổ thời gian gần nhất để phát hiện một size đang bán nhưng vừa bị hết. Mặc định 10 ngày.">ⓘ</button></label>
      <input id="c_size_days" type="number" min="1">
    </div>
    <div class="field">
      <label>Size bán tối thiểu để bù (SP)<button type="button" class="infoTip" data-tip="Nếu tồn size bằng 0 và size đó bán ít nhất số SP này trong cửa sổ thiếu size, mã được đặc cách Cần nhập bù · Thiếu size. Mặc định 2 SP.">ⓘ</button></label>
      <input id="c_size_sales" type="number" min="1">
    </div>
  </div>
  <div class="row" style="margin-top:10px">
    <button id="resetCfg" class="w">↺ Đặt lại cấu hình chuẩn</button>
  </div>
  <div class="autoSaveNote">Các thay đổi cấu hình được tự động lưu âm thầm.</div>
</div>

<div id="summary" class="summary"></div>
<div id="toolbar" class="row hidden" style="margin-bottom:8px"><button id="back" class="s">← Tổng quan NCC</button><b id="detailTitle"></b><button id="orderBtn" class="orderBtn hidden">Tổng hợp bù</button></div>
<div id="content"></div>

</main></div>

<div id="modal" class="modal"><div class="modalCard">
  <div class="row"><h3 id="modalTitle" style="margin:0;color:#075f9f">Kiểm tra</h3><button id="close" class="s" style="margin-left:auto">Đóng</button></div>
  <div id="modalBody"></div>
</div></div>


<div id="orderModal" class="orderModal">
  <div class="orderCard">
    <div class="orderHead">
      <h3 id="orderTitle">TỔNG HỢP NHẬP BÙ</h3>
      <span id="orderStats" class="orderStats"></span>
      <div class="orderActions">
        <button id="orderCompact" class="s">Rút gọn</button>
        <button id="orderCopyShort" class="p">Copy đơn đặt</button>
        <button id="orderCopyAll" class="s">Copy toàn bộ</button>
        <button id="orderReset" class="w">Đặt lại theo gợi ý</button>
        <button id="orderClose" class="s">Đóng</button>
      </div>
    </div>
    <div class="orderBody"><div id="hotOrder"></div></div>
  </div>
</div>

<script type="module" src="./scripts/stockQuickPopup.js"></script>
<script type="module">
import {
 refreshNhapBuV2,tongQuanHeThongV2,tongQuanNccV2,chiTietNhapBuV2,
 kiemTraNguonV2,phanBoSizeV2,getConfigV2,setConfigV2,resetConfigV2
} from './scripts/nhapBuV2.js';

const $=id=>document.getElementById(id);
const fmt=(v,d=1)=>v==null||v===''?'—':Number(v).toLocaleString('vi-VN',{maximumFractionDigits:d});
const blank0=v=>v==null||v===''||Number(v)===0?'':Number(v).toLocaleString('vi-VN',{maximumFractionDigits:1});
const fmtSpeed=v=>{
  if(v==null||v==='') return '—';
  const n=Number(v);
  if(Math.abs(n)<0.0000001) return '0';
  return n.toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2});
};
const winHtml=(vals,kind='qty')=>{
  const cls=['w3','w7','w14','w21','w30'];
  return vals.map((v,i)=>`<span class="win ${cls[i]}">${kind==='speed'?fmtSpeed(v):fmt(v,0)}</span>`).join('<span class="mini"> / </span>');
};
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
$('date').value=today();

const codes=()=>[...new Set($('codes').value.split(/\r?\n/).map(x=>x.trim().toUpperCase()).filter(Boolean))];
let currentSupplier=null;
let currentDetailRows=[];
let orderHot=null;
let orderRows=[];
let orderCompact=false;
let orderGroupColorMap=new Map();

const ORDER_FULL_HEADERS=[
  'STT','Mã SP','Size','SL hệ thống gợi ý','SL đặt',
  'Tồn hiện tại','Tồn sau Đặt','Bán gần','Tên','Nhóm','Lý do'
];

const ORDER_FULL_COLUMNS=[
  {data:'stt',type:'numeric',readOnly:true,width:45},
  {data:'masp',type:'text',readOnly:true,width:145},
  {data:'size',type:'text',readOnly:true,width:55},
  {data:'sl_goi_y',type:'numeric',readOnly:true,width:108},
  {data:'sl_dat',type:'numeric',numericFormat:{pattern:'0'},width:72,className:'order-red'},
  {data:'ton_hien_tai',type:'numeric',readOnly:true,width:86},
  {data:'ton_sau_dat',type:'numeric',readOnly:true,width:94,className:'order-blue'},
  {data:'ban_gan',type:'numeric',readOnly:true,width:72},
  {data:'ten',type:'text',readOnly:true,width:120},
  {data:'nhom',type:'text',readOnly:true,width:66},
  {data:'ly_do',type:'text',readOnly:true,width:96}
];

const ORDER_COMPACT_HEADERS=['STT','Mã SP','Size','SL đặt'];
const ORDER_COMPACT_COLUMNS=[
  {data:'stt',type:'numeric',readOnly:true,width:46},
  {data:'masp',type:'text',readOnly:true,width:165},
  {data:'size',type:'text',readOnly:true,width:58},
  {data:'sl_dat',type:'numeric',numericFormat:{pattern:'0'},width:78,className:'order-red'}
];

const ORDER_FULL_WIDTH=990;
const ORDER_COMPACT_WIDTH=355;

function badge(a){
  if(a==='CAN_NHAP_BU_THIEU_SIZE') return '<span class="badge sizeNeed">CẦN NHẬP BÙ · THIẾU SIZE</span>';
  if(a==='CAN_NHAP_BU') return '<span class="badge need">CẦN NHẬP BÙ</span>';
  if(a==='CAN_QUAN_TAM_THIEU_SIZE') return '<span class="badge sizeWatch">CẦN QUAN TÂM · THIẾU SIZE</span>';
  if(a==='CAN_QUAN_TAM') return '<span class="badge watch">CẦN QUAN TÂM</span>';
  if(a==='CHUA_DEN_NGUONG') return '<span class="badge no">CHƯA ĐẾN NGƯỠNG</span>';
  if(a==='CHUA_CO_DOT_NHAP') return '<span class="badge no">CHƯA CÓ ĐỢT</span>';
  return '<span class="badge no">CHƯA CẦN</span>';
}

async function loadSummary(){
  const s=await tongQuanHeThongV2($('date').value||null);

async function openSupplierOrder(){
  const ncc=currentSupplier;
  if(!ncc){return}
  $('orderModal').classList.add('show');
  $('orderTitle').textContent='TỔNG HỢP NHẬP BÙ · NCC: '+ncc;
  $('orderStats').textContent='Đang tổng hợp dữ liệu size...';
  $('hotOrder').innerHTML='';

  try{
    const rows=await chiTietNhapBuV2({
      ngay:$('date').value||null,
      nhacc:ncc,
      hienTatCa:false
    });
    const needRows=rows.filter(r=>
      Number(r.sl_can_bu||0)>0 &&
      ['CAN_NHAP_BU_THIEU_SIZE','CAN_NHAP_BU'].includes(r.hanh_dong)
    );

    const chunks=await Promise.all(needRows.map(async r=>{
      const sizes=await phanBoSizeV2(r.masp,Number(r.sl_can_bu||0),$('date').value||null);
      return sizes
        .filter(x=>Number(x.sl_de_nghi||0)>0)
        .map(x=>({
          stt:0,
          masp:r.masp,
          size:x.size,
          sl_goi_y:Number(x.sl_de_nghi||0),
          sl_dat:Number(x.sl_de_nghi||0),
          ton_hien_tai:Number(x.ton_hien_tai||0),
          ton_sau_dat:Number(x.ton_hien_tai||0)+Number(x.sl_de_nghi||0),
          ban_gan:Number(x.ban_gan_ngay||0),
          ten:r.tensp||'',
          nhom:r.nhomhang||'',
          ly_do:String(x.loai_goi_y||'').startsWith('THIEU_SIZE')?'Thiếu size':'Phân bổ'
        }));
    }));

    orderRows=chunks.flat()
      .sort((a,b)=>a.masp.localeCompare(b.masp,'vi',{numeric:true}) ||
                   String(a.size).localeCompare(String(b.size),'vi',{numeric:true}))
      .map((r,i)=>({...r,stt:i+1}));

    rebuildOrderGroupColors();
    buildOrderHot();
  }catch(e){
    console.error(e);
    $('orderStats').textContent='Lỗi: '+(e?.message||e);
  }
}


function getOrderSourceRows(){
  if(orderHot){
    const src=orderHot.getSourceData();
    return Array.isArray(src)?src:[];
  }
  return orderRows;
}

function rebuildOrderGroupColors(){
  orderGroupColorMap=new Map();
  let i=0;
  for(const r of orderRows){
    const key=String(r?.masp||'').trim().toUpperCase();
    if(key && !orderGroupColorMap.has(key)){
      orderGroupColorMap.set(key,i%4);
      i++;
    }
  }
}


function orderMaspRenderer(instance,td,row,col,prop,value,cellProperties){
  Handsontable.renderers.TextRenderer(
    instance,td,row,col,prop,value,cellProperties
  );

    ? `<span class="orderMaspLink" data-masp="${masp}" title="Bấm để xem nhanh tồn, size và ảnh">${masp}</span>`
    : '';
}

function orderBlankRenderer(instance,td,row,col,prop,value,cellProperties){
  Handsontable.renderers.TextRenderer(
    instance,td,row,col,prop,value,cellProperties
  );
  if(
    ['ton_hien_tai','ban_gan'].includes(prop)
    && Number(value||0)===0
  ){

  }
}

function applyOrderGroupColor(TD,row){
  TD.classList.remove(
    'order-group-0','order-group-1','order-group-2','order-group-3',
    'order-group-start'
  );
  if(!orderHot || row<0)return;

  const physical=orderHot.toPhysicalRow(row);
  const data=physical==null?null:orderHot.getSourceDataAtRow(physical);
  const masp=String(data?.masp||'').trim().toUpperCase();
  if(!masp)return;

  const idx=orderGroupColorMap.get(masp) ?? 0;
  TD.classList.add(`order-group-${idx}`);

  if(row===0){
    TD.classList.add('order-group-start');
  }else{
    const pPrev=orderHot.toPhysicalRow(row-1);
    const prev=pPrev==null?null:orderHot.getSourceDataAtRow(pPrev);
    const prevMasp=String(prev?.masp||'').trim().toUpperCase();
    if(prevMasp!==masp)TD.classList.add('order-group-start');
  }
}

function orderColumnsForMode(){
  const cols=(orderCompact?ORDER_COMPACT_COLUMNS:ORDER_FULL_COLUMNS).map(c=>({...c}));
  for(const c of cols){
    if(c.data==='masp'){
      c.renderer=orderMaspRenderer;
    }else if(c.data==='ton_hien_tai'||c.data==='ban_gan'){
      c.renderer=orderBlankRenderer;
    }
  }
  return cols;
}

function buildOrderHot(){
  if(orderHot){orderHot.destroy();orderHot=null}
  const container=$('hotOrder');
  rebuildOrderGroupColors();

  orderHot=new Handsontable(container,{
    data:orderRows,
    rowHeaders:false,
    colHeaders:ORDER_FULL_HEADERS,
    columns:orderColumnsForMode(),
    width:ORDER_FULL_WIDTH,
    stretchH:'none',
    height:'100%',
    licenseKey:'non-commercial-and-evaluation',

    /* Giống tinh thần XNT19: lọc/sort/context menu/resize */
    filters:true,
    dropdownMenu:true,
    columnSorting:true,
    manualColumnResize:true,
    manualRowResize:false,
    copyPaste:true,

    /* Cho xóa dòng + Ctrl+Z/Ctrl+Y */
    undo:true,
    contextMenu:['remove_row','undo','redo'],

    afterGetColHeader(col,TH){
      const t=(TH.textContent||'').trim();
      TH.style.fontWeight='800';
      if(t==='SL đặt'){
        TH.style.color='#d71920';
      }else if(t==='Tồn sau Đặt'){
        TH.style.color='#143cff';
      }else{
        TH.style.color='';
      }
    },

    afterRenderer(TD,row,col,prop,value,cellProperties){
      applyOrderGroupColor(TD,row);
    },

    afterChange(changes,source){
      if(!changes || source==='loadData' || source==='calc') return;

      let needRender=false;
      for(const [visualRow,prop,oldVal,newVal] of changes){
        if(prop!=='sl_dat')continue;

        const physical=orderHot.toPhysicalRow(visualRow);
        if(physical==null)continue;

        const r=orderHot.getSourceDataAtRow(physical);
        if(!r)continue;

        const v=Math.max(0,Math.round(Number(newVal)||0));
        r.sl_dat=v;
        r.ton_sau_dat=Number(r.ton_hien_tai||0)+v;
        needRender=true;
      }

      if(needRender){
        orderHot.render();
        updateOrderStats();
      }
    },

    afterRemoveRow(){
      /* Built-in remove_row của Handsontable có UndoRedo hỗ trợ */
      updateOrderStats();
      orderHot.render();
    },

    afterUndo(){
      updateOrderStats();
      orderHot.render();
    },

    afterRedo(){
      updateOrderStats();
      orderHot.render();
    },


afterOnCellMouseDown(event,coords,TD){
  if(coords.row<0 || coords.col<0)return;

  const prop=this.colToProp(coords.col);
  if(prop!=='masp')return;

  const physical=this.toPhysicalRow(coords.row);
  if(physical==null)return;

  const rowData=this.getSourceDataAtRow(physical);
  const masp=String(rowData?.masp||'').trim();
  if(!masp)return;

  event?.preventDefault?.();
  event?.stopPropagation?.();

  if(window.stockQuickPopup){
    window.stockQuickPopup(masp);
  }else{
    console.warn('Chưa load stockQuickPopup.js');
  }
},

    afterColumnSort(){
      /* STT hiển thị lại theo thứ tự đang nhìn */
      for(let r=0;r<orderHot.countRows();r++){
        const physical=orderHot.toPhysicalRow(r);
        const obj=physical==null?null:orderHot.getSourceDataAtRow(physical);
        if(obj)obj.stt=r+1;
      }
      orderHot.render();
    }
  });

  orderCompact=false;
  applyOrderCompact(false);
  updateOrderStats();
}

function updateOrderStats(){
  const rows=getOrderSourceRows();
  const active=rows.filter(r=>Number(r?.sl_dat||0)>0);
  const ma=new Set(active.map(r=>r.masp)).size;
  const goiY=rows.reduce((s,r)=>s+Number(r?.sl_goi_y||0),0);
  const dat=rows.reduce((s,r)=>s+Number(r?.sl_dat||0),0);
  $('orderStats').textContent=
    `${ma} mã · ${active.length} dòng size · Gợi ý ${goiY} SP · SL đặt ${dat} SP`;
}

function applyOrderCompact(force){
  orderCompact=!!force;
  if(!orderHot)return;

  const headers=orderCompact?ORDER_COMPACT_HEADERS:ORDER_FULL_HEADERS;
  const cols=orderColumnsForMode();
  const width=orderCompact?ORDER_COMPACT_WIDTH:ORDER_FULL_WIDTH;

  /*
   * Không dùng HiddenColumns nữa.
   * Đổi trực tiếp bộ columns nên rút gọn luôn đủ 4 cột,
   * hiện lại luôn đủ 11 cột và không bị khóa chiều rộng.
   */
  orderHot.updateSettings({
    colHeaders:headers,
    columns:cols,
    width,
    stretchH:'none'
  });

  orderHot.render();
  $('orderCompact').textContent=orderCompact?'Hiện đầy đủ':'Rút gọn';
}

function orderRowsVisual(){
  if(!orderHot)return orderRows;
  const arr=[];
  for(let r=0;r<orderHot.countRows();r++){
    const physical=orderHot.toPhysicalRow(r);
    if(physical==null)continue;
    const obj=orderHot.getSourceDataAtRow(physical);
    if(obj)arr.push(obj);
  }
  return arr;
}

async function copyText(txt){
  try{
    await navigator.clipboard.writeText(txt);
  }catch{
    const ta=document.createElement('textarea');
    ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
  }
}

async function copyOrderShort(){
  const rows=orderRowsVisual().filter(r=>Number(r.sl_dat||0)>0);
  const lines=[['STT','Mã SP','Size','SL đặt'].join('\t')];
  rows.forEach((r,i)=>lines.push([i+1,r.masp,r.size,r.sl_dat].join('\t')));
  await copyText(lines.join('\n'));
}

async function copyOrderAll(){
  const rows=orderRowsVisual();
  const head=['STT','Mã SP','Size','SL hệ thống gợi ý','SL đặt','Tồn hiện tại','Tồn sau Đặt','Bán gần','Tên','Nhóm','Lý do'];
  const lines=[head.join('\t')];
  rows.forEach((r,i)=>lines.push([
    i+1,r.masp,r.size,r.sl_goi_y,r.sl_dat,
    r.ton_hien_tai||'',r.ton_sau_dat||'',r.ban_gan||'',
    r.ten,r.nhom,r.ly_do
  ].join('\t')));
  await copyText(lines.join('\n'));
}


async function refreshScope(){
  const cs=codes(),sup=$('supplier').value.trim();
  $('status').textContent='Đang tính lại dữ liệu nền từ XNT19 V6...';
  try{
    const r=await refreshNhapBuV2({ngay:$('date').value||null,masps:cs.length?cs:null,nhacc:cs.length?null:(sup||null)});
    await loadSummary();
    if(cs.length) await showDetail({masps:cs,hienTatCa:true});
    else if(sup) await showDetail({nhacc:sup,hienTatCa:false});
    else await showOverview();
    $('status').textContent=`Đã tính lại ${r.processed||0} mã · phạm vi ${r.scope_text||''}.`;
  }catch(e){console.error(e);$('status').textContent='Lỗi làm mới: '+(e?.message||e)}
}

async function loadCurrent(){
  const cs=codes(),sup=$('supplier').value.trim();
  if(cs.length) return showDetail({masps:cs,hienTatCa:true});
  if(sup) return showDetail({nhacc:sup,hienTatCa:false});
  return showOverview();
}

  $('c_target').value=c.so_ngay_muc_tieu??14;
  $('c_watch').value=c.nguong_diem_quan_tam??60;
  $('c_size').value=c.nguong_du_du_lieu_size??5;

  $('c_size_sales').value=c.so_sp_ban_toi_thieu_size_thieu??2;
}



let cfgSaveTimer=null;
async function saveCfgSilently(){
  try{
    await setConfigV2({
      so_thang_nhap_gan_nhat_quan_tam:Number($('c_recent').value),
      so_ngay_gop_dot_nhap:Number($('c_gap').value),
      nguong_ty_le_ban_dot:Number($('c_ratio').value),
      so_ngay_hang_ve:Number($('c_lead').value),
      so_ngay_muc_tieu:Number($('c_target').value),
      nguong_diem_quan_tam:Number($('c_watch').value),
      nguong_du_du_lieu_size:Number($('c_size').value),
      so_ngay_kiem_tra_thieu_size:Number($('c_size_days').value),
      so_sp_ban_toi_thieu_size_thieu:Number($('c_size_sales').value)
    });
  }catch(e){
    console.error('Lỗi tự lưu cấu hình V2',e);
  }
}
['c_recent','c_gap','c_ratio','c_lead','c_target','c_watch','c_size','c_size_days','c_size_sales'].forEach(id=>{
  $(id).addEventListener('input',()=>{
    clearTimeout(cfgSaveTimer);
    cfgSaveTimer=setTimeout(saveCfgSilently,650);
  });
  $(id).addEventListener('change',()=>{
    clearTimeout(cfgSaveTimer);
    saveCfgSilently();
  });
});


document.querySelectorAll('.infoTip').forEach(t=>{
  t.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();
    document.querySelectorAll('.infoTip.open').forEach(x=>{if(x!==t)x.classList.remove('open')});
    t.classList.toggle('open');
  });
});
document.addEventListener('click',()=>document.querySelectorAll('.infoTip.open').forEach(x=>x.classList.remove('open')));

$('resetCfg').onclick=async()=>{
  if(!confirm('Đặt lại toàn bộ cấu hình nhập bù V2 về chuẩn ban đầu?')) return;
  await resetConfigV2(); await loadCfg();
  alert('Đã đặt lại cấu hình chuẩn. Bấm Tính lại dữ liệu nền để tính lại.');
};

$('config').onclick=async()=>{$('cfgCard').classList.toggle('hidden');if(!$('cfgCard').classList.contains('hidden'))await loadCfg()};
$('load').onclick=loadCurrent;
$('refresh').onclick=refreshScope;
$('overview').onclick=showOverview;
$('back').onclick=showOverview;
$('orderBtn').onclick=openSupplierOrder;
$('orderClose').onclick=()=>{$('orderModal').classList.remove('show')};
$('orderCompact').onclick=()=>applyOrderCompact(!orderCompact);
$('orderCopyShort').onclick=copyOrderShort;
$('orderCopyAll').onclick=copyOrderAll;

document.addEventListener('keydown',e=>{
  if(!$('orderModal')?.classList.contains('show') || !orderHot)return;

  const ctrl=e.ctrlKey||e.metaKey;
  if(ctrl && e.key.toLowerCase()==='z'){
    e.preventDefault();
    if(e.shiftKey)orderHot.redo?.();
    else orderHot.undo?.();
    updateOrderStats();
    return;
  }
  if(ctrl && e.key.toLowerCase()==='y'){
    e.preventDefault();
    orderHot.redo?.();
    updateOrderStats();
  }
});

$('orderReset').onclick=()=>{
  const rows=getOrderSourceRows();
  rows.forEach(r=>{
    r.sl_dat=Number(r.sl_goi_y||0);
    r.ton_sau_dat=Number(r.ton_hien_tai||0)+Number(r.sl_dat||0);
  });
  if(orderHot)orderHot.render();
  updateOrderStats();
};
$('close').onclick=()=>{$('modal').style.display='none'};
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').style.display='none'};

(async()=>{
  try{
    const s=await loadSummary();
    if(!s.refreshed_at){
      $('status').textContent='Chưa có snapshot V2 hôm nay. Đang tạo lần đầu từ XNT19 V6...';
      await refreshNhapBuV2({ngay:$('date').value||null});
      await loadSummary();
    }
    await showOverview();
  }catch(e){
    console.error(e);
    $('status').textContent='Lỗi khởi tạo: '+(e?.message||e);
  }
})();
