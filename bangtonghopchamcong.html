<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Bảng tổng hợp chấm công</title>

  <!-- Handsontable CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.css"
  />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 10px;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 20px;
    }

    .sub-title {
      font-size: 13px;
      margin-bottom: 8px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .filter-row label {
      font-size: 13px;
    }

    .filter-row input,
    .filter-row select,
    .filter-row button {
      font-size: 13px;
      padding: 3px 6px;
    }

    #status {
      margin: 4px 0;
      font-size: 13px;
      color: #555;
    }

    #tonghopGrid {
      width: 100%;
      max-height: 600px;
      overflow: hidden;
    }

    .giocon-cell {
      color: #d32f2f;
      font-weight: bold;
    }

    .ghi-chu-cell {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>BẢNG TỔNG HỢP CHẤM CÔNG</h1>
  <div class="sub-title">
    Từ ngày: <span id="lbl-tungay"></span> &nbsp;&nbsp; Đến ngày: <span id="lbl-denngay"></span>
  </div>

  <div class="filter-row">
    <label>Từ ngày:
      <input type="date" id="tu_ngay" />
    </label>

    <label>Đến ngày:
      <input type="date" id="den_ngay" />
    </label>

    <label>Cơ sở:
      <select id="diadiem">
        <option value="">Tất cả</option>
        <option value="cs1">CS1</option>
        <option value="cs2">CS2</option>
      </select>
    </label>

    <label>Mã NV:
      <input type="text" id="manv" list="ds-manv" placeholder="Chọn mã NV" />
    </label>
    <datalist id="ds-manv"></datalist>

    <button id="btn-load">Tải dữ liệu</button>
    <button id="btn-export">Xuất CSV</button>
  </div>

  <div id="status"></div>

  <div id="tonghopGrid"></div>

  <!-- Handsontable JS -->
  <script src="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.js"></script>

  <!-- Script chính -->
  <script type="module" src="./scripts/bangtonghopchamcong.js"></script>
</body>
</html>
