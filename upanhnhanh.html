<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <title>Up ảnh nhanh – MÃ SP → chụp → lưu</title>
  <!-- Tối ưu iPhone 13 Pro Max dọc, chống zoom khi focus -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <style>
    :root {
      --pad: 14px;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial;
      background: #f7f7f8;
      color: #111;
      -webkit-text-size-adjust: 100%;
    }

    .wrap {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
      padding: var(--pad);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    label {
      font-size: 14px;
      color: #444;
    }

    #masp {
      font-size: 18px;
      padding: 14px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      width: 100%;
      outline: none;
    }

    #masp:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, .15);
    }

    button {
      font-size: 16px;
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: #fff;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111;
    }

    button:disabled {
      opacity: .6;
    }

    .status {
      font-size: 14px;
      min-height: 24px;
    }

    .status.ok {
      color: #16a34a;
    }

    .status.warn {
      color: #ef4444;
    }

    .thumb {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .thumb img {
      width: 82px;
      height: 82px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      background: #fff;
    }

    /* Ẩn nhưng vẫn được click theo chuẩn iOS */
    .ghost {
      position: fixed;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }


    .toast {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      background: rgba(17, 17, 17, .92);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      opacity: 0;
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    .footer {
      color: #666;
      font-size: 12px;
      text-align: center;
      padding-bottom: 10px;
    }

    .thumb img {
      width: 300px;
      height: 300px;
      object-fit: cover;
      cursor: pointer;
    }

    /* Thanh đáy cố định và layout 2 hàng */
    .bottombar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      background: #fff;
      box-shadow: 0 -6px 16px rgba(0, 0, 0, .08);
      padding: 10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      /* iPhone safe area */
    }

    .bottombar .bb-row1 {
      display: grid;
      grid-template-columns: 1fr;
    }

    .bottombar .bb-row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    /* Chừa chỗ cho thanh đáy để nội dung không bị che */
    .wrap {
      padding-bottom: 140px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="status" id="status"></div>

    <div class="thumb" id="thumb" style="display:none;">
      <img id="thumbImg" alt="ảnh sản phẩm" />
      <div id="thumbMeta" style="font-size:13px;color:#555"></div>
    </div>

    <div></div> <!-- spacer -->

    <div class="footer">Chụp & lưu siêu nhanh • Tối ưu iPhone 13 Pro Max</div>
  </div>

  <!-- input camera ẩn, mở ngay khi cần -->

  <div class="bottombar">
    <div class="bb-row1">
      <input id="masp" inputmode="latin" autocomplete="off" placeholder="Nhập MÃ SP rồi Enter…"
        aria-label="Mã sản phẩm" />
    </div>
    <div class="bb-row2">
      <button id="btnCheck" aria-label="Kiểm tra">Kiểm tra</button>
      <button id="btnRetake" class="secondary" aria-label="Chèn ảnh mới">Chèn ảnh mới</button>
    </div>
  </div>


  <input id="camera" class="ghost" type="file" accept="image/*" capture="environment" />
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    /********************
     * CẤU HÌNH – hãy sửa cho khớp dự án của bạn
     ********************/
    const SUPABASE_URL = window.SUPABASE_URL || 'https://rddjrmbyftlcvrgzlyby.supabase.co';
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZGpybWJ5ZnRsY3ZyZ3pseWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3NjU4MDQsImV4cCI6MjA2MjM0MTgwNH0.-0xtqxn6b9OBz4unTTvJ4klxizWhHa1iSuYGm7cOYTM';
    const STORAGE_BUCKET = window.STORAGE_BUCKET || 'anhsanpham'; // tên bucket lưu ảnh
    const PATH_PREFIX = window.PATH_PREFIX || ''; // ví dụ 'products/' nếu bạn để trong thư mục con của bucket

    const AUTO_OPEN_CAMERA = true;     // Tự mở camera khi chắc chắn chưa có ảnh
const FORCE_AUTO_ON_IOS = false;   // Nếu muốn ép iOS cũng auto, đổi thành true (có thể bị chặn)


    // Chuẩn hoá key lưu file: CHỈ giữ A-Z 0-9 - _
    function sanitizeBaseName(str) {
      const up = String(str || '').trim().toUpperCase();
      return up.replace(/[^A-Z0-9_-]+/g, '-').replace(/-+/g, '-').replace(/^[-_]+|[-_]+$/g, '');
    }


    // Tên file theo chuẩn trang 222 (tùy biến nếu cần)
    // Tên file khi UPLOAD: thống nhất .JPG để khớp hệ thống cũ

    const FILE_NAMER = (masp) => `${sanitizeBaseName(masp)}.JPG`;

    // Các đuôi ảnh có thể đã tồn tại từ trước
    const EXT_CANDIDATES = ['.JPG', '.jpg', '.PNG', '.png'];

    // Đường dẫn ảnh public (tùy trang 222). Nếu trước nay bạn dùng publicURL + fileName thì giữ nguyên:
    const publicUrlFromKey = (fileName) => {
      // Gợi ý 1: dùng getPublicUrl (chuẩn Supabase v2)
      const { data } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(PATH_PREFIX + fileName);
      return (data?.publicUrl || '') + `?t=${Date.now()}`;
    };

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /********************
     * UI tiện ích
     ********************/
    const $ = (s) => document.querySelector(s);
    const maspInput = $('#masp');
    const btnCheck = $('#btnCheck');
    const btnRetake = $('#btnRetake');
    const statusEl = $('#status');
    const cameraInput = $('#camera');
    const toastEl = $('#toast');
    const thumb = $('#thumb');
    const thumbImg = $('#thumbImg');
    const thumbMeta = $('#thumbMeta');

    thumbImg?.addEventListener('click', () => {
      if (!thumbImg.src) return;
      window.open(thumbImg.src, '_blank'); // xem ảnh lớn
    });

    btnRetake.addEventListener('click', () => {
      const masp = maspInput.value.trim();
      if (!masp) { setStatus('Nhập MÃ SP trước', 'warn'); maspInput.focus(); return; }
      setStatus('Chụp ảnh mới để ghi đè…');
      openCamera(); // user gesture trực tiếp → iOS mở camera ổn định
    });

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 1500);
      if (navigator.vibrate) try { navigator.vibrate(15); } catch { }
    }
    function setStatus(msg, kind = '') {
      statusEl.className = 'status ' + (kind || '');
      statusEl.textContent = msg || '';
    }
    function focusSelectInput() { maspInput.focus({ preventScroll: true }); maspInput.select(); }

    /********************
     * Cache key ảnh – tải nhanh, kiểm tra O(1)
     ********************/
    const CACHE_KEY = 'image_keys_v1';
    const MAX_LIST = 5000; // điều chỉnh theo bucket
    let imageKeySet = new Set();
    let imageKeySetLower = new Set(); // giữ bản viết thường để tra cứu O(1)


    function loadCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (raw) {
          const obj = JSON.parse(raw);
          if (Array.isArray(obj.keys)) {
            imageKeySet = new Set(obj.keys);
            imageKeySetLower = new Set(obj.keys.map(k => String(k).toLowerCase()));
          }
        }
      } catch { /* ignore */ }
    }

    function saveCache() {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ keys: [...imageKeySet] })); } catch { }
    }

    function updateGlobalNames() {
  // Mảng tên file hiện có (để bạn kiểm tra nhanh trong console hoặc dùng lại)
  window.ANH_KEYS = Array.from(imageKeySet);
}


    async function refreshKeysFromBucket() {
      let offset = 0; const page = 1000;
      const keys = [];
      while (offset < MAX_LIST) {
        const { data, error } = await supabase.storage.from(STORAGE_BUCKET).list(PATH_PREFIX, {
          limit: page, offset, sortBy: { column: 'name', order: 'asc' }
        });
        if (error) { console.warn('list error', error); break; }
        if (!data || data.length === 0) break;
        for (const f of data) { if (f?.name) keys.push(f.name); }
        offset += data.length;
        if (data.length < page) break;
      }
      if (keys.length) {
        imageKeySet = new Set(keys);
        imageKeySetLower = new Set(keys.map(k => k.toLowerCase()));
        saveCache();
        updateGlobalNames();
      }
    }

    function isIOS() {
  return /iP(hone|od|ad)/.test(navigator.platform)
      || (/Mac/.test(navigator.userAgent) && 'ontouchend' in document);
}
function shouldAutoOpenCamera() {
  return AUTO_OPEN_CAMERA && (FORCE_AUTO_ON_IOS || !isIOS());
}


    function hasImageFor(masp) {
      const base = masp.trim().toUpperCase();
      for (const ext of EXT_CANDIDATES) {
        if (imageKeySetLower.has((base + ext).toLowerCase())) return true;
      }
      return false;
    }


    function updateThumb(masp) {
      const base = masp.trim().toUpperCase();
      let found = null;
      for (const ext of EXT_CANDIDATES) {
        if (imageKeySetLower.has((base + ext).toLowerCase())) { found = base + ext; break; }
      }
      if (!found) { thumb.style.display = 'none'; return; }
      thumb.style.display = 'flex';
      thumbImg.src = publicUrlFromKey(found);
      thumbMeta.textContent = found;
    }


    /********************
     * Mở camera & xử lý ảnh
     ********************/

    // Kiểm tra tồn tại ảnh bằng Supabase API (ổn định, không dùng HEAD CDN)
    async function existsOnServer(masp) {
      const bases = [
        sanitizeBaseName(masp),           // chuẩn hoá (khuyên dùng)
        String(masp || '').trim().toUpperCase() // nguyên bản in hoa
      ];
      for (const base of bases) {
        for (const ext of EXT_CANDIDATES) {
          const key = base + ext;
          const { data, error } = await supabase
            .storage.from(STORAGE_BUCKET)
            .createSignedUrl(PATH_PREFIX + key, 1); // có = tồn tại, lỗi = không có
          if (!error && data?.signedUrl) return { exists: true, keyFound: key };
        }
      }
      return { exists: false, keyFound: null };
    }


    function openCamera() {
      cameraInput.value = '';
      cameraInput.click();
    }

    cameraInput.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      const masp = maspInput.value.trim();
      if (!file || !masp) return;
      try {
        setStatus('Đang xử lý & lưu ảnh…');
        const blob = await resizeImage(file, 1024, 1024, 0.82); // nén vừa phải
        const key = FILE_NAMER(masp);
        const { error } = await supabase.storage
          .from(STORAGE_BUCKET)
          .upload(PATH_PREFIX + key, blob, { upsert: true, contentType: 'image/jpeg', cacheControl: '3600' });
        if (error) throw error;
        imageKeySet.add(key);
        imageKeySetLower.add(key.toLowerCase());
        saveCache();
        updateGlobalNames();

        setStatus('Lưu ảnh thành công', 'ok');
        showToast('✔ Đã lưu');
        updateThumb(masp);
      } catch (err) {
        console.error('Upload error:', err);
        const msg = (err && (err.message || err.error_description || err.error)) ? String(err.message || err.error_description || err.error) : 'KHÔNG rõ nguyên nhân';
        setStatus('Lưu ảnh KHÔNG thành công: ' + msg, 'warn');
        showToast('✖ Lỗi lưu ảnh: ' + msg);
      } finally {

        focusSelectInput();
      }
    });

    function fileToImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }
    async function resizeImage(file, maxW, maxH, quality = 0.85) {
      const img = await fileToImage(file);
      const ratio = Math.min(maxW / img.width, maxH / img.height, 1);
      const w = Math.round(img.width * ratio);
      const h = Math.round(img.height * ratio);

      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d', { alpha: false });
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      return await new Promise((res) => canvas.toBlob((b) => res(b), 'image/jpeg', quality));
    }

    /********************
     * Kiểm tra mã & điều hướng luồng
     ********************/
    async function handleCheck() {
      const masp = maspInput.value.trim();
      if (!masp || masp.length < 2) { setStatus('Mã sản phẩm chưa hợp lệ', 'warn'); focusSelectInput(); return; }
      focusSelectInput();

      // 1) Tra nhanh trong cache
      if (hasImageFor(masp)) {
        setStatus('ĐÃ CÓ ẢNH', 'ok');
        updateThumb(masp);
        return;
      }

      // 2) Kiểm tra chắc chắn trên server (ổn định, tránh mở camera nhầm)
      setStatus('Đang kiểm tra ảnh trên server…');
      const { exists, keyFound } = await existsOnServer(masp);

      if (exists) {
        // Đồng bộ cache để lần sau nhanh tức thì
        imageKeySet.add(keyFound);
        imageKeySetLower.add(keyFound.toLowerCase());
        saveCache();

        setStatus('ĐÃ CÓ ẢNH', 'ok');
        updateThumb(masp);
        return;
      }

      // 3) Không có ảnh thật → mở camera
      setStatus('Chưa có ảnh. Sẽ mở camera để chụp…');
updateThumb('');

if (shouldAutoOpenCamera()) {
  openCamera();                    // Android/Desktop: auto mở
} else {
  setStatus('Chưa có ảnh. Bấm “Chèn ảnh mới” để chụp (iPhone chế độ an toàn).');
}

      // Mặc định: chờ người dùng bấm nút "Chèn ảnh mới" (ổn định nhất trên iOS)
    }

    maspInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleCheck();
      }
    });
    maspInput.addEventListener('blur', () => { if (maspInput.value.trim()) handleCheck(); });
    btnCheck.addEventListener('click', handleCheck);

    /********************
     * Khởi động
     ********************/
    loadCache(); // dùng cache ngay để kiểm tra tức thì
    updateGlobalNames();
    focusSelectInput();
    // Làm mới danh sách key ở nền (không chặn UI)
    refreshKeysFromBucket().catch(console.warn);
  </script>
</body>

</html>
