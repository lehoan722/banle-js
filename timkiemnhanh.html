<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Tìm kiếm nhanh Hoàn Tuyết V1.2.9</title>
  <style>
    :root{--blue:#0878d1;--green:#15945d;--red:#d92d20;--amber:#f4a900;--bg:#f3f6f9;--card:#fff;--border:#d7e0e8;--text:#172033}
    *{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit;font-size:16px}button{cursor:pointer}.top{background:var(--blue);color:#fff;padding:9px 10px}.top-row{display:flex;align-items:center;gap:8px}.title{font-size:20px;font-weight:900;flex:1;min-width:0}.new-btn{border:1px solid rgba(255,255,255,.7);background:#fff;color:#0878d1;border-radius:8px;padding:7px 11px;font-weight:900;white-space:nowrap}.mini{font-size:12px;margin-top:3px;opacity:.95}
    .wrap{max-width:1100px;margin:auto;padding:8px}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:9px;margin-bottom:9px;box-shadow:0 1px 4px #0000000d}
    .quickbar{display:grid;grid-template-columns:15% 45% 20% 20%;gap:5px;align-items:stretch}.quickbar>*{min-width:0;height:46px}.scan-btn{border:0;border-radius:9px;background:#0b7bd5;color:#fff;font-weight:900}.codebox{position:relative}.codebox input{height:46px;width:100%;border:1px solid #b8c7d5;border-radius:9px;padding:0 8px}.suggest{display:none;position:absolute;left:0;right:0;top:48px;max-height:240px;overflow:auto;background:#fff;border:1px solid #aebdca;border-radius:8px;z-index:500;box-shadow:0 6px 18px #0002}.suggest button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf0f3;background:#fff;padding:9px}.suggest button b{display:block}.suggest button small{color:#657586}.quickbar select{width:100%;border:1px solid #b8c7d5;border-radius:9px;padding:0 6px;background:#fff}
    .location-line{font-size:16px;font-weight:400;line-height:1.22;color:#334155;overflow-wrap:anywhere}.source-location{display:none;margin:6px 2px 0;font-size:18px!important;font-weight:800!important;line-height:1.28;color:#0b3f78;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;text-transform:uppercase;cursor:pointer;user-select:none;-webkit-tap-highlight-color:rgba(11,63,120,.14)}.source-location.show{display:block}.source-location:active{opacity:.65}.product-location{margin-top:1px}.selected-location{margin-top:2px}.info-kho{color:#0b3f78;font-size:18px;font-weight:800;text-transform:uppercase}.info-mau{color:#7c3aed;font-size:18px;font-weight:400}
    .size-warning{display:none;color:#c82118;font-size:12px;font-weight:900;margin:5px 2px -1px;line-height:1.25}.size-warning.show{display:block}
    .sizes{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:7px}.size{min-width:0;border:1px solid #bdcbd7;background:#fff;border-radius:8px;padding:9px 0;font-weight:800}.size.on{background:#f4c542!important;border-color:#c58b00!important;color:#4d3400!important;box-shadow:inset 0 0 0 2px #a97300}.size.has{background:#fff0a8;border-color:#deb33b;color:#604800;font-weight:900}.size.no{opacity:.38;text-decoration:line-through;background:#f1f3f5}.size.no{cursor:pointer}.size:disabled{cursor:not-allowed}.size.hint{box-shadow:inset 0 0 0 2px #55a9df}
    .sizes.guide-open{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;align-items:stretch;margin-top:7px}.size-guide-col{min-width:0;border:1px solid #bdcbd7;background:#fff;border-radius:7px;padding:0;overflow:hidden;font-weight:800;color:#172033}.size-guide-col.has{background:#fff0a8;border-color:#d5a928}.size-guide-col.no{background:#f6f7f8;color:#687480}.size-guide-col:active{transform:scale(.98)}.size-guide-cell{min-height:27px;display:flex;align-items:center;justify-content:center;padding:3px 1px;border-bottom:1px solid rgba(130,145,160,.26);font-size:12px;line-height:1.05;white-space:nowrap}.size-guide-cell:last-child{border-bottom:0}.size-guide-cell:first-child{font-size:14px;font-weight:900}.size-guide-col.has .size-guide-cell:first-child{color:#7a4b00}.size-guide-stock{font-size:9px;font-weight:700;opacity:.72}

    .main-groups{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.main-group{border:1px solid #b9cadd;background:#fff;border-radius:9px;min-height:48px;padding:6px 3px;font-weight:900;line-height:1.05}.main-group.on{background:#0878d1;color:#fff;border-color:#0878d1}.main-group small{display:block;font-size:10px;margin-top:4px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subgroups{display:none;gap:5px;flex-wrap:wrap;padding-top:7px}.subgroups.show{display:flex}.subgroup{border:1px solid #c3ced8;background:#fff;border-radius:999px;padding:8px 11px;font-weight:800}.subgroup.on{background:#dff2ff;border-color:#39a4e2;color:#075f9f}
    .modes{display:flex;gap:5px;overflow:auto}.mode{border:1px solid #c5d2df;background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;white-space:nowrap}.mode.on{background:#172033;color:#fff}.mode[data-mode=discount].on{background:#d92d20}.mode[data-mode=cheaper].on{background:#15945d}.mode[data-mode=premium].on{background:#7c3aed}.refprice{display:none;margin-top:7px}.refprice.show{display:grid;grid-template-columns:100px 1fr;gap:6px;align-items:center}.refprice input{height:42px;border:1px solid #c3ced8;border-radius:8px;padding:0 9px}
    .section-head{display:flex;align-items:center;gap:8px;margin:4px 0 8px}.section-head h3{margin:0;color:#075f9f;font-size:17px;flex:1}.count{font-size:12px;color:#657586}
    .products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px}.product{background:#fff;border:1px solid #d7dee5;border-radius:4px;overflow:hidden;transition:box-shadow .2s,transform .2s}.product-focus{box-shadow:0 0 0 3px #f4a900,0 6px 18px #0002;transform:scale(1.01)}.product-image-wrap{width:100%;height:228px;padding:0;margin:0;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}.product-image{display:block;width:100%;height:100%;margin:0;padding:0;object-fit:contain;background:#fff;cursor:zoom-in}.pb{padding:3px 3px 4px}.stock-link{display:block;border:0;background:transparent;color:#075f9f;text-decoration:underline;font-weight:900;padding:0;text-align:left;font-size:16px;line-height:1.2}.price{color:#d92d20;font-weight:900;margin-top:1px;font-size:16px;line-height:1.2}.product-info-line{font-size:16px;font-weight:400;line-height:1.2;margin-top:1px;white-space:normal;overflow-wrap:anywhere}.product-meta{color:#334155}.product-kho{color:#0b3f78;font-size:18px;font-weight:800;text-transform:uppercase}.product-mau{color:#7c3aed;font-size:18px;font-weight:400}.pick{width:100%;margin-top:4px;border:0;border-radius:6px;background:#0878d1;color:#fff;padding:7px;font-weight:900}.pick-sizes{display:none;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:4px}.pick-sizes.show{display:grid}.pick-size{border:1px solid #bfcbd6;background:#fff;border-radius:6px;padding:6px 1px;font-weight:800}.pick-size.no{opacity:.35;text-decoration:line-through}.pick-size.has{background:#eaf6ff}.pick-size:disabled{cursor:not-allowed}
    #selectedSection{scroll-margin-top:8px}.selected-item{border-bottom:1px solid #e5e9ed;padding:6px 0}.selected-item:last-child{border-bottom:0}.sel-line{display:flex;align-items:center;gap:7px}.sel-code{flex:1;border:0;background:transparent;text-align:left;color:#075f9f;text-decoration:underline;font-weight:900;padding:0}.sel-size{font-weight:900}.selected-info-line{display:flex;align-items:center;gap:7px;margin-top:2px;font-size:14px;font-weight:400;line-height:1.2;white-space:nowrap;overflow:hidden}.selected-info-line span{min-width:0}.selected-kho{color:#0b3f78;font-size:18px;font-weight:800;text-transform:uppercase}.selected-mau{color:#7c3aed;font-size:18px;font-weight:400}.selected-formstock{color:#334155;overflow:hidden;text-overflow:ellipsis}.sel-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:5px}.sel-actions button{min-width:0;border:0;border-radius:8px;padding:7px 1px;font-weight:900;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.research{background:#7c3aed;color:#fff}.continue{background:#dff2ff;color:#075f9f}.remove{background:#eceff2;color:#3d4854}.sale{background:#15945d;color:#fff}.empty{text-align:center;color:#6a7886;padding:22px 8px}.selected-empty{padding:10px 6px}.initial-empty{font-size:13px}.more{display:none!important}.auto-load-status{display:none;text-align:center;color:#657586;font-size:12px;padding:10px 4px}.auto-load-status.show{display:block}
    .status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#172033;color:#fff;border-radius:999px;padding:9px 14px;z-index:20000;display:none;max-width:92vw;font-size:13px}.overlay{display:none;position:fixed;inset:0;background:#000;z-index:30000}.overlay.show{display:block}.overlay video{width:100%;height:100%;object-fit:cover}.scan-controls{position:absolute;left:8px;right:8px;bottom:12px;display:flex;gap:6px;align-items:center;z-index:2}.scan-controls button,.scan-controls label{padding:8px 10px;border:0;border-radius:8px;background:#fff;font-weight:800}.scan-status{position:absolute;left:12px;top:14px;color:#fff;font-weight:800;z-index:2}.camera-select{display:none}.loading{opacity:.6;pointer-events:none}

    .stock-check-modal{display:none;position:fixed;inset:0;z-index:45000;background:rgba(0,0,0,.48);align-items:center;justify-content:center;padding:18px}.stock-check-modal.show{display:flex}.stock-check-box{width:min(430px,94vw);background:#fff;border-radius:14px;padding:16px;box-shadow:0 16px 44px #0005}.stock-check-title{font-size:18px;font-weight:900;color:#c82118;margin-bottom:8px}.stock-check-text{font-size:15px;line-height:1.45;color:#263342}.stock-check-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stock-check-actions button{border:0;border-radius:9px;padding:11px 8px;font-weight:900}.stock-check-yes{background:#0878d1;color:#fff}.stock-check-later{background:#e9edf1;color:#344150}
    .image-overlay{display:none;position:fixed;inset:0;z-index:40000;background:rgba(0,0,0,.94);align-items:center;justify-content:center;padding:0;cursor:zoom-out}.image-overlay.show{display:flex}.image-overlay img{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain;margin:0;padding:0}.image-open{overflow:hidden}
    #resultsSection{padding:3px;margin-bottom:4px}#resultsSection .section-head{margin:2px 2px 4px}
    @media(max-width:520px){.wrap{padding:4px}.products{gap:1px}.product-image-wrap{height:216px}.quickbar{gap:4px}.quickbar select{padding:0 3px}.size{padding:8px 0;font-size:14px}.main-group{font-size:12px}.top{padding:7px 8px}.title{font-size:18px}.new-btn{padding:6px 9px;font-size:14px}#resultsSection{margin-left:-4px;margin-right:-4px;padding:1px;border-left:0;border-right:0;border-radius:0}#resultsSection .section-head{padding:0 3px;margin:2px 0 3px}.pb{padding:2px 2px 3px}.product-info-line,.stock-link,.price{font-size:14px}.selected-info-line{font-size:12px;gap:5px}.sel-actions button{font-size:11px;padding:7px 0}.sizes.guide-open{gap:2px}.size-guide-cell{min-height:25px;font-size:10.5px;padding:2px 0}.size-guide-cell:first-child{font-size:12.5px}.location-line{font-size:15px}.source-location{font-size:18px!important}.product-kho,.product-mau,.selected-kho,.selected-mau{font-size:18px!important}}
  
    /* V1.2.7 - Đồng bộ cỡ chữ thông tin sản phẩm 20px, giữ nguyên độ đậm hiện có */
    #productCode,
    .stock-link, .sel-code,
    .size, .size-guide-cell, .size-guide-cell:first-child, .size-guide-stock,
    .product-info-line, .product-meta, .selected-info-line, .selected-formstock, .sel-size,
    .location-line, .source-location,
    .info-kho, .info-mau, .product-kho, .product-mau, .selected-kho, .selected-mau,
    #formSelect { font-size:20px !important; }

    /* Không cho media mobile thu nhỏ các thông tin trên */
    @media(max-width:520px){
      #productCode,
      .stock-link, .sel-code,
      .size, .size-guide-cell, .size-guide-cell:first-child, .size-guide-stock,
      .product-info-line, .product-meta, .selected-info-line, .selected-formstock, .sel-size,
      .location-line, .source-location,
      .info-kho, .info-mau, .product-kho, .product-mau, .selected-kho, .selected-mau,
      #formSelect { font-size:20px !important; }
    }

    /* V1.2.9 - Cho thông tin SP đã chọn tự xuống dòng + tăng chiều cao khay ảnh kết quả */
    .selected-info-line{
      flex-wrap:wrap !important;
      align-items:flex-start !important;
      white-space:normal !important;
      overflow:visible !important;
      row-gap:2px !important;
      column-gap:7px !important;
      height:auto !important;
    }
    .selected-info-line span{
      max-width:100%;
      white-space:normal !important;
      overflow:visible !important;
      text-overflow:clip !important;
      overflow-wrap:anywhere;
    }
    .selected-formstock{
      overflow:visible !important;
      text-overflow:clip !important;
      white-space:normal !important;
    }
    .product-image-wrap{height:300px;}
    @media(max-width:520px){
      .selected-info-line{column-gap:6px !important;row-gap:2px !important;}
      .product-image-wrap{height:270px !important;}
    }
  
    /* V1.2.9 - Điều hướng nhanh, header, nút 16px, size compact */
    .top-row .title{order:2;text-align:right;}
    .top-row .new-btn{order:1;}
    #codeInput{font-size:18px !important;}
    .sel-actions button{font-size:16px !important;padding:7px 1px !important;line-height:1.1;}
    .main-group{font-size:16px !important;padding:6px 1px !important;}
    .main-group small{font-size:11px;}
    .page-jump-btn{
      position:fixed;left:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:26000;
      width:44px;height:44px;border:1px solid rgba(255,255,255,.85);border-radius:50%;
      background:rgba(11,63,120,.90);color:#fff;font-size:25px;font-weight:900;line-height:1;
      display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.25);
      backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:manipulation;
    }
    .page-jump-btn:active{transform:scale(.94);}
    @media(max-width:520px){
      .sel-actions{gap:3px !important;}
      .sel-actions button{font-size:16px !important;padding:7px 0 !important;}
      .main-groups{gap:3px !important;}
      .main-group{font-size:16px !important;padding:6px 0 !important;min-height:50px;}
      .main-group small{font-size:10px;}
      #codeInput{font-size:18px !important;}
    }
  </style>
</head>
<body>
  <div id="login-container"></div>
  <div id="app-container">
  <div class="top"><div class="top-row"><button id="btnNew" class="new-btn" type="button">＋ Thêm mới</button><div class="title">🔎 TÌM KIẾM NHANH</div></div><div class="mini" id="nvInfo">V1.2.9</div></div>
  <main class="wrap">
    <section class="card" id="selectedSection">
      <div class="section-head"><h3>Sản phẩm đã chọn</h3><span id="selectedCount" class="count"></span></div>
      <div id="selectedList"></div>
    </section>

    <section class="card">
      <div class="quickbar">
        <button id="btnScan" class="scan-btn" type="button">📷</button>
        <div class="codebox"><input id="codeInput" autocomplete="off" placeholder="Mã sản phẩm"><div id="suggestBox" class="suggest"></div></div>
        <select id="formSelect"><option value="">Form</option><option value="RONG">Rộng</option><option value="VUA">Vừa</option><option value="BO">Bó</option></select>
        <select id="colorSelect"><option value="">Màu</option></select>
      </div>
      <div id="sourceLocation" class="location-line source-location" role="button" tabindex="0" aria-label="Mở tồn nhanh của sản phẩm đang nhập"></div>
      <div id="sizeWarning" class="size-warning"></div>
      <div id="sizeRow" class="sizes"></div>
      <div id="mainGroups" class="main-groups"></div>
      <div id="subGroups" class="subgroups"></div>
    </section>

    <section class="card">
      <div class="modes">
        <button class="mode on" data-mode="similar">Phù hợp</button>
        <button class="mode" data-mode="discount">Giảm giá</button>
        <button class="mode" data-mode="cheaper">Rẻ hơn</button>
        <button class="mode" data-mode="premium">Cao cấp hơn</button>
      </div>
      <div id="refPriceBox" class="refprice"><b>Giá mốc</b><input id="refPrice" type="number" inputmode="numeric" min="0" step="1000" placeholder="VD 320000"></div>
    </section>



    <section class="card" id="resultsSection">
      <div class="section-head"><h3>Kết quả sản phẩm</h3><span id="resultCount" class="count"></span></div>
      <div id="productList" class="products"></div>
      <div id="autoLoadStatus" class="auto-load-status">Đang tải thêm sản phẩm...</div>
      <div id="loadMoreSentinel" aria-hidden="true" style="height:1px"></div>
      <button id="btnMore" class="more" type="button" style="display:none">Tải thêm 40 sản phẩm</button>
    </section>
  </main>

  <button id="pageJumpBtn" class="page-jump-btn" type="button" aria-label="Đi đến cuối trang" title="Cuối trang">↓</button>
  <div id="toast" class="status"></div>
  <div id="scanOverlay" class="overlay">
    <video id="scanVideo" autoplay playsinline></video>
    <div id="scanStatus" class="scan-status"></div>
    <select id="cameraSelect" class="camera-select"></select>
    <div class="scan-controls">
      <button id="btnCameraUltra" type="button">📷 Rộng</button>
      <button id="btnCameraNormal" type="button">📷 Thường</button>
      <button id="flashBtn" type="button">🔦</button>
      <label>Ảnh<input id="pickImage" type="file" accept="image/*" capture="environment" hidden></label>
      <button id="btnCloseScan" type="button">Đóng</button>
    </div>
  </div>

  <div id="imageOverlay" class="image-overlay" aria-hidden="true"><img id="imageOverlayImg" alt="Ảnh sản phẩm"></div>
  <div id="stockCheckModal" class="stock-check-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="stock-check-box">
      <div class="stock-check-title">Kiểm tra tồn kho</div>
      <div id="stockCheckText" class="stock-check-text"></div>
      <div class="stock-check-actions">
        <button id="btnStockCheckYes" class="stock-check-yes" type="button">Có, kiểm kho</button>
        <button id="btnStockCheckLater" class="stock-check-later" type="button">Để sau</button>
      </div>
    </div>
  </div>

  </div><!-- /app-container -->


  <script src="/scripts/stockQuickPopup.js?v=77"></script>
  <script type="module" src="/scripts/timKiemNhanh.js?v=130"></script>
</body>
</html>
