<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      style-src 'self' 'unsafe-inline';
      script-src 'self' 'unsafe-inline';
    "
  >

  <title>SuperPOS - Mất kết nối</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f3f6f9;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 540px;
      padding: 34px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e4e7ec;
      border-radius: 18px;
      box-shadow: 0 18px 50px
        rgba(16, 24, 40, 0.18);
    }

    .icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff3cd;
      color: #b42318;
      font-size: 42px;
      font-weight: 900;
    }

    .online .icon {
      background: #dcfae6;
      color: #067647;
    }

    h1 {
      margin: 0 0 14px;
      color: #b42318;
      font-size: 28px;
    }

    .online h1 {
      color: #067647;
    }

    p {
      margin: 8px 0;
      font-size: 17px;
      line-height: 1.55;
    }

    .status {
      margin: 22px 0;
      padding: 14px;
      border-radius: 10px;
      background: #f8fafc;
      color: #475467;
      font-size: 15px;
    }

    button {
      min-width: 180px;
      padding: 13px 24px;
      border: 0;
      border-radius: 9px;
      background: #087db8;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #066b9e;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .hint {
      margin-top: 18px;
      color: #667085;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main id="card" class="card">
    <div id="icon" class="icon">!</div>

    <h1 id="title">
      Không thể kết nối hệ thống
    </h1>

    <p id="description">
      SuperPOS chưa thể kết nối với máy chủ.
    </p>

    <p>
      Hãy kiểm tra Internet, modem mạng hoặc
      trạng thái máy chủ.
    </p>

    <div id="status" class="status">
      SuperPOS đang tự kiểm tra kết nối.
    </div>

    <button id="actionButton" type="button">
      Thử lại ngay
    </button>

    <div class="hint">
      Cửa sổ bán hàng vẫn được giữ ở phía sau.
    </div>
  </main>

  <script>
    const card = document.getElementById("card");
    const icon = document.getElementById("icon");
    const title = document.getElementById("title");
    const description =
      document.getElementById("description");
    const status =
      document.getElementById("status");
    const button =
      document.getElementById("actionButton");

    let connected = false;

    window.superPOSOffline.onStatus(
      (connectionStatus = {}) => {
        connected =
          connectionStatus.online === true;

        if (connected) {
          card.classList.add("online");

          icon.textContent = "✓";
          title.textContent =
            "Đã kết nối lại hệ thống";

          description.textContent =
            "Internet và máy chủ SuperPOS " +
            "đã hoạt động trở lại.";

          status.textContent =
            "Nhấn nút bên dưới để tải lại " +
            "trang bán hàng.";

          button.disabled = false;
          button.textContent =
            "Tiếp tục bán hàng";

          return;
        }

        card.classList.remove("online");

        icon.textContent = "!";
        title.textContent =
          "Không thể kết nối hệ thống";

        description.textContent =
          connectionStatus.message ||
          "SuperPOS chưa thể kết nối với máy chủ.";

        status.textContent =
          connectionStatus.checking
            ? "Đang kiểm tra lại kết nối..."
            : "Chương trình vẫn hoạt động. " +
              "Dữ liệu trên máy không bị xóa.";

        button.disabled =
          connectionStatus.checking === true;

        button.textContent =
          connectionStatus.checking === true
            ? "Đang kiểm tra..."
            : "Thử lại ngay";
      }
    );

    button.addEventListener("click", () => {
      if (connected) {
        window.superPOSOffline
          .continueToSystem();

        return;
      }

      button.disabled = true;
      button.textContent = "Đang kiểm tra...";

      status.textContent =
        "SuperPOS đang thử kết nối lại.";

      window.superPOSOffline.retry();
    });
  </script>
</body>
</html>
