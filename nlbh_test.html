<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiểm tra Module Năng lực bán</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:1180px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dce4ec;border-radius:12px;padding:12px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,button,select{font:inherit;font-size:16px}input,select{height:42px;border:1px solid #bac8d6;border-radius:8px;padding:0 10px}button{height:42px;border:0;border-radius:8px;padding:0 14px;font-weight:800;cursor:pointer}.primary{background:#0878d1;color:#fff}.secondary{background:#eaf2f8;color:#075f9f}.status{font-size:14px;color:#526171}.grid{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:8px}.metric{position:relative;border:1px solid #dce4ec;border-radius:10px;padding:10px;background:#fff;cursor:help;transition:.15s box-shadow,.15s transform}.metric:hover{box-shadow:0 6px 18px #0002;transform:translateY(-1px)}.metric b{display:block;font-size:13px;color:#5b6877}.metric strong{display:block;font-size:24px;margin-top:4px}.metric-help{display:none;position:absolute;z-index:50;left:8px;right:8px;top:calc(100% + 7px);background:#172033;color:#fff;border-radius:10px;padding:11px 12px;box-shadow:0 10px 28px #0005;font-size:13px;line-height:1.42;font-weight:400}.metric:hover .metric-help,.metric.open .metric-help{display:block}.metric-help:before{content:"";position:absolute;top:-6px;left:22px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid #172033}.metric-help strong{display:inline;font-size:13px;margin:0;color:#fff}.metric-help .ex{display:block;margin-top:6px;color:#d9e8f8}.branch{font-size:20px;font-weight:900;margin:8px 0}.small{font-size:13px;color:#64748b}.bad{color:#c62828}.good{color:#0b7a45}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.metric-help{position:fixed;left:14px;right:14px;top:auto;bottom:14px;max-height:52vh;overflow:auto}.metric-help:before{display:none}}
</style>
</head>
<body>
<div id="login-container"></div>
<div id="app-container">
  <main class="wrap">
    <div class="card">
      <div class="row">
        <input id="masp" placeholder="Mã sản phẩm" autocomplete="off">
        <button id="btnLoad" class="primary">Tải 6 chỉ số</button>
        <button id="btnFresh" class="secondary">Refresh mã rồi tải</button>
      </div>
      <div id="status" class="status" style="margin-top:8px">Nhập một mã sản phẩm để kiểm tra module.</div>
    </div>
    <div id="results"></div>
  </main>
</div>
<script type="module">
import { getProductBothBranches, refreshSalesCapability } from './scripts/nlbhModule.js';
const $=id=>document.getElementById(id);const n=v=>Number(v||0)||0;const f=v=>n(v).toLocaleString('vi-VN',{maximumFractionDigits:2});
const HELP={
  size:`<strong>Độ đầy đủ size</strong> đo mức độ cơ cấu size hiện tại còn phủ được dải size THỰC mà chính mã hàng này đã từng kinh doanh. Module không mặc định mã nào cũng phải có toàn bộ size 38–46. Ví dụ mã từ đầu chỉ nhập 39–42 thì 39,40,41,42 chính là dải chuẩn của mã; nếu hiện còn đủ cả 4 size thì điểm = 100. Trọng số từng size vẫn dựa trên nhu cầu bán thực tế của nhóm hàng/cơ sở. <span class="ex">Dùng để phân biệt “còn nhiều chiếc” với “còn đúng các size khách cần”.</span>`,
  eff:`<strong>Ngày bán hiệu dụng</strong> là số ngày mà sản phẩm thực sự có cơ hội bán, sau khi đã điều chỉnh theo mức đầy đủ size. Một ngày đủ dải size có giá trị gần 1 ngày; ngày gãy size chỉ tính một phần; hết hàng thì tính 0. <span class="ex">Mục đích: không đánh giá oan một cơ sở bán chậm trong thời gian nó không có đủ hàng để bán.</span>`,
  vel:`<strong>Tốc độ bán thực tế</strong> = số lượng bán / ngày bán hiệu dụng. Trang hiển thị theo dạng dễ hiểu “1 sản phẩm / X ngày hiệu dụng”. Ví dụ tốc độ 0,10 tương đương 1 sản phẩm / 10 ngày hiệu dụng. <span class="ex">Đây là chỉ số cốt lõi để so năng lực bán giữa CS1 và CS2 sau khi đã loại bớt ảnh hưởng thiếu hàng/gãy size.</span>`,
  cap:`<strong>Năng lực bán cơ sở</strong> là điểm tổng hợp 0–100 của riêng mã này tại từng cơ sở. Nền chính gồm tốc độ bán thực tế chuẩn hóa trong cùng nhóm hàng, tỷ lệ chuyển hàng thành doanh số và xu hướng bán gần đây. Điểm được điều chỉnh theo độ tin cậy: mẫu ít vẫn được đánh giá nhưng bị kéo gần mức trung bình hơn. <span class="ex">Ngay cả khi hiện đã hết hàng, nếu lịch sử cho thấy cơ sở từng được cấp hàng và bán hết, dữ liệu đó vẫn được dùng để đánh giá năng lực.</span>`,
  conv:`<strong>Tỷ lệ hàng được chuyển thành doanh số</strong> đo phần hàng thực sự được giao/được phép bán tại cơ sở đã biến thành doanh số. Module xét tồn đầu, hàng tăng/nhập, hàng chuyển ra và lượng bán trong kỳ phân tích. <span class="ex">Tỷ lệ cao cho thấy cơ sở sử dụng lượng hàng được giao hiệu quả; tỷ lệ thấp cần xem thêm tuổi tồn và tình trạng size trước khi kết luận.</span>`,
  health:`<strong>Sức khỏe tồn kho</strong> đánh giá trạng thái hàng đang còn ở hiện tại, dựa trên độ đầy đủ size, số ngày phủ tồn, xu hướng bán và tuổi tồn. Hết hàng thì sức khỏe tồn = 0 dù năng lực bán lịch sử có thể vẫn cao. <span class="ex">Chỉ số này phục vụ quyết định nhập bù, cân đối/chuyển kho hoặc xử lý tồn; không đồng nghĩa với năng lực bán.</span>`
};
function velText(v){const x=Number(v||0);if(!(x>0))return 'Chưa bán';const days=1/x;const d=days.toLocaleString('vi-VN',{maximumFractionDigits:1});return `1 SP / ${d} ngày`;}
function helpBox(key){return `<div class="metric-help">${HELP[key]}</div>`;}
function metric(title,value,unit,key){return `<div class="metric" tabindex="0" data-help="${key}"><b>${title}</b><strong>${value}</strong><span class="small">${unit||''}</span>${helpBox(key)}</div>`;}
function card(r){if(!r)return '<div class="card">Chưa có snapshot.</div>';const anomaly=String(r.trang_thai_ton||'')==='DU_LIEU_TON_AM';const hasEvidence=Number(r.ngay_ban_hieu_dung_365||0)>0||Number(r.ban_365||0)>0;const nlb=(!anomaly&&hasEvidence)?f(r.nang_luc_ban_coso):'—';const conv=(!anomaly&&hasEvidence)?f(r.ty_le_chuyen_doi_doanh_so):'—';const vel=(!anomaly&&hasEvidence)?velText(r.toc_do_ban_thuc_te_90>0?r.toc_do_ban_thuc_te_90:r.toc_do_ban_thuc_te_365):'—';const note=anomaly?'DỮ LIỆU TỒN ÂM - KHÔNG DÙNG RA QUYẾT ĐỊNH':(hasEvidence?('/100 · tin cậy '+f(r.confidence_score)):'CHƯA CÓ LỊCH SỬ BÁN/CƠ HỘI BÁN');const warn=anomaly?'<div class="bad" style="font-weight:900;margin:8px 0">⚠ Dữ liệu tồn đang âm/không nhất quán. Module khóa điểm năng lực cho đến khi dữ liệu tồn được xử lý.</div>':'';return `<div class="card"><div class="branch">${String(r.diadiem||'').toUpperCase()} · ${r.masp||''}</div>${warn}<div class="grid">
${metric('1. Độ đầy đủ size',f(r.do_day_du_size),'/100','size')}
${metric('2. Ngày bán hiệu dụng 90',f(r.ngay_ban_hieu_dung_90),'ngày','eff')}
${metric('3. Tốc độ bán thực tế',vel,'','vel')}
${metric('4. Năng lực bán cơ sở',nlb,note,'cap')}
${metric('5. Chuyển thành doanh số',conv,hasEvidence?'%':'CHƯA CÓ DỮ LIỆU','conv')}
${metric('6. Sức khỏe tồn kho',f(r.suc_khoe_ton_kho),'/100','health')}
</div><div class="small" style="margin-top:10px">Tồn: <b>${f(r.ton_hientai)}</b> · Bán 30/90/365: <b>${f(r.ban_30)} / ${f(r.ban_90)} / ${f(r.ban_365)}</b> · Phủ tồn: <b>${r.so_ngay_phu_ton==null?'—':f(r.so_ngay_phu_ton)+' ngày'}</b> · Xu hướng: <b>${f(r.xu_huong_ban)}</b> · Trạng thái: <b>${r.trang_thai_ton||''}</b></div></div>`}
function bindMetricHelp(){document.querySelectorAll('.metric').forEach(el=>{el.addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.metric.open').forEach(x=>{if(x!==el)x.classList.remove('open')});el.classList.toggle('open')});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}})});}
document.addEventListener('click',()=>document.querySelectorAll('.metric.open').forEach(x=>x.classList.remove('open')));
async function load(fresh=false){const m=$('masp').value.trim().toUpperCase();if(!m)return alert('Nhập mã sản phẩm.');$('status').textContent=fresh?'Đang refresh và tính lại...':'Đang đọc snapshot...';try{if(fresh)await refreshSalesCapability([m],365);const x=await getProductBothBranches(m);$('results').innerHTML=card(x.cs1)+card(x.cs2);bindMetricHelp();$('status').textContent='Đã tải.';}catch(e){console.error(e);$('status').textContent='Lỗi: '+(e?.message||e);}}
$('btnLoad').onclick=()=>load(false);$('btnFresh').onclick=()=>load(true);$('masp').addEventListener('keydown',e=>{if(e.key==='Enter')load(false)});
</script>
</body>
</html>
