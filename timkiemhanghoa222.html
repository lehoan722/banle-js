<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Tìm kiếm thông tin hàng hóa</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.js"></script>
    <script type="module" src="scripts/supabaseClient.js"></script>
    <script type="module" src="scripts/timkiemhanghoa11.js"></script>
    <style>
        body {
            background: #f6f8fa;
            font-family: Segoe UI, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .main-container {
            max-width: 980px; 
            background: #fff;
            margin: 32px auto 0 auto;
            border-radius: 16px;
            box-shadow: 0 3px 18px #d2d8e3;
            padding: 36px 24px 24px 24px;
        }

        h2 {
            margin-top: 0;
            font-size: 2rem;
            color: #1976d2;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            gap: 24px;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            color: #1976d2;
            margin-bottom: 5px;
        }

        .input-group input {
            font-size: 1.15rem;
            padding: 7px 11px;
            border-radius: 5px;
            border: 1px solid #90caf9;
            width: 200px;
            margin-bottom: 2px;
            transition: box-shadow 0.2s;
        }

        .input-group input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #90caf9;
        }

        .input-group .popup-btn {
            background: #e3f0ff;
            border: 1px solid #1976d2;
            color: #1976d2;
            font-weight: 600;
            padding: 3px 11px;
            border-radius: 4px;
            margin-left: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .input-group .popup-btn:hover {
            background: #bbdefb;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .info-table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 8px;
            background: #fafbfc;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 10px #ececec;
        }

        .info-table th,
        .info-table td {
            padding: 7px 10px;
            border: 1px solid #dbe9fd;
            text-align: center;
        }

        .info-table th {
            background: #e3f0ff;
            color: #1976d2;
            font-weight: bold;
        }

        .info-table td.label {
            text-align: left;
            color: #1469aa;
            background: #e3f0ff;
            font-weight: 500;
        }

        .info-table td.title {
            background: #1769aa;
            color: #fff;
            font-weight: bold;
            text-align: left;
        }

        .info-table td.size {
            font-weight: 600;
            background: #f4f9fd;
        }

        .info-table td.number {
            font-variant-numeric: tabular-nums;
        }

        .info-table td.red {
            color: #d32f2f;
            font-weight: 700;
        }

        .info-table td.blue {
            color: #1565c0;
            font-weight: 700;
        }

        @media (max-width:600px) {
            .main-container {
                padding: 10px;
                margin: 0;
                border-radius: 0;
                box-shadow: none;
            }

            .input-row {
                flex-direction: column;
                gap: 10px;
            }

            .input-group input {
                width: 100%;
            }
        }

        /* Popup */
        #popupSearch {
            display: none;
            position: fixed;
            top: 16%;
            left: 50%;
            transform: translate(-50%, 0);
            background: #fff;
            z-index: 2000;
            border: 1px solid #ccc;
            min-width: 340px;
            max-width: 96vw;
            box-shadow: 0 0 12px #888;
            border-radius: 8px;
        }

        #popupSearch input {
            width: 94%;
            margin-bottom: 5px;
        }

        #popupSearchList {
            max-height: 260px;
            overflow: auto;
            font-size: 15px;
        }

        #popupSearchList div {
            padding: 5px 10px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }

        #popupSearchList div:hover {
            background: #e3f0ff;
        }

        .flex-wrap {
            display: flex;
            gap: 24px;
        }

        .left-info {
            width: 30%;
            min-width: 200px;
        }

        .right-xnt {
            width: 70%;
            min-width: 420px;
            overflow-x: auto;
        }

        @media (max-width: 900px) {
            .flex-wrap {
                flex-direction: column;
            }

            .left-info,
            .right-xnt {
                width: 100%;
                min-width: unset;
            }
        }
    </style>
</head>

<body>

    <div id="authBox"
        style="margin-bottom:18px; background:#f6f8fa; padding:12px 16px; border-radius:8px; box-shadow:0 2px 8px #eee; max-width:380px;">
        <label>Email: <input type="email" id="email" value="khohangcs1@gmail.com"></label>
        <label style="margin-left:12px;">Mật khẩu: <input type="password" id="password" value="123123"></label>
        <button onclick="dangNhap()"
            style="margin-left:12px; background:#1976d2; color:#fff; border:none; padding:4px 12px; border-radius:6px;">Đăng
            nhập</button>
        <span id="authStatus" style="color:red; margin-left:10px"></span>
    </div>


    <div class="main-container">
        <h2>🔍 TÌM KIẾM THÔNG TIN HÀNG HÓA</h2>
        <div class="input-row">
            <div class="input-group">
                <!-- ngay cạnh nút 🔍 hiện có -->
                <button class="popup-btn" id="scanBtn">📷 Quét</button>

                <label for="maspInput">Nhập mã hàng</label>
                <div>
                    <input id="maspInput" placeholder="Nhập mã sản phẩm, ví dụ 66862-AP" autocomplete="off" />
                    <button class="popup-btn" onclick="openPopupSearch('mahang')">🔍</button>
                </div>
            </div>
            <button id="searchBtn"
                style="height:40px;background:#1976d2;color:#fff;font-weight:bold;border:none;border-radius:7px;padding:0 32px;cursor:pointer;">Tìm
                kiếm</button>
        </div>
        <div id="statusMsg" style="color: #c62828; font-weight:bold; min-height:30px;"></div>

        <div id="multiDetailBox"></div>
        <div class="flex-wrap" id="singleDetailBox">
            <div class="left-info">
                <table id="infoTableLeft" class="info-table"></table>
            </div>
            <div class="right-xnt">
                <table id="infoTableRight" class="info-table"></table>
            </div>
        </div>

    </div>
    <!-- Popup tìm kiếm dùng chung -->
    <div id="popupSearch">
        <div style="padding:6px 10px;border-bottom:1px solid #eee;background:#f8fafd;">
            <input id="popupSearchInput" type="text" placeholder="Nhập từ khóa tìm kiếm..." autofocus>
            <button onclick="closePopupSearch()" style="float:right;background:#e57373;color:#fff;">Đóng</button>
        </div>
        <div id="popupSearchList"></div>
    </div>

    <!-- Scanner Modal -->
    <div id="scannerModal" style="display:none;
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:3000;">
        <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:min(92vw,720px);background:#000;border-radius:12px;overflow:hidden">
            <div style="position:relative;background:#000">
                <video id="scannerVideo" playsinline autoplay muted
                    style="width:100%;height:auto;background:#000"></video>
                <!-- khung ngắm -->
                <div style="position:absolute;inset:12% 12%;border:2px solid rgba(255,255,255,.8);
                  border-radius:10px;pointer-events:none;"></div>
                <div id="scannerStatus" style="position:absolute;left:12px;bottom:10px;color:#fff;font-weight:600;
                  text-shadow:0 1px 2px #000"></div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;
                padding:10px;background:#111;color:#eee">
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                    <select id="cameraSelect" style="max-width:48vw"></select>
                    <button id="flashBtn" class="popup-btn" style="background:#222;border-color:#666;color:#eee">
                        🔦 Đèn
                    </button>
                    <label class="popup-btn" style="background:#222;border-color:#666;color:#eee;cursor:pointer">
                        Ảnh có sẵn
                        <input id="filePicker" type="file" accept="image/*" capture="environment" hidden>
                    </label>
                </div>
                <button id="closeScanner" class="popup-btn"
                    style="background:#e57373;border-color:#c62828;color:#fff">Đóng</button>
            </div>
        </div>
    </div>


</body>

</html>
