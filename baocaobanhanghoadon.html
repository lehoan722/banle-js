<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Báo cáo Bán hàng theo Hóa đơn</title>
  <script src="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.css">
  <style>
    body { font-family: Arial, sans-serif; padding: 10px; }
    .filter-group { margin-bottom: 10px; }
    label { margin-right: 5px; }
    #hotContainer { margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Ảnh Báo Bán hàng theo Hóa đơn</h2>

  <div class="filter-group">
    <label>Từ ngày: <input type="date" id="tu_ngay"></label>
    <label>Đến ngày: <input type="date" id="den_ngay"></label>
    <label>Khách hàng: <input type="text" id="khachhang"></label>
    <label>Nhân viên: <input type="text" id="nhanvien"></label>
    <label>Địa điểm: <input type="text" id="diadiem"></label>
    <label>Loại hóa đơn: <input type="text" id="loaihd"></label>
    <label>Mã SP: <input type="text" id="masp"></label>
    <label><input type="checkbox" id="tonghop_ngay"> Tổng hợp theo ngày</label>
    <button onclick="taiDuLieu()">Ấn tìm</button>
    <button onclick="xuatExcelToanBo()">Xuất Excel</button>
  </div>

  <div id="hotContainer"></div>

  <div class="filter-group">
    <button onclick="prevPage()">Trang trước</button>
    <span id="pageInfo">Trang 1</span>
    <button onclick="nextPage()">Trang sau</button>
  </div>

  <script src="baocaobanhanghoadon.js"></script>
</body>
</html>
