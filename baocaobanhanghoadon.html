<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Báo cáo Bán hàng theo Hóa đơn</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@7.4.2/dist/handsontable.full.min.css">
    <style>
        body {
            font-family: Arial;
            padding: 10px;
        }

        .filter-group {
            margin-bottom: 8px;
        }

        label {
            margin-right: 6px;
        }

        #hotContainer {
            margin-top: 15px;
        }

        .checkbox-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
    </style>
</head>

<body>
    <h2>BÁO CÁO BÁN HÀNG THEO HÓA ĐƠN</h2>

    <div class="filter-group">
        <label>Từ ngày: <input type="date" id="tu_ngay"></label>
        <label>Đến ngày: <input type="date" id="den_ngay"></label>
        <label>Khách hàng: <input type="text" id="khachhang" size="10"></label>
        <label>Nhân viên: <input type="text" id="nhanvien" size="10"></label>
        <label>Địa điểm: <input type="text" id="diadiem" size="8"></label>
        <label>Mã SP: <input type="text" id="masp" size="8"></label>
        <label>Số HĐ: <input type="text" id="sohd" size="10"></label>
        <label><input type="checkbox" id="tonghop_ngay"> Tổng hợp theo ngày</label>
    </div>

    <div class="filter-group checkbox-list">
        <label><input type="checkbox" class="loaihd-filter" value="bancs1"> bancs1</label>
        <label><input type="checkbox" class="loaihd-filter" value="bancs2"> bancs2</label>
        <label><input type="checkbox" class="loaihd-filter" value="xcncs1"> xcncs1</label>
        <label><input type="checkbox" class="loaihd-filter" value="xcncs2"> xcncs2</label>
        <label><input type="checkbox" class="loaihd-filter" value="ncncs1"> ncncs1</label>
        <label><input type="checkbox" class="loaihd-filter" value="ncncs2"> ncncs2</label>
    </div>

    <div class="filter-group">
        <button onclick="taiDuLieu()">🔍 Tìm kiếm</button>
        <button onclick="xuatExcelToanBo()">📤 Xuất Excel</button>
        <button onclick="xoaHoaDon()">🗑 Xóa hóa đơn đã chọn</button>
    </div>

    <div id="hotContainer" style="max-width: 100%; overflow: auto;"></div>

    <div class="filter-group">
        <button onclick="prevPage()">⬅ Trang trước</button>
        <span id="pageInfo">Trang 1</span>
        <button onclick="nextPage()">Trang sau ➡</button>
    </div>
