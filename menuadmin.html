<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MENU ADMIN - AuthModule</title>
    <style>
        body { background:#f8f8f8; font-family:'Segoe UI',Arial,sans-serif; margin:0; padding:0; }
        .menu-container { max-width:450px; margin:30px auto; background:#fff; border-radius:12px; box-shadow:0 2px 16px rgba(90,100,120,.08); padding:0 0 18px; }
        .menu-header { width:100%; display:flex; align-items:center; justify-content:space-between; padding-bottom:2px; border-bottom:2px solid #ffd54f; background:#fff; }
        .username { font-size:1rem; color:#34495e; font-weight:600; min-width:80px; padding-left:10px; padding-top:10px; }
        .menu-title { flex:1; text-align:center; color:#e53935; font-size:1.38rem; font-weight:700; letter-spacing:1.5px; padding:18px 0 10px; }
        .logout-btn { margin:9px 18px 0 0; background:#ffd54f; color:#d32f2f; font-size:.98rem; border:none; border-radius:8px; padding:4px 18px; cursor:pointer; font-weight:600; box-shadow:0 1px 4px #ffe08233; }
        .menu-list { list-style:none; margin:0; padding:0; }
        .menu-item { cursor:pointer; font-size:1.11rem; padding:11px 20px; border-bottom:1px solid #f0eee5; background:#fff; transition:background .18s; color:#34495e; }
        .menu-item:nth-child(even) { background:#fffbe7; }
        .menu-item:hover,.menu-item:active { background:#ffe082; color:#c62828; }
        .status { text-align:center; color:#888; padding:20px 12px; }
        @media (max-width:600px) {
            .menu-container { max-width:99vw; margin:5px auto; border-radius:0; box-shadow:none; }
            .menu-title { font-size:1.12rem; padding:12px 0 7px; }
            .username { font-size:.98rem; padding-top:7px; }
            .logout-btn { margin:7px 8px 0 0; font-size:.97rem; }
        }
    </style>
</head>
<body>
    <div id="login-container"></div>

    <div id="app-container" style="display:none;">
        <div class="menu-container">
            <div class="menu-header">
                <span class="username" id="username"></span>
                <span class="menu-title">MENU ADMIN</span>
                <button class="logout-btn" id="logoutBtn" type="button">Đăng xuất</button>
            </div>
            <ul class="menu-list" id="menuList">
                <li class="status">Đang tải menu...</li>
            </ul>
        </div>
    </div>

    <script type="module">
        import { khoiTaoDangNhapDungChung, dangXuatDungChung } from "./scripts/authModule.js";

        const SHEET_ID = "1LK_VKjXFRwLWuabZgjlIs1Q0EIEYF7Vf3EdCSGbTDOk";
        const SHEET_NAME = "MENUADMIN";
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

        let menuData = [];

        function parseCSV(text) {
            const rows = [];
            let row = [], field = "", inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (text[i + 1] === '"') { field += '"'; i++; }
                        else inQuotes = false;
                    } else {
                        field += c;
                    }
                    continue;
                }
                if (c === '"') {
                    inQuotes = true;
                } else if (c === ',') {
                    row.push(field);
                    field = '';
                } else if (c.charCodeAt(0) === 10) {
                    if (field.endsWith(String.fromCharCode(13))) field = field.slice(0, -1);
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = '';
                } else {
                    field += c;
                }
            }
            if (field.endsWith(String.fromCharCode(13))) field = field.slice(0, -1);
            if (field.length || row.length) {
                row.push(field);
                rows.push(row);
            }
            return rows;
        }

        async function fetchMenuSheet() {
            const menuList = document.getElementById("menuList");
            menuList.innerHTML = '<li class="status">Đang tải menu...</li>';

            const res = await fetch(SHEET_URL, { cache:"no-store" });
            if (!res.ok) throw new Error("Không thể đọc Google Sheet");

            const csv = await res.text();
            let data = parseCSV(csv).filter(r => r.some(v => String(v || '').trim() !== ''));

            if (data.length) {
                const first = String(data[0][0] || '').trim().toLowerCase();
                const second = String(data[0][1] || '').trim().toLowerCase();
                if (first.includes('menu') || first === 'name' || first === 'label' || second === 'url') data = data.slice(1);
            }

            menuData = data;
            renderMenu();
        }

        function renderMenu() {
            const menuList = document.getElementById("menuList");
            menuList.innerHTML = '';
            menuData.forEach(row => {
                const name = String(row[0] || '').trim();
                const url = String(row[1] || '').trim();
                if (!name || !url) return;
                const li = document.createElement('li');
                li.className = 'menu-item';
                li.textContent = name;
                li.addEventListener('click', () => window.open(url, '_blank'));
                menuList.appendChild(li);
            });
            if (!menuList.children.length) menuList.innerHTML = '<li class="status">Không có dữ liệu menu!</li>';
        }

        function capNhatNguoiDung(nhanvien) {
            const manv = String(nhanvien?.manv || localStorage.getItem('manv') || '').trim();
            const tennv = String(nhanvien?.tennv || localStorage.getItem('tennv') || '').trim();
            const displayName = tennv ? `${tennv}${manv ? ' (' + manv + ')' : ''}` : manv;
            document.getElementById('username').textContent = displayName ? '👤 ' + displayName : '';
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await dangXuatDungChung({
                loginContainerId:'login-container',
                appContainerId:'app-container',
                clearDraft:false,
                reloadPage:true
            });
        });

        khoiTaoDangNhapDungChung({
            loginContainerId:'login-container',
            appContainerId:'app-container',
            macDinhDiaDiem: localStorage.getItem('diadiem') || 'cs1',
            tuDongKhoaCoSo:false,
            onLoginSuccess: async (nhanvien, ctx) => {

                const isAdmin = !!(
                    nhanvien?.is_admin === true ||
                    localStorage.getItem("is_admin") === "true"
                );

                if (!isAdmin) {
                    alert("Bạn không có quyền truy cập MENU ADMIN.");
                    await dangXuatDungChung({
                        loginContainerId: "login-container",
                        appContainerId: "app-container",
                        clearDraft: false,
                        reloadPage: true
                    });
                    return false;
                }

                capNhatNguoiDung(nhanvien);
                try {
                    await fetchMenuSheet();
                } catch (err) {
                    console.error('Lỗi tải menu:', err);
                    document.getElementById('menuList').innerHTML = '<li class="status" style="color:#d32f2f;">Lỗi tải dữ liệu menu: ' + String(err?.message || err) + '</li>';
                }
                return true;
            }
        });
    </script>
</body>
</html>
