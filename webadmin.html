<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản trị Website - Shop Hoàn Tuyết</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="webadmin.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="admin-wrap">
    <h1>Quản trị Website Shop Hoàn Tuyết</h1>

    <section class="box">
      <h2>Ảnh trình chiếu trang chủ</h2>

      <input id="slideTitle" placeholder="Tên ảnh / ghi chú">
      <input id="slideUrl" placeholder="Link ảnh Supabase">
      <input id="slideOrder" type="number" placeholder="Thứ tự hiển thị">

      <button onclick="saveSlide()">Lưu ảnh trình chiếu</button>

      <div id="slideList"></div>
    </section>

    <section class="box">
      <h2>Bài viết / nội dung website</h2>

      <input id="postTitle" placeholder="Tiêu đề bài viết">
      <input id="postImage" placeholder="Link ảnh bài viết">

      <select id="postCategory">
        <option value="ao-nam">Áo nam</option>
        <option value="quan-nam">Quần nam</option>
        <option value="giay-dep">Giày dép</option>
        <option value="phu-kien">Phụ kiện</option>
        <option value="khuyen-mai">Khuyến mãi</option>
      </select>

      <textarea id="postContent" placeholder="Nội dung bài viết"></textarea>

      <button onclick="savePost()">Lưu bài viết</button>

      <div id="postList"></div>
    </section>
  </div>

  <script src="webadmin.js"></script>
</body>
</html>
