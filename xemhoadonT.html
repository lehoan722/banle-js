<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Xem hóa đơn T2</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    tr:hover {
      background-color: #f1f1f1;
      cursor: pointer;
    }

    input,
    select {
      margin: 4px;
      padding: 6px;
    }

    #popup {
      display: none;
      position: fixed;
      top: 10px;
      right: 10px;
      left: auto;
      width: 600px;

      min-width: 350px;
      min-height: 200px;
      height: 300px;
      background: #fff;
      border: 2px solid #4884ce;
      overflow: auto;
      padding: 20px;
      z-index: 9999;
      box-shadow: 0 2px 18px rgba(0, 0, 0, 0.2);
      border-radius: 7px;
      resize: both;
      /* Cho phép thay đổi kích thước */

    }

    #popup .drag-header {
      cursor: move;
      background: #f3f7fa;
      font-weight: bold;
      padding: 8px 10px;
      margin: -20px -20px 15px -20px;
      border-bottom: 1px solid #4884ce;
      border-radius: 7px 7px 0 0;
      user-select: none;
    }

    thead tr th {
      position: sticky;
      top: 0;
      background: #f9f9f9;
      z-index: 2;
    }

    button.loc-btn {
      background: #2196f3;
      color: #fff;
      border: none;
      font-weight: bold;
      padding: 7px 18px;
      border-radius: 4px;
      margin-right: 8px;
      cursor: pointer;
    }

    .xoa-btn {
      background: #ffe066;
      color: #555;
      border: none;
      font-weight: bold;
      padding: 7px 18px;
      border-radius: 4px;
      margin-right: 8px;
      cursor: pointer;
    }

    .xoa-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }


    button.loc-btn:hover {
      background: #1769aa;
    }

    button.xoa-btn {
      background: #ffe066;
      color: #555;
      border: none;
      font-weight: bold;
      padding: 7px 18px;
      border-radius: 4px;
      cursor: pointer;
    }

    button.xoa-btn:hover {
      background: #ffe599;
    }
  </style>
</head>

<body>


  <!---//Thêm “hàng rào” đăng nhập chuẩn auth cho xemhoadon111.html-->
  <div id="app-container">

  <!---//Thêm “hàng rào” đăng nhập chuẩn auth cho xemhoadon111.html-->

  <script>

    let rowDangChon = null;

    // ====== T2: Trạng thái gửi + gửi lại HĐĐT Viettel ======
    let __loaiTongHopCurrent = "chitiet";

    const getTrangThaiGui = (trangThai) => {
      if (!trangThai || String(trangThai).trim() === "") return "Chưa gửi";
      return String(trangThai);
    };

    const getMauTrangThai = (trangThai) => {
      const t = getTrangThaiGui(trangThai);
      if (!t || t === "Chưa gửi") return "orange";
      if (t === "Đã gửi") return "green";
      if (t.startsWith("Lỗi")) return "red";
      return "#888";
    };


    function capNhatNutXoa() {
      const btnXoa = document.getElementById('btnXoaHD');
      if (!btnXoa) return;

      // Chỉ bật khi đang ở chế độ chi tiết và có ít nhất 1 hóa đơn được tick
      const isChiTiet = (__loaiTongHopCurrent === 'chitiet');
      const hasChecked = document.querySelectorAll('.chonHD:checked').length > 0;

      btnXoa.disabled = !(isChiTiet && hasChecked);
    }

    function capNhatNutGuiLai() {
      const btn = document.getElementById("btnGuiLai");
      if (!btn) return;

      // Chỉ cho gửi lại trong chế độ "chi tiết"
      capNhatNutXoa();
      if (__loaiTongHopCurrent !== "chitiet") {
        btn.disabled = true;
        return;
      }

      const checkboxes = document.querySelectorAll('.chonHD:checked');
      if (!checkboxes || checkboxes.length === 0) {
        btn.disabled = true;
        return;
      }

      const allValid = Array.from(checkboxes).every(cb => {
        const tr = cb.closest('tr');
        const trangThai = tr && tr.querySelector("td:last-child")?.textContent?.trim();
        return (trangThai === "Chưa gửi" || (trangThai && trangThai.startsWith("Lỗi")));
      });

      btn.disabled = !allValid;
    }


    // Lấy đủ mọi dòng hóa đơn từ Supabase (bằng .range để lấy từng trang, rồi gộp lại)
    async function getAllHoaDon(query, pageSize = 1000) {
      let from = 0;
      let allData = [];
      while (true) {
        let { data, error } = await query.range(from, from + pageSize - 1);
        if (error) {
          alert("❌ Lỗi tải hóa đơn: " + error.message);
          break;
        }
        if (data && data.length > 0) {
          allData = allData.concat(data);
          if (data.length < pageSize) break; // Trang cuối cùng
          from += pageSize;
        } else {
          break;
        }
      }
      return allData;
    }


    // ... (đoạn createClient, getAllHoaDon, v.v. của bạn giữ nguyên)

    // Lấy tất cả sohd từ ct_hoadon_banle theo 1 mã (dùng phân trang .range giống getAllHoaDon)
    async function getSohdByOneMasp(masp, pageSize = 2000) {
      let from = 0;
      const sohdSet = new Set();
      while (true) {
        const { data, error } = await window.supabase
          .from('ct_hoadon_banleT')
          .select('sohd, masp')
          .ilike('masp', `%${masp}%`)
          .range(from, from + pageSize - 1);

        if (error) { alert('❌ Lỗi tìm sohd theo mã: ' + error.message); break; }
        if (!data || data.length === 0) break;

        data.forEach(r => { if (r?.sohd) sohdSet.add(r.sohd); });
        if (data.length < pageSize) break;
        from += pageSize;
      }
      return sohdSet;
    }

    // Lấy tập sohd theo nhiều mã: matchAll=true → giao nhau; matchAll=false → hợp
    async function getSohdByMaspList(maspList, matchAll = true) {
      if (!maspList.length) return new Set();
      const sets = [];
      for (const m of maspList) {
        const s = await getSohdByOneMasp(m);
        sets.push(s);
      }
      if (sets.length === 1) return sets[0];

      if (matchAll) {
        // Giao nhau
        let inter = sets[0];
        for (let i = 1; i < sets.length; i++) {
          const next = sets[i];
          inter = new Set([...inter].filter(x => next.has(x)));
          if (inter.size === 0) break;
        }
        return inter;
      } else {
        // Hợp
        const uni = new Set();
        sets.forEach(s => s.forEach(x => uni.add(x)));
        return uni;
      }
    }


    async function taiDanhSachHoaDon() {
      if (!window.supabase) { console.warn("Supabase chưa sẵn sàng (chưa đăng nhập)"); return; }
      // 1. Lấy các giá trị lọc từ giao diện
      const tuNgay = document.getElementById("tuNgay").value;
      let denNgay = document.getElementById("denNgay").value;
      if (denNgay) denNgay = denNgay + "T23:59:59.999";

      const nv = document.getElementById("locNV").value.trim().toUpperCase();
      const sohd = document.getElementById("locSoHD").value.trim();
      const khach = document.getElementById("locKhach").value.trim();
      const tienTu = Number(document.getElementById("tienTu").value);
      const tienDen = Number(document.getElementById("tienDen").value);

      const selectLoai = document.getElementById("loaiChungTu");
      const loaiChungTuArr = Array.from(selectLoai.selectedOptions).map(o => o.value);

      const loaiTongHop = document.getElementById("loaiTongHop")?.value || "chitiet";

      // T2: lưu trạng thái chế độ để điều khiển nút gửi lại
      __loaiTongHopCurrent = loaiTongHop;

      const tbody = document.getElementById("dsHoaDon");
      tbody.innerHTML = "";

      // --- THÊM: chuẩn bị lọc theo mã sản phẩm ---
      const maspRaw = document.getElementById('locMasp').value.trim();
      const matchAll = document.getElementById('chkMatchAll').checked;
      let sohdFilterSet = null;

      if (maspRaw) {
        // chuẩn hóa & loại trống
        const maspList = maspRaw.split(',')
          .map(s => s.trim().toUpperCase())
          .filter(Boolean);
        if (maspList.length) {
          sohdFilterSet = await getSohdByMaspList(maspList, matchAll);
          if (sohdFilterSet.size === 0) {
            tbody.innerHTML = `<tr><td colspan="13">Không có dữ liệu (không có HĐ chứa các mã đã nhập)</td></tr>`;
            // cũng reset tổng
            document.getElementById('tongSoLuong2').textContent = '0';
            document.getElementById('tongTien2').textContent = '0';
            return;
          }
        }
      }

      let filtered = [];

      // Nếu chọn loại chứng từ: Truy vấn từng loại (song song, gộp lại)
      if (loaiChungTuArr.length > 0) {
        let arr = [];
        for (const loai of loaiChungTuArr) {
          let query = window.supabase
            .from('hoadon_banleT')
            .select('*')
            .order('created_at', { ascending: true })    // SỬA: dùng 'ngay'
            .ilike('sohd', `${loai}_%`);

          if (tuNgay && denNgay) query = query.gte('created_at', tuNgay).lte('created_at', denNgay);   // SỬA: dùng 'ngay'
          else if (tuNgay) query = query.gte('ngay', tuNgay);
          else if (denNgay) query = query.lte('ngay', denNgay);

          if (nv) query = query.ilike('manv', `%${nv}%`);

          if (sohd) query = query.ilike('sohd', `%${sohd}%`);
          if (khach) query = query.ilike('khachhang', `%${khach}%`);
          if (!isNaN(tienTu) && tienTu > 0) query = query.gte('thanhtoan', tienTu);
          if (!isNaN(tienDen) && tienDen > 0) query = query.lte('thanhtoan', tienDen);

          if (sohdFilterSet && sohdFilterSet.size > 0) {
            // Giới hạn sohd theo ct_hoadon_xxx đã tìm được
            query = query.in('sohd', Array.from(sohdFilterSet));
          }

          let data = await getAllHoaDon(query, 1000);
          arr = arr.concat(data);
        }
        // Loại bỏ trùng hóa đơn (nếu 2 loại overlap)
        const hash = {};
        filtered = arr.filter(hd => {
          if (hash[hd.sohd]) return false;
          hash[hd.sohd] = true;
          return true;
        });
      } else {
        // Không chọn loại, lấy toàn bộ
        let query = window.supabase
          .from('hoadon_banleT')
          .select('*')
          .order('ngay', { ascending: true }) // Ưu tiên order theo ngày hóa đơn thực tế

        if (tuNgay && denNgay) query = query.gte('created_at', tuNgay).lte('created_at', denNgay);
        else if (tuNgay) query = query.gte('ngay', tuNgay);
        else if (denNgay) query = query.lte('ngay', denNgay);


        if (nv) query = query.ilike('manv', `%${nv}%`);

        if (sohd) query = query.ilike('sohd', `%${sohd}%`);
        if (khach) query = query.ilike('khachhang', `%${khach}%`);
        if (!isNaN(tienTu) && tienTu > 0) query = query.gte('thanhtoan', tienTu);
        if (!isNaN(tienDen) && tienDen > 0) query = query.lte('thanhtoan', tienDen);

        if (sohdFilterSet && sohdFilterSet.size > 0) {
          query = query.in('sohd', Array.from(sohdFilterSet));
        }
        let data = await getAllHoaDon(query, 1000);
        filtered = data || [];

      }

      if (!filtered.length) return tbody.innerHTML = `<tr><td colspan="13">Không có dữ liệu</td></tr>`;

      // SẮP XẾP THEO SỐ HÓA ĐƠN TỪ NHỎ ĐẾN LỚN (chỉ áp dụng cho chế độ chi tiết)
      if (loaiTongHop === "chitiet") {
        filtered.sort((a, b) => {
          const s1 = (a.sohd || "").toString();
          const s2 = (b.sohd || "").toString();
          return s1.localeCompare(s2); // tăng dần
        });
      }

      // ----------- XỬ LÝ TỔNG HỢP THEO NGÀY/THÁNG/NĂM ----------
      let hienThiData = filtered;
      if (loaiTongHop !== "chitiet") {
        const groupMap = new Map();
        filtered.forEach(hd => {
          const d = new Date(hd.created_at);
          let key = "";
          if (loaiTongHop === "ngay") key = d.toISOString().slice(0, 10);
          if (loaiTongHop === "thang") key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
          if (loaiTongHop === "nam") key = d.getFullYear() + "";
          if (!groupMap.has(key)) {
            groupMap.set(key, {
              sohd: 1,
              created_at: hd.created_at,
              tongsl: Number(hd.tongsl || 0),
              tongthanhtien: Number(hd.tongthanhtien || 0),
              chietkhau: Number(hd.chietkhau || 0),
              thanhtoan: Number(hd.thanhtoan || 0)
            });
          } else {
            let obj = groupMap.get(key);
            obj.sohd += 1;
            obj.tongsl += Number(hd.tongsl || 0);
            obj.tongthanhtien += Number(hd.tongthanhtien || 0);
            obj.chietkhau += Number(hd.chietkhau || 0);
            obj.thanhtoan += Number(hd.thanhtoan || 0);
          }
        });
        hienThiData = Array.from(groupMap.entries()).map(([key, val]) => {
          // Định dạng lại ngày/tháng/năm để hiển thị
          if (loaiTongHop === "ngay") val.created_at = key.split('-').reverse().join('/');
          if (loaiTongHop === "thang") val.created_at = key.slice(5, 7) + "/" + key.slice(0, 4);
          if (loaiTongHop === "nam") val.created_at = key;
          return val;
        });
      }

      // ------------- HÀM ĐỊNH DẠNG NGÀY  -------------

      function dinhDangNgay(ngayStr) {
        if (!ngayStr) return "";
        const d = new Date(ngayStr);
        return new Intl.DateTimeFormat("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        }).format(d);
      }

      // ------------- HÀM ĐỊNH DẠNG NGÀY GIỜ -------------
      function dinhDangNgayGio(ngayStr) {
        if (!ngayStr) return "";

        // Nếu chuỗi có dạng dd/mm/yyyy hoặc mm/yyyy hoặc yyyy thì giữ nguyên (đang tổng hợp)
        if (
          /^\d{2}\/\d{2}\/\d{4}$/.test(ngayStr) ||
          /^\d{2}\/\d{4}$/.test(ngayStr) ||
          /^\d{4}$/.test(ngayStr)
        ) return ngayStr;

        const d = new Date(ngayStr);
        const datePart = new Intl.DateTimeFormat("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        }).format(d);

        const timePart = new Intl.DateTimeFormat("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(d);

        // timePart thường ra "09:18" => đổi thành "09h18"
        return `${datePart} ${timePart.replace(":", "h")}`;
      }
      // ------------- HIỂN THỊ RA BẢNG -------------
      hienThiData.forEach((hd, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
  <td>${idx + 1}</td>
  <td><input type="checkbox" class="chonHD" data-sohd="${hd.sohd || ""}"></td>
  <td>${hd.sohd || ""}</td>
  <td>${dinhDangNgayGio(hd.created_at)}</td>
  <td>${dinhDangNgayGio(hd.updated_at || hd.updatedAt)}</td>
  <td>${hd.manv || ""}</td>
  <td>${hd.khachhang || ""}</td>
  <td>${hd.tongsl || 0}</td>
  <td>${Number(hd.tongthanhtien || 0).toLocaleString()}</td>
  <td>${Number(hd.chietkhau || 0).toLocaleString()}</td>
  <td>${Number(hd.thanhtoan || 0).toLocaleString()}</td>
  <td>${hd.ghichu || ""}</td>
  <td style="color:${__loaiTongHopCurrent === "chitiet" ? getMauTrangThai(hd.trang_thai_gui) : ""}; font-weight:bold;">${__loaiTongHopCurrent === "chitiet" ? getTrangThaiGui(hd.trang_thai_gui) : ""}</td>
`;

        // T2: checkbox chỉ dùng cho gửi lại (chỉ bật ở chế độ chi tiết)
        const __cb = tr.querySelector('.chonHD');
        if (__cb) {
          __cb.disabled = (__loaiTongHopCurrent !== 'chitiet');
          __cb.onchange = () => { capNhatNutGuiLai(); capNhatNutXoa(); capNhatNutXoa(); };
        }

        tr.onclick = (e) => {
          if (e.target.tagName !== 'INPUT' && loaiTongHop === "chitiet") {
            document.querySelectorAll("#dsHoaDon tr").forEach(tr2 => tr2.style.backgroundColor = "");
            tr.style.backgroundColor = "#ffe066";
            rowDangChon = tr;
            xemChiTiet(hd.sohd);
          }
        };

        // Double-click vào cột Số HĐ để mở trang hóa đơn tương ứng
        const sohdCell = tr.cells[2]; // cột thứ 3 = Số HĐ
        if (sohdCell) {
          sohdCell.style.cursor = 'pointer';
          sohdCell.style.textDecoration = 'underline';

          sohdCell.ondblclick = (ev) => {
            ev.stopPropagation();           // không kích hoạt click chọn dòng
            if (!hd.sohd) return;
            openInvoiceBySohd(hd.sohd);     // hàm sẽ khai báo ở dưới
          };
        }

        tbody.appendChild(tr);
      });

        header.onmousedown = function (e) {

          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
          document.onmousemove = function (ev) {

    async function fetchBuyerFromDMKH(makhOrName) {
      const key = String(makhOrName || "").trim();
      if (!key || /^kh(á|a)ch\s*l(ẻ|e)$/i.test(key)) return null;

      let { data: kh } = await window.supabase
        .from('dmkhachhang')
        .select('makh, tenkh, diachi, dienthoai, email, mst')
        .eq('makh', key)
        .maybeSingle();

      if (!kh && key.length >= 2) {
        const { data: list } = await window.supabase
          .from('dmkhachhang')
          .select('makh, tenkh, diachi, dienthoai, email, mst')
          .ilike('tenkh', key);
        kh = Array.isArray(list) && list.length === 1 ? list[0] : null;
      }

      if (!kh) return null;
      return {
        buyerName: kh.tenkh || 'Khách lẻ',
        buyerAddressLine: kh.diachi || '',
        buyerTaxCode: kh.mst || '',
        buyerPhoneNumber: kh.dienthoai || '',
        buyerEmail: kh.email || ''
      };
    }

    async function guiLaiHoaDonDaChon() {
      // Lấy danh sách các checkbox được chọn
      const checkboxes = document.querySelectorAll(".chonHD:checked");
      const sohdList = Array.from(checkboxes).map(cb => cb.dataset.sohd);

      if (sohdList.length === 0) {
        alert("Vui lòng tick chọn ít nhất 1 hóa đơn chưa gửi/lỗi để gửi lại!");
        return;
      }

      // Lấy trạng thái gửi của từng hóa đơn
      // => Đọc thẳng từ DOM bảng hiện tại cho đơn giản
      const rows = Array.from(document.querySelectorAll("#dsHoaDon tr"));
      const hoadonToSend = [];
      for (let sohd of sohdList) {
        const row = rows.find(tr => {
          const td = tr.querySelector("td:nth-child(3)");
          return td && td.textContent.trim() === sohd;
        });
        if (!row) continue;
        // Lấy trạng thái gửi ở cột cuối cùng (thứ 9)
        const trangThai = row.querySelector("td:last-child").textContent.trim();
        if (trangThai === "Chưa gửi" || trangThai.startsWith("Lỗi")) {
          hoadonToSend.push(sohd);
        }
      }

      if (hoadonToSend.length === 0) {
        alert("Chỉ gửi lại các hóa đơn chưa gửi hoặc báo lỗi. Không có hóa đơn nào hợp lệ để gửi lại!");
        return;
      }

      if (!confirm(`Bạn có chắc chắn muốn gửi lại ${hoadonToSend.length} hóa đơn chưa gửi/lỗi này lên Viettel?`)) return;

      let thanhCong = 0, thatBai = 0, loiList = [];

      for (const sohd of hoadonToSend) {
        // Lấy lại dữ liệu hóa đơn & chi tiết
        const { data: hoadon } = await window.supabase
          .from('hoadon_banleT')
          .select('*')
          .eq('sohd', sohd)
          .single();

        const { data: chitiet } = await window.supabase
          .from('ct_hoadon_banleT')
          .select('*')
          .eq('sohd', sohd);

        if (!hoadon || !chitiet || chitiet.length === 0) {
          loiList.push(`HĐ [${sohd}]: Không tìm thấy dữ liệu!`);
          await window.supabase
            .from('hoadon_banleT')
            .update({ trang_thai_gui: 'Lỗi: Không tìm thấy dữ liệu' })
            .eq('sohd', sohd);
          thatBai++;
          continue;
        }

        let buyerOverride = null;
        if (hoadon?.khachhang && !/^kh(á|a)ch\s*l(ẻ|e)$/i.test(hoadon.khachhang)) {
          buyerOverride = await fetchBuyerFromDMKH(hoadon.khachhang);
        }
        const json = taoDuLieuHoaDon({ ...hoadon, __buyerOverride: buyerOverride }, chitiet);

        try {
          const response = await fetch('/api/guiHDDT', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: json })
          });

          let result;
          try {
            result = await response.json();
          } catch (err) {
            loiList.push(`HĐ [${sohd}]: Lỗi phản hồi từ server.`);
            await window.supabase
              .from('hoadon_banleT')
              .update({ trang_thai_gui: 'Lỗi: Lỗi phản hồi server' })
              .eq('sohd', sohd);
            thatBai++;
            continue;
          }

          if (!response.ok) {
            loiList.push(`HĐ [${sohd}]: ${result?.message || "Gửi thất bại!"}`);
            await window.supabase
              .from('hoadon_banleT')
              .update({ trang_thai_gui: 'Lỗi: ' + (result?.message || "Gửi thất bại!") })
              .eq('sohd', sohd);
            thatBai++;
            continue;
          }

          // Thành công
          await window.supabase
            .from('hoadon_banleT')
            .update({ trang_thai_gui: 'Đã gửi' })
            .eq('sohd', sohd);

          thanhCong++;
        } catch (error) {
          loiList.push(`HĐ [${sohd}]: ${error.message}`);
          await window.supabase
            .from('hoadon_banleT')
            .update({ trang_thai_gui: 'Lỗi: ' + error.message })
            .eq('sohd', sohd);
          thatBai++;
        }
      }

      alert(`Gửi lại hóa đơn hoàn tất.\nThành công: ${thanhCong}\nThất bại: ${thatBai}\n${loiList.length ? "Chi tiết lỗi:\n" + loiList.join("\n") : ""}`);
      taiDanhSachHoaDon();
    }

    function openInvoiceBySohd(sohd) {

      // Bán lẻ thường

        url = `banlemtcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'bancs2') {
        url = `banlemtcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;

      // Bán nhân viên
      else if (prefix === 'bannvcs1') {
        url = `bannvcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'bannvcs2') {
        url = `bannvcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Nhập mới
      else if (prefix === 'nmcs1') {
        url = `nhapmoimtcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nmcs2') {

      // Chuyển chi nhánh (2v1) – dùng cùng trang CCN2V1
      else if (prefix === 'xcncs1' || prefix === 'ncncs1') {
        url = `ccn2v1cs1.html?sohd=${encodeURIComponent(sohd)}&loaihd=${prefix}&diadiem=cs1`;
      } else if (prefix === 'xcncs2' || prefix === 'ncncs2') {

      } else if (prefix === 'xuatkiemcs2') {
        url = `xuatkiemcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Nhập tạm
      else if (prefix === 'nhaptamcs1') {
        url = `nhaptamcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nhaptamcs2') {
        url = `nhaptamcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Nhập đổi từ khách
      else if (prefix === 'nhapdoics1') {
        url = `nhapdoimtcs1.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs1`;
      } else if (prefix === 'nhapdoics2') {
        url = `nhapdoimtcs2.html?sohd=${encodeURIComponent(sohd)}&diadiem=cs2`;
      }

      // Xuất hủy
      else if (prefix === 'xuathuycs1') {

        let doiUngList = [];
        let coCCN = false;

        const mapDoiUng = {
          xcncs1: 'ncncs2',
          xcncs2: 'ncncs1',
          ncncs1: 'xcncs2',
          ncncs2: 'xcncs1'
        };

        for (const cb of checkboxes) {
          const sohd = cb.getAttribute("data-sohd");
          if (!sohd) continue;

          const prefix = (sohd.split("_")[0] || "").trim();
          const so = (sohd.split("_")[1] || "").trim();

          // Hỗ trợ cả trường hợp prefix có hậu tố "T" (vd: xcncs1T_00031)
          const isT = prefix.endsWith("T");
          const basePrefix = isT ? prefix.slice(0, -1) : prefix;

          dsXoa.push(sohd);

          if (mapDoiUng[basePrefix] && so) {
            coCCN = true;

            const doiUngPrefix = mapDoiUng[basePrefix] + (isT ? "T" : "");
            const doiUng = `${doiUngPrefix}_${so}`;

            dsXoa.push(doiUng);
            doiUngList.push(`${sohd} ↔ ${doiUng}`);
          }
        }

        dsXoa = [...new Set(dsXoa.filter(Boolean))]; // loại trùng + loại rỗng

        // Xác nhận xóa
        let xacNhan = false;
        if (coCCN) {
          xacNhan = confirm(
            `⚠️ Có hóa đơn chuyển chi nhánh. Hệ thống sẽ xóa kèm cả hóa đơn đối ứng (nếu có).

Các cặp dự kiến xóa:
${doiUngList.join("\n")}

Bạn có đồng ý xóa toàn bộ không?`
          );
        } else {
          xacNhan = confirm("Bạn có chắc chắn muốn xóa các hóa đơn đã chọn?");
        }
        if (!xacNhan) return;


        // Thực hiện xóa: chi tiết trước, master sau (T tables)
        for (const sohd of dsXoa) {
          const { error: e1 } = await window.supabase.from("ct_hoadon_banleT").delete().eq("sohd", sohd);
          if (e1) {
            alert(`❌ Lỗi xóa CT hóa đơn ${sohd}: ${e1.message}`);
            return;
          }
          const { error: e2 } = await window.supabase.from("hoadon_banleT").delete().eq("sohd", sohd);
          if (e2) {
            alert(`❌ Lỗi xóa hóa đơn ${sohd}: ${e2.message}`);
            return;
          }
        }

        alert(`✅ Đã xóa thành công ${dsXoa.length} hóa đơn (bao gồm đối ứng nếu có).`);
        await window.taiDanhSachHoaDon(); // refresh lại bảng
      });
    }

    const checkboxes = document.querySelectorAll(".chonHD:checked");
    if (checkboxes.length === 0) {
      alert("❌ Bạn chưa chọn hóa đơn nào để xóa.");
      return;
    }

    // Xác thực lại nhân viên giống 111
    kiemTraNhanVienTruocKhiXoa(async function () {
      const dsXoa = Array.from(checkboxes).map(cb => cb.getAttribute("data-sohd")).filter(Boolean);

      // Xác nhận lần cuối (an toàn hơn)
      const ok = confirm(`Bạn có chắc muốn XÓA ${dsXoa.length} hóa đơn đã chọn không?\nLưu ý: thao tác này không thể hoàn tác.`);
      if (!ok) return;

      // Xóa: chỉ bảng T (không có đối ứng chuyển chi nhánh)
      for (const sohd of dsXoa) {
        const { error: e1 } = await window.supabase.from("ct_hoadon_banleT").delete().eq("sohd", sohd);
        if (e1) {
          alert(`❌ Lỗi xóa chi tiết hóa đơn ${sohd}: ${e1.message}`);
          return;
        }
        const { error: e2 } = await window.supabase.from("hoadon_banleT").delete().eq("sohd", sohd);
        if (e2) {
          alert(`❌ Lỗi xóa hóa đơn ${sohd}: ${e2.message}`);
          return;
        }
      }

      alert(`✅ Đã xóa thành công ${dsXoa.length} hóa đơn.`);
      await window.taiDanhSachHoaDon();
    });



    // Expose functions for inline onclick handlers
    window.taiDanhSachHoaDon = taiDanhSachHoaDon;
    window.xemChiTiet = xemChiTiet;
    window.dongPopup = dongPopup;
    window.xoaHoaDonDaChon = xoaHoaDonDaChon;
    window.kiemTraNhanVienTruocKhiXoa = kiemTraNhanVienTruocKhiXoa;
    khoiTaoDangNhapDungChung({
      appContainerId: 'app-container',

      // Không khóa cứng cơ sở, để nhân viên chọn CS1 / CS2
      macDinhDiaDiem: '',
      tuDongKhoaCoSo: false,

      // API backend đăng nhập
      loginApiPath: '/api/login-cs1',

      async onLoginSuccess(nv, ctx) {
        // 1. Kiểm tra quyền admin
        const flagFromObj =
          nv && (nv.is_admin === true || nv.is_admin === 'true' || nv.is_admin === 1);
        const flagFromLS = localStorage.getItem('is_admin') === 'true';
        const isAdmin = flagFromObj || flagFromLS;

        if (!isAdmin) {
          alert('Bạn không phải ADMIN, không được phép xem báo cáo này.');

          const app = document.getElementById('app-container') || document.body;
          app.innerHTML = `
      <h2 style="color:#c00; margin-top:20px; font-weight:bold;">
        🚫 Bạn không có quyền xem báo cáo này
      </h2>
      <p>
        Chỉ tài khoản <b>admin</b> (cột <code>is_admin = TRUE</code>
        trong bảng <code>dmnhanvien</code>) mới được phép truy cập
        trang <b>Tra cứu Hóa Đơn Bán Lẻ</b>.
      </p>
    `;
          return;
        }

        // 2. Sau khi login OK và là admin → lúc này window.supabase đã sẵn sàng
        //    => MỚI gắn popup tìm mã sản phẩm
        const { attachMaspPopup } = await import('./scripts/productSearchModule.js');
        const elMasp = document.getElementById('locMasp');

        if (elMasp) {
          attachMaspPopup({
            supabase: window.supabase,                // client đã có session
            maspInput: elMasp,
            onPick: (p) => {
              const cur = (elMasp.value || '').trim();
              const v = (p?.masp || '').trim();
              if (!v) return;
              const set = new Set(
                cur
                  ? cur.split(',').map(s => s.trim().toUpperCase()).filter(Boolean)
                  : []
              );
              set.add(v.toUpperCase());
              elMasp.value = Array.from(set).join(',');
            }
          });
        }

        // 3. Set filter mặc định (hôm nay) hoặc theo ?sohd=, rồi tải danh sách
        const params = new URLSearchParams(window.location.search);
        const sohdQ = (params.get('sohd') || '').trim();

        const setDateInputs = (yyyy_mm_dd) => {
          const tuNgayEl = document.getElementById('tuNgay');
          const denNgayEl = document.getElementById('denNgay');
          if (tuNgayEl) tuNgayEl.value = yyyy_mm_dd || '';
          if (denNgayEl) denNgayEl.value = yyyy_mm_dd || '';
        };

        if (sohdQ) {
          const locSoHDEl = document.getElementById('locSoHD');
          if (locSoHDEl) locSoHDEl.value = sohdQ;

          // auto tick loại chứng từ theo prefix
          const prefix = sohdQ.split('_')[0];
          const selectLoai = document.getElementById('loaiChungTu');
          if (selectLoai) {
            Array.from(selectLoai.options).forEach(o => (o.selected = false));
            const opt = Array.from(selectLoai.options).find(o => o.value === prefix);
            if (opt) opt.selected = true;
          }

          // set ngày theo created_at của hóa đơn (nếu có)
          try {
            const { data } = await window.supabase
              .from('hoadon_banleT')
              .select('created_at')
              .eq('sohd', sohdQ)
              .maybeSingle();
            if (data?.created_at) {
              const d = new Date(data.created_at);
              const yyyy_mm_dd = d.toISOString().slice(0, 10);
              setDateInputs(yyyy_mm_dd);
            } else {
              setDateInputs('');
            }
          } catch (e) {
            setDateInputs('');
          }
        } else {
          const today = new Date().toISOString().slice(0, 10);
          setDateInputs(today);
        }

        await window.taiDanhSachHoaDon();
      }

    });
  </script>
