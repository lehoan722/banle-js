<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Xem Hóa Đơn Tạm</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    tr:hover {
      background-color: #f1f1f1;
      cursor: pointer;
    }

    input,
    select {
      margin: 4px;
      padding: 6px;
    }

    #popup {
      display: none;
      position: fixed;
      top: 10%;
      left: 10%;
      width: 500px;
      min-width: 350px;
      min-height: 200px;
      height: 400px;
      background: #fff;
      border: 2px solid #4884ce;
      overflow: auto;
      padding: 20px;
      z-index: 9999;
      box-shadow: 0 2px 18px rgba(0, 0, 0, 0.2);
      border-radius: 7px;
      resize: both;
      /* Cho phép thay đổi kích thước */
    }

    #popup .drag-header {
      cursor: move;
      background: #f3f7fa;
      font-weight: bold;
      padding: 8px 10px;
      margin: -20px -20px 15px -20px;
      border-bottom: 1px solid #4884ce;
      border-radius: 7px 7px 0 0;
      user-select: none;
    }

    thead tr th {
      position: sticky;
      top: 0;
      background: #f9f9f9;
      z-index: 2;
    }

    button.loc-btn {
      background: #2196f3;
      color: #fff;
      border: none;
      font-weight: bold;
      padding: 7px 18px;
      border-radius: 4px;
      margin-right: 8px;
      cursor: pointer;
    }

    button.loc-btn:hover {
      background: #1769aa;
    }

    button.xoa-btn {
      background: #ffe066;
      color: #555;
      border: none;
      font-weight: bold;
      padding: 7px 18px;
      border-radius: 4px;
      cursor: pointer;
    }

    button.xoa-btn:hover {
      background: #ffe599;
    }
  </style>
</head>

<body>
  <h2>📋 Tra cứu Hóa Đơn Tạm</h2>
  <label>Từ ngày: <input type="date" id="locTuNgay"></label>
  <label>Đến ngày: <input type="date" id="locDenNgay"></label>

  <label>Nhân viên: <input type="text" id="locNV"></label>
  <label>Số HĐ: <input type="text" id="locSoHD"></label>

  <label>Loại chứng từ:</label>
  <select id="loaiChungTuT" style="min-width:140px;">
    <option value="">--Tất cả--</option>
    <option value="bancs1T">bancs1T</option>
    <option value="bancs2T">bancs2T</option>
    <option value="nmcs1T">nmcs1T</option>
    <option value="nmcs2T">nmcs2T</option>
    <option value="ccn1v2T">ccn1v2T</option>
    <option value="ccn2v1T">ccn2v1T</option>
  </select>

  <label>
    Xem tổng hợp:
    <select id="loaiTongHopT" style="min-width:120px">
      <option value="chitiet">Chi tiết từng hóa đơn</option>
      <option value="ngay">Tổng hợp theo ngày</option>
      <option value="thang">Tổng hợp theo tháng</option>
      <option value="nam">Tổng hợp theo năm</option>
    </select>
  </label>


  <button class="loc-btn" onclick="taiDanhSachHoaDon()">🔍 Lọc</button>
  <button id="btnGuiLai" onclick="guiLaiHoaDonDaChon()" disabled>📤 Gửi lại hóa đơn</button>
  <button class="xoa-btn" onclick="xoaHoaDonDaChon()">❌ Xóa hóa đơn đã chọn</button>

  <div id="tongHopNhanhT" style="font-size:1.1em;margin:12px 0;color:#0066cc;font-weight:bold;">
    Tổng số lượng hóa đơn: <span id="tongSoLuongT">0</span> | Tổng tiền thanh toán: <span id="tongTienT">0</span>
  </div>

  <!-- Thêm nút xóa và cột số thứ tự, checkbox -->

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>✔️</th>
        <th>Số HĐ</th>
        <th>Ngày</th>
        <th>NV</th>
        <th>Khách</th>
        <th>Tổng SL</th>
        <th>TT</th>
        <th>Ghi chú</th>
        <th>Trạng thái gửi</th>
      </tr>
    </thead>
    <tbody id="dsHoaDon"></tbody>
  </table>


  <div id="popup">
    <div class="drag-header" id="popupHeader">
      Chi tiết hóa đơn: <span id="sohdCT"></span>
      <span style="float:right;cursor:pointer;color:#999;" onclick="dongPopup()">✖</span>
    </div>

    <table>
      <thead>
        <tr>
          <th>Mã SP</th>
          <th>Tên SP</th>
          <th>Size</th>
          <th>SL</th>
          <th>Giá</th>
          <th>KM</th>
          <th>Thành tiền</th>
        </tr>
      </thead>
      <tbody id="ctHoaDon"></tbody>
    </table>
    <button onclick="dongPopup()">Đóng</button>
  </div>

  <script>
    let sohdDangChon = null;

    const getTrangThaiGui = (trangThai) => {
      if (!trangThai || trangThai.trim() === "") return "Chưa gửi";
      return trangThai;
    };
    const getMauTrangThai = (trangThai) => {
      if (!trangThai || trangThai === "Chưa gửi") return "orange";
      if (trangThai === "Đã gửi") return "green";
      if (trangThai.startsWith("Lỗi")) return "red";
      return "#888";
    };


    const supabase = window.supabase.createClient(
      'https://rddjrmbyftlcvrgzlyby.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZGpybWJ5ZnRsY3ZyZ3pseWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3NjU4MDQsImV4cCI6MjA2MjM0MTgwNH0.-0xtqxn6b9OBz4unTTvJ4klxizWhHa1iSuYGm7cOYTM'
    );

    document.getElementById("loaiTongHopT").onchange = taiDanhSachHoaDon;


    async function taiDanhSachHoaDon() {
      // Lấy giá trị lọc
      const tuNgay = document.getElementById("locTuNgay").value;
      const denNgay = document.getElementById("locDenNgay").value;
      const nv = document.getElementById("locNV").value.trim().toUpperCase();
      const sohd = document.getElementById("locSoHD").value.trim();
      const loaiChungTu = document.getElementById("loaiChungTuT").value;
      const loaiTongHop = document.getElementById("loaiTongHopT")?.value || "chitiet";

      let query = supabase
        .from('hoadon_banleT')
        .select('*')
        .order('ngay', { ascending: false })
        .order('sohd', { ascending: false });

      if (loaiChungTu) query = query.ilike('sohd', `${loaiChungTu}_%`);
      if (tuNgay && denNgay) query = query.gte('ngay', tuNgay).lte('ngay', denNgay);
      else if (tuNgay) query = query.gte('ngay', tuNgay);
      else if (denNgay) query = query.lte('ngay', denNgay);
      if (nv) query = query.ilike('manv', `%${nv}%`);
      if (sohd) query = query.ilike('sohd', `%${sohd}%`);

      const { data, error } = await query;
      const tbody = document.getElementById("dsHoaDon");
      tbody.innerHTML = "";
      let tongTien = 0, tongSoLuong = 0;

      if (error) return alert("Lỗi tải hóa đơn: " + error.message);
      if (!data || !data.length) {
        document.getElementById('tongThanhToan').textContent = "0";
        document.getElementById('tongSoLuongT').textContent = "0";
        document.getElementById('tongTienT').textContent = "0";
        return tbody.innerHTML = `<tr><td colspan="10">Không có dữ liệu</td></tr>`;
      }

      // ----------- XỬ LÝ TỔNG HỢP THEO NGÀY/THÁNG/NĂM ----------
      let hienThiData = data;
      if (loaiTongHop !== "chitiet") {
        const groupMap = new Map();
        data.forEach(hd => {
          const d = new Date(hd.ngay || hd.created_at);
          let key = "";
          if (loaiTongHop === "ngay") key = d.toISOString().slice(0, 10);
          if (loaiTongHop === "thang") key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
          if (loaiTongHop === "nam") key = d.getFullYear() + "";
          if (!groupMap.has(key)) {
            groupMap.set(key, {
              sohd: 1,
              ngay: key,
              tennv: "",
              khachhang: "",
              tongsl: Number(hd.tongsl || 0),
              thanhtoan: Number(hd.thanhtoan || 0)
            });
          } else {
            let obj = groupMap.get(key);
            obj.sohd += 1;
            obj.tongsl += Number(hd.tongsl || 0);
            obj.thanhtoan += Number(hd.thanhtoan || 0);
          }
        });
        hienThiData = Array.from(groupMap.entries()).map(([key, val]) => {
          if (loaiTongHop === "ngay") val.ngay = key.split('-').reverse().join('/');
          if (loaiTongHop === "thang") val.ngay = key.slice(5, 7) + "/" + key.slice(0, 4);
          if (loaiTongHop === "nam") val.ngay = key;
          return val;
        });
      }

      // Định dạng ngày
      function dinhDangNgayGio(ngayStr) {
        if (!ngayStr) return "";
        // Nếu dạng chỉ có ngày
        if (/^\d{4}-\d{2}-\d{2}$/.test(ngayStr)) {
          // Trả về ngày, không có giờ
          const [y, m, d] = ngayStr.split("-");
          return `${d}/${m}/${y}`;
        }
        // Các dạng tổng hợp (tổng hợp theo tháng, năm)
        if (ngayStr.match(/^\d{2}\/\d{2}\/\d{4}$/) || ngayStr.match(/^\d{2}\/\d{4}$/) || ngayStr.length === 4) return ngayStr;
        // Dạng có cả ngày giờ
        const d = new Date(ngayStr);
        if (isNaN(d.getTime())) return ngayStr;
        const ngay = d.getDate().toString().padStart(2, "0");
        const thang = (d.getMonth() + 1).toString().padStart(2, "0");
        const nam = d.getFullYear();
        const gio = d.getHours().toString().padStart(2, "0");
        const phut = d.getMinutes().toString().padStart(2, "0");
        return `${ngay}/${thang}/${nam} ${gio}h${phut}`;
      }


      // HIỂN THỊ RA BẢNG
      hienThiData.forEach((hd, idx) => {
        const tr = document.createElement("tr");
        // Sử dụng 2 hàm getTrangThaiGui và getMauTrangThai để luôn có trạng thái và màu sắc đúng
        const trangThai = getTrangThaiGui(hd.trang_thai_gui);
        tr.innerHTML = `
      <td>${idx + 1}</td>
      <td><input type="checkbox" class="chonHD" data-sohd="${hd.sohd || ""}"></td>
      <td>${hd.sohd || ""}</td>
      <td>${dinhDangNgayGio(hd.created_at || hd.ngay)}</td>

      <td>${hd.tennv || ""}</td>
      <td>${hd.khachhang || ""}</td>
      <td>${hd.tongsl || 0}</td>
      <td>${hd.thanhtoan?.toLocaleString()}</td>
      <td>${hd.ghichu || ""}</td>
      <td style="color:${getMauTrangThai(trangThai)}">${trangThai}</td>
    `;
        tr.onclick = (e) => {
          if (e.target.tagName !== 'INPUT' && loaiTongHop === "chitiet") {
            document.querySelectorAll("#dsHoaDon tr").forEach(tr2 => tr2.style.backgroundColor = "");
            tr.style.backgroundColor = "#ffe066";
            sohdDangChon = hd.sohd;
            xemChiTiet(hd.sohd);
          }
        };
        tbody.appendChild(tr);
      });


      // Tổng cộng
      let tongSL = 0, tongTien2 = 0;
      hienThiData.forEach(hd => {
        tongSL += Number(hd.tongsl || 0);
        tongTien2 += Number(hd.thanhtoan || 0);
      });
      document.getElementById('tongSoLuongT').textContent = tongSL.toLocaleString();
      document.getElementById('tongTienT').textContent = tongTien2.toLocaleString();

      // Dòng tổng dưới cùng
      const trTong = document.createElement("tr");
      trTong.style.fontWeight = "bold";
      trTong.style.background = "#f8f8f8";
      trTong.innerHTML = `
    <td colspan="6" style="text-align:right">TỔNG</td>
    <td id="tongSoLuongTong">${tongSL.toLocaleString()}</td>
    <td id="tongTienTong">${tongTien2.toLocaleString()}</td>
    <td colspan="2"></td>
  `;

      // Bắt sự kiện tick chọn checkbox
      document.querySelectorAll('.chonHD').forEach(cb => {
        cb.onchange = () => {
          const checkboxes = document.querySelectorAll('.chonHD:checked');
          let allValid = false;
          if (checkboxes.length > 0) {
            allValid = Array.from(checkboxes).every(cb2 => {
              const tr = cb2.closest('tr');
              const trangThai = tr && tr.querySelector("td:last-child")?.textContent?.trim();
              return !trangThai || trangThai === "Chưa gửi" || (trangThai && trangThai.startsWith("Lỗi"));
            });
          }
          document.getElementById("btnGuiLai").disabled = !allValid || checkboxes.length === 0;
        };
      });

      tbody.appendChild(trTong);
      document.getElementById("btnGuiLai").disabled = true;

    }



    async function xemChiTiet(sohd) {
      document.getElementById("popup").style.display = "block";
      document.getElementById("sohdCT").textContent = sohd;
      const { data, error } = await supabase.from('ct_hoadon_banleT').select('*').eq('sohd', sohd);
      const tbody = document.getElementById("ctHoaDon");
      tbody.innerHTML = "";
      if (error) return tbody.innerHTML = `<tr><td colspan='7'>Lỗi: ${error.message}</td></tr>`;
      let tongSL = 0, tongTT = 0;
      data.forEach(row => {
        const tt = (row.gia - row.km) * row.soluong;
        tongSL += Number(row.soluong);
        tongTT += Number(tt);
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${row.masp}</td><td>${row.tensp}</td><td>${row.size}</td><td>${row.soluong}</td><td>${row.gia}</td><td>${row.km}</td><td>${tt.toLocaleString()}</td>`;
        tbody.appendChild(tr);
      });
      // Thêm dòng tổng
      const trTong = document.createElement("tr");
      trTong.style.fontWeight = "bold";
      trTong.innerHTML = `<td colspan="3" style="text-align:right">TỔNG</td>
    <td>${tongSL}</td><td></td><td></td><td>${tongTT.toLocaleString()}</td>`;
      tbody.appendChild(trTong);
    }


    function dongPopup() {
      document.getElementById("popup").style.display = "none";
    }


    function chonHoaDon(sohd, row, trangThaiGui) {
      document.querySelectorAll("#dsHoaDon tr").forEach(tr => tr.style.backgroundColor = "");
      row.style.backgroundColor = "#ffe066";
      sohdDangChon = sohd;
      // Chỉ bật nút nếu hóa đơn chưa gửi hoặc lỗi
      document.getElementById("btnGuiLai").disabled = !(!trangThaiGui || trangThaiGui === 'Chưa gửi' || trangThaiGui.startsWith('Lỗi'));
    }

    async function guiLaiHoaDonDaChon() {
      // Lấy danh sách các checkbox được chọn
      const checkboxes = document.querySelectorAll(".chonHD:checked");
      const sohdList = Array.from(checkboxes).map(cb => cb.dataset.sohd);

      if (sohdList.length === 0) {
        alert("Vui lòng tick chọn ít nhất 1 hóa đơn chưa gửi/lỗi để gửi lại!");
        return;
      }

      // Lấy trạng thái gửi của từng hóa đơn
      // => Đọc thẳng từ DOM bảng hiện tại cho đơn giản
      const rows = Array.from(document.querySelectorAll("#dsHoaDon tr"));
      const hoadonToSend = [];
      for (let sohd of sohdList) {
        const row = rows.find(tr => {
          const td = tr.querySelector("td:nth-child(3)");
          return td && td.textContent.trim() === sohd;
        });
        if (!row) continue;
        // Lấy trạng thái gửi ở cột cuối cùng (thứ 9)
        const trangThai = row.querySelector("td:last-child").textContent.trim();
        if (trangThai === "Chưa gửi" || trangThai.startsWith("Lỗi")) {
          hoadonToSend.push(sohd);
        }
      }

      if (hoadonToSend.length === 0) {
        alert("Chỉ gửi lại các hóa đơn chưa gửi hoặc báo lỗi. Không có hóa đơn nào hợp lệ để gửi lại!");
        return;
      }

      if (!confirm(`Bạn có chắc chắn muốn gửi lại ${hoadonToSend.length} hóa đơn chưa gửi/lỗi này lên Viettel?`)) return;

      let thanhCong = 0, thatBai = 0, loiList = [];

      for (const sohd of hoadonToSend) {
        // Lấy lại dữ liệu hóa đơn & chi tiết
        const { data: hoadon } = await supabase
          .from('hoadon_banleT')
          .select('*')
          .eq('sohd', sohd)
          .single();

        const { data: chitiet } = await supabase
          .from('ct_hoadon_banleT')
          .select('*')
          .eq('sohd', sohd);

        if (!hoadon || !chitiet || chitiet.length === 0) {
          loiList.push(`HĐ [${sohd}]: Không tìm thấy dữ liệu!`);
          await supabase
            .from('hoadon_banleT')
            .update({ trang_thai_gui: 'Lỗi: Không tìm thấy dữ liệu' })
            .eq('sohd', sohd);
          thatBai++;
          continue;
        }

        const json = taoDuLieuHoaDon(hoadon, chitiet);

        try {
          const response = await fetch('/api/guiHDDT', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: json })
          });

          let result;
          try {
            result = await response.json();
          } catch (err) {
            loiList.push(`HĐ [${sohd}]: Lỗi phản hồi từ server.`);
            await supabase
              .from('hoadon_banleT')
              .update({ trang_thai_gui: 'Lỗi: Lỗi phản hồi server' })
              .eq('sohd', sohd);
            thatBai++;
            continue;
          }

          if (!response.ok) {
            loiList.push(`HĐ [${sohd}]: ${result?.message || "Gửi thất bại!"}`);
            await supabase
              .from('hoadon_banleT')
              .update({ trang_thai_gui: 'Lỗi: ' + (result?.message || "Gửi thất bại!") })
              .eq('sohd', sohd);
            thatBai++;
            continue;
          }

          // Thành công
          await supabase
            .from('hoadon_banleT')
            .update({ trang_thai_gui: 'Đã gửi' })
            .eq('sohd', sohd);

          thanhCong++;
        } catch (error) {
          loiList.push(`HĐ [${sohd}]: ${error.message}`);
          await supabase
            .from('hoadon_banleT')
            .update({ trang_thai_gui: 'Lỗi: ' + error.message })
            .eq('sohd', sohd);
          thatBai++;
        }
      }

      alert(`Gửi lại hóa đơn hoàn tất.\nThành công: ${thanhCong}\nThất bại: ${thatBai}\n${loiList.length ? "Chi tiết lỗi:\n" + loiList.join("\n") : ""}`);
      taiDanhSachHoaDon();
    }


    // Tạo dữ liệu JSON chuẩn
    function taoDuLieuHoaDon(hoadon, chitiet) {
      let tongTien = Number(hoadon.thanhtoan) || chitiet.reduce((sum, item) => sum + Number(item.thanhtien), 0);

      // Nhận diện cơ sở từ số hóa đơn
      let isCs2 = hoadon.sohd.startsWith('bancs2T_');
      let isCs1 = hoadon.sohd.startsWith('bancs1T_');

      if (!isCs1 && !isCs2) {
        throw new Error("❌ Không xác định được cơ sở phát hành hóa đơn từ số hóa đơn: " + hoadon.sohd + ". Vui lòng kiểm tra lại!");
      }

      // Thông tin người bán tách biệt cho từng CS
      const sellers = {
        cs1: {
          sellerLegalName: "ĐẶNG LÊ HOÀN",
          sellerTaxCode: "4600370592",
          sellerAddressLine: "Số nhà 540, đường 3/2, tổ 8, Phường Tích Lương, Tỉnh Thái Nguyên, Việt Nam",
          sellerPhoneNumber: "0916747401",
          sellerEmail: "huel31@viettel.com.vn",
          sellerBankAccount: "",
          sellerBankName: ""
        },
        cs2: {
          sellerLegalName: "NGUYỄN ÁNH TUYẾT",
          sellerTaxCode: "4600960665",
          sellerAddressLine: "Số 561, Tổ 23, Phường Phan Đình Phùng, Tỉnh Thái Nguyên, Việt Nam",
          sellerPhoneNumber: "0916747401",
          sellerEmail: "cskh.viettelhue@gmail.com",
          sellerBankAccount: "",
          sellerBankName: ""
        }
      };

      // Chọn thông tin người bán
      const sellerInfo = isCs2 ? sellers.cs2 : sellers.cs1;

      return {
        generalInvoiceInfo: {
          sohd: hoadon.sohd,
          invoiceType: "02GTTT",
          templateCode: isCs2 ? "2/001" : "2/001",
          invoiceSeries: isCs2 ? "C25MAT" : "C25MLH",
          invoiceIssuedDate: new Date().getTime(),
          currencyCode: "VND",
          adjustmentType: "1",
          paymentStatus: true,
          paymentType: "TM/CK",
          paymentTypeName: "TM/CK",
          cusGetInvoiceRight: true
        },
        buyerInfo: {
          sohd: hoadon.sohd,
          buyerName: hoadon.khachhang || "Khách lẻ",
          buyerTaxCode: "",
          buyerAddressLine: hoadon.diadiem || "",
          buyerPhoneNumber: "",
          buyerEmail: "",
          buyerIdNo: "",
          buyerIdType: "",
          buyerBudgetCode: ""
        },
        sellerInfo: sellerInfo, // Đã tách biệt CS1/CS2
        payments: [
          { paymentMethodName: "TM/CK", paymentAmount: tongTien }
        ],
        itemInfo: chitiet.map((item, index) => ({
          lineNumber: index + 1,
          itemCode: item.masp,
          itemName: item.tensp,
          unitName: item.dvt,
          quantity: Number(item.soluong),
          unitPrice: Number(item.gia) - Number(item.km || 0),
          itemTotalAmountWithoutTax: Number(item.thanhtien),
          taxPercentage: 0,
          taxAmount: 0,
          discount: 0,
          itemDiscount: Number(item.km) || 0
        })),
        summarizeInfo: {
          totalAmountWithoutTax: tongTien,
          totalTaxAmount: 0,
          totalAmountWithTax: tongTien,
          totalAmountWithTaxInWords: "Bốn trăm nghìn đồng chẵn",
          discountAmount: Number(hoadon.chietkhau) || 0
        },
        taxBreakdowns: [],
        metadata: [],
        customFields: [],
        deliveryInfo: {},
        meterReading: []
      };
    }


    // DRAG POPUP
    (function dragPopup() {
      let popup = document.getElementById('popup');
      let header = document.getElementById('popupHeader');
      let offsetX, offsetY, isDragging = false;
      header.onmousedown = function (e) {
        isDragging = true;
        let rect = popup.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        document.onmousemove = function (ev) {
          if (isDragging) {
            popup.style.left = (ev.clientX - offsetX) + 'px';
            popup.style.top = (ev.clientY - offsetY) + 'px';
          }
        };
        document.onmouseup = function () { isDragging = false; document.onmousemove = null; };
      };
    })();

    // Đóng popup bằng phím ESC
    document.addEventListener('keydown', function (e) {
      if (e.key === "Escape") dongPopup();
    });

    async function xoaHoaDonDaChon() {
      const checkboxes = document.querySelectorAll(".chonHD:checked");
      const sohdList = Array.from(checkboxes).map(cb => cb.dataset.sohd);

      if (sohdList.length === 0) return alert("❗ Vui lòng chọn ít nhất một hóa đơn cần xóa.");

      if (!confirm(`Bạn có chắc muốn xóa ${sohdList.length} hóa đơn khỏi hệ thống?`)) return;

      // Xóa chi tiết trước
      const { error: errCT } = await supabase.from('ct_hoadon_banleT').delete().in('sohd', sohdList);
      if (errCT) {
        console.error("❌ Lỗi xóa chi tiết:", errCT.message);
        return alert("Không thể xóa chi tiết hóa đơn.");
      }

      // Xóa hóa đơn chính
      const { error: errHD } = await supabase.from('hoadon_banleT').delete().in('sohd', sohdList);
      if (errHD) {
        console.error("❌ Lỗi xóa hóa đơn:", errHD.message);
        return alert("Không thể xóa hóa đơn.");
      }

      alert(`✅ Đã xóa ${sohdList.length} hóa đơn.`);
      taiDanhSachHoaDon();
    }

    window.onload = function () {
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('locTuNgay').value = today;
      document.getElementById('locDenNgay').value = today;
      taiDanhSachHoaDon();
    };


  </script>
