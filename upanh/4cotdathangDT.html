<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>DAT / KIEM - HANG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@latest/dist/handsontable.full.min.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .nutlenh {
            width: 100%;
            padding: 8px 12px;
            box-sizing: border-box;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid #ccc;
        }

        .main-content {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 50px);
        }

        .data-container {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
            background-color: #ffffff;
            border-right: 1px solid #ddd;
        }

        .gallery-container {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
            background-color: #f1f1f1;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .gallery img {
            display: block;
            object-fit: contain;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin: 0 auto;
            max-width: 100%;
            max-height: 320px;
            min-width: 0;
            min-height: 0;
        }

        .gallery-item {
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f8f8;
            border-radius: 8px;
            box-shadow: 0 1px 6px #eee;
            margin: 0 auto;
            flex-direction: column;
        }


        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-button {
            padding: 5px 5px;
            font-size: 14px;
            border: 2px solid #ccc;
            border-radius: 4px;
            background-color: #f8f9fa;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            z-index: 9999;
            background-color: white;
            min-width: 220px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.15);
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .dropdown-content button {
            width: 100%;
            padding: 10px;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #eee;
        }

        .dropdown-content button:hover {
            background-color: #f0f0f0;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* =================== MÀN HÌNH ĐIỆN THOẠI (<=600px) =================== */
        @media (max-width: 600px) {
            body {
                flex-direction: column;
                /* Sắp xếp dọc theo chiều từ trên xuống */
            }

            .gallery-container {
                order: 1;
                /* Hiển thị đầu tiên */
                height: 40vh;
                /* Chiếm 50% chiều cao màn hình */
                width: 100vw;
                /* Chiếm toàn bộ chiều rộng màn hình */
                overflow-y: auto;
                /* Cuộn dọc nếu ảnh nhiều */
                position: sticky;
                /* Cố định khi cuộn */
                top: 0;
                /* Sát trên cùng */
                background: #f1f1f1;
                /* Nền sáng nhẹ */
                padding: 10px;
                /* Lề trong */
                box-sizing: border-box;
                /* Bao gồm cả padding trong kích thước */
            }

            .gallery {
                display: flex;
                /* Kích hoạt flex */
                flex-direction: column;
                /* Ảnh xếp theo cột */
                align-items: center;
                /* Căn giữa ảnh theo chiều ngang */
                gap: 10px;
                /* Khoảng cách giữa các ảnh */
            }

            .gallery img {
                width: 100%;
                /* Mỗi ảnh chiếm toàn chiều ngang */
                height: auto;
                /* Tự điều chỉnh chiều cao theo tỷ lệ */
                border: 1px solid #ccc;
                /* Viền ảnh */
                border-radius: 4px;
                /* Bo tròn nhẹ */
            }

            .nutlenh {
                order: 2;
                /* Vị trí thứ hai */
                height: 7vh;
                /* Cao 10% màn hình */
                width: 100vw;
                /* Rộng toàn màn hình */
                padding: 5px;
                /* Lề trong 5px */
                box-sizing: border-box;
                /* Bao gồm cả padding trong tổng kích thước */
                background-color: #f8f9fa;
                /* Màu nền nhạt */
                display: flex;
                /* Bố trí các nút bằng flex */
                flex-wrap: wrap;
                /* Xuống hàng khi tràn */
                justify-content: center;
                /* Căn giữa các nút theo chiều ngang */
                align-items: center;
                /* Căn giữa các nút theo chiều dọc */
                gap: 4px;
                /* Khoảng cách giữa các nút */
            }

            .data-container {
                order: 3;
                /* Vị trí cuối cùng */
                height: 40vh;
                /* Cao 40% màn hình */
                width: 100vw;
                /* Rộng toàn màn hình */
                overflow-y: auto;
                /* Cuộn dọc nếu dài */
                padding: 10px;
                /* Khoảng cách bên trong */
                box-sizing: border-box;
                /* Bao gồm padding trong tổng kích thước */
            }
        }

        button {
            margin: 2px;
            /* Cách các nút ra 2px */
            padding: 2px 2px;
            /* Padding trong nút */
            font-size: 12px;
            /* Cỡ chữ nhỏ */
            border: 2px solid #ccc;
            /* Viền nút màu xám nhạt */
            border-radius: 4px;
            /* Bo tròn góc nút */
            cursor: pointer;
            /* Con trỏ biến thành bàn tay khi di chuột */
        }

        .handsontable input[type="checkbox"] {
            transform: scale(1.3);
            /* Phóng to checkbox */
            width: 60%;
            /* Rộng bằng ô */
            height: 60%;
            /* Cao bằng ô */
            cursor: pointer;
            /* Đổi chuột thành bàn tay */
        }

        .htCheckboxRenderer {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>

    <style>
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-button {
            padding: 5px 5px;
            font-size: 14px;
            border: 2px solid #ccc;

        }

        .dropdown-content {

            background-color: white;
            min-width: 220px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.15);
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .dropdown-content button {
            width: 100%;
            padding: 10px;

            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #eee;
        }

        .dropdown-content button:hover {

        }

        .dropdown:hover .dropdown-content {

</head>

<body>
    <div class="nutlenh">
        <div class="dropdown">
            <div class="dropdown-button">☰ MENU</div>
            <div class="dropdown-content">
                <button onclick="searchImages()">Hiện ảnh sản phẩm</button>
                <button onclick="window.open('https://banle-js.vercel.app/timkiemhanghoa111.html')">Tim Kiem NV</button>
                <button onclick="window.open('upanhmoi2.html')">Up ảnh mới</button>
                <button onclick="window.open('/a/upanhdathang.html', '_blank')">Trang đặt hàng</button>
                <button onclick="loadDataFromDatHang()">Lấy đặt hàng</button>
                <button onclick="saveTraHangData()">Lưu trả hàng</button>

            </div>
        </div>
        <div class="dropdown">
            <div class="dropdown-button">☰ MENU2</div>
            <div class="dropdown-content">

                <button onclick="loadDataFromKiemHangcs1()">Lấy kiểm hàng cs1</button>
                <button onclick="loadDataFromKiemHangcs2()">Lấy kiểm hàng cs2</button>

                <button onclick="loadDataFrombaymaucs1()">Lấy baymaucs1</button>
                <button onclick="loadDataFrombaymaucs2()">Lấy baymaucs2</button>

                <button onclick="loadDataFrom2v1()">Lấy 2v1</button>
                <button onclick="loadDataFrom1v2()">Lấy 1v2</button>


            </div>
        </div>

        <label for="fromDate">Từ:</label>
        <input type="date" id="fromDate">
        <label for="toDate">Đến:</label>
        <input type="date" id="toDate">
    </div>

    <button id="btnLuu2v1" style="display:none;" onclick="save2v1()">Lưu 2v1</button>
    <button id="btnLuu1v2" style="display:none;" onclick="save1v2()">Lưu 1v2</button>


    <div id="statusMessage" style="margin: 10px; color: green; font-weight: bold;"></div>

    <div class="main-content">
        <div class="data-container">
            <div id="loading" class="loading"></div>
            <div id="hot"></div>
        </div>
        <div class="gallery-container">
            <div class="gallery" id="gallery"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/handsontable@latest/dist/handsontable.full.min.js"></script>
    <script>

        //---------------------lenh---khai bao bang -------------------------------
        let allImages = [];
        let checkAlltrahang = false;

        const container = document.getElementById('hot');
        const hot = new Handsontable(container, {
            data: Handsontable.helper.createEmptySpreadsheetData(400, 4),
            colHeaders: ['Tên sp', 'Nhập', 'Bán', 'Tồn'],
            rowHeaders: true,
            columns: [
                { data: 0, type: 'text', wordWrap: true },
                { data: 1, type: 'numeric', wordWrap: true },
                { data: 2, type: 'numeric', wordWrap: true },
                { data: 3, type: 'numeric', wordWrap: true }
            ],
            autoWrapRow: true,
            autoRowSize: false,
            autoColumnSize: false,

            stretchH: 'all',
            width: '100%',
            height: '600px',
            licenseKey: 'non-commercial-and-evaluation'
        });

        //---------------------lenh--lay dia chi may chu -------------------------------
        function getServerIP() {
            const url = window.location.href;
            const ipMatch = url.match(/^(https?:\/\/[^\/]+)/);
            return ipMatch ? ipMatch[1] : null;
        }


        //---------------------lenh--hien thi anh -------------------------------

        function displayImages(images) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            images.forEach((image, index) => {
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';
                galleryItem.id = `image-${index}`;

                const link = document.createElement('a');
                const nameNoExt = image.name.replace(/\.[^/.]+$/, "");
                link.href = `${getServerIP()}/index.php?mdl=tonkho&ma=${nameNoExt}`;
                link.target = "_blank";

                const img = document.createElement('img');
                img.src = image.url || '';
                img.alt = image.name || 'Không có ảnh';
                link.appendChild(img);

                const caption = document.createElement('div');
                caption.className = 'caption';
                caption.textContent = image.url ? `${image.name} / ${image.date.toLocaleDateString()}` : `Không có ảnh`;

                const itemNumber = document.createElement('div');
                itemNumber.className = 'item-number';
                itemNumber.textContent = index + 1;

                galleryItem.appendChild(link);
                galleryItem.appendChild(caption);
                galleryItem.appendChild(itemNumber);
                gallery.appendChild(galleryItem);
            });
        }
        //---------------------lenh--tim kiem anh-------------------------------

        async function searchImages() {
            const data = hot.getData();
            const searchNames = data
                .map((row, index) => {
                    const raw = row[0];
                    const name = typeof raw === 'string' ? raw.trim() : String(raw || '').trim();
                    return { name: name.toUpperCase(), index };
                })
                .filter(({ name }) => name);

            if (searchNames.length === 0) {
                alert("Vui lòng nhập ít nhất một tên ảnh để tìm kiếm.");
                return;
            }

            document.getElementById("loading").style.display = "block";

            const supabaseDomain = 'https://rddjrmbyftlcvrgzlyby.supabase.co/storage/v1/object/public/anhsanpham/';
            const matchedImages = searchNames.map(({ name, index }) => ({
                name,
                url: supabaseDomain + name + '.JPG',
                date: new Date(),
                notFound: false,
                index
            }));

            displayImages(matchedImages);
            document.getElementById("loading").style.display = "none";
        }

        function displayImages(images) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            images.forEach((image, index) => {
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';
                galleryItem.id = `image-${index}`;

                const link = document.createElement('a');
                link.href = image.url;
                link.target = "_blank";

                const img = document.createElement('img');
                img.src = image.url || '';
                img.onerror = function () {
                    if (img.src.endsWith('.JPG')) {
                        img.src = img.src.replace('.JPG', '.png');
                    } else if (img.src.endsWith('.png')) {
                        img.alt = 'Không có ảnh';
                    }
                };

                img.alt = image.name || 'Không có ảnh';
                img.onerror = function () {
                    if (img.src.endsWith('.JPG')) {
                        img.src = img.src.replace('.JPG', '.png');
                    } else if (img.src.endsWith('.png')) {
                        img.alt = 'Không có ảnh';
                    }
                };
                link.appendChild(img);

                const caption = document.createElement('div');
                caption.className = 'caption';
                caption.textContent = image.url ? image.name : `Không có ảnh`;

                const itemNumber = document.createElement('div');
                itemNumber.className = 'item-number';
                itemNumber.textContent = index + 1;

                galleryItem.appendChild(link);
                galleryItem.appendChild(caption);
                galleryItem.appendChild(itemNumber);
                gallery.appendChild(galleryItem);
            });
        }


        //---------------------lenh---tu dong chuyen den hinh anh duoc chon------------------------------

        hot.addHook('afterOnCellMouseDown', function (event, coords, TD) {
            if (coords.col === 0) {
                const rowIndex = coords.row;
                const galleryItem = document.getElementById(`image-${rowIndex}`);
                if (galleryItem) {
                    galleryItem.scrollIntoView({ behavior: 'smooth' });

                    const clickedName = hot.getDataAtCell(coords.row, coords.col);

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(clickedName).catch(err => {
                            console.warn("Không thể sao chép vào clipboard:", err);
                        });
                    } else {
                        console.warn("Clipboard API không hỗ trợ trình duyệt này.");
                    }
                }
            }
        });

        //-----lenh-----JavaScript dùng để xử lý hành vi dán dữ liệu------------------

        document.addEventListener('paste', async (event) => {
            const selected = hot.getSelected();
            if (selected && selected.length === 1) {
                const [startRow, startCol] = selected[0];
                const clipboardData = event.clipboardData || window.clipboardData;
                const pastedData = clipboardData.getData('Text');
                if (pastedData.includes('\n')) {
                    event.preventDefault();
                    const rows = pastedData.split('\n').filter(row => row.trim() !== '');
                    rows.forEach((row, index) => {
                        hot.setDataAtCell(startRow + index, startCol, row);
                    });
                    hot.deselectCell();
                }
            }
        });
        //---------------------bo tap lenh nay  ----------------------------------
        async function loadDataFromSheet(sheetName = "dathangcs1") {
            const baseURL = "https://script.google.com/macros/s/AKfycbzwGd4UAuD1Z_96dYdm6uDtROu_zW1xvYGn41lCcAmGLbfeS9yPI2y_uxkAQmq60zUQpw/exec";
            const url = `${baseURL}?sheet=${sheetName}`;

            try {
                document.getElementById("loading").style.display = "block"; // ✅ báo hiệu đang tải

                const response = await fetch(url);
                const json = await response.json();

                const formattedData = json.map(row => [
                    row.ten || "", row.nhap || "", row.ban || "", row.ton || ""
                ]);

                const emptyRows = Array.from({ length: 400 - formattedData.length }, () => ["", "", "", ""]);
                hot.loadData([...formattedData, ...emptyRows]);

                //alert("✅ Đã tải dữ liệu thành công!");  khong hien thong bao
            } catch (err) {
                console.error("Lỗi khi tải dữ liệu:", err);
                alert("❌ Không thể tải dữ liệu từ Google Sheet.");
            } finally {
                document.getElementById("loading").style.display = "none";
            }
        }

        //---------------------lenh--tai ve du lieu dat hang -------------------------------

        async function loadDataFromDatHang() {
            const fromDate = document.getElementById("fromDate").value.trim();
            const toDate = document.getElementById("toDate").value.trim();
            const statusMessage = document.getElementById("statusMessage");

            // ✅ Kiểm tra ngày bắt buộc phải chọn
            if (!fromDate || !toDate) {
                alert("❌ Bạn phải chọn TỪ NGÀY và ĐẾN NGÀY trước khi tìm kiếm.");
                return;
            }

            const baseURL = "https://script.google.com/macros/s/AKfycbzwGd4UAuD1Z_96dYdm6uDtROu_zW1xvYGn41lCcAmGLbfeS9yPI2y_uxkAQmq60zUQpw/exec";
            const url = `${baseURL}?sheet=dathangcs1&fromDate=${fromDate}&toDate=${toDate}`;

            try {
                document.getElementById("loading").style.display = "block";

                const response = await fetch(url);
                const json = await response.json();

                const formattedData = json.map(row => [
                    row.ten || "",
                    row.nhap || "",
                    row.ban || "",
                    row.ton || "",
                    row.ghichu || ""
                ]);

                originalData = JSON.parse(JSON.stringify(formattedData)); // ✅ lưu bản gốc để so sánh
                const emptyRows = Array.from({ length: 400 - formattedData.length }, () => ["", "", "", "", ""]);

                hot.updateSettings({
                    colHeaders: [
                        'Tên SP',
                        'Đặt hàng',
                        `<input type="checkbox" id="checkAllTraHang" title="Chọn tất cả">`,
                        'Ngày tháng',
                        'Số CT'
                    ],
                    columns: [
                        { data: 0, type: 'text', width: 120 },    // Cột Tên SP
                        { data: 1, type: 'numeric', width: 190 }, // Cột Đặt hàng
                        {
                            data: 2,
                            type: 'checkbox',
                            checkedTemplate: 'có',
                            uncheckedTemplate: 'không',
                            width: 50                              // Cột Trả hàng
                        },
                        { data: 3, type: 'text', width: 100 },    // Cột Ngày tháng
                        { data: 4, type: 'text', width: 120 }     // Cột Số CT
                    ]
                });

                setTimeout(() => {
                    const checkAll = document.getElementById("checkAllTraHang");
                    if (checkAll) {
                        checkAll.addEventListener("change", toggleCheckAll);
                    }
                }, 50);

                hot.loadData([...formattedData, ...emptyRows]);
                statusMessage.innerText = `✅ Đã tải ${formattedData.length} dòng dữ liệu.`;
                setTimeout(() => statusMessage.innerText = "", 3000);
            } catch (err) {
                console.error("Lỗi khi tải dữ liệu:", err);
                alert("❌ Không thể tải dữ liệu Đặt hàng.");
            } finally {
                document.getElementById("loading").style.display = "none";
            }

            searchImages();
        }


        function toggleCheckAll() {
            const checked = document.getElementById("checkAllTraHang").checked;
            const rowCount = hot.countRows();

            for (let i = 0; i < rowCount; i++) {
                const masp = hot.getDataAtCell(i, 0);
                const soct = hot.getDataAtCell(i, 4);
                if (masp && soct) {
                    hot.setDataAtCell(i, 2, checked ? "có" : "không");
                }
            }
        }


        //---------------------lenh--tai ve du lieu trahang -------------------------------

        async function saveTraHangData() {
            const data = hot.getData();
            const serverURL = "https://script.google.com/macros/s/AKfycbzwGd4UAuD1Z_96dYdm6uDtROu_zW1xvYGn41lCcAmGLbfeS9yPI2y_uxkAQmq60zUQpw/exec";

            const payload = [];

            for (let i = 0; i < data.length; i++) {
                const masp = (data[i][0] || "").toString().trim();
                const trahang = (data[i][2] || "").toString().trim();
                const soct = (data[i][4] || "").toString().trim();

                if (!masp || !trahang || !soct) continue;

                const oldRow = originalData[i] || [];
                const oldTraHang = (oldRow[2] || "").toString().trim();

                if (trahang !== oldTraHang) {
                    payload.push({ masp, soct, trahang });
                }
            }

            if (payload.length === 0) {
                alert("Không có dòng nào thay đổi để ghi.");
                return;
            }

            try {
                const encoded = encodeURIComponent(JSON.stringify(payload));
                const url = `${serverURL}?action=batchUpdateTraHang&data=${encoded}`;

                const res = await fetch(url);
                const result = await res.text();
                alert(result);
            } catch (err) {
                console.error("Lỗi khi gửi dữ liệu:", err);
                alert("❌ Không thể gửi dữ liệu trả hàng.");
            }

            // Sau khi lưu thành công
            hot.loadData([]);                          // Xóa bảng
            document.getElementById("gallery").innerHTML = "";  // Xóa ảnh
            loadDataFromDatHang(); // goi lai du lieu da luu

        }


        //---------------------lenh--tai ve du lieu 2v1 -------------------------------

        async function loadDataFrom2v1() {
            const fromDate = document.getElementById("fromDate").value.trim();
            const toDate = document.getElementById("toDate").value.trim();

            if (!fromDate || !toDate) {
                alert("❌ Bạn phải chọn TỪ NGÀY và ĐẾN NGÀY.");
                return;
            }

            const baseURL = "https://script.google.com/macros/s/AKfycbzwGd4UAuD1Z_96dYdm6uDtROu_zW1xvYGn41lCcAmGLbfeS9yPI2y_uxkAQmq60zUQpw/exec";
            const url = `${baseURL}?sheet=2v1&fromDate=${fromDate}&toDate=${toDate}`;

            try {
                document.getElementById("loading").style.display = "block";
                const response = await fetch(url);
                const json = await response.json();

                const formattedData = json.map(row => [
                    row.ten || "",
                    row.nhap || "",
                    row.ban || "",
                    row.ton || "",
                    row.ghichu || "",
                    row.cot5 || "",
                    row.cot6 || "",
                    row.cot7 || "",
                    row.cot8 || "",
                    row.cot9 || "",
                    row.cot10 || "",
                    row.realRow || 0  // CỘT 12: lưu dòng thật
                ]);

                const emptyRows = Array.from({ length: 400 - formattedData.length }, () => Array(12).fill(""));

                hot.updateSettings({

let currentAbortController = null;

function apply4ColsLayout() {
  hot.updateSettings({
    colHeaders: ['Tên SP', 'Nhập', 'Bán', 'Tồn'],
    columns: [
      { data: 0, type: 'text' },
      { data: 1, type: 'numeric' },
      { data: 2, type: 'numeric' },
      { data: 3, type: 'numeric' }
    ]
  });
}

async function load4ColsFromSheet(sheetName) {
  // Abort request trước nếu còn đang chạy
  if (currentAbortController) currentAbortController.abort();
  currentAbortController = new AbortController();

  const url = `${GAS_BASE_URL}?sheet=${encodeURIComponent(sheetName)}`;

  try {
    document.getElementById("loading").style.display = "block";

    const response = await fetch(url, { signal: currentAbortController.signal });
    const json = await response.json();

    const formattedData = json.map(row => [
      row.ten || "", row.nhap || "", row.ban || "", row.ton || ""
    ]);

    const emptyRows = Array.from(
      { length: Math.max(0, 400 - formattedData.length) },
      () => ["", "", "", ""]
    );

    // Update layout trước, rồi load data
    apply4ColsLayout();
    hot.loadData([...formattedData, ...emptyRows]);

  } catch (err) {
    if (err.name !== "AbortError") {
      console.error("Lỗi khi tải dữ liệu:", err);
      alert("❌ Không thể tải dữ liệu từ Google Sheet.");
    }
  } finally {
    document.getElementById("loading").style.display = "none";
  }
}
