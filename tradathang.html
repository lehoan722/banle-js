<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <title>TRA DAT HANG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- Handsontable CE -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@13.1.0/dist/handsontable.full.min.css">
  <script src="https://cdn.jsdelivr.net/npm/handsontable@13.1.0/dist/handsontable.full.min.js"></script>

  <!-- Supabase UMD -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    :root {
      --blue: #1976d2;
      --bd: #d9e5ff;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f7fafc;
      margin: 0;
    }

    .wrap {
      max-width: 1180px;
      margin: 18px auto;
      padding: 0 12px;
    }

    h2 {
      margin: 8px 0 14px;
      color: var(--blue);
      letter-spacing: .5px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: #fff;
      padding: 10px;
      border: 1px solid #e5ecff;
      border-radius: 10px;
    }

    .toolbar label {
      color: #333;
      font-weight: 600;
      margin-right: 4px;
    }

    .toolbar input[type="date"],
    .toolbar input[type="text"],
    .toolbar select {
      height: 36px;
      padding: 6px 10px;
      border: 1px solid var(--bd);
      border-radius: 8px;
      outline: none;
      font-size: 16px;
      background: #fff;
    }

    .btn {
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--blue);
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      padding: 0 14px;
      cursor: pointer;
    }

    .btn.secondary {
      background: #e3f2fd;
      color: #0b60b3;
      border-color: #90caf9;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #grid {
      margin-top: 12px;
      background: #fff;
      border: 1px solid #e5ecff;
      border-radius: 12px;
      overflow: hidden;
    }

    .foot {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin: 12px 0 24px;
    }

    /* Popup ảnh */
    #imgModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      z-index: 4000;
    }

    #imgModal .card {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      width: min(92vw, 720px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
    }

    #imgModal .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #f7f9ff;
      border-bottom: 1px solid #eef3ff;
    }

    #imgModal .body {
      padding: 12px;
      max-height: 76vh;
      overflow: auto;
    }

    #imgModal img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      margin: auto;
    }

    #imgModal .cap {
      text-align: center;
      padding: 8px 12px 12px;
      color: #333;
    }

    a.link {
      color: var(--blue);
      text-decoration: none;
    }

    a.link:hover {
      text-decoration: underline;
    }

    /* iOS chống auto-zoom khi focus input */
    input,
    select,
    button {
      font-size: 16px;
    }

    /* màu dòng theo trạng thái */
    .row-ok {
      background: #e8f5e9 !important;
    }

    .row-het {
      background: #fff8e1 !important;
    }

    /* Đăng nhập overlay */
    #loginOverlay {
      position: fixed;
      inset: 0;
      background: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }

    #loginBox {
      background: #f9f9f9;
      padding: 24px;
      border-radius: 10px;
      width: min(92vw, 380px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .15);
    }

    #loginBox h3 {
      margin-top: 0;
      color: #333;
    }

    #loginBox input,
    #loginBox select,
    #loginBox button {
      width: 100%;
      margin: 6px 0;
      padding: 8px 10px;
      border: 1px solid #cfe1ff;
      border-radius: 8px;
    }

    #loginBox button {
      background: #1976d2;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    #loginBox small {
      color: #666;
    }

    .gitem {
      border: 1px solid #e8eefc;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .gitem .pic {
      background: #f8faff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 180px;
    }

    .gitem .pic img {
      max-width: 100%;
      max-height: 240px;
      display: block;
    }

    .gitem .cap {
      padding: 8px 10px;
      border-top: 1px solid #eef3ff;
      font-size: 14px;
    }

    .gitem .cap a {
      color: #1976d2;
      text-decoration: none;
    }

    .gitem .cap a:hover {
      text-decoration: underline;
    }

    .gitem .opts {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px 10px 12px;
    }

    .gitem .miss {
      color: #c62828;
      font-size: 12px;
      margin-top: 6px;
    }

    .gitem .cap b {
      color: #333;
    }

    .gitem .cap div {
      line-height: 1.35;
      margin: 2px 0;
    }
  </style>
</head>

<body>
  <div class="wrap" id="appRoot" style="display:none;">
    <h2>TRA DAT HANG</h2>

    <div class="toolbar">
      <div>
        <label>Địa điểm:</label>
        <select id="fDiaDiem">
          <option value="ALL">Tất cả</option>
          <option value="cs1">Cơ sở 1</option>
          <option value="cs2">Cơ sở 2</option>
        </select>
      </div>
      <div>
        <label>Từ ngày:</label>
        <input type="date" id="fFrom">
      </div>
      <div>
        <label>Đến ngày:</label>
        <input type="date" id="fTo">
      </div>
      <div>
        <label>Mã SP:</label>
        <input type="text" id="fMasp" placeholder="nhập mã...">
      </div>
      <div>
        <label>Tên NV:</label>
        <input type="text" id="fTennv" placeholder="nhập tên...">
      </div>
      <div>
        <label>Trạng thái:</label>
        <select id="fTrangThai">
          <option value="ALL">Tất cả</option>
          <option value="OK">OK</option>
          <option value="HET">HET</option>
          <option value="TRONG">Trống</option>
        </select>
      </div>
      <div style="margin-left:auto; display:flex; gap:8px;">
        <button id="btnFilter" class="btn secondary">LOC DL</button>
        <button id="btnShowGallery" class="btn secondary">HIỂN THỊ ẢNH</button>
        <button id="btnDelete" class="btn secondary" style="border-color:#ef5350;background:#ffcdd2;color:#b71c1c;">XÓA
          DL</button>
        <button id="btnSave" class="btn">LƯU DL</button>
      </div>
    </div>

    <div id="grid"></div>

    <!-- Popup ảnh -->
    <div id="imgModal">
      <div class="card">
        <div class="head">
          <b>Ảnh sản phẩm</b>
          <button id="imgClose" class="btn secondary">Đóng</button>
        </div>
        <div class="body">
          <img id="pimg" src="" alt="product">
          <div class="cap" id="cap"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Popup Gallery Ảnh cho toàn bộ dòng -->
  <div id="galleryModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:5000;">
    <div class="gcard"
      style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
       width:min(96vw,1200px); height:min(92vh,860px); background:#fff; border-radius:14px; display:flex; flex-direction:column; overflow:hidden;">
      <div class="ghead"
        style="display:flex; gap:10px; align-items:center; padding:10px 12px; background:#f6f9ff; border-bottom:1px solid #e6eeff;">
        <b style="font-size:18px; color:#1b5dbf;"></b>
        <input id="galSearch" placeholder="Tìm nhanh theo mã SP..."
          style="margin-left:auto; height:34px; padding:6px 10px; border:1px solid #cfe1ff; border-radius:8px; width:100px;">
        <button id="galAllOK" class="btn secondary" style="height:34px;">Chọn tất cả OK</button>
        <button id="galAllHET" class="btn secondary" style="height:34px;">Chọn tất cả HET</button>
        <button id="galClear" class="btn secondary" style="height:34px;">Xóa chọn</button>
      </div>

      <div id="galBody" style="padding:12px; overflow:auto; flex:1;">
        <div id="galGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:12px;">
        </div>
      </div>

      <div class="gfoot"
        style="display:flex; gap:10px; justify-content:flex-end; padding:10px 12px; border-top:1px solid #e6eeff;">
        <button id="galClose" class="btn secondary">Đóng</button>
        <button id="galApply" class="btn">Lưu</button>
      </div>
    </div>
  </div>


  <!-- Đăng nhập (tái dùng mô hình trang bán lẻ CS1) -->
  <div id="loginOverlay">
    <div id="loginBox">
      <h3>Đăng nhập hệ thống</h3>
      <label>Cơ sở</label>
      <select id="login-cs">
        <option value="cs1" selected>Cơ sở 1</option>
        <option value="cs2">Cơ sở 2</option>
      </select>

      <label>Email</label>
      <input id="login-email" placeholder="Email" value="">

      <label>Mật khẩu</label>
      <input id="login-password" type="password" placeholder="••••••••">

      <label>Mã nhân viên</label>
      <input id="login-manv" type="text" placeholder="VD: HOAN" autocomplete="off">

      

      <button id="btnLogin">Đăng nhập</button>
      <div id="loginMsg" style="color:#c62828; font-weight:600;"></div>
      <small>Email dùng cho Supabase; Mã NV sẽ tra bảng nhân viên để lấy tên NV.</small>
    </div>
  </div>

  <script src="scripts/tradathang.js"></script>
</body>

</html>
