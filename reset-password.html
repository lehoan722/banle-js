<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset mật khẩu</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:#f6f7fb}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(560px,100%);background:#fff;border:1px solid #e7e7ee;border-radius:16px;padding:22px 22px 18px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
    h1{margin:0 0 12px;font-size:26px}
    .muted{color:#6b7280;font-size:14px;line-height:1.5}
    .row{margin-top:14px}
    label{display:block;font-weight:600;margin:10px 0 6px}
    input{width:100%;padding:12px 12px;border:1px solid #d7d7e3;border-radius:10px;font-size:15px}
    button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
    .btn{background:#16a34a;color:#fff}
    .btn2{background:#0f172a;color:#fff}
    .err{margin-top:12px;background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;padding:10px 12px;border-radius:10px}
    .ok{margin-top:12px;background:#ecfdf5;border:1px solid #bbf7d0;color:#166534;padding:10px 12px;border-radius:10px}
    pre{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-top:12px;font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Reset mật khẩu</h1>
    <div class="muted">
      Trang này nhận link “Password Recovery” từ Supabase. Nếu bạn thấy báo thiếu <b>token/code</b>,
      hãy kiểm tra <b>Authentication → URL Configuration</b> và bấm đúng link trong email.
    </div>

    <div id="status" class="err" style="display:none"></div>
    <div id="success" class="ok" style="display:none"></div>

    <div id="form" style="display:none">
      <div class="row">
        <label>Mật khẩu mới</label>
        <input id="pw1" type="password" placeholder="Nhập mật khẩu mới" autocomplete="new-password" />
        <label>Nhập lại mật khẩu mới</label>
        <input id="pw2" type="password" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" />
        <button class="btn" id="btnUpdate">Cập nhật mật khẩu</button>
        <button class="btn2" id="btnLogout" type="button">Đăng xuất</button>
      </div>
    </div>

    <pre id="debug"></pre>
  </div>
</div>

<script type="module">
  import { supabase } from './scripts/supabaseClient.js';

  const $status = document.getElementById('status');
  const $success = document.getElementById('success');
  const $form = document.getElementById('form');
  const $debug = document.getElementById('debug');

  function showErr(msg){
    $status.style.display = '';
    $status.textContent = msg;
  }
  function showOk(msg){
    $success.style.display = '';
    $success.textContent = msg;
  }

  function parseQueryAndHash() {
    const url = new URL(window.location.href);
    const code = url.searchParams.get('code'); // PKCE flow
    const err = url.searchParams.get('error') || url.searchParams.get('error_description');

    // hash flow: #access_token=...&refresh_token=...&type=recovery
    const hash = new URLSearchParams((url.hash || '').replace(/^#/, ''));
    const access_token = hash.get('access_token');
    const refresh_token = hash.get('refresh_token');
    const type = hash.get('type');
    const hashErr = hash.get('error') || hash.get('error_description');

    return {
      href: window.location.href,
      code,
      err: err || hashErr,
      access_token,
      refresh_token,
      type
    };
  }

  async function bootstrapRecoverySession() {
    const info = parseQueryAndHash();

    // debug để bạn nhìn ngay vì sao thiếu token/code
    $debug.textContent = JSON.stringify(info, null, 2);

    if (info.err) {
      showErr(info.err);
      return false;
    }

    // 1) PKCE: có ?code=...
    if (info.code) {
      const { data, error } = await supabase.auth.exchangeCodeForSession(info.code);
      if (error) {
        showErr('Không exchange được code: ' + error.message);
        return false;
      }
      return !!data?.session;
    }

    // 2) Hash token: có #access_token & refresh_token
    if (info.access_token && info.refresh_token) {
      const { data, error } = await supabase.auth.setSession({
        access_token: info.access_token,
        refresh_token: info.refresh_token
      });
      if (error) {
        showErr('Không setSession được: ' + error.message);
        return false;
      }
      return !!data?.session;
    }

    // 3) Không có gì cả => bạn đang mở trang trực tiếp hoặc redirect URL sai
    showErr('Link khôi phục không hợp lệ hoặc thiếu token/code. Hãy cấu hình Redirect URLs trong Supabase rồi bấm đúng link trong email reset.');
    return false;
  }

  async function ensureLoggedInForRecovery() {
    // Nếu exchange/setSession xong thì session sẽ tồn tại
    const { data } = await supabase.auth.getSession();
    return !!data?.session;
  }

  document.getElementById('btnUpdate').addEventListener('click', async () => {
    $status.style.display = 'none';
    $success.style.display = 'none';

    const pw1 = document.getElementById('pw1').value.trim();
    const pw2 = document.getElementById('pw2').value.trim();

    if (!pw1 || pw1.length < 6) return showErr('Mật khẩu tối thiểu 6 ký tự.');
    if (pw1 !== pw2) return showErr('Hai mật khẩu không khớp.');

    const { error } = await supabase.auth.updateUser({ password: pw1 });
    if (error) return showErr('Lỗi update mật khẩu: ' + error.message);

    showOk('Đã đổi mật khẩu thành công! Bạn có thể quay lại trang đăng nhập để đăng nhập bằng mật khẩu mới.');
  });

  document.getElementById('btnLogout').addEventListener('click', async () => {
    await supabase.auth.signOut();
    showOk('Đã đăng xuất.');
  });

  // Boot
  (async () => {
    const ok = await bootstrapRecoverySession();
    if (!ok) return;

    const hasSession = await ensureLoggedInForRecovery();
    if (!hasSession) {
      showErr('Không tạo được session recovery. Hãy gửi lại email reset và thử lại.');
      return;
    }

    $form.style.display = '';
    showOk('Đã nhận session recovery. Nhập mật khẩu mới để cập nhật.');
  })();
</script>
</body>
</html>
