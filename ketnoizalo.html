<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Kết nối Zalo khách hàng</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.6.1/dist/handsontable.full.min.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    #app-container {
      padding: 10px;
    }

    .topbar {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    input,
    button {
      padding: 6px 8px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
    }

    button.primary {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    button.success {
      background: #16a34a;
      color: white;
      border-color: #16a34a;
    }

    #hot {
      width: 100%;
      height: calc(100vh - 180px);
      min-height: 500px;
      overflow: hidden;
      background: white;
    }

    .readonly-cell {
      background: #f3f4f6 !important;
      color: #555 !important;
    }

    .zalo-completed-row {
      background: #e5e7eb !important;
      color: #888 !important;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      #app-container {
        padding: 6px;
      }

      .topbar {
        padding: 8px;
        border-radius: 6px;
      }

      .row {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }

      input,
      button {
        width: 100%;
        box-sizing: border-box;
        font-size: 15px;
        padding: 9px 10px;
      }

      #quickSearch {
        width: 100% !important;
      }

      #hot {
        height: calc(100vh - 230px);
        min-height: 420px;
      }

      .handsontable {
        font-size: 13px;
      }

      .handsontable td,
      .handsontable th {
        height: 34px !important;
        line-height: 30px !important;
      }
    }
  </style>
</head>

<body>

  <div id="login-container"></div>

  <div id="app-container" style="display:none;">

    <div class="topbar">

      <div class="row">
        <strong>Kết nối Zalo khách hàng</strong>
        <span id="adminInfo"></span>
        <button id="btnLogout">Đăng xuất</button>
      </div>

      <div class="row">
        <label>Từ ngày:</label>
        <input type="date" id="tuNgay" />

        <label>Đến ngày:</label>
        <input type="date" id="denNgay" />

        <input type="text" id="quickSearch" placeholder="Tìm mã khách, tên khách, SĐT..." style="width:260px;" />

        <button id="btnLoad" class="primary">Tải dữ liệu</button>

        <button id="btnZaloMulti" style="background:#0068ff; color:white;">
          Gửi Zalo nhiều khách
        </button>
      </div>

      <div id="status">Sẵn sàng.</div>
    </div>

    <div id="hot"></div>

    <div id="zaloPopupOverlay"
      style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:99999;">

      <div style="
        width:700px;
        max-width:95vw;
        max-height:90vh;
        overflow:auto;
        background:white;
        margin:30px auto;
        border-radius:10px;
        padding:12px;
      ">

        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
          <strong>Trợ lý gửi Zalo từng khách nhanh</strong>

          <button id="btnCloseZaloPopup">Đóng</button>
        </div>

        <textarea id="zaloMessageContent" style="width:100%; height:140px; margin-bottom:10px;"></textarea>

        <div id="zaloCustomerList"></div>

      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/handsontable@14.6.1/dist/handsontable.full.min.js"></script>

  <script type="module" src="./scripts/ketnoizalo.js"></script>

</body>

</html>
