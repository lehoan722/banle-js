<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Quản lý danh mục khách hàng</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.6.1/dist/handsontable.full.min.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    #app-container {
      padding: 10px;
    }

    .topbar {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    input, select, button {
      padding: 6px 8px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
    }

    button.primary {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    button.danger {
      background: #dc2626;
      color: white;
      border-color: #dc2626;
    }

    button.success {
      background: #16a34a;
      color: white;
      border-color: #16a34a;
    }

    #hot {
      width: 100%;
      height: calc(100vh - 170px);
      overflow: hidden;
      background: white;
    }

    #status {
      font-size: 13px;
      color: #374151;
    }

    .cell-edited {
      background: #fff7cc !important;
    }

    .cell-error {
      background: #ffd6d6 !important;
    }

    .cell-inactive {
      color: #999 !important;
      background: #f1f1f1 !important;
    }

    .readonly-cell {
      background: #f3f4f6 !important;
      color: #555 !important;
    }
  </style>
</head>

<body>
  <div id="login-container"></div>

  <div id="app-container" style="display:none;">
    <div class="topbar">
      <div class="row">
        <strong>Quản lý danh mục khách hàng</strong>
        <span id="adminInfo"></span>
        <button id="btnLogout">Đăng xuất</button>
      </div>

      <div class="row">
        <label>Từ ngày:</label>
        <input type="date" id="tuNgay" />

        <label>Đến ngày:</label>
        <input type="date" id="denNgay" />

        <label>
          <input type="checkbox" id="includeInactive" />
          Hiện khách đã ẩn
        </label>

        <input type="text" id="quickSearch" placeholder="Tìm mã, tên, SĐT..." style="width:220px;" />

        <button id="btnLoad" class="primary">Tải dữ liệu</button>
        <button id="btnSave" class="success">Lưu thay đổi</button>
        <button id="btnAddRow">Thêm dòng</button>
        <button id="btnHide" class="danger">Ẩn khách chọn</button>
        <button id="btnRestore">Khôi phục khách chọn</button>
        <button id="btnExport">Xuất Excel/CSV</button>
        <button id="btnCopyAll">Copy bảng</button>
      </div>

      <div id="status">Sẵn sàng.</div>
    </div>

    <div id="hot"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/handsontable@14.6.1/dist/handsontable.full.min.js"></script>
  <script type="module" src="./scripts/quanlydmkhachhang.js"></script>
</body>
</html>
