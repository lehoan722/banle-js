<!doctype html>
<html lang="vi">
<head> 
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lịch âm & Thời tiết - Hoàn Tuyết</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--red:#dc2626;--green:#15803d}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.page{max-width:1440px;margin:0 auto;padding:12px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);padding:10px;border-radius:14px;border:1px solid var(--line);position:sticky;top:0;z-index:10}
button,input,select{font:inherit} button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.month-title{font-size:20px;font-weight:800;min-width:160px;text-align:center}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.weekhead,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.weekhead div{padding:8px;text-align:center;font-size:12px;font-weight:700;background:#f8fafc;border-bottom:1px solid var(--line)}
.day{min-height:120px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.day:nth-child(7n){border-right:0}.day.out{opacity:.38}.day.today{outline:2px solid var(--accent);outline-offset:-2px}.day.selected{background:#eff6ff}
.solar{font-size:22px;font-weight:800}.lunar{font-size:12px;color:var(--red);margin-top:1px}.tet{font-weight:800;color:var(--red)}
.wx{margin-top:8px;font-size:12px;line-height:1.35}.temp{font-weight:800}.source{font-size:10px;color:var(--muted)}
.detail{padding:14px}.detail h2{margin:0 0 10px;font-size:19px}.kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;padding:8px 0;border-bottom:1px dashed var(--line)}.kv b{text-align:right}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2ff;font-size:11px;font-weight:700}.badge.hist{background:#ecfdf5;color:#166534}.badge.fc{background:#eff6ff;color:#1d4ed8}.badge.trend{background:#fff7ed;color:#9a3412}
.history{margin-top:14px}.history table{width:100%;border-collapse:collapse;font-size:12px}.history th,.history td{padding:6px;border-bottom:1px solid var(--line);text-align:right}.history th:first-child,.history td:first-child{text-align:left}
.searchbox{display:flex;gap:5px;align-items:center}.searchbox input{width:110px;padding:8px;border:1px solid var(--line);border-radius:8px}
@media(max-width:900px){.main{grid-template-columns:1fr}.day{min-height:90px;padding:5px}.solar{font-size:18px}.wx{font-size:11px}.detail{order:-1}.weekhead div{font-size:11px}}
@media(max-width:600px){.day{min-height:78px}.source{display:none}.wx .more{display:none}.month-title{font-size:17px;min-width:120px}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <button id="prev">◀</button>
    <div class="month-title" id="monthTitle"></div>
    <button id="next">▶</button>
    <button id="today" class="primary">Hôm nay</button>
    <div class="searchbox">
      <input id="solarInput" type="date" title="Ngày dương">
      <button id="goSolar">Đi</button>
    </div>
    <div class="searchbox">
      <input id="lunarInput" placeholder="VD 1/1/2027" title="ngày/tháng/năm âm">
      <button id="goLunar">Tìm âm</button>
    </div>
    <span class="spacer"></span>
    <select id="location"></select>
    <span class="status" id="status"></span>
  </div>

  <div class="main">
    <section class="card">
      <div class="weekhead">
        <div>Thứ 2</div><div>Thứ 3</div><div>Thứ 4</div><div>Thứ 5</div><div>Thứ 6</div><div>Thứ 7</div><div>CN</div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="card detail">
      <h2 id="detailTitle">Chọn một ngày</h2>
      <div id="detailBody"></div>
      <div class="history" id="history"></div>
    </aside>
  </div>
</div>
<script type="module" src="./scripts/lichamthoitiet.js?v=1"></script>
</body>
</html>
