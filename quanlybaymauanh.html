<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý ảnh bày mẫu</title>
  <script type="module" src="scripts/supabaseClient.js"></script>
  <script type="module" src="scripts/quanlybaymauanh.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 14px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 6px #ddd;
    }

    h2 {
      margin-top: 0;
      color: #1976d2;
      text-align: center;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
      margin-bottom: 14px;
      padding: 10px;
      background: #f7fafd;
      border: 1px solid #e1e7f0;
      border-radius: 6px;
    }

    .filters label {
      font-weight: bold;
      font-size: 14px;
    }

    .filters input,
    .filters select {
      padding: 6px;
      font-size: 15px;
      margin-top: 3px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 5px;
      padding: 7px 12px;
      font-weight: bold;
    }

    .btn-main {
      background: #2196f3;
      color: #fff;
    }

    .btn-ok {
      background: #2e7d32;
      color: #fff;
    }

    .btn-warn {
      background: #ef6c00;
      color: #fff;
    }

    #summary {
      margin: 8px 0 12px;
      font-weight: bold;
      color: #333;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fffdf6;
      padding: 8px;
      box-shadow: 0 1px 4px #ddd;
    }

    .card img {
      width: 100%;
      height: 230px;
      object-fit: contain;
      background: #eee;
      border-radius: 5px;
      border: 1px solid #ccc;
      cursor: zoom-in;
    }

    .info {
      font-size: 13px;
      line-height: 1.45;
      margin-top: 6px;
    }

    .status-ok {
      color: green;
      font-weight: bold;
    }

    .status-wait {
      color: #d35400;
      font-weight: bold;
    }

    .note-input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 5px;
      padding: 5px;
    }

    #imageOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.82);
      z-index: 99999;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    #imageOverlay img {
      max-width: 96vw;
      max-height: 94vh;
      object-fit: contain;
      background: #fff;
    }

    #imageOverlay button {
      position: fixed;
      top: 12px;
      right: 12px;
      background: #fff;
      color: #111;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>🖼️ Quản lý ảnh bày mẫu</h2>

    <div class="filters">
      <label>Từ ngày<br>
        <input type="date" id="tuNgay">
      </label>

      <label>Đến ngày<br>
        <input type="date" id="denNgay">
      </label>

      <label>Cơ sở<br>
        <select id="diadiem">
          <option value="">Tất cả</option>
          <option value="cs1">CS1</option>
          <option value="cs2">CS2</option>
        </select>
      </label>

      <label>Nhân viên bày<br>
        <input type="text" id="baymauBy" placeholder="VD: HOAN">
      </label>

      <label>Mã SP<br>
        <input type="text" id="masp" placeholder="VD: AP215">
      </label>

      <label>Trạng thái<br>
        <select id="status">
          <option value="wait_confirm">Có ảnh - chờ xác nhận</option>
          <option value="all">Tất cả</option>
          <option value="confirmed">Đã xác nhận</option>
          <option value="missing_image">Đã bày nhưng thiếu ảnh</option>
          <option value="has_note">Có ghi chú</option>
        </select>
      </label>

      <button class="btn-main" id="btnLoad">Xem dữ liệu</button>
    </div>

    <div id="summary">Chưa tải dữ liệu</div>
    <div id="grid"></div>
  </div>

  <div id="imageOverlay">
    <button id="btnCloseImage">Đóng</button>
    <img id="bigImage" src="">
  </div>
</body>
</html>
