<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý Danh mục Vị trí</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.js"></script>

  <script type="module" src="scripts/suadmvitri.js?v=3"></script>

  <style>
    :root {
      --border:#d9dee7;
      --muted:#667085;
      --ok:#15803d;
      --warn:#b45309;
      --err:#dc2626;
      --info:#1d4ed8;
      --bg:#f7f9fc;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#111827}
    #app-container{display:none;padding:14px}
    body.admin-ready #app-container{display:block !important}
    body.admin-ready #startup-status{display:none !important}
    .page-title{margin:0 0 10px;font-size:24px}
    .toolbar,.actionbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px}
    .field{display:flex;flex-direction:column;gap:4px}
    .field label{font-size:12px;color:var(--muted);font-weight:700}
    select,input,button{height:36px;border:1px solid #cfd6df;border-radius:7px;padding:0 10px;font-size:14px;background:#fff}
    input[type="text"]{min-width:170px}
    button{cursor:pointer;font-weight:700}
    button:hover{background:#f3f4f6}
    button.primary{background:#0f62fe;color:#fff;border-color:#0f62fe}
    button.primary:hover{background:#0b56dc}
    button.danger{color:#b42318}
    #summary{background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:10px;min-height:40px;line-height:22px}
    #hot-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px;overflow:hidden}
    #hot{width:100%;height:620px}
    .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:18px}
    .status-new{background:#eff6ff !important;color:#1d4ed8 !important;font-weight:700}
    .status-changed{background:#fff7ed !important;color:#b45309 !important;font-weight:700}
    .status-ok{background:#f0fdf4 !important;color:#15803d !important;font-weight:700}
    .status-error{background:#fef2f2 !important;color:#dc2626 !important;font-weight:700}
    .status-same{color:#667085 !important}
    .row-error{background:#fff1f2 !important}
    @media (max-width: 780px){
      #app-container{padding:8px}
      .page-title{font-size:20px}
      .toolbar,.actionbar{padding:8px;gap:6px}
      .field{width:calc(50% - 4px)}
      .field.search{width:100%}
      .field select,.field input{width:100%;min-width:0}
      button{height:38px}
      #hot{height:68vh}
    }
  </style>
</head>
<body>
  <div id="startup-status" style="margin:18px;padding:14px;border:1px solid #d9dee7;border-radius:10px;background:#fff;font-family:Arial,Helvetica,sans-serif;">
    ⏳ Đang khởi tạo trang Quản lý Danh mục Vị trí...
  </div>
  <div id="app-container">
    <h2 class="page-title">📍 Quản lý Danh mục Vị trí</h2>

    <div class="toolbar">
      <div class="field">
        <label>Cơ sở</label>
        <select id="filter-coso">
          <option value="">Tất cả</option>
          <option value="CS1">CS1</option>
          <option value="CS2">CS2</option>
        </select>
      </div>

      <div class="field">
        <label>Loại vị trí</label>
        <input id="filter-loai" type="text" placeholder="VD: KHO, TREO...">
      </div>

      <div class="field">
        <label>Khu vực</label>
        <input id="filter-khuvuc" type="text" placeholder="VD: TẦNG 1">
      </div>

      <div class="field">
        <label>Trạng thái</label>
        <select id="filter-active">
          <option value="true" selected>Đang dùng</option>
          <option value="">Tất cả</option>
          <option value="false">Ngừng dùng</option>
        </select>
      </div>

      <div class="field search">
        <label>Tìm nhanh</label>
        <input id="filter-search" type="text" placeholder="Mã hoặc tên vị trí...">
      </div>

      <button id="btn-load">⬇️ Tải danh mục</button>
      <button id="btn-load-all">📚 Tải toàn bộ</button>
    </div>

    <div class="actionbar">
      <button id="btn-add">➕ Thêm dòng</button>
      <button id="btn-check">🔍 Kiểm tra dữ liệu</button>
      <button id="btn-reorder">🔢 Đánh lại thứ tự 10,20,30...</button>
      <button id="btn-copy">📋 Copy toàn bộ bảng</button>
      <button id="btn-reset">↩️ Hủy thay đổi / tải lại</button>
      <button id="btn-save" class="primary">💾 Lưu thay đổi</button>
    </div>

    <div id="summary">Sẵn sàng.</div>

    <div id="hot-wrap">
      <div id="hot"></div>
      <div class="hint">
        Có thể copy dữ liệu từ Google Sheets/Excel rồi dán trực tiếp vào bảng. Không sửa trường ID; hệ thống tự nhận biết dòng mới và dòng đã thay đổi. Để ngừng sử dụng vị trí, bỏ chọn cột <b>Đang dùng</b> thay vì xóa vật lý.
      </div>
    </div>
  </div>
</body>
</html>
