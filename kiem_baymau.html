<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiểm bày mẫu</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/handsontable/10.0.0/handsontable.full.min.js"></script>

  <!-- Dùng lại popup và module đăng nhập hiện có của hệ thống -->
  <script src="./scripts/stockQuickPopup.js?v=1.5.1"></script>
  <script type="module" src="./scripts/kiem_baymau.js?v=1.5.1"></script>

  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --line: #dfe3e8;
      --primary: #1769aa;
      --success: #15803d;
      --warning: #b45309;
      --danger: #b91c1c;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 7px;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
    }

    #app-container { max-width: 1180px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 4px 0 7px; }

    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      padding-bottom: 6px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .identity-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px;
      align-items: center;
      margin-bottom: 7px;
      font-size: 14px;
    }

    #session-summary { font-weight: 700; }
    #save-state {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      background: #fee2e2;
      color: var(--danger);
    }
    #save-state.saved { background: #dcfce7; color: var(--success); }
    #save-state.dirty { background: #fef3c7; color: var(--warning); }

    .grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 7px; }
    .grid-1 { display: grid; grid-template-columns: 1fr; gap: 7px; }
    .scan-location-row > input { min-width: 0; }
    .mt7 { margin-top: 7px; }

    input, select, button {
      width: 100%;
      min-height: 42px;
      border: 1px solid #cfd5dd;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 16px;
      background: #fff;
    }

    button { cursor: pointer; font-weight: 700; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-soft { background: #eef3f8; }
    .btn-admin { background: #fff4e5; color: #8a4b00; border-color: #f2c078; }
    .btn-danger { background:#b91c1c; color:#fff; border-color:#b91c1c; }
    label { font-size:14px; font-weight:700; margin-top:3px; }

    #current-location { font-weight: 700; border: 2px solid #7cb7e8; }
    #scan-masp { font-weight: 700; text-transform: uppercase; border: 2px solid #59a56a; }

    #command-panel {
      display: none;
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid var(--line);
    }
    .command-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

    #check-panel {
      display: none;
      margin-top: 7px;
      padding: 8px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    #message {
      margin: 7px 0;
      padding: 8px 10px;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
    }
    #message.ok { color: var(--success); border-color: #a7d8b4; }
    #message.warn { color: var(--warning); border-color: #e7c280; }
    #message.err { color: var(--danger); border-color: #e6a4a4; }

    #hot {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      min-height: 420px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99990;
      background: rgba(15,23,42,.45);
      padding: 12px;
      align-items: center;
      justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-box {
      width: min(760px, 100%);
      max-height: 88vh;
      overflow: auto;
      background: #fff;
      border-radius: 13px;
      padding: 10px;
    }
    .modal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .modal-head h3 { flex: 1; margin: 0; font-size: 18px; }
    .modal-close { width: 42px; min-height: 38px; }
    .session-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: start;
      padding: 9px 4px;
      border-bottom: 1px solid #e7e9ed;
    }
    .session-main { cursor: pointer; }
    .session-title { font-weight: 700; }
    .session-meta { font-size: 13px; color: #576071; margin-top: 3px; }



    .task-row-done td { background:#dcfce7 !important; }
    .task-check-cell { text-align:center !important; }

    .group-multi-wrap {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 6px;
      min-width: 0;
    }
    .group-multi-wrap select,
    .group-multi-wrap input {
      width: 100%;
      min-width: 0;
    }

    /* Giữ các nút và ô dữ liệu của StockQuickPopup trên cùng một dòng.
       Các quy tắc này chỉ tác động popup, không ảnh hưởng giao diện kiểm bày mẫu. */
    .sq-stock-popup .sq-vitri-action-row {
      display: flex !important;
      flex-wrap: nowrap !important;
      align-items: center !important;
      gap: 6px !important;
      width: 100% !important;
    }

    .sq-stock-popup .sq-vitri-save-btn {
      width: auto !important;
      min-width: max-content !important;
      min-height: 0 !important;
      flex: 0 0 auto !important;
      padding: 3px 8px !important;
    }

    .sq-stock-popup .sq-vitri-input {
      width: auto !important;
      min-width: 0 !important;
      max-width: none !important;
      min-height: 0 !important;
      flex: 1 1 auto !important;
      padding: 3px 7px !important;
    }

    .sq-stock-popup .sq-vitri-value-readonly {
      min-width: 0 !important;
      flex: 1 1 auto !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      white-space: nowrap !important;
    }

    .sq-stock-popup .sq-vitri-coso,
    .sq-stock-popup .sq-vitri-label,
    .sq-stock-popup .sq-vitri-msg {
      flex: 0 0 auto !important;
      white-space: nowrap !important;
    }

    @media (max-width: 520px) {
      body { padding: 5px; }
      h1 { font-size: 18px; }
      input, select, button { min-height: 40px; font-size: 15px; padding: 7px 8px; }
      .command-grid { grid-template-columns: 1fr 1fr; }
      #hot { min-height: 470px; }
      .identity-row { font-size: 13px; }
      .handsontable td, .handsontable th { font-size: 13px !important; }
    }
  </style>
</head>
<body>
  <div id="app-container" style="display:none;">
    <h1>Kiểm bày mẫu</h1>

    <div class="sticky-top">
      <div class="card">
        <div class="identity-row">
          <div id="session-summary">Chưa tạo phiên</div>
          <div id="save-state">Chưa lưu</div>
        </div>

        <div class="grid-2 scan-location-row">
          <input id="scan-masp" type="text" placeholder="Quét mã sản phẩm" autocomplete="off" inputmode="text">
          <input id="current-location" type="text" placeholder="Vị trí bày mẫu" autocomplete="off">
        </div>
        <div class="grid-1 mt7">
          <input id="area-name" type="text" placeholder="Tên khu vực kiểm, ví dụ: GIA1-GIA10" autocomplete="off">
        </div>

        <div class="grid-1 mt7">
          <button id="btn-toggle-commands" class="btn-soft" type="button">Chức năng ▼</button>
        </div>

        <div id="command-panel">
          <div class="command-grid">
            <button id="btn-save" class="btn-primary" type="button">Lưu dữ liệu</button>
            <button id="btn-load-session" class="btn-soft" type="button">Tải phiên kiểm</button>
            <button id="btn-load-stock-location" type="button">Tải vị trí kho</button>
            <button id="btn-multi-location" type="button">Bày nhiều vị trí</button>
            <button id="btn-toggle-check" type="button">Hàng chưa bày mẫu</button>
            <button id="btn-compare" type="button">So sánh phiên</button>
            <button id="btn-delete-rows" type="button">Xóa dòng chọn</button>
            <button id="btn-new-session" type="button">Tạo phiên mới</button>
            <button id="btn-back-main" type="button">Trở lại bảng quét</button>
            <button id="btn-merge" class="btn-admin" type="button" style="display:none;">Ghép phiên</button>
            <button id="btn-set-standard" class="btn-admin" type="button" style="display:none;">Đặt làm phiên chuẩn</button>
            <button id="btn-delete-session" class="btn-admin" type="button" style="display:none;">Xóa phiên</button>
            <button id="btn-save-baymau" class="btn-admin" type="button" style="display:none;">Lưu vị trí bày mẫu</button>
            <button id="btn-save-task" class="btn-admin" type="button" style="display:none;">Lưu kết quả giao bày mẫu</button>
            <button id="btn-open-tasks" type="button">Danh sách cần bày mẫu</button>
            <button id="btn-task-complete" class="btn-admin" type="button" style="display:none;">Hoàn tất phiếu</button>
          </div>

          <div id="check-panel">
            <div class="grid-2">
              <input id="date-from" type="date" aria-label="Từ ngày">
              <input id="date-to" type="date" aria-label="Đến ngày">
            </div>
            <div class="grid-2 mt7">
              <select id="category-select"><option value="">Chủng loại</option></select>
              <div class="group-multi-wrap">
                <select id="group-picker" aria-label="Chọn nhóm hàng để thêm">
                  <option value="">Chọn nhóm hàng</option>
                </select>
                <input id="group-select" type="text" placeholder="Nhóm hàng: AP, SM..." autocomplete="off" aria-label="Các nhóm hàng đã chọn, cách nhau bằng dấu phẩy">
              </div>
            </div>
            <div class="grid-1 mt7">
              <button id="btn-run-unshown" class="btn-primary" type="button">Kiểm tra hàng chưa bày mẫu</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="message">Hãy nhập vị trí bày mẫu rồi quét mã sản phẩm.</div>
    <div id="hot"></div>
  </div>

  <div id="session-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="session-modal-title">Chọn phiên kiểm</h3>
        <button id="session-modal-close" class="modal-close" type="button">✕</button>
      </div>
      <div id="session-list"></div>
      <div id="merge-actions" class="grid-1 mt7" style="display:none;">
        <button id="btn-confirm-merge" class="btn-primary" type="button">Ghép các phiên đã chọn</button>
      </div>
      <div id="delete-actions" class="grid-1 mt7" style="display:none;">
        <button id="btn-confirm-delete-session" class="btn-danger" type="button">Xóa các phiên đã chọn</button>
      </div>
    </div>
  </div>

  <div id="task-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h3>Danh sách cần bày mẫu</h3>
        <button id="task-modal-close" class="modal-close" type="button">✕</button>
      </div>
      <div id="task-list"></div>
    </div>
  </div>

  <div id="compare-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h3>So sánh phiên kiểm</h3>
        <button id="compare-modal-close" class="modal-close" type="button">✕</button>
      </div>
      <div class="grid-1">
        <label>Phiên chuẩn</label>
        <select id="compare-standard"></select>
        <label>Phiên hiện tại</label>
        <select id="compare-current"></select>
        <button id="btn-run-compare" class="btn-primary" type="button">Thực hiện so sánh</button>
      </div>
    </div>
  </div>
</body>
</html>
