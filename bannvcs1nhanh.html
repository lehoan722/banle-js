<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <title>Bán NV nhanh CS1</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 14px;
      margin: 0;
      padding: 8px;
      background: #f5f5f5;
    }

    .sheet-wrapper {
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ccc;
      padding: 6px;
      box-sizing: border-box;
    }

    .top-row {
      display: grid;
      grid-template-columns: 70px 1fr 1fr;
      gap: 4px;
      margin-bottom: 4px;
    }

    .top-row input {
      width: 100%;
      box-sizing: border-box;
      padding: 3px 4px;
    }

    .label-small {
      font-size: 11px;
      color: #4b5563;
      margin: 2px 0;
    }

    #masp {
      width: 100%;
      box-sizing: border-box;
      padding: 4px;
    }

    /* Khu ảnh + card để gắn StockQuick */
    #imageCard {
      margin-top: 4px;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      background: #fafafa;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #productImage {
      max-width: 100%;
      max-height: 220px;
      display: block;
    }

    #imagePlaceholder {
      padding: 12px;
      color: #6b7280;
      text-align: center;
    }

    table.form-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }

    table.form-table td {
      border: 1px solid #d1d5db;
      padding: 4px;
      vertical-align: middle;
    }

    table.form-table td.label {
      width: 90px;
      background: #f3f4f6;
      font-weight: 600;
      font-size: 12px;
    }

    table.form-table input,
    table.form-table select {
      width: 100%;
      box-sizing: border-box;
      border: none;
      outline: none;
      padding: 3px 4px;
      font-size: 13px;
    }

    table.form-table input[readonly] {
      background: #f9fafb;
    }

        .makh-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .makh-row input {
      flex: 1 1 auto;
    }

    /* Hàng mã sản phẩm + nút chụp ảnh */
    .masp-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .masp-row input {
      flex: 1 1 auto;
    }


    .btn-icon {
      padding: 3px 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .buttons-row {
      text-align: center;
      margin-top: 6px;
      display: flex;
      gap: 4px;
      justify-content: space-between;
    }

    .buttons-row button {
      flex: 1 1 0px;
      padding: 6px 4px;
      font-size: 13px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    #btnLuu {
      background: #111827;
      color: #fff;
    }

    #btnLuu.saving {
      opacity: 0.7;
      cursor: default;
    }

    #btnThemMoi {
      background: #e5e7eb;
    }

    #btnKiemTraAnh {
      background: #f3f4f6;
    }

    #btnChenAnhMoi {
      background: #d1fae5;
    }

    .note {
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
    }
  </style>
</head>

<body>

  <!-- Khung login: authModule.js sẽ vẽ form đăng nhập vào đây -->
  <div id="login-container"></div>

  <!-- App chính: chỉ hiện sau khi đăng nhập -->
  <div id="app-container" style="display:none;">

    <div class="sheet-wrapper">
      <!-- Hàng trên: cơ sở / ngày / tên NV -->
      <div class="top-row">
        <input id="diadiem" readonly />
        <input id="ngay" />
        <input id="tennv" readonly />
      </div>

      <!-- Hàng: trạng thái ảnh + mã SP -->
      <div class="label-small" id="statusAnh">ĐÃ CÓ ẢNH</div>
      <div class="masp-row">
        <input id="masp" placeholder="Nhập mã sản phẩm." />
        <button type="button" id="btnScanMasp" class="btn-icon">📷</button>
      </div>


      <!-- THÊM popup gợi ý mã sản phẩm ngay bên dưới -->
      <div id="maspSuggestList" style="display:none;"></div>

      <!-- Khu ảnh + click xem tồn kho (StockQuick.attach) -->
      <div id="imageCard" class="card">
        <div id="imagePlaceholder">Chưa có ảnh sản phẩm.</div>
        <img id="productImage" src="" alt="" style="display:none;" />
      </div>

      <!-- Bảng thông tin sản phẩm + khách hàng -->
      <table class="form-table">
        <tr>
          <td class="label">size:</td>
          <td>
            <input id="size" list="sizeList" />
            <datalist id="sizeList">
              <option value="0"></option>
              <option value="38"></option>
              <option value="39"></option>
              <option value="40"></option>
              <option value="41"></option>
              <option value="42"></option>
              <option value="43"></option>
              <option value="44"></option>
              <option value="45"></option>
            </datalist>
          </td>
        </tr>
        <tr>
          <td class="label">GIA SP:</td>
          <td><input id="gia_sp" /></td>
        </tr>
        <tr>
          <td class="label">KHUYEN MAI:</td>
          <td><input id="khuyen_mai" /></td>
        </tr>
        <tr>
          <td class="label">vi tri kho:</td>
          <td><input id="vitrikho" readonly /></td>
        </tr>
        <tr>
          <td class="label">mã khách</td>
          <td>
            <div class="makh-row">
              <input id="makh" placeholder="Mã KH" />
              <button type="button" id="btnTimKH" class="btn-icon">🔍</button>
            </div>
          </td>
        </tr>
        <tr>
          <td class="label">TEN KHACH</td>
          <td><input id="tenkh" readonly /></td>
        </tr>
      </table>

      <!-- Nút thao tác -->
      <div class="buttons-row">
        <button id="btnLuu">LƯU</button>
        <button id="btnThemMoi">THEM MOI</button>
      </div>
      <div class="buttons-row">
        <button id="btnKiemTraAnh">KIEM TRA ANH</button>
        <button id="btnChenAnhMoi">CHEN ANH MOI</button>
      </div>

      <div class="note">
        • Hình thức thanh toán: <b>NV</b> (cố định).<br />
        • Bấm vào vùng ảnh để xem nhanh tồn kho / bán theo size.
      </div>

      <!-- hidden -->
      <input type="hidden" id="sohd" />
      <input type="hidden" id="manv" />
      <input type="hidden" id="gio" />
      <input type="hidden" id="hinhthuctt" value="NV" />
    </div>

     <!-- JS: thư viện đọc QR và OCR -->
      <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

      <!-- stockQuickPopup sử dụng global supabase, nên cứ load trước là được -->
      <script src="scripts/stockQuickPopup.js"></script>

      <!-- Trang bán NV nhanh -->
      <script type="module" src="scripts/bannvcs1nhanh.js"></script>
    </div>
  </body>
</html>
