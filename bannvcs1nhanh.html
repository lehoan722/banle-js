<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Bán NV nhanh CS1</title>
  <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body {
      height: 100%;
    }
    body {
      font-family: Arial, sans-serif;
      font-size: 16px;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      overscroll-behavior-y: contain;
    }
    .sheet-wrapper {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ccc;
      padding: 6px 8px 8px;
      box-sizing: border-box;
    }
    .top-row {
      display: grid;
      grid-template-columns: 70px 1fr 80px;
      gap: 4px;
      margin-bottom: 4px;
    }
    .top-row input {
      width: 100%;
      box-sizing: border-box;
      padding: 3px 4px;
    }
    .label-small {
      font-size: 13px;
      color: #4b5563;
      margin: 2px 0;
    }
    #masp {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 6px;
      font-size: 16px;
    }

    .image-panel {
      margin-top: 4px;
      margin-bottom: 6px;
      border: 1px solid #e5e7eb;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9fafb;
      position: relative;
      overflow: hidden;
    }
    .image-panel img {
      max-width: 100%;
      max-height: 100%;
      display: none;
      object-fit: contain;
    }
    .image-placeholder {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
      padding: 4px;
    }

    .stock-popup-hint {
      position: absolute;
      left: 4px;
      bottom: 4px;
      font-size: 11px;
      color: #111827;
      background: rgba(255, 255, 255, 0.8);
      padding: 2px 4px;
      border-radius: 2px;
    }

    table.form-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 14px;
    }
    table.form-table td {
      padding: 2px 2px;
      vertical-align: middle;
    }
    table.form-table td.label {
      width: 90px;
      background: #f3f4f6;
      font-weight: 600;
      font-size: 13px;
    }
    table.form-table input,
    table.form-table select {
      width: 100%;
      box-sizing: border-box;
      border: none;
      outline: none;
      padding: 6px 6px;
      font-size: 16px;
    }
    table.form-table input[readonly] {
      background: #f9fafb;
    }

    .makh-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .makh-row input {
      flex: 1;
    }
    .btn-icon {
      padding: 4px 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .buttons-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .buttons-row button {
      flex: 1 1 0px;
      padding: 8px 4px;
      font-size: 16px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
    }
    #btnLuu {
      background: #111827;
      color: #fff;
    }
    #btnThemMoi {
      background: #e5e7eb;
    }

    .buttons-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 4px;
    }
    .buttons-row-2 button {
      flex: 1 1 0px;
      padding: 8px 4px;
      font-size: 16px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
    }
    #btnKiemTraAnh {
      background: #f3f4f6;
    }
    #btnChenAnhMoi {
      background: #d1fae5;
    }

    .note {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    @supports (-webkit-touch-callout: none) {
      body {
        -webkit-text-size-adjust: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="sheet-wrapper">
    <!-- Dòng đầu: địa điểm, ngày, nhân viên -->
    <div class="top-row">
      <input id="diadiem" readonly />
      <input id="ngay" />
      <input id="tennv" readonly />
    </div>

    <!-- Hàng: trạng thái ảnh + mã SP -->
    <div class="label-small" id="statusAnh">ĐÃ CÓ ẢNH</div>
    <input id="masp" placeholder="Nhập mã sản phẩm..." />
    <!-- THÊM popup gợi ý 
      - thao tác giống bên inmavachcs1.html: 
        + gõ ký tự => hiển thị danh sách
        + Enter/chọn => gọi onMaspSelected()
    -->
    <div id="maspSuggestionsContainer"></div>

    <!-- Panel ảnh sản phẩm -->
    <div class="image-panel" id="imagePanel">
      <img id="productImage" alt="Ảnh sản phẩm" />
      <div class="image-placeholder" id="imagePlaceholder">
        Chưa có ảnh sản phẩm.
      </div>
      <div class="stock-popup-hint">Bấm vào ảnh để xem nhanh tồn kho / bán theo size.</div>
    </div>

    <!-- Bảng thông tin sản phẩm & bán NV -->
    <table class="form-table">
      <tbody>
        <tr>
          <td class="label">size:</td>
          <td>
            <select id="size">
              <option value="">Chọn size</option>
              <option value="0">0 (không size)</option>
              <option value="38">38</option>
              <option value="39">39</option>
              <option value="40">40</option>
              <option value="41">41</option>
              <option value="42">42</option>
              <option value="43">43</option>
              <option value="44">44</option>
              <option value="45">45</option>
            </select>
          </td>
        </tr>

        <tr>
          <td class="label">GIA SP:</td>
          <td>
            <input id="gia_sp" type="number" />
          </td>
        </tr>

        <tr>
          <td class="label">KHUYEN MAI:</td>
          <td>
            <input id="khuyen_mai" type="number" />
          </td>
        </tr>

        <tr>
          <td class="label">vi tri kho:</td>
          <td>
            <input id="vitrikho" />
          </td>
        </tr>

        <tr>
          <td class="label">mã khách</td>
          <td>
            <div class="makh-row">
              <input id="makh" placeholder="Mã KH" />
              <button class="btn-icon" id="btnSearchKH" title="Tìm khách hàng">&#128269;</button>
            </div>
          </td>
        </tr>

        <tr>
          <td class="label">TEN KHACH</td>
          <td>
            <input id="tenkh" placeholder="Tên khách" />
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Hàng nút LƯU / THÊM MỚI -->
    <div class="buttons-row">
      <button id="btnLuu">LƯU</button>
      <button id="btnThemMoi">THEM MOI</button>
    </div>

    <!-- Hàng nút KIỂM TRA ẢNH / CHÈN ẢNH MỚI -->
    <div class="buttons-row-2">
      <button id="btnKiemTraAnh">KIEM TRA ANH</button>
      <button id="btnChenAnhMoi">CHEN ANH MOI</button>
    </div>

    <div class="note">
      - Hình thức thanh toán: NV (cố định).<br />
      - Bấm vào vùng ảnh để xem nhanh tồn kho / bán theo size.
    </div>

    <!-- hidden -->
    <input type="hidden" id="sohd" />
    <input type="hidden" id="manv" />
    <input type="hidden" id="gio" />
    <input type="hidden" id="hinhthuctt" value="NV" />
  </div>

  <!-- JS: Supabase / stockQuick / trang bán NV nhanh -->
  <!-- stockQuickPopup sử dụng global supabase, nên cứ load trước là được --> 
   <script src="scripts/stockQuickPopup.js"></script>
  
  <script type="module" src="scripts/bannvcs1nhanh.js"></script>
</body>
</html>
