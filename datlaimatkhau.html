<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset mật khẩu</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#f6f7fb; margin:0; }
    .wrap { max-width: 520px; margin: 60px auto; padding: 0 16px; }
    .card { background:#fff; border-radius: 14px; padding: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.07); }
    h1 { font-size: 22px; margin: 0 0 12px; }
    .muted { color:#666; font-size: 13px; line-height: 1.5; }
    label { display:block; margin-top: 12px; font-weight: 600; font-size: 13px; }
    input { width:100%; padding: 12px; border:1px solid #ddd; border-radius: 10px; margin-top: 6px; font-size: 14px; }
    button { width:100%; margin-top: 14px; padding: 12px; border:0; border-radius: 10px; background:#16a34a; color:#fff; font-weight: 700; font-size: 15px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .err { margin-top: 12px; color:#b91c1c; font-weight: 600; }
    .ok { margin-top: 12px; color:#166534; font-weight: 700; }
    .box { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background:#f3f4f6; font-size: 12px; color:#333; overflow:auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Đặt lại mật khẩu</h1>
      <div id="status" class="muted">
        Đang kiểm tra link khôi phục...
      </div>

      <div id="formArea" style="display:none;">
        <label>Mật khẩu mới</label>
        <input id="pw1" type="password" placeholder="Nhập mật khẩu mới" />

        <label>Nhập lại mật khẩu mới</label>
        <input id="pw2" type="password" placeholder="Nhập lại mật khẩu" />

        <button id="btnSave">Lưu mật khẩu</button>
        <div id="msg"></div>
      </div>

      <div id="debug" class="box" style="display:none;"></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabaseClient.js';

    const statusEl = document.getElementById('status');
    const formArea = document.getElementById('formArea');
    const msgEl = document.getElementById('msg');
    const debugEl = document.getElementById('debug');
    const btnSave = document.getElementById('btnSave');

    function setErr(t){ msgEl.className='err'; msgEl.textContent=t; }
    function setOk(t){ msgEl.className='ok'; msgEl.textContent=t; }

    function parseHash() {
      const h = location.hash?.startsWith('#') ? location.hash.slice(1) : '';
      const p = new URLSearchParams(h);
      return {
        access_token: p.get('access_token'),
        refresh_token: p.get('refresh_token'),
        type: p.get('type'),
        expires_in: p.get('expires_in'),
      };
    }

    async function bootstrapRecoverySession() {
      // Case A: PKCE flow -> ?code=...
      const url = new URL(location.href);
      const code = url.searchParams.get('code');

      // Case B: implicit tokens -> #access_token=...&refresh_token=...&type=recovery
      const h = parseHash();

      debugEl.style.display = 'block';
      debugEl.textContent =
        'URL=' + location.href + '\n' +
        'code=' + (code || '') + '\n' +
        'hash.type=' + (h.type || '') + '\n' +
        'hash.access_token=' + (h.access_token ? '[OK]' : '') + '\n' +
        'hash.refresh_token=' + (h.refresh_token ? '[OK]' : '');

      // 1) Nếu có code -> đổi code lấy session
      if (code) {
        const { data, error } = await supabase.auth.exchangeCodeForSession(code);
        if (error) throw error;

        // dọn query ?code=... cho sạch URL
        url.searchParams.delete('code');
        history.replaceState({}, document.title, url.toString());

        return data?.session || null;
      }

      // 2) Nếu có access_token/refresh_token trong hash -> setSession
      if (h.access_token && h.refresh_token) {
        const { data, error } = await supabase.auth.setSession({
          access_token: h.access_token,
          refresh_token: h.refresh_token,
        });
        if (error) throw error;

        // dọn hash cho sạch URL
        history.replaceState({}, document.title, location.pathname + location.search);

        return data?.session || null;
      }

      // 3) Nếu không có gì -> fail (do cấu hình redirect url chưa đúng)
      return null;
    }

    async function init() {
      try {
        const session = await bootstrapRecoverySession();

        if (!session) {
          statusEl.innerHTML =
            '<span style="color:#b91c1c;font-weight:700;">Link khôi phục không hợp lệ hoặc thiếu token/code.</span><br>' +
            '<span class="muted">Bạn cần cấu hình Supabase Auth → URL Configuration đúng, rồi gửi lại email reset password.</span>';
          return;
        }

        statusEl.innerHTML =
          '<span style="color:#166534;font-weight:800;">OK.</span> Hãy nhập mật khẩu mới để cập nhật.';
        formArea.style.display = 'block';

        btnSave.onclick = async () => {
          msgEl.textContent = '';
          const pw1 = document.getElementById('pw1').value.trim();
          const pw2 = document.getElementById('pw2').value.trim();

          if (!pw1 || pw1.length < 6) return setErr('Mật khẩu phải >= 6 ký tự.');
          if (pw1 !== pw2) return setErr('2 mật khẩu không khớp.');

          btnSave.disabled = true;
          btnSave.textContent = 'Đang lưu...';

          try {
            const { data, error } = await supabase.auth.updateUser({ password: pw1 });
            if (error) throw error;

            setOk('Đổi mật khẩu thành công. Bạn có thể quay lại trang đăng nhập để đăng nhập lại.');
            // Optional: supabase.auth.signOut();
          } catch (e) {
            setErr(e?.message || String(e));
          } finally {
            btnSave.disabled = false;
            btnSave.textContent = 'Lưu mật khẩu';
          }
        };

      } catch (e) {
        statusEl.innerHTML =
          '<span style="color:#b91c1c;font-weight:700;">Lỗi khi khởi tạo recovery session:</span> ' +
          (e?.message || String(e));
      }
    }

    init();
  </script>
</body>
</html>
